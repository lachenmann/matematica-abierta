<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="720" id="C00-F05" role="img" version="1.1" viewBox="0 0 1200 720" width="1200">
  <title>La copia racional q ↦ q*</title>
  <desc>La aplicación q a q estrella transforma racionales ordenados en cortaduras racionales anidadas; en la etapa de la sección 0.5 sólo están certificadas inyectividad y orden, mientras la estructura algebraica queda pendiente.</desc>
  <defs/>
  <rect fill="#ffffff" height="720" width="1200" x="0" y="0"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="46">La copia racional q ↦ q*</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="76">El orden racional reaparece como anidamiento de cortaduras racionales</text>
  <rect fill="#f8fafc" height="170" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1100" x="50" y="115"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="68" y="146">Racionales</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="130" x2="1070" y1="215" y2="215"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1060" x2="1070" y1="209" y2="215"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1060" x2="1070" y1="221" y2="215"/>
  <circle cx="300" cy="215" fill="#2f6f9f" r="6" stroke="#2f6f9f" stroke-width="1"/>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="300" y="200">p</text>
  <circle cx="590" cy="215" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="590" y="200">q</text>
  <circle cx="870" cy="215" fill="#6d5aa8" r="6" stroke="#6d5aa8" stroke-width="1"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="870" y="200">r</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="600" y="270">p &lt; q &lt; r</text>
  <rect fill="#f8fafc" height="250" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1100" x="50" y="315"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="68" y="346">Imágenes q* = { t∈Q : t&lt;q }</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="120" x2="1080" y1="390" y2="390"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1070" x2="1080" y1="384" y2="390"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1070" x2="1080" y1="396" y2="390"/>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="13" x1="120" x2="300" y1="390" y2="390"/>
  <circle cx="300" cy="390" fill="#ffffff" r="6" stroke="#2f6f9f" stroke-width="3"/>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="300" y="375">p*</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="120" x2="1080" y1="455" y2="455"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1070" x2="1080" y1="449" y2="455"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1070" x2="1080" y1="461" y2="455"/>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="13" x1="120" x2="590" y1="455" y2="455"/>
  <circle cx="590" cy="455" fill="#ffffff" r="6" stroke="#2f7d77" stroke-width="3"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="590" y="440">q*</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="120" x2="1080" y1="520" y2="520"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1070" x2="1080" y1="514" y2="520"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1070" x2="1080" y1="526" y2="520"/>
  <line stroke="#6d5aa8" stroke-linecap="round" stroke-width="13" x1="120" x2="870" y1="520" y2="520"/>
  <circle cx="870" cy="520" fill="#ffffff" r="6" stroke="#6d5aa8" stroke-width="3"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="870" y="505">r*</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="980" y="486">p* ⊊ q* ⊊ r*</text>
  <rect fill="#f8fafc" height="95" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1000" x="100" y="595"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="118" y="626">Estado de certificación en §0.5</text>
  <rect fill="#eef8f6" height="38" rx="19" ry="19" stroke="#dce3ec" stroke-width="1.5" width="180" x="145" y="642"/>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="235.0" y="667">INYECTIVA ✓</text>
  <rect fill="#eef8f6" height="38" rx="19" ry="19" stroke="#dce3ec" stroke-width="1.5" width="170" x="345" y="642"/>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="430.0" y="667">ORDEN ↔ ✓</text>
  <rect fill="#fff8e8" height="38" rx="19" ry="19" stroke="#dce3ec" stroke-width="1.5" width="185" x="540" y="642"/>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="632.5" y="667">SUMA pendiente</text>
  <rect fill="#fff8e8" height="38" rx="19" ry="19" stroke="#dce3ec" stroke-width="1.5" width="210" x="745" y="642"/>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="850.0" y="667">PRODUCTO pendiente</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="600" y="706">“Q⊂D” como cuerpo ordenado todavía NO está certificado aquí.</text>
</svg>
