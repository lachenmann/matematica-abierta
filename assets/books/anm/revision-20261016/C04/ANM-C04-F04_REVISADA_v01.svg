<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>Adherencia, acumulación y aislamiento</title><desc>En A=(0,1) unido con {2}, los centros 0 y 1/2 son de acumulación. Una bola de radio 1/3 aísla al punto 2. El centro retirado y los testigos distintos se distinguen visualmente.</desc><rect width="1200" height="720" fill="white"/><g font-family="Arial,sans-serif"><text x="600" y="55" text-anchor="middle" font-size="32" fill="#18212b">Adherencia, acumulación y aislamiento</text><text x="600" y="90" text-anchor="middle" font-size="20" fill="#18212b">A=(0,1)∪{2}; la bola perforada excluye únicamente su centro.</text><rect x="30" y="130" width="360" height="480" rx="18" fill="#f4f7fa" stroke="#cbd5e1"/><text x="210" y="175" text-anchor="middle" font-size="25" fill="#18212b">x=0</text><rect x="62" y="285" width="66" height="70" rx="12" fill="#f4efff" stroke="#6d28d9" opacity="0.7"/><line x1="50" y1="320" x2="370" y2="320" stroke="#18212b" stroke-width="3"/><line x1="95" y1="320" x2="195" y2="320" stroke="#2563eb" stroke-width="7"/><text x="95" y="390" text-anchor="middle" font-size="17" fill="#18212b">0</text><text x="195" y="390" text-anchor="middle" font-size="17" fill="#18212b">1</text><text x="295" y="390" text-anchor="middle" font-size="17" fill="#18212b">2</text><circle cx="95" cy="320" r="7" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="195" cy="320" r="7" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="295" cy="320" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><circle cx="95" cy="320" r="10" fill="white" stroke="#be123c" stroke-width="3"/><circle cx="115" cy="320" r="5" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><line x1="95" y1="280" x2="95" y2="300" stroke="#be123c" stroke-width="2"/><text x="95" y="265" text-anchor="middle" font-size="15" fill="#be123c">centro retirado</text><text x="210" y="435" text-anchor="middle" font-size="18" fill="#18212b">El centro no pertenece a A.</text><text x="210" y="485" text-anchor="middle" font-size="18" fill="#18212b">Toda bola perforada encuentra A.</text><text x="210" y="540" text-anchor="middle" font-size="19" fill="#0f766e">Adherente y de acumulación</text><rect x="420" y="130" width="360" height="480" rx="18" fill="#f4f7fa" stroke="#cbd5e1"/><text x="600" y="175" text-anchor="middle" font-size="25" fill="#18212b">x=1/2</text><rect x="502.0" y="285" width="66" height="70" rx="12" fill="#f4efff" stroke="#6d28d9" opacity="0.7"/><line x1="440" y1="320" x2="760" y2="320" stroke="#18212b" stroke-width="3"/><line x1="485" y1="320" x2="585" y2="320" stroke="#2563eb" stroke-width="7"/><text x="485" y="390" text-anchor="middle" font-size="17" fill="#18212b">0</text><text x="585" y="390" text-anchor="middle" font-size="17" fill="#18212b">1</text><text x="685" y="390" text-anchor="middle" font-size="17" fill="#18212b">2</text><circle cx="485" cy="320" r="7" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="585" cy="320" r="7" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="685" cy="320" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><circle cx="535.0" cy="320" r="10" fill="white" stroke="#be123c" stroke-width="3"/><circle cx="555.0" cy="320" r="5" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><line x1="535.0" y1="280" x2="535.0" y2="300" stroke="#be123c" stroke-width="2"/><text x="535.0" y="265" text-anchor="middle" font-size="15" fill="#be123c">centro retirado</text><text x="600" y="435" text-anchor="middle" font-size="18" fill="#18212b">El centro pertenece a A.</text><text x="600" y="485" text-anchor="middle" font-size="18" fill="#18212b">Toda bola perforada encuentra A.</text><text x="600" y="540" text-anchor="middle" font-size="19" fill="#0f766e">Adherente y de acumulación</text><rect x="810" y="130" width="360" height="480" rx="18" fill="#f4f7fa" stroke="#cbd5e1"/><text x="990" y="175" text-anchor="middle" font-size="25" fill="#18212b">x=2</text><rect x="1042" y="285" width="66" height="70" rx="12" fill="#f4efff" stroke="#6d28d9" opacity="0.7"/><line x1="830" y1="320" x2="1150" y2="320" stroke="#18212b" stroke-width="3"/><line x1="875" y1="320" x2="975" y2="320" stroke="#2563eb" stroke-width="7"/><text x="875" y="390" text-anchor="middle" font-size="17" fill="#18212b">0</text><text x="975" y="390" text-anchor="middle" font-size="17" fill="#18212b">1</text><text x="1075" y="390" text-anchor="middle" font-size="17" fill="#18212b">2</text><circle cx="875" cy="320" r="7" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="975" cy="320" r="7" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="1075" cy="320" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><text x="990" y="265" text-anchor="middle" font-size="18" fill="#6d28d9">r=1/3</text><text x="990" y="435" text-anchor="middle" font-size="17" fill="#18212b">Una bola sólo encuentra al centro.</text><text x="990" y="485" text-anchor="middle" font-size="20" fill="#be123c">B(2,1/3)∩A={2}</text><text x="990" y="540" text-anchor="middle" font-size="20" fill="#0f766e">Adherente y aislado</text><text x="600" y="665" text-anchor="middle" font-size="20" fill="#18212b">En los dos primeros casos se necesita un testigo distinto del centro para cada radio.</text></g></svg>