 <title id="title-f04">Dos capturas supuestas exigen el mismo término</title>
 <desc id="desc-f04">Dos ventanas abiertas de radio d/3 están separadas por un hueco d/3. Los cortes de dos capturas hipotéticas se reúnen en su máximo y exigirían una pertenencia simultánea imposible para el mismo término.</desc>
