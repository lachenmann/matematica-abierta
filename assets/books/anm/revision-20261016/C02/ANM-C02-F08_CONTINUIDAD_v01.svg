<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F08" role="img" aria-labelledby="title desc">
<title id="title">Definición, comprobación y existencia</title><desc id="desc">Tres niveles distinguen la definición del supremo, su comprobación particular y la garantía por completitud para conjuntos no vacíos y acotados superiormente. La completitud fue establecida en C00 y se estudia en C03.</desc>
<rect width="1200" height="720" fill="white"/>
<text x="60" y="54" font-family="Arial,sans-serif" font-size="34" fill="#18212b" text-anchor="start" font-weight="700">Definición, comprobación y existencia</text>
<rect x="100" y="110" width="1000" height="120" rx="16" stroke="#2563eb" fill="#eaf2ff" stroke-width="2"/>
<text x="600.0" y="161.5" font-family="Arial,sans-serif" font-size="25" fill="#2563eb" text-anchor="middle" font-weight="400">DEFINICIÓN</text>
<text x="600.0" y="194.5" font-family="Arial,sans-serif" font-size="25" fill="#2563eb" text-anchor="middle" font-weight="400">s = sup A  ⇔  s = min U(A)</text>
<path d="M600,232 L600,275" fill="none" stroke="#18212b" stroke-width="2"/>
<polygon points="600,275 605.0,263.0 595.0,263.0" fill="#18212b"/>
<rect x="100" y="280" width="1000" height="120" rx="16" stroke="#0f766e" fill="#e8f7f4" stroke-width="2"/>
<text x="600.0" y="331.5" font-family="Arial,sans-serif" font-size="25" fill="#0f766e" text-anchor="middle" font-weight="400">COMPROBACIÓN PARTICULAR</text>
<text x="600.0" y="364.5" font-family="Arial,sans-serif" font-size="25" fill="#0f766e" text-anchor="middle" font-weight="400">Para un candidato: verificar cota y minimalidad</text>
<path d="M600,402 L600,445" fill="none" stroke="#18212b" stroke-width="2"/>
<polygon points="600,445 605.0,433.0 595.0,433.0" fill="#18212b"/>
<rect x="100" y="450" width="1000" height="140" rx="16" stroke="#b45c00" fill="#fff6e8" stroke-width="2"/>
<text x="600.0" y="511.5" font-family="Arial,sans-serif" font-size="25" fill="#b45c00" text-anchor="middle" font-weight="400">GARANTÍA POR COMPLETITUD EN ℝ</text>
<text x="600.0" y="544.5" font-family="Arial,sans-serif" font-size="25" fill="#b45c00" text-anchor="middle" font-weight="400">A ≠ ∅  y  U(A) ≠ ∅  ⇒  existe min U(A)</text>
<text x="600" y="640" font-family="Arial,sans-serif" font-size="23" fill="#18212b" text-anchor="middle" font-weight="400">C00: construcción y completitud · C03: estudio sistemático</text>
<text x="600" y="680" font-family="Arial,sans-serif" font-size="21" fill="#5f6b78" text-anchor="middle" font-weight="400">La garantía de existencia no se deduce de la definición.</text>
</svg>
