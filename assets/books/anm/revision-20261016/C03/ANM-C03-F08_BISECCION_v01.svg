<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" id="C03-F08" role="img" aria-labelledby="title desc">
<title id="title">Bisección con una escala común</title><desc id="desc">Cuatro intervalos cerrados encajados conservan mitades alternadas de su predecesor. En la misma escala, sus longitudes son exactamente L, L/2, L/4 y L/8. Arquimedianidad permite elegir un número finito de pasos para cada tolerancia positiva.</desc>
<rect width="1200" height="760" fill="white"/>
<text x="55" y="55" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#18212b" text-anchor="start" font-weight="700">Bisección: una escala común para todos los anchos</text>
<text x="55" y="96" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#5f6b78" text-anchor="start" font-weight="400">Cada intervalo retenido es una mitad cerrada del anterior.</text>
<line x1="100" y1="185" x2="900" y2="185" stroke="#d1d5db" stroke-width="2"/>
<line x1="100" y1="185" x2="900" y2="185" stroke="#2563eb" stroke-width="8"/>
<circle cx="100" cy="185" r="8" fill="#2563eb"/>
<circle cx="900" cy="185" r="8" fill="#2563eb"/>
<text x="55" y="193" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2563eb" text-anchor="start" font-weight="700">J0</text>
<text x="955" y="193" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#18212b" text-anchor="start" font-weight="400">L</text>
<line x1="100" y1="290" x2="900" y2="290" stroke="#d1d5db" stroke-width="2"/>
<line x1="500" y1="290" x2="900" y2="290" stroke="#2563eb" stroke-width="8"/>
<circle cx="500" cy="290" r="8" fill="#2563eb"/>
<circle cx="900" cy="290" r="8" fill="#2563eb"/>
<text x="55" y="298" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2563eb" text-anchor="start" font-weight="700">J1</text>
<text x="955" y="298" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#18212b" text-anchor="start" font-weight="400">L/2</text>
<line x1="100" y1="395" x2="900" y2="395" stroke="#d1d5db" stroke-width="2"/>
<line x1="500" y1="395" x2="700" y2="395" stroke="#2563eb" stroke-width="8"/>
<circle cx="500" cy="395" r="8" fill="#2563eb"/>
<circle cx="700" cy="395" r="8" fill="#2563eb"/>
<text x="55" y="403" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2563eb" text-anchor="start" font-weight="700">J2</text>
<text x="955" y="403" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#18212b" text-anchor="start" font-weight="400">L/4</text>
<line x1="100" y1="500" x2="900" y2="500" stroke="#d1d5db" stroke-width="2"/>
<line x1="600" y1="500" x2="700" y2="500" stroke="#2563eb" stroke-width="8"/>
<circle cx="600" cy="500" r="8" fill="#2563eb"/>
<circle cx="700" cy="500" r="8" fill="#2563eb"/>
<text x="55" y="508" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2563eb" text-anchor="start" font-weight="700">J3</text>
<text x="955" y="508" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#18212b" text-anchor="start" font-weight="400">L/8</text>
<rect x="130" y="565" width="940" height="105" rx="16" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/>
<text x="600" y="605" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#b45c00" text-anchor="middle" font-weight="400">ε &gt; 0: elegir m &gt; L/ε y tomar k = m.</text>
<text x="600" y="645" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#b45c00" text-anchor="middle" font-weight="400">2ᵏ ≥ k+1 &gt; L/ε  ⇒  L/2ᵏ &lt; ε</text>
<text x="600" y="720" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#5f6b78" text-anchor="middle" font-weight="400">La elección finita de k usa arquimedianidad.</text>
</svg>
