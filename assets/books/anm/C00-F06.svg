<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="760" id="C00-F06" role="img" version="1.1" viewBox="0 0 1200 760" width="1200">
  <title>Aritmética I: suma, opuesto y cancelación</title>
  <desc>Mapa de prueba para la estructura aditiva de cortaduras: suma por testigos, opuesto mediante racionales exteriores, lema de cruce y cancelación por C más menos C igual a cero estrella.</desc>
  <defs/>
  <rect fill="#ffffff" height="760" width="1200" x="0" y="0"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="46">Aritmética I: suma, opuesto y cancelación</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="76">Mapa de prueba de la estructura aditiva; las flechas no sustituyen las demostraciones</text>
  <rect fill="#f8fafc" height="255" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="340" x="55" y="115"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="73" y="146">SUMA</text>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="120" y="190">a∈A</text>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="275" y="190">b∈B</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="3" x1="150" x2="210" y1="210" y2="275"/>
  <polygon fill="#2f6f9f" points="210,275 199.6495727018928,271.2759357220105 207.1145451364855,264.3851919362326"/>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="310" x2="250" y1="210" y2="275"/>
  <polygon fill="#2f7d77" points="250,275 252.8854548635145,264.3851919362326 260.3504272981072,271.2759357220105"/>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="180" x="135" y="280"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="225.0" y="311">x = a+b</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="225" y="365">PROBAR: A+B ∈ D</text>
  <rect fill="#f8fafc" height="255" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="340" x="430" y="115"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="448" y="146">OPUESTO</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="505" y="190">s∉A</text>
  <line stroke="#a24d4d" stroke-linecap="round" stroke-width="3" x1="550" x2="600" y1="210" y2="255"/>
  <polygon fill="#a24d4d" points="600,255 589.3496667230348,252.2485638132844 596.1457743322036,244.6973331364302"/>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="575.0" y="220.5">reflejar</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="170" x="525" y="280"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="610.0" y="311">x &lt; −s</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="600" y="335">frontera abierta</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="600" y="365">PROBAR: −A ∈ D</text>
  <rect fill="#f8fafc" height="255" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="340" x="805" y="115"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="823" y="146">LEMA DE CRUCE</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="845" x2="1105" y1="285" y2="285"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1095" x2="1105" y1="279" y2="285"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1095" x2="1105" y1="291" y2="285"/>
  <circle cx="900" cy="285" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="900" y="270">a∈A</text>
  <circle cx="1000" cy="285" fill="#ffffff" r="6" stroke="#a24d4d" stroke-width="3"/>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="1000" y="270">a+h∉A</text>
  <line stroke="#a87320" stroke-linecap="round" stroke-width="3" x1="915" x2="985" y1="235" y2="235"/>
  <polygon fill="#a87320" points="985,235 975.2430558494278,240.07957093095632 975.2430558494278,229.92042906904368"/>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="950.0" y="225.0">h</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="975" y="340">un punto dentro + uno fuera</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="975" y="365">(versión dinámica → Manim/web)</text>
  <rect fill="#f8fafc" height="230" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="970" x="115" y="430"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="133" y="461">CANCELACIÓN Y ORDEN</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="300" x="175" y="475"/>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="325.0" y="506">A + (−A) = 0*</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="510" x2="650" y1="500" y2="500"/>
  <polygon fill="#2f7d77" points="650,500 640.2430558494278,505.0795709309563 640.2430558494278,494.9204290690437"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="580.0" y="487.0">permite cancelar</text>
  <rect fill="#f2f6fb" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="345" x="680" y="475"/>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="852.5" y="506">A+C ⊆ B+C  ⇔  A⊆B</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="585">La existencia del opuesto vuelve invertible la traslación por C.</text>
  <rect fill="#eef8f6" height="38" rx="19" ry="19" stroke="#dce3ec" stroke-width="1.5" width="390" x="405" y="620"/>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="600.0" y="645">ADDITIVE GROUP = VERIFIED</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="600" y="720">Producto, unidad e inversos multiplicativos siguen fuera de alcance en §0.6.</text>
</svg>
