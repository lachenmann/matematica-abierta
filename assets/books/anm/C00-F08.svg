  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="496">ι_F(m−1) ≤ x &lt; ι_F(m)</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="110" y="565">2 · refinar la malla hasta entrar entre x&lt;y</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="135" x2="1060" y1="630" y2="630"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1050" x2="1060" y1="624" y2="630"/>
