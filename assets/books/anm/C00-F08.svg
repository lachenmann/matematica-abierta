  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="2" x1="580" x2="580" y1="621" y2="639"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="2" x1="640" x2="640" y1="621" y2="639"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="2" x1="700" x2="700" y1="621" y2="639"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="2" x1="760" x2="760" y1="621" y2="639"/>
  <circle cx="640" cy="630" fill="#ffffff" r="6" stroke="#4f7c5b" stroke-width="3"/>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="640" y="615">ι_F(q)</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="700">elige 1/n &lt; y−x  →  algún racional cae estrictamente entre ambos</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="600" y="755">F se dibuja sólo como orden abstracto: no se identifica con el modelo de cortaduras ni con una recta real preexistente.</text>
