  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="110" y="350">1 · localizar x entre enteros consecutivos</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="135" x2="1060" y1="420" y2="420"/>
