  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="390" y="615">x</text>
  <circle cx="835" cy="630" fill="#6d5aa8" r="6" stroke="#6d5aa8" stroke-width="1"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="835" y="615">y</text>
