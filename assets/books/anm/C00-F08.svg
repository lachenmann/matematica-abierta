  <title>De completitud a rejilla racional en F</title>
  <desc>Cadena de dependencias en un cuerpo ordenado completo abstracto F: característica cero, copia racional, arquimedianidad, localización entera, refinamiento racional y densidad.</desc>
  <defs/>
