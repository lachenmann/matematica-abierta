<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F01" role="img" aria-labelledby="C02-F01-title C02-F01-desc">
<title id="C02-F01-title">Barreras válidas y estabilidad direccional</title>
<desc id="C02-F01-desc">Dos paneles muestran que una cota superior sigue siendo válida al moverse a la derecha y una cota inferior al moverse a la izquierda; al cruzar elementos del conjunto pueden dejar de ser cotas.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
