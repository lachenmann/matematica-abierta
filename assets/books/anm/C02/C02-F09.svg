<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F09" role="img" aria-labelledby="C02-F09-title C02-F09-desc">
<title id="C02-F09-title">Sumar barreras: mecanismo epsilon sobre dos</title>
<desc id="C02-F09-desc">Tres paneles muestran testigos a y b dentro de franjas de anchura epsilon sobre dos junto a sus supremos. Al sumarlos se obtiene un punto de A+B a menos de epsilon de sA+sB, complementando la cota superior.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#18212b">Sumar barreras: mecanismo ε/2</text><text x="60" y="90" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Después de probar que sA+sB es cota superior, falta mostrar que no puede bajarse.</text><rect x="80" y="140" width="300" height="250" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="230" y="173" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">A cerca de sA</text><line x1="125" y1="275" x2="350" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="345" y1="275" x2="350" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 350 275 L 338.5 281.1 L 338.5 268.9 Z" fill="#18212b"/><line x1="340" y1="267" x2="340" y2="283" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="340" y="309" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">sA</text><rect x="245" y="253" width="95" height="44" rx="7" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="292.5" y="243" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#c76b00">ε/2</text><circle cx="302" cy="275" r="8" fill="#0f766e"/><text x="302" y="313" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0f766e">a</text><text x="230" y="365" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">sA−ε/2 &lt; a ≤ sA</text><rect x="440" y="140" width="300" height="250" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="590" y="173" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">B cerca de sB</text><line x1="485" y1="275" x2="710" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="705" y1="275" x2="710" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 710 275 L 698.5 281.1 L 698.5 268.9 Z" fill="#18212b"/><line x1="700" y1="267" x2="700" y2="283" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="700" y="309" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">sB</text><rect x="605" y="253" width="95" height="44" rx="7" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="652.5" y="243" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#c76b00">ε/2</text><circle cx="662" cy="275" r="8" fill="#0f766e"/><text x="662" y="313" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0f766e">b</text><text x="590" y="365" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">sB−ε/2 &lt; b ≤ sB</text><line x1="745" y1="265" x2="865" y2="265" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M 865 265 L 853.5 271.1 L 853.5 258.9 Z" fill="#2563eb"/><text x="805" y="245" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#2563eb">sumar</text><rect x="825" y="140" width="300" height="250" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="975" y="173" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">A+B cerca de sA+sB</text><line x1="865" y1="275" x2="1090" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1085" y1="275" x2="1090" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1090 275 L 1078.5 281.1 L 1078.5 268.9 Z" fill="#18212b"/><line x1="1070" y1="267" x2="1070" y2="283" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="1070" y="309" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">sA+sB</text><rect x="965" y="253" width="105" height="44" rx="7" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><circle cx="1025" cy="275" r="8" fill="#0f766e"/><text x="1025" y="313" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#0f766e">a+b</text><text x="975" y="365" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#18212b">a+b &gt; sA+sB−ε</text><rect x="130" y="455" width="940" height="155" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="492" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#18212b">Dos mitades de la prueba</text><rect x="265.5" y="530" width="169" height="38" rx="19" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5"/><text x="350" y="557" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#2563eb">a+b ≤ sA+sB</text><text x="600" y="555" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#5f6b78">y</text><rect x="752.5" y="530" width="195" height="38" rx="19" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="850" y="557" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">a+b &gt; sA+sB−ε</text><text x="600" y="675" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">Las elecciones dependen de ε; no forman una sucesión.</text>
</svg>
