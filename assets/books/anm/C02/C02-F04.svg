<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F04" role="img" aria-labelledby="C02-F04-title C02-F04-desc">
<title id="C02-F04-title">Mismo supremo, distinto máximo</title>
<desc id="C02-F04-desc">Dos intervalos alineados, [a,s] y [a,s), comparten la misma barrera superior s. El primero la incluye y tiene máximo; el segundo no la incluye y no tiene máximo.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="58" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#18212b">Mismo supremo, distinto máximo</text><text x="60" y="92" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">Sólo cambia la pertenencia de la barrera s.</text><rect x="100" y="170" width="1000" height="180" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="203" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">A=[a,s]</text><line x1="220" y1="275" x2="970" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="965" y1="275" x2="970" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 970 275 L 958.5 281.1 L 958.5 268.9 Z" fill="#18212b"/><line x1="300" y1="267" x2="300" y2="283" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="300" y="309" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">a</text><line x1="880" y1="267" x2="880" y2="283" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="880" y="309" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">s</text><line x1="300" y1="275" x2="880" y2="275" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="300" cy="275" r="10" fill="#18212b" stroke="#18212b" stroke-width="3"/><circle cx="880" cy="275" r="10" fill="#18212b" stroke="#18212b" stroke-width="3"/><line x1="880" y1="230" x2="880" y2="320" stroke="#c76b00" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" opacity="1"/><rect x="691.5" y="310" width="117" height="38" rx="19" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5"/><text x="750" y="337" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">sup = s</text><rect x="871.5" y="310" width="117" height="38" rx="19" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="930" y="337" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">max = s</text><rect x="100" y="405" width="1000" height="180" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="438" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">B=[a,s)</text><line x1="220" y1="510" x2="970" y2="510" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="965" y1="510" x2="970" y2="510" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 970 510 L 958.5 516.1 L 958.5 503.9 Z" fill="#18212b"/><line x1="300" y1="502" x2="300" y2="518" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="300" y="544" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">a</text><line x1="880" y1="502" x2="880" y2="518" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="880" y="544" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">s</text><line x1="300" y1="510" x2="880" y2="510" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="300" cy="510" r="10" fill="#18212b" stroke="#18212b" stroke-width="3"/><circle cx="880" cy="510" r="10" fill="#ffffff" stroke="#18212b" stroke-width="3"/><line x1="880" y1="465" x2="880" y2="555" stroke="#c76b00" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" opacity="1"/><rect x="691.5" y="545" width="117" height="38" rx="19" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5"/><text x="750" y="572" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">sup = s</text><rect x="871.5" y="545" width="117" height="38" rx="19" fill="#fff0f3" stroke="#be123c" stroke-width="1.5"/><text x="930" y="572" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#be123c">sin max</text><text x="600" y="674" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">La barrera extremal permanece; sólo el primer conjunto la alcanza.</text>
</svg>
