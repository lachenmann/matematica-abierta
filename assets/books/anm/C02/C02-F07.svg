<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F07" role="img" aria-labelledby="C02-F07-title C02-F07-desc">
<title id="C02-F07-title">Reflexión intercambia supremo e ínfimo</title>
<desc id="C02-F07-desc">Dos rectas muestran A=[-1,4) y su reflejo -A=(-4,1]. La reflexión intercambia los papeles de ínfimo y supremo, con las identidades sup(-A)=-inf A e inf(-A)=-sup A.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="58" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#18212b">Reflexión: arriba y abajo intercambian papeles</text><text x="60" y="92" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">x ↦ −x invierte el orden.</text><rect x="95" y="170" width="1010" height="165" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="200" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">A=[−1,4)</text><line x1="170" y1="275" x2="1030" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1025" y1="275" x2="1030" y2="275" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1030 275 L 1018.5 281.1 L 1018.5 268.9 Z" fill="#18212b"/><rect x="95" y="415" width="1010" height="165" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="445" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">−A=(−4,1]</text><line x1="170" y1="520" x2="1030" y2="520" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1025" y1="520" x2="1030" y2="520" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1030 520 L 1018.5 526.1 L 1018.5 513.9 Z" fill="#18212b"/><line x1="470" y1="275" x2="920" y2="275" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="470" cy="275" r="10" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><circle cx="920" cy="275" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="470" y="315" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">inf A = −1</text><text x="920" y="315" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">sup A = 4</text><line x1="280" y1="520" x2="730" y2="520" stroke="#be123c" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="280" cy="520" r="10" fill="#ffffff" stroke="#be123c" stroke-width="3"/><circle cx="730" cy="520" r="10" fill="#be123c" stroke="#be123c" stroke-width="3"/><text x="280" y="560" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">inf(−A)=−4</text><text x="730" y="560" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">sup(−A)=1</text><line x1="895" y1="345" x2="745" y2="425" stroke="#be123c" stroke-width="3" stroke-linecap="round"/><path d="M 745 425 L 752.2 414.2 L 758.0 425.0 Z" fill="#be123c"/><text x="840" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#be123c">reflexión</text><line x1="480" y1="345" x2="315" y2="425" stroke="#be123c" stroke-width="3" stroke-linecap="round"/><path d="M 315 425 L 322.6 414.5 L 328.0 425.5 Z" fill="#be123c"/><rect x="286.0" y="625" width="208" height="38" rx="19" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="390" y="652" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">sup(−A)=−inf A</text><rect x="716.0" y="625" width="208" height="38" rx="19" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5"/><text x="820" y="652" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">inf(−A)=−sup A</text>
</svg>
