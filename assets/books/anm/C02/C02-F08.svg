<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F08" role="img" aria-labelledby="C02-F08-title C02-F08-desc">
<title id="C02-F08-title">De definición a pregunta de existencia</title>
<desc id="C02-F08-desc">Diagrama lógico de tres niveles: definición de supremo, verificación en un conjunto concreto y garantía general de existencia. La pregunta min U(A)? permanece abierta y una caja discontinua remite a C03 completitud.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#18212b">De definición a pregunta de existencia</text><rect x="100" y="115" width="1000" height="125" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="150" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#2563eb">1. DEFINICIÓN</text><text x="600" y="185" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" font-style="normal" fill="#18212b">s = sup A  ⇔  s = min U(A)</text><line x1="600" y1="242" x2="600" y2="295" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 600 295 L 593.9 283.5 L 606.1 283.5 Z" fill="#18212b"/><rect x="100" y="300" width="1000" height="125" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="150" y="335" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#0f766e">2. VERIFICACIÓN PARTICULAR</text><text x="600" y="370" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" font-style="normal" fill="#18212b">para un A concreto: probar cota + minimalidad</text><line x1="600" y1="427" x2="600" y2="480" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 600 480 L 593.9 468.5 L 606.1 468.5 Z" fill="#18212b"/><rect x="100" y="485" width="1000" height="145" rx="18" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="150" y="520" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#c76b00">3. GARANTÍA GENERAL</text><text x="380" y="560" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#18212b">U(A) ≠ ∅</text><text x="600" y="560" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#5f6b78">+</text><rect x="722.0" y="535" width="156" height="38" rx="19" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5"/><text x="800" y="562" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">min U(A) ?</text><text x="600" y="605" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">La definición no responde este signo de interrogación.</text><rect x="875" y="652" width="225" height="45" rx="16" fill="#fff0f3" stroke="#be123c" stroke-width="2" stroke-dasharray="7 6"/><text x="987" y="681" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#be123c">C03: completitud</text><line x1="875" y1="675" x2="790" y2="620" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M 790 620 L 803.0 621.1 L 796.3 631.4 Z" fill="#be123c"/>
</svg>
