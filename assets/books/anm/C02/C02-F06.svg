<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F06" role="img" aria-labelledby="C02-F06-title C02-F06-desc">
<title id="C02-F06-title">Inclusión, familias de cotas y movimiento de barreras</title>
<desc id="C02-F06-desc">Tres paneles muestran que una inclusión estricta puede conservar el supremo, puede desplazarlo y que añadir un punto dentro del intervalo entre ínfimo y supremo no cambia las barreras, mientras un punto exterior sí.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Inclusión, familias de cotas y movimiento de barreras</text><rect x="55" y="100" width="535" height="240" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><rect x="610" y="100" width="535" height="240" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><rect x="55" y="370" width="1090" height="280" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="322" y="132" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">A⊊B, pero la barrera puede quedar igual</text><line x1="110" y1="225" x2="545" y2="225" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="540" y1="225" x2="545" y2="225" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 545 225 L 533.5 231.1 L 533.5 218.9 Z" fill="#18212b"/><line x1="230" y1="217" x2="230" y2="233" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="230" y="259" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="465" y1="217" x2="465" y2="233" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="465" y="259" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="230" y1="225" x2="465" y2="225" stroke="#2563eb" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="230" cy="225" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><circle cx="465" cy="225" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><line x1="230" y1="270" x2="465" y2="270" stroke="#0f766e" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="230" cy="270" r="9" fill="#0f766e" stroke="#0f766e" stroke-width="3"/><circle cx="465" cy="270" r="9" fill="#0f766e" stroke="#0f766e" stroke-width="3"/><text x="150" y="230" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2563eb">A</text><text x="150" y="275" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0f766e">B</text><line x1="465" y1="165" x2="465" y2="315" stroke="#c76b00" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7" opacity="1"/><text x="465" y="325" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">sup A = sup B = 1</text><text x="878" y="132" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">Al ampliar B, la barrera puede desplazarse</text><line x1="665" y1="225" x2="1100" y2="225" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1095" y1="225" x2="1100" y2="225" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1100 225 L 1088.5 231.1 L 1088.5 218.9 Z" fill="#18212b"/><line x1="775" y1="217" x2="775" y2="233" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="775" y="259" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="920" y1="217" x2="920" y2="233" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="920" y="259" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="1045" y1="217" x2="1045" y2="233" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="1045" y="259" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">2</text><line x1="775" y1="225" x2="920" y2="225" stroke="#2563eb" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="775" cy="225" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><circle cx="920" cy="225" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><line x1="775" y1="270" x2="1045" y2="270" stroke="#0f766e" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="775" cy="270" r="9" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="1045" cy="270" r="9" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><line x1="920" y1="165" x2="920" y2="310" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" opacity="1"/><line x1="1045" y1="165" x2="1045" y2="310" stroke="#c76b00" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7" opacity="1"/><text x="878" y="325" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">sup A=1 &lt; sup B=2</text><text x="600" y="403" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">Añadir un punto: dentro no mueve las barreras; fuera sí</text><line x1="145" y1="520" x2="1070" y2="520" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1065" y1="520" x2="1070" y2="520" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1070 520 L 1058.5 526.1 L 1058.5 513.9 Z" fill="#18212b"/><line x1="300" y1="512" x2="300" y2="528" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="300" y="554" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">i</text><line x1="830" y1="512" x2="830" y2="528" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="830" y="554" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">s</text><line x1="300" y1="520" x2="830" y2="520" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="300" cy="520" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><circle cx="830" cy="520" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><circle cx="580" cy="520" r="9" fill="#0f766e"/><text x="580" y="490" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">c∈[i,s]</text><rect x="450.0" y="585" width="260" height="38" rx="19" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="580" y="612" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">inf/sup no cambian</text><circle cx="980" cy="520" r="9" fill="#be123c"/><text x="980" y="490" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#be123c">c&gt;s</text><rect x="813.0" y="585" width="234" height="38" rx="19" fill="#fff0f3" stroke="#be123c" stroke-width="1.5"/><text x="930" y="612" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#be123c">sup se mueve a c</text><text x="600" y="690" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">Si A⊆B: U(B)⊆U(A) y L(B)⊆L(A).</text>
</svg>
