<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F05" role="img" aria-labelledby="C02-F05-title C02-F05-desc">
<title id="C02-F05-title">Franjas epsilon junto al supremo</title>
<desc id="C02-F05-desc">Tres franjas de anchuras epsilon distintas junto a una barrera s. En cada franja aparece al menos un punto de A, sin flechas ni índices que sugieran una sucesión.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="58" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#18212b">Franjas ε junto al supremo</text><text x="60" y="92" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">Cada ε plantea una existencia independiente; no hay una sucesión dibujada.</text><rect x="95" y="115" width="1010" height="130" rx="16" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="135" y="187" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#c76b00">ε₁</text><line x1="255" y1="180" x2="1060" y2="180" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1055" y1="180" x2="1060" y2="180" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1060 180 L 1048.5 186.1 L 1048.5 173.9 Z" fill="#18212b"/><line x1="980" y1="172" x2="980" y2="188" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="980" y="214" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">s</text><line x1="255" y1="180" x2="980" y2="180" stroke="#2563eb" stroke-width="7" stroke-linecap="round" opacity="1"/><circle cx="980" cy="180" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><rect x="617.5" y="156" width="362.5" height="48" rx="8" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="798.75" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">(s−ε₁, s]</text><circle cx="853.125" cy="180" r="8" fill="#0f766e"/><text x="853.125" y="218" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">a∈A</text><rect x="95" y="295" width="1010" height="130" rx="16" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="135" y="367" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#c76b00">ε₂</text><line x1="255" y1="360" x2="1060" y2="360" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1055" y1="360" x2="1060" y2="360" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1060 360 L 1048.5 366.1 L 1048.5 353.9 Z" fill="#18212b"/><line x1="980" y1="352" x2="980" y2="368" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="980" y="394" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">s</text><line x1="255" y1="360" x2="980" y2="360" stroke="#2563eb" stroke-width="7" stroke-linecap="round" opacity="1"/><circle cx="980" cy="360" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><rect x="777.0" y="336" width="203.0" height="48" rx="8" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="878.5" y="326" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">(s−ε₂, s]</text><circle cx="908.95" cy="360" r="8" fill="#0f766e"/><text x="908.95" y="398" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">a∈A</text><rect x="95" y="475" width="1010" height="130" rx="16" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="135" y="547" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#c76b00">ε₃</text><line x1="255" y1="540" x2="1060" y2="540" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1055" y1="540" x2="1060" y2="540" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1060 540 L 1048.5 546.1 L 1048.5 533.9 Z" fill="#18212b"/><line x1="980" y1="532" x2="980" y2="548" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="980" y="574" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">s</text><line x1="255" y1="540" x2="980" y2="540" stroke="#2563eb" stroke-width="7" stroke-linecap="round" opacity="1"/><circle cx="980" cy="540" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><rect x="878.5" y="516" width="101.5" height="48" rx="8" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="929.25" y="506" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#c76b00">(s−ε₃, s]</text><circle cx="944.475" cy="540" r="8" fill="#0f766e"/><text x="944.475" y="578" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">a∈A</text><text x="600" y="666" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#18212b">No existe una franja positiva junto a s que quede vacía de A.</text>
</svg>
