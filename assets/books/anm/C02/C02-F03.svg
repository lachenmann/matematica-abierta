<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F03" role="img" aria-labelledby="C02-F03-title C02-F03-desc">
<title id="C02-F03-title">A, L(A), U(A) y sus extremos</title>
<desc id="C02-F03-desc">Tres carriles alineados para A=(2,5), L(A)=(-infinito,2] y U(A)=[5,infinito). Los extremos de las familias de cotas son el ínfimo y el supremo, aunque no pertenezcan a A.</desc>
