<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F10" role="img" aria-labelledby="C02-F10-title C02-F10-desc">
<title id="C02-F10-title">Mapa lógico de una barrera superior</title>
<desc id="C02-F10-desc">Grafo de dependencias entre s=sup A, s=min U(A), ser cota superior más la condición epsilon, pertenencia s en A y s=max A. Una caja discontinua C03 representa la garantía general de existencia y no una premisa disponible en C02.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#18212b">Mapa lógico de una barrera superior</text><text x="60" y="90" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#5f6b78">Flecha doble = equivalencia demostrada en C02. Flecha discontinua = puerta de existencia de C03.</text><rect x="455" y="135" width="290" height="75" rx="16" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="600.0" y="164.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#2563eb">s = sup A</text><rect x="100" y="295" width="300" height="80" rx="16" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="327.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#0f766e">s = min U(A)</text><rect x="800" y="285" width="320" height="100" rx="16" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="960.0" y="327.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#0f766e">s cota superior
+ condición ε (A≠∅)</text><rect x="120" y="500" width="250" height="75" rx="16" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="245.0" y="529.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#c76b00">s ∈ A</text><rect x="475" y="500" width="300" height="75" rx="16" fill="#fff0f3" stroke="#be123c" stroke-width="2"/><text x="625.0" y="529.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#be123c">s = max A</text><rect x="850" y="510" width="270" height="95" rx="16" fill="#fff7ed" stroke="#be123c" stroke-width="2" stroke-dasharray="8 7"/><text x="985.0" y="549.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#be123c">C03: existencia
general de sup A</text><line x1="455" y1="173" x2="400" y2="335" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 400 335 L 397.9 322.2 L 409.5 326.1 Z" fill="#2563eb"/><line x1="400" y1="328" x2="455" y2="175" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 455 175 L 456.9 187.9 L 445.3 183.7 Z" fill="#2563eb"/><text x="402" y="238" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#2563eb">⇔</text><line x1="745" y1="173" x2="800" y2="335" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 800 335 L 790.5 326.1 L 802.1 322.2 Z" fill="#2563eb"/><line x1="800" y1="328" x2="745" y2="175" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 745 175 L 754.7 183.7 L 743.1 187.9 Z" fill="#2563eb"/><text x="798" y="238" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#2563eb">⇔</text><line x1="370" y1="538" x2="475" y2="538" stroke="#c76b00" stroke-width="3" stroke-linecap="round"/><path d="M 475 538 L 463.5 544.1 L 463.5 531.9 Z" fill="#c76b00"/><text x="422" y="522" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#c76b00">+</text><line x1="625" y1="500" x2="625" y2="215" stroke="#be123c" stroke-width="2" stroke-linecap="round"/><path d="M 625 215 L 631.1 226.5 L 618.9 226.5 Z" fill="#be123c"/><text x="646" y="370" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#be123c">⇒</text><text x="600" y="468" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#5f6b78">sup A + pertenencia ⇒ max A</text><line x1="850" y1="555" x2="745" y2="190" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7"/><path d="M 745 190 L 754.1 199.3 L 742.3 202.7 Z" fill="#be123c"/><text x="870" y="430" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#be123c">garantía</text><text x="600" y="665" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">C02 describe qué es el supremo y cómo reconocerlo; C03 garantizará que exista bajo hipótesis.</text>
</svg>
