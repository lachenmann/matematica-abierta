<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C02-F02" role="img" aria-labelledby="C02-F02-title C02-F02-desc">
<title id="C02-F02-title">Extremo alcanzado: máximo y mínimo</title>
<desc id="C02-F02-desc">Comparación de un intervalo cerrado y uno abierto. En el cerrado los extremos pertenecen y son mínimo y máximo; en el abierto las mismas fronteras no pertenecen y no hay mínimo ni máximo.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="60" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#18212b">Extremo alcanzado: máximo y mínimo</text><text x="60" y="94" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">Ser cota no basta: el extremo debe pertenecer al conjunto.</text><rect x="80" y="160" width="1040" height="175" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="192" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">[a,b]  — máximo y mínimo</text><line x1="210" y1="265" x2="990" y2="265" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="985" y1="265" x2="990" y2="265" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 990 265 L 978.5 271.1 L 978.5 258.9 Z" fill="#18212b"/><line x1="300" y1="257" x2="300" y2="273" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="300" y="299" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">a</text><line x1="900" y1="257" x2="900" y2="273" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="900" y="299" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">b</text><line x1="300" y1="265" x2="900" y2="265" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="300" cy="265" r="10" fill="#18212b" stroke="#18212b" stroke-width="3"/><circle cx="900" cy="265" r="10" fill="#18212b" stroke="#18212b" stroke-width="3"/><rect x="292.0" y="291" width="156" height="38" rx="19" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="370" y="318" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">mínimo = a</text><rect x="752.0" y="291" width="156" height="38" rx="19" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="830" y="318" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#0f766e">máximo = b</text><rect x="80" y="390" width="1040" height="175" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="422" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#18212b">(a,b)  — ni máximo ni mínimo</text><line x1="210" y1="495" x2="990" y2="495" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="985" y1="495" x2="990" y2="495" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 990 495 L 978.5 501.1 L 978.5 488.9 Z" fill="#18212b"/><line x1="300" y1="487" x2="300" y2="503" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="300" y="529" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">a</text><line x1="900" y1="487" x2="900" y2="503" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="900" y="529" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#18212b">b</text><line x1="300" y1="495" x2="900" y2="495" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="300" cy="495" r="10" fill="#ffffff" stroke="#18212b" stroke-width="3"/><circle cx="900" cy="495" r="10" fill="#ffffff" stroke="#18212b" stroke-width="3"/><rect x="292.0" y="521" width="156" height="38" rx="19" fill="#fff0f3" stroke="#be123c" stroke-width="1.5"/><text x="370" y="548" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#be123c">sin mínimo</text><rect x="752.0" y="521" width="156" height="38" rx="19" fill="#fff0f3" stroke="#be123c" stroke-width="1.5"/><text x="830" y="548" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#be123c">sin máximo</text><text x="600" y="674" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">Punto lleno = pertenece. Punto hueco = no pertenece.</text>
</svg>
