<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="800" id="C00-F07" role="img" version="1.1" viewBox="0 0 1200 800" width="1200">
  <title>La unión que cierra la existencia</title>
  <desc>Una familia no vacía y acotada de cortaduras tiene como candidato a supremo su unión; la figura separa verificar que la unión es cortadura de verificar que es la menor cota superior.</desc>
  <defs/>
