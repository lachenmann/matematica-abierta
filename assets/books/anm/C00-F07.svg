  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="625" y="490">✓</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="653" y="490">S⊆V para toda cota superior V</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="350" x="690" y="535"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="865.0" y="566">sup_D(A) = unión(A)</text>
  <rect fill="#f8fafc" height="105" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="900" x="150" y="660"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="168" y="691">Cierre de existencia</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="300" y="715">ORDERED_FIELD = VERIFIED</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="715">+</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="875" y="715">SUPREMUM_PROPERTY = VERIFIED</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="752">⇒  modelo de cuerpo ordenado completo</text>
