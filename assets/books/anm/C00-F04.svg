<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="700" id="C00-F04" role="img" version="1.1" viewBox="0 0 1200 700" width="1200">
  <title>Una cortadura es un lado izquierdo racional</title>
  <desc>Una cortadura de Dedekind se representa como un subconjunto propio de Q cerrado hacia abajo y sin máximo; la frontera dibujada sólo codifica una posición y no es un punto del conjunto.</desc>
  <defs/>
  <rect fill="#ffffff" height="700" width="1200" x="0" y="0"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="46">Una cortadura es un lado izquierdo racional</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="76">El objeto es A⊂Q; la frontera sólo representa una posición codificada</text>
  <rect fill="#f8fafc" height="390" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="720" x="50" y="120"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="68" y="151">A ⊂ Q</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="120" x2="700" y1="330" y2="330"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="690" x2="700" y1="324" y2="330"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="690" x2="700" y1="336" y2="330"/>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="16" x1="120" x2="500" y1="330" y2="330"/>
  <line stroke="#a87320" stroke-dasharray="8 6" stroke-linecap="round" stroke-width="3" x1="500" x2="500" y1="250" y2="410"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="310" y="285">racionales de A</text>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="500" y="235">frontera conceptual</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="500" y="435">no es elemento de A</text>
  <circle cx="200" cy="330" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="200" y="315">q₁</text>
  <circle cx="320" cy="330" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="320" y="315">q₂</text>
  <circle cx="440" cy="330" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="440" y="315">q₃</text>
  <circle cx="560" cy="330" fill="#ffffff" r="6" stroke="#65758b" stroke-width="3"/>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="560" y="315">u∉A</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="410" y="475">objeto = conjunto de racionales</text>
  <rect fill="#f8fafc" height="390" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="340" x="805" y="120"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="823" y="151">Cuatro obligaciones</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="840" y="190">✓</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="868" y="190">A ≠ ∅</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="840" y="245">✓</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="868" y="245">A ≠ Q</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="840" y="300">✓</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="868" y="300">q∈A, r&lt;q ⇒ r∈A</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="840" y="355">✓</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="868" y="355">sin máximo</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="900" x2="1040" y1="410" y2="410"/>
  <polygon fill="#2f7d77" points="1040,410 1030.243055849428,415.0795709309563 1030.243055849428,404.9204290690437"/>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="860" y="455">si q∈A</text>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="845" y="482">hay r∈A con q&lt;r</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="650" x="275" y="560"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="591">cortadura = “lado izquierdo” racional</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="650">La figura NO identifica todavía A con un real preexistente.</text>
</svg>
