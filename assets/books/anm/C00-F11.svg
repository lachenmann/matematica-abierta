  <title>Aritmética II: producto, inverso y signos</title>
  <desc>Arquitectura probatoria del producto e inverso de cortaduras: el producto ingenuo falla, se pasa al cono positivo, luego se extiende por signos y se verifican inversos, asociatividad y distributividad.</desc>
