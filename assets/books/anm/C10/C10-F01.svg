   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #525c64" x="35.64" y="491.4" transform="rotate(-0 35.64 491.4)">Muestra n = 0,…,11. El control universal se prueba por la cota 1/(N+1), no por el par mostrado.</text>
  </g>
 </g>
