<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" id="C00-F01" role="img" version="1.1" viewBox="0 0 1200 650" width="1200">
  <title>Existencia antes que unicidad</title>
  <desc>Mapa lógico del capítulo: partir de una especificación, preguntar por existencia, construir un modelo y sólo después abrir la comparación estructural y la unicidad.</desc>
  <defs/>
  <rect fill="#ffffff" height="650" width="1200" x="0" y="0"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="46">Existencia antes que unicidad</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="76">La pregunta de existencia debe cerrarse antes de abrir la unicidad</text>
  <rect fill="#f8fafc" height="395" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1090" x="55" y="115"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="73" y="146">Orden lógico del capítulo</text>
  <rect fill="#eef3f8" height="86" rx="16" ry="16" stroke="#dce3ec" stroke-width="2" width="210" x="150" y="220"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="255.0" y="257">ESPECIFICACIÓN</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="255.0" y="283">cuerpo + orden + supremos</text>
  <rect fill="#fff8e8" height="86" rx="16" ry="16" stroke="#dce3ec" stroke-width="2" width="180" x="390" y="220"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="480.0" y="257">¿EXISTE?</text>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="480.0" y="283">pregunta abierta</text>
  <rect fill="#eef8f6" height="86" rx="16" ry="16" stroke="#dce3ec" stroke-width="2" width="270" x="650" y="220"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="785.0" y="257">CONSTRUCCIÓN / VERIFICACIÓN</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="785.0" y="283">no presupone la respuesta</text>
  <rect fill="#f2f6fb" height="86" rx="16" ry="16" stroke="#dce3ec" stroke-width="2" width="230" x="930" y="220"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1045.0" y="257">COMPARACIÓN ESTRUCTURAL</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="1045.0" y="283">sólo después de existencia</text>
  <line stroke="#65758b" stroke-linecap="round" stroke-width="3" x1="360" x2="388" y1="263" y2="263"/>
  <polygon fill="#65758b" points="388,263 378.2430558494279,268.0795709309563 378.2430558494279,257.9204290690437"/>
  <line stroke="#65758b" stroke-linecap="round" stroke-width="3" x1="570" x2="645" y1="263" y2="263"/>
  <polygon fill="#65758b" points="645,263 635.2430558494278,268.0795709309563 635.2430558494278,257.9204290690437"/>
  <line stroke="#65758b" stroke-linecap="round" stroke-width="3" x1="920" x2="925" y1="263" y2="263"/>
  <polygon fill="#65758b" points="925,263 915.2430558494278,268.0795709309563 915.2430558494278,257.9204290690437"/>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="600" y="360">La apertura NO revela la respuesta.</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="600" y="405">El capítulo primero construye y certifica un modelo; recién entonces pregunta si otro modelo puede diferir estructuralmente.</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="470" x="365" y="448"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="479">primero existencia  →  después unicidad</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="575">No confundir: especificar propiedades ≠ demostrar que existe un objeto que las satisface.</text>
</svg>
