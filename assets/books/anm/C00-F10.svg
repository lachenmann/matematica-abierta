<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="860" id="C00-F10" role="img" version="1.1" viewBox="0 0 1200 860" width="1200">
  <title>Transporte canónico y unicidad</title>
  <desc>El transporte entre dos cuerpos ordenados completos pasa de x en F a su traza racional, reconstruye esa traza en G y usa el transporte simétrico para obtener biyección y unicidad del isomorfismo.</desc>
  <defs/>
  <rect fill="#ffffff" height="860" width="1200" x="0" y="0"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="46">Transporte canónico y unicidad</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="76">El puente común es Q; la biyección se obtiene con el transporte simétrico</text>
  <rect fill="#ffffff" height="560" rx="14" ry="14" stroke="#2f6f9f" stroke-width="2" width="300" x="45" y="120"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="151">Modelo F</text>
  <rect fill="#ffffff" height="560" rx="14" ry="14" stroke="#2f7d77" stroke-width="2" width="300" x="450" y="120"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="468" y="151">Puente Q</text>
  <rect fill="#ffffff" height="560" rx="14" ry="14" stroke="#6d5aa8" stroke-width="2" width="300" x="855" y="120"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="873" y="151">Modelo G</text>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" x="195" y="230">x</text>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" x="1005" y="230">φ(x)</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="160" x="520" y="260"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="291">Aₓ ⊂ Q</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="4" x1="300" x2="490" y1="230" y2="300"/>
  <polygon fill="#2f6f9f" points="490,300 479.0886037237664,301.3933525408151 482.60067350651696,291.86059170192084"/>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="395.0" y="250.0">traza Aₓ</text>
  <line stroke="#6d5aa8" stroke-linecap="round" stroke-width="4" x1="710" x2="900" y1="300" y2="230"/>
  <polygon fill="#6d5aa8" points="900,230 892.600673506517,238.13940829807916 889.0886037237664,228.60664745918487"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="805.0" y="250.0">sup_G ι_G(Aₓ)</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="240" x="480" y="355"/>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="600.0" y="386">A_{φ(x)} = Aₓ</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="600" y="430">orden preservado y reflejado</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="500">transporte simétrico</text>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" x="1005" y="565">y</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="160" x="520" y="535"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="600.0" y="566">A_y ⊂ Q</text>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" x="195" y="565">ψ(y)</text>
  <line stroke="#6d5aa8" stroke-linecap="round" stroke-width="4" x1="900" x2="710" y1="555" y2="585"/>
  <polygon fill="#6d5aa8" points="710,585 718.8453251321886,578.4608698356836 720.4297710412499,588.4956939264051"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="805.0" y="558.0">traza</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="4" x1="490" x2="300" y1="585" y2="555"/>
  <polygon fill="#2f6f9f" points="300,555 310.42977104124986,551.5043060735949 308.8453251321886,561.5391301643164"/>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="395.0" y="558.0">sup_F</text>
  <rect fill="#f2f6fb" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="460" x="370" y="625"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="600.0" y="656">ψ∘φ = id_F   ·   φ∘ψ = id_G</text>
  <rect fill="#f8fafc" height="110" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="800" x="200" y="715"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="218" y="746">Conclusión estructural</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="330" y="765">LITERAL_EQUALITY: no requerida</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="600" y="765">ISOMORFISMO: existe</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="870" y="765">ISOMORFISMO: único</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="600" y="842">La correspondencia F↔G no se dibuja como flecha directa antes de pasar por la traza racional.</text>
</svg>
