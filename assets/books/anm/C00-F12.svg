<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="900" id="C00-F12" role="img" version="1.1" viewBox="0 0 1200 900" width="1200">
  <title>La aritmética viaja con la traza</title>
  <desc>La preservación de la aritmética por el transporte canónico se fuerza por las trazas racionales: se fijan los racionales, se caracteriza la suma y se trata el producto primero en no negativos y luego por signos.</desc>
  <defs/>
  <rect fill="#ffffff" height="900" width="1200" x="0" y="0"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="46">La aritmética viaja con la traza</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="76">La misma información racional fuerza la misma aritmética en F y G</text>
  <rect fill="#f8fafc" height="160" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1110" x="45" y="115"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="146">1 · Los racionales quedan fijos</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="430" x="385" y="165"/>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="600.0" y="196">φ ∘ ι_F = ι_G</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="260">0 y 1 se transportan automáticamente con la copia racional canónica.</text>
  <rect fill="#f8fafc" height="230" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1110" x="45" y="305"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="336">2 · La suma se lee desde la traza</text>
  <rect fill="#f2f6fb" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="870" x="165" y="355"/>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600.0" y="386">q∈A_{x+y}  ⇔  ∃r∈Aₓ, ∃s∈A_y : q&lt;r+s</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="360" x2="520" y1="440" y2="440"/>
  <polygon fill="#2f7d77" points="520,440 510.2430558494279,445.0795709309563 510.2430558494279,434.9204290690437"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="440.0" y="428.0">misma regla en G</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="410" x="545" y="415"/>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="750.0" y="446">A_{φ(x+y)} = A_{φ(x)+φ(y)}</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="600" y="505">⇒ φ(x+y)=φ(x)+φ(y)</text>
  <rect fill="#f8fafc" height="250" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1110" x="45" y="565"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="596">3 · El producto: primero no negativos, después signos</text>
  <rect fill="#f2f6fb" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="1020" x="90" y="615"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="600.0" y="646">x,y≥0: q∈A_{xy} ⇔ q&lt;0 o ∃ r∈Aₓ, s∈A_y con r,s&gt;0 y q&lt;rs</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="170" y="705">Luego usar φ(−z)=−φ(z) para cerrar:</text>
  <rect fill="#fff8e8" height="38" rx="19" ry="19" stroke="#dce3ec" stroke-width="1.5" width="190" x="230" y="730"/>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="325.0" y="755">x&lt;0≤y</text>
  <rect fill="#fff8e8" height="38" rx="19" ry="19" stroke="#dce3ec" stroke-width="1.5" width="190" x="470" y="730"/>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="565.0" y="755">x≥0&gt;y</text>
  <rect fill="#fff8e8" height="38" rx="19" ry="19" stroke="#dce3ec" stroke-width="1.5" width="190" x="710" y="730"/>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="805.0" y="755">x&lt;0, y&lt;0</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="500" x="350" y="815"/>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="846">φ(xy)=φ(x)φ(y)  para todos x,y∈F</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="600" y="880">No basta la multiplicatividad en el cono no negativo: los tres casos restantes deben cerrarse explícitamente.</text>
</svg>
