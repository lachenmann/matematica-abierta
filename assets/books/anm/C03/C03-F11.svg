<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F11" role="img" aria-labelledby="C03-F11-title C03-F11-desc">
<title id="C03-F11-title">Tres criterios equivalentes para un núcleo singleton</title>
<desc id="C03-F11-desc">Diagrama triangular que conecta por equivalencias el estrechamiento arbitrario, la igualdad s igual a t y la intersección puntual. Una caja exterior indica que completitud se usa previamente sólo para garantizar la existencia de las barreras s y t.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Tres criterios equivalentes para un núcleo singleton</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">La existencia de s y t es previa; las equivalencias internas no gastan completitud otra vez.</text><rect x="380" y="120" width="440" height="80" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="600" y="152" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">dependencia previa</text><text x="600" y="180" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" font-style="normal" fill="#18212b">completitud ⇒ existen s=sup{a_n}, t=inf{b_n}</text><line x1="600" y1="202" x2="600" y2="245" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M 600 245 L 593.9 233.5 L 606.1 233.5 Z" fill="#0f766e"/><rect x="95" y="445" width="320" height="130" rx="18" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="255" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#c76b00"><tspan x="255" dy="0">estrechamiento arbitrario</tspan><tspan x="255" dy="21">para todo ε&gt;0 existe n:</tspan><tspan x="255" dy="21">b_n−a_n&lt;ε</tspan></text><rect x="455" y="245" width="290" height="95" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="600" y="282" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#2563eb"><tspan x="600" dy="0">coincidencia</tspan><tspan x="600" dy="29">s = t</tspan></text><rect x="785" y="455" width="320" height="105" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="945" y="488" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#0f766e"><tspan x="945" dy="0">intersección puntual</tspan><tspan x="945" dy="26">intersección I_n = {s}</tspan></text><line x1="405" y1="455" x2="505" y2="338" stroke="#18212b" stroke-width="2" stroke-linecap="round"/><path d="M 505 338 L 502.2 350.7 L 492.9 342.7 Z" fill="#18212b"/><line x1="505" y1="338" x2="405" y2="455" stroke="#18212b" stroke-width="2" stroke-linecap="round"/><path d="M 405 455 L 407.8 442.3 L 417.1 450.3 Z" fill="#18212b"/><text x="455" y="390" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#18212b">⇔</text><line x1="695" y1="338" x2="795" y2="455" stroke="#18212b" stroke-width="2" stroke-linecap="round"/><path d="M 795 455 L 782.9 450.3 L 792.2 442.3 Z" fill="#18212b"/><line x1="795" y1="455" x2="695" y2="338" stroke="#18212b" stroke-width="2" stroke-linecap="round"/><path d="M 695 338 L 707.1 342.7 L 697.8 350.7 Z" fill="#18212b"/><text x="745" y="390" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#18212b">⇔</text><line x1="415" y1="520" x2="785" y2="520" stroke="#18212b" stroke-width="2" stroke-linecap="round"/><path d="M 785 520 L 773.5 526.1 L 773.5 513.9 Z" fill="#18212b"/><line x1="785" y1="520" x2="415" y2="520" stroke="#18212b" stroke-width="2" stroke-linecap="round"/><path d="M 415 520 L 426.5 513.9 L 426.5 526.1 Z" fill="#18212b"/><text x="600" y="505" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#18212b">⇔</text><text x="600" y="632" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">Una vez disponibles las barreras, las tres descripciones expresan el mismo fenómeno.</text>
</svg>