<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F09" role="img" aria-labelledby="C03-F09-title C03-F09-desc">
<title id="C03-F09-title">SUP, INF, SEP y GCI como interfaces equivalentes</title>
<desc id="C03-F09-desc">Cuatro nodos SUP, INF, SEP y GCI forman un ciclo de equivalencias. Desde GCI desciende una flecha unilateral hacia el caso numerable de intervalos encajados. En un carril separado, el estrechamiento conduce a unicidad sin formar parte del ciclo de completitud.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Interfaces equivalentes de completitud</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Equivalencia estructural arriba; consecuencias y unicidad en carriles separados.</text><rect x="190" y="180" width="230" height="85" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="305" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800" font-style="normal" fill="#2563eb">SUP</text><rect x="780" y="180" width="230" height="85" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="895" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800" font-style="normal" fill="#2563eb">INF</text><rect x="780" y="370" width="230" height="85" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="895" y="422" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800" font-style="normal" fill="#2563eb">SEP</text><rect x="190" y="370" width="230" height="85" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="305" y="422" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800" font-style="normal" fill="#2563eb">GCI</text><line x1="420" y1="222" x2="780" y2="222" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 780 222 L 768.5 228.1 L 768.5 215.9 Z" fill="#2563eb"/><line x1="780" y1="222" x2="420" y2="222" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 420 222 L 431.5 215.9 L 431.5 228.1 Z" fill="#2563eb"/><text x="600" y="205" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#2563eb">⇔</text><line x1="895" y1="265" x2="895" y2="370" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 895 370 L 888.9 358.5 L 901.1 358.5 Z" fill="#2563eb"/><line x1="895" y1="370" x2="895" y2="265" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 895 265 L 901.1 276.5 L 888.9 276.5 Z" fill="#2563eb"/><text x="920" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#2563eb">⇔</text><line x1="780" y1="412" x2="420" y2="412" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 420 412 L 431.5 405.9 L 431.5 418.1 Z" fill="#2563eb"/><line x1="420" y1="412" x2="780" y2="412" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 780 412 L 768.5 418.1 L 768.5 405.9 Z" fill="#2563eb"/><text x="600" y="395" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#2563eb">⇔</text><line x1="305" y1="370" x2="305" y2="265" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 305 265 L 311.1 276.5 L 298.9 276.5 Z" fill="#2563eb"/><line x1="305" y1="265" x2="305" y2="370" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 305 370 L 298.9 358.5 L 311.1 358.5 Z" fill="#2563eb"/><text x="278" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#2563eb">⇔</text><line x1="305" y1="455" x2="305" y2="535" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M 305 535 L 298.9 523.5 L 311.1 523.5 Z" fill="#0f766e"/><rect x="120" y="545" width="370" height="75" rx="16" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="305" y="591" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0f766e">caso numerable encajado</text><text x="305" y="642" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5f6b78">consecuencia / especialización</text><rect x="685" y="525" width="390" height="120" rx="16" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="880" y="560" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#c76b00">estrechamiento arbitrario</text><line x1="880" y1="580" x2="880" y2="615" stroke="#c76b00" stroke-width="3" stroke-linecap="round"/><path d="M 880 615 L 873.9 603.5 L 886.1 603.5 Z" fill="#c76b00"/><text x="880" y="638" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#c76b00">unicidad</text><text x="600" y="687" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#5f6b78">No hay flecha de equivalencia desde el caso numerable ni desde el estrechamiento al ciclo básico.</text>
</svg>