<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F07" role="img" aria-labelledby="C03-F07-title C03-F07-desc">
<title id="C03-F07-title">Estrechamiento arbitrario fuerza unicidad</title>
<desc id="C03-F07-desc">Dos puntos distintos x e y determinan una distancia positiva delta. Un intervalo de ancho menor que delta no puede contenerlos a ambos. La fórmula distancia menor o igual que el ancho menor que la misma distancia produce la contradicción de unicidad.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Estrechamiento arbitrario fuerza unicidad</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Si dos candidatos distintos sobrevivieran, su distancia positiva proporciona la tolerancia decisiva.</text><rect x="80" y="140" width="1040" height="390" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><line x1="150" y1="270" x2="1050" y2="270" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1045" y1="270" x2="1050" y2="270" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1050 270 L 1038.5 276.1 L 1038.5 263.9 Z" fill="#18212b"/><circle cx="370" cy="270" r="10" fill="#2563eb"/><circle cx="820" cy="270" r="10" fill="#2563eb"/><text x="370" y="240" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#2563eb">x</text><text x="820" y="240" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#2563eb">y</text><line x1="370" y1="205" x2="820" y2="205" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="370" y1="195" x2="370" y2="215" stroke="#be123c" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="820" y1="195" x2="820" y2="215" stroke="#be123c" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="595.0" y="188" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#be123c">δ = |x−y| &gt; 0</text><line x1="510" y1="400" x2="700" y2="400" stroke="#0f766e" stroke-width="12" stroke-linecap="round" opacity="1"/><circle cx="510" cy="400" r="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="700" cy="400" r="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><line x1="510" y1="355" x2="700" y2="355" stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="605.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#0f766e">b_n−a_n &lt; δ</text><line x1="470" y1="345" x2="510" y2="385" stroke="#5f6b78" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><path d="M 510 385 L 497.6 381.2 L 506.2 372.6 Z" fill="#5f6b78"/><line x1="740" y1="345" x2="700" y2="385" stroke="#5f6b78" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><path d="M 700 385 L 703.8 372.6 L 712.4 381.2 Z" fill="#5f6b78"/><rect x="502.0" y="467" width="196" height="40" rx="20" fill="#fff0f3" stroke="#be123c" stroke-width="1.5"/><text x="600" y="494" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#be123c">no caben ambos</text><text x="600" y="585" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#18212b">Si x,y están en I_n: |x−y|≤b_n−a_n&lt;|x−y|, contradicción.</text><text x="600" y="646" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">La existencia viene de otra parte; este argumento sólo elimina un segundo punto.</text>
</svg>