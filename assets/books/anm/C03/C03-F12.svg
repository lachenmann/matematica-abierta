<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F12" role="img" aria-labelledby="C03-F12-title C03-F12-desc">
<title id="C03-F12-title">La misma prueba compilada con SUP o SEP</title>
<desc id="C03-F12-desc">Dos columnas parten de la misma compatibilidad cruzada y terminan en un punto común. La ruta izquierda usa SUP para producir el supremo de los extremos izquierdos y la derecha usa SEP para producir un separador. Cada columna lleva una sola marca de completitud.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">La misma prueba, dos interfaces de completitud</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Cambiar SUP por SEP cambia la interfaz estructural, no la infraestructura matemática.</text><rect x="310" y="120" width="580" height="75" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="150" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#18212b">compatibilidad cruzada de extremos</text><text x="600" y="178" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#5f6b78">a_m ≤ b_n  para todo m,n</text><rect x="95" y="235" width="480" height="320" rx="20" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="335" y="272" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#2563eb">Ruta SUP</text><rect x="625" y="235" width="480" height="320" rx="20" fill="#f4efff" stroke="#6d28d9" stroke-width="2"/><text x="865" y="272" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#6d28d9">Ruta SEP</text><rect x="255.0" y="290" width="160" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="335" y="317" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">COMPLETITUD</text><rect x="175" y="345" width="320" height="65" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="335" y="385" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" font-style="normal" fill="#2563eb">s = sup A_L</text><line x1="335" y1="412" x2="335" y2="448" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M 335 448 L 328.9 436.5 L 341.1 436.5 Z" fill="#2563eb"/><rect x="160" y="458" width="350" height="65" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="335" y="498" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#18212b">a_n ≤ s ≤ b_n  para todo n</text><rect x="785.0" y="290" width="160" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="865" y="317" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">COMPLETITUD</text><rect x="705" y="345" width="320" height="65" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/><text x="865" y="385" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" font-style="normal" fill="#6d28d9">SEP produce separador c</text><line x1="865" y1="412" x2="865" y2="448" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/><path d="M 865 448 L 858.9 436.5 L 871.1 436.5 Z" fill="#6d28d9"/><rect x="690" y="458" width="350" height="65" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/><text x="865" y="498" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#18212b">a_n ≤ c ≤ b_n  para todo n</text><line x1="335" y1="555" x2="500" y2="610" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M 500 610 L 487.2 612.2 L 491.1 600.6 Z" fill="#0f766e"/><line x1="865" y1="555" x2="700" y2="610" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M 700 610 L 708.9 600.6 L 712.8 612.2 Z" fill="#0f766e"/><rect x="420" y="600" width="360" height="70" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="600" y="642" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" font-style="normal" fill="#0f766e">punto común en todos los I_n</text>
</svg>