<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F01" role="img" aria-labelledby="C03-F01-title C03-F01-desc">
<title id="C03-F01-title">De definición condicional a existencia garantizada</title>
<desc id="C03-F01-desc">Tres paneles separan la definición condicional del supremo, la verificación de no vaciedad y acotación, y la garantía de existencia proporcionada por completitud. Una etiqueta recuerda que la pertenencia del supremo al conjunto no queda decidida.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">De definición condicional a existencia garantizada</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Completitud añade existencia; no convierte automáticamente el supremo en máximo.</text><rect x="70" y="145" width="340" height="390" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="240" y="183" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#5f6b78">1. Definición</text><rect x="430" y="145" width="340" height="390" rx="20" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="600" y="183" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#2563eb">2. Hipótesis verificadas</text><rect x="790" y="145" width="340" height="390" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="960" y="183" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#0f766e">3. Garantía de C03</text><text x="240" y="245" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" fill="#18212b"><tspan x="240" dy="0">sup A = min U(A)</tspan><tspan x="240" dy="33">si ese mínimo existe</tspan></text><rect x="166.0" y="325" width="148" height="40" rx="20" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5"/><text x="240" y="352" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#c76b00">min U(A) ?</text><text x="240" y="425" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#5f6b78"><tspan x="240" dy="0">La definición dice qué sería</tspan><tspan x="240" dy="24">la mejor barrera.</tspan></text><text x="600" y="245" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="650" fill="#18212b"><tspan x="600" dy="0">A ≠ ∅</tspan><tspan x="600" dy="35">U(A) ≠ ∅</tspan></text><text x="600" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2563eb">Condiciones de entrada</text><text x="600" y="422" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#5f6b78"><tspan x="600" dy="0">Todavía no hemos producido</tspan><tspan x="600" dy="24">una menor cota superior.</tspan></text><text x="960" y="235" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" fill="#18212b"><tspan x="960" dy="0">existe s en R</tspan><tspan x="960" dy="33">s = sup A = min U(A)</tspan></text><rect x="880.0" y="320" width="160" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="960" y="347" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">COMPLETITUD</text><rect x="772.0" y="405" width="376" height="40" rx="20" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5"/><text x="960" y="432" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#c76b00">s pertenece a A?  no decidido</text><line x1="410" y1="340" x2="430" y2="340" stroke="#5f6b78" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M 430 340 L 418.5 346.1 L 418.5 333.9 Z" fill="#5f6b78"/><text x="420" y="318" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#be123c">no basta</text><line x1="770" y1="340" x2="790" y2="340" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/><path d="M 790 340 L 778.5 346.1 L 778.5 333.9 Z" fill="#0f766e"/><text x="780" y="312" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#0f766e">⇒</text><text x="600" y="600" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" font-style="normal" fill="#18212b">Definir la frontera no garantiza que exista; SUP autoriza exactamente ese salto.</text><text x="600" y="652" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">La pertenencia de s a A sigue siendo una cuestión distinta.</text>
</svg>