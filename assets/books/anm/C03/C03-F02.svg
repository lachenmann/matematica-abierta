<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F02" role="img" aria-labelledby="C03-F02-title C03-F02-desc">
<title id="C03-F02-title">El fallo racional sin agujero macroscópico</title>
<desc id="C03-F02-desc">Dos paneles muestran S2 como subconjunto racional no vacío y acotado y su familia de cotas superiores racionales con candidatos sucesivamente menores, ninguno mínimo. Se indica que Q es denso y arquimediano pero no completo, sin dibujar un agujero geométrico ni nombrar una frontera irracional.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">El fallo racional sin dibujar un agujero</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">El defecto está en la familia de cotas: U_Q(S₂) existe, pero no tiene mínimo racional.</text><rect x="65" y="130" width="500" height="455" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><rect x="600" y="130" width="535" height="455" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="315" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#18212b">S₂ en Q: conjunto no vacío y acotado</text><line x1="120" y1="310" x2="515" y2="310" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="510" y1="310" x2="515" y2="310" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 515 310 L 503.5 316.1 L 503.5 303.9 Z" fill="#18212b"/><line x1="185" y1="302" x2="185" y2="318" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="185" y="344" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="320" y1="302" x2="320" y2="318" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="320" y="344" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="470" y1="302" x2="470" y2="318" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="470" y="344" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">2</text><circle cx="215" cy="310" r="7" fill="#2563eb"/><circle cx="255" cy="310" r="7" fill="#2563eb"/><circle cx="300" cy="310" r="7" fill="#2563eb"/><circle cx="355" cy="310" r="7" fill="#2563eb"/><circle cx="410" cy="310" r="7" fill="#2563eb"/><text x="315" y="235" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#5f6b78">muestra racional (no exhaustiva)</text><rect x="247.0" y="405" width="136" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="315" y="432" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">Q denso ✓</text><rect x="205.0" y="460" width="220" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="315" y="487" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">Q arquimediano ✓</text><rect x="229.0" y="515" width="172" height="40" rx="20" fill="#fff0f3" stroke="#be123c" stroke-width="1.5"/><text x="315" y="542" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#be123c">Q completo ✗</text><text x="867" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#18212b">U_Q(S₂): cotas superiores racionales</text><rect x="690" y="193" width="355" height="62" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.8"/><text x="745" y="230" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#2563eb">u₁</text><text x="1010" y="230" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#5f6b78">cota superior</text><line x1="867" y1="260" x2="867" y2="287" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M 867 287 L 860.9 275.5 L 873.1 275.5 Z" fill="#0f766e"/><text x="890" y="280" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#0f766e">mejorar</text><rect x="690" y="288" width="355" height="62" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.8"/><text x="745" y="325" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#2563eb">u₂&lt;u₁</text><text x="1010" y="325" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#5f6b78">otra cota superior</text><line x1="867" y1="355" x2="867" y2="382" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M 867 382 L 860.9 370.5 L 873.1 370.5 Z" fill="#0f766e"/><text x="890" y="375" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#0f766e">mejorar</text><rect x="690" y="383" width="355" height="62" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.8"/><text x="745" y="420" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#2563eb">u₃&lt;u₂</text><text x="1010" y="420" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#5f6b78">otra cota superior</text><rect x="751.0" y="490" width="232" height="40" rx="20" fill="#fff0f3" stroke="#be123c" stroke-width="1.5"/><text x="867" y="517" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#be123c">ninguna es mínima</text><text x="867" y="555" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#be123c">min U_Q(S₂) no existe en Q</text><text x="600" y="646" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">No se necesita señalar una frontera irracional concreta para diagnosticar la incompletitud.</text>
</svg>