<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F05" role="img" aria-labelledby="C03-F05-title C03-F05-desc">
<title id="C03-F05-title">GCI y condición cruzada</title>
<desc id="C03-F05-desc">Una familia general de cuatro intervalos cerrados no encajados se representa en filas con un punto común. Un panel lateral muestra la condición cruzada para todos los índices, su equivalencia con intersección por pares en la recta y el paso GCI que garantiza un punto común global.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">GCI: compatibilidad global de intervalos cerrados</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Familia general: no se supone numerabilidad ni una cadena encajada.</text><rect x="60" y="130" width="650" height="440" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><rect x="745" y="130" width="390" height="440" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="385" y="165" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#18212b">Intervalos no presentados como cadena</text><line x1="120" y1="220" x2="675" y2="220" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="670" y1="220" x2="675" y2="220" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 675 220 L 663.5 226.1 L 663.5 213.9 Z" fill="#18212b"/><line x1="170" y1="220" x2="515" y2="220" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="170" cy="220" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="515" cy="220" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="135" y="206" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#5f6b78">[aα,bα]</text><line x1="120" y1="300" x2="675" y2="300" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="670" y1="300" x2="675" y2="300" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 675 300 L 663.5 306.1 L 663.5 293.9 Z" fill="#18212b"/><line x1="245" y1="300" x2="610" y2="300" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="245" cy="300" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="610" cy="300" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="135" y="286" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#5f6b78">[aβ,bβ]</text><line x1="120" y1="380" x2="675" y2="380" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="670" y1="380" x2="675" y2="380" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 675 380 L 663.5 386.1 L 663.5 373.9 Z" fill="#18212b"/><line x1="205" y1="380" x2="555" y2="380" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="205" cy="380" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="555" cy="380" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="135" y="366" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#5f6b78">[aγ,bγ]</text><line x1="120" y1="460" x2="675" y2="460" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="670" y1="460" x2="675" y2="460" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 675 460 L 663.5 466.1 L 663.5 453.9 Z" fill="#18212b"/><line x1="300" y1="460" x2="660" y2="460" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="300" cy="460" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="660" cy="460" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="135" y="446" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#5f6b78">[aδ,bδ]</text><line x1="420" y1="185" x2="420" y2="500" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6" opacity="1"/><rect x="328.0" y="510" width="184" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="420" y="537" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">punto común c</text><text x="940" y="165" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#18212b">Condición que activa GCI</text><text x="940" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#18212b"><tspan x="940" dy="0">para todo i,j</tspan><tspan x="940" dy="35">a_i ≤ b_j</tspan></text><rect x="686.0" y="305" width="508" height="40" rx="20" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5"/><text x="940" y="332" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2563eb">pares se intersectan ⇔ condición cruzada</text><line x1="940" y1="375" x2="940" y2="420" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/><path d="M 940 420 L 933.9 408.5 L 946.1 408.5 Z" fill="#0f766e"/><rect x="824.0" y="440" width="232" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="940" y="467" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">GCI / COMPLETITUD</text><line x1="940" y1="510" x2="940" y2="545" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/><path d="M 940 545 L 933.9 533.5 L 946.1 533.5 Z" fill="#0f766e"/><text x="940" y="565" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0f766e">existe c común a todos</text><text x="600" y="640" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">La equivalencia “por pares ⇔ condición cruzada” es de orden; el paso al punto global usa GCI.</text>
</svg>