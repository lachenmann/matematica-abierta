<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F06" role="img" aria-labelledby="C03-F06-title C03-F06-desc">
<title id="C03-F06-title">Cierre y encajamiento: existencia sin unicidad</title>
<desc id="C03-F06-desc">Dos paneles contrastan una familia de intervalos cerrados encajados cuya intersección conserva un intervalo no degenerado con una familia semiabierta estrechante que excluye siempre el punto fronterizo y tiene intersección vacía. La figura separa existencia de unicidad.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Existencia no es unicidad: cierre y encajamiento importan</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Dos familias estrechan el espacio de posibilidades, pero sólo la hipótesis cerrada garantiza persistencia.</text><rect x="55" y="135" width="530" height="445" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="320" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#18212b">A. Cerrados encajados</text><rect x="615" y="135" width="530" height="445" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="880" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#18212b">B. Semiabiertos estrechantes</text><line x1="100" y1="235" x2="550" y2="235" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="545" y1="235" x2="550" y2="235" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 550 235 L 538.5 241.1 L 538.5 228.9 Z" fill="#18212b"/><line x1="140" y1="235" x2="520" y2="235" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="140" cy="235" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="520" cy="235" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="100" y1="315" x2="550" y2="315" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="545" y1="315" x2="550" y2="315" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 550 315 L 538.5 321.1 L 538.5 308.9 Z" fill="#18212b"/><line x1="190" y1="315" x2="480" y2="315" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="190" cy="315" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="480" cy="315" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="100" y1="395" x2="550" y2="395" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="545" y1="395" x2="550" y2="395" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 550 395 L 538.5 401.1 L 538.5 388.9 Z" fill="#18212b"/><line x1="240" y1="395" x2="445" y2="395" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="240" cy="395" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="445" cy="395" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="240" y="430" width="205" height="48" rx="8" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="342" y="462" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#0f766e">núcleo común [s,t]</text><rect x="210.0" y="505" width="220" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="320" y="532" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">intersección ≠ ∅</text><text x="320" y="565" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#5f6b78">puede contener muchos puntos</text><line x1="680" y1="235" x2="1110" y2="235" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1105" y1="235" x2="1110" y2="235" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1110 235 L 1098.5 241.1 L 1098.5 228.9 Z" fill="#18212b"/><line x1="705" y1="235" x2="1080" y2="235" stroke="#c76b00" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="705" cy="235" r="10" fill="#ffffff" stroke="#c76b00" stroke-width="3"/><circle cx="1080" cy="235" r="10" fill="#c76b00" stroke="#c76b00" stroke-width="2"/><text x="700" y="217" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#5f6b78">J0</text><line x1="680" y1="315" x2="1110" y2="315" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1105" y1="315" x2="1110" y2="315" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1110 315 L 1098.5 321.1 L 1098.5 308.9 Z" fill="#18212b"/><line x1="705" y1="315" x2="990" y2="315" stroke="#c76b00" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="705" cy="315" r="10" fill="#ffffff" stroke="#c76b00" stroke-width="3"/><circle cx="990" cy="315" r="10" fill="#c76b00" stroke="#c76b00" stroke-width="2"/><text x="700" y="297" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#5f6b78">J1</text><line x1="680" y1="395" x2="1110" y2="395" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1105" y1="395" x2="1110" y2="395" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1110 395 L 1098.5 401.1 L 1098.5 388.9 Z" fill="#18212b"/><line x1="705" y1="395" x2="920" y2="395" stroke="#c76b00" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="705" cy="395" r="10" fill="#ffffff" stroke="#c76b00" stroke-width="3"/><circle cx="920" cy="395" r="10" fill="#c76b00" stroke="#c76b00" stroke-width="2"/><text x="700" y="377" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#5f6b78">J2</text><line x1="705" y1="205" x2="705" y2="430" stroke="#be123c" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6" opacity="1"/><text x="717" y="452" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#be123c">0 excluido en todas</text><rect x="680.0" y="485" width="400" height="40" rx="20" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5"/><text x="880" y="512" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#c76b00">ancho → arbitrariamente pequeño</text><rect x="770.0" y="533" width="220" height="40" rx="20" fill="#fff0f3" stroke="#be123c" stroke-width="1.5"/><text x="880" y="560" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#be123c">intersección = ∅</text><text x="600" y="645" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" font-style="normal" fill="#18212b">§3.5 garantiza existencia para cerrados encajados; no garantiza unicidad.</text>
</svg>