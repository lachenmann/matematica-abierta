<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F04" role="img" aria-labelledby="C03-F04-title C03-F04-desc">
<title id="C03-F04-title">Único gasto de completitud en arquimedianidad</title>
<desc id="C03-F04-desc">Diagrama horizontal de la prueba por contradicción de la propiedad arquimediana. Sólo el nodo s igual al supremo de los naturales está marcado como uso de completitud; los demás pasos son de orden y aritmética. Un control inferior recuerda que Q es arquimediano pero no completo.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Dónde se gasta completitud en la prueba arquimediana</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Sólo un paso es estructural; lo demás es orden y aritmética.</text><rect x="55" y="230" width="160" height="95" rx="17" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="135.0" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#18212b"><tspan x="135.0" dy="0">Supón N acotado</tspan></text><line x1="223" y1="277" x2="247" y2="277" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 247 277 L 235.5 283.1 L 235.5 270.9 Z" fill="#18212b"/><rect x="257" y="230" width="150" height="95" rx="17" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="332.0" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e"><tspan x="332.0" dy="0">s = sup N</tspan></text><line x1="415" y1="277" x2="439" y2="277" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 439 277 L 427.5 283.1 L 427.5 270.9 Z" fill="#18212b"/><rect x="449" y="230" width="160" height="95" rx="17" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="529.0" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#18212b"><tspan x="529.0" dy="0">s−1 no es cota</tspan></text><line x1="617" y1="277" x2="641" y2="277" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 641 277 L 629.5 283.1 L 629.5 270.9 Z" fill="#18212b"/><rect x="651" y="230" width="160" height="95" rx="17" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="731.0" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#18212b"><tspan x="731.0" dy="0">existe n &gt; s−1</tspan></text><line x1="819" y1="277" x2="843" y2="277" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 843 277 L 831.5 283.1 L 831.5 270.9 Z" fill="#18212b"/><rect x="853" y="230" width="160" height="95" rx="17" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="933.0" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#18212b"><tspan x="933.0" dy="0">n+1 &gt; s</tspan></text><line x1="1021" y1="277" x2="1045" y2="277" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1045 277 L 1033.5 283.1 L 1033.5 270.9 Z" fill="#18212b"/><rect x="1055" y="230" width="150" height="95" rx="17" fill="#fff0f3" stroke="#be123c" stroke-width="2"/><text x="1130.0" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#be123c"><tspan x="1130.0" dy="0">contradicción</tspan></text><rect x="252.0" y="165" width="160" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="332.0" y="192" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">COMPLETITUD</text><text x="600" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" font-style="normal" fill="#18212b">Minimalidad de supremo → negar “ser cota” → sucesor natural.</text><rect x="160" y="455" width="880" height="125" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="490" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">Control lógico</text><rect x="280.0" y="520" width="220" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="390" y="547" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">Q arquimediano ✓</text><rect x="724.0" y="520" width="172" height="40" rx="20" fill="#fff0f3" stroke="#be123c" stroke-width="1.5"/><text x="810" y="547" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#be123c">Q completo ✗</text><text x="600" y="640" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#5f6b78">Completitud ⇒ arquimedianidad; la conversa es falsa.</text>
</svg>