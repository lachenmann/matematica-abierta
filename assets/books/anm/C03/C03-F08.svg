<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F08" role="img" aria-labelledby="C03-F08-title C03-F08-desc">
<title id="C03-F08-title">Bisección finita hasta una tolerancia</title>
<desc id="C03-F08-desc">Cuatro intervalos cerrados retenidos por bisección muestran anchos L, L sobre 2, L sobre 4 y L sobre 8. Una barra final expresa que para toda tolerancia positiva existe un índice finito k con L sobre 2 a la k menor que epsilon, usando arquimedianidad y no un límite.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Bisección finita hasta una tolerancia</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">No se usa un límite: dada ε&gt;0, arquimedianidad produce un número finito de refinamientos.</text><rect x="70" y="135" width="1060" height="405" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2"/><line x1="75.0" y1="150" x2="1125.0" y2="150" stroke="#2563eb" stroke-width="11" stroke-linecap="round" opacity="1"/><circle cx="75.0" cy="150" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="1125.0" cy="150" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="120" y="156" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2563eb">J₀</text><text x="1080" y="156" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#5f6b78">ancho L</text><line x1="600" y1="166" x2="600" y2="219" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><path d="M 600 219 L 593.9 207.5 L 606.1 207.5 Z" fill="#0f766e"/><line x1="232.5" y1="235" x2="967.5" y2="235" stroke="#2563eb" stroke-width="11" stroke-linecap="round" opacity="1"/><circle cx="232.5" cy="235" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="967.5" cy="235" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="120" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2563eb">J₁</text><text x="1080" y="241" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#5f6b78">ancho L/2</text><line x1="600" y1="251" x2="600" y2="304" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><path d="M 600 304 L 593.9 292.5 L 606.1 292.5 Z" fill="#0f766e"/><line x1="315.0" y1="320" x2="885.0" y2="320" stroke="#2563eb" stroke-width="11" stroke-linecap="round" opacity="1"/><circle cx="315.0" cy="320" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="885.0" cy="320" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="120" y="326" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2563eb">J₂</text><text x="1080" y="326" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#5f6b78">ancho L/4</text><line x1="600" y1="336" x2="600" y2="369" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><path d="M 600 369 L 593.9 357.5 L 606.1 357.5 Z" fill="#0f766e"/><line x1="345.0" y1="385" x2="855.0" y2="385" stroke="#2563eb" stroke-width="11" stroke-linecap="round" opacity="1"/><circle cx="345.0" cy="385" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="855.0" cy="385" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="120" y="391" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2563eb">J₃</text><text x="1080" y="391" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#5f6b78">ancho L/8</text><rect x="220" y="470" width="760" height="50" rx="10" fill="#fff6e8" stroke="#c76b00" stroke-width="2"/><text x="600" y="503" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#c76b00">ε &gt; 0  ⇒  existe k finito con L/2^k &lt; ε</text><rect x="496.0" y="560" width="208" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="600" y="587" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">arquimedianidad</text><text x="600" y="642" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">La figura muestra una rama retenida, no una trayectoria de puntos convergentes.</text>
</svg>