<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C03-F10" role="img" aria-labelledby="C03-F10-title C03-F10-desc">
<title id="C03-F10-title">Mapa de consumo futuro de completitud</title>
<desc id="C03-F10-desc">Grafo con C03 como nodo central y seis capítulos futuros. C07, C08, C16 y C23 reciben flechas sólidas de consumo estructural; C10 y C31 reciben flechas discontinuas de comparación o reformulación. Todas las cajas externas están rotuladas FUTURO.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Mapa de consumo futuro de completitud</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Todas las cajas externas son FUTURO: la flecha indica dependencia, no teorema ya demostrado.</text><rect x="455" y="270" width="290" height="150" rx="22" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="600" y="315" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#2563eb">C03</text><text x="600" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#18212b"><tspan x="600" dy="0">completitud de orden</tspan><tspan x="600" dy="24">SUP · INF · SEP · GCI</tspan></text><rect x="85" y="145" width="270" height="105" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="220" y="173" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0f766e">FUTURO · C07</text><text x="220" y="203" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#18212b">monótonas acotadas</text><text x="220" y="231" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#5f6b78">consume existencia</text><rect x="85" y="470" width="270" height="105" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="220" y="498" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0f766e">FUTURO · C08</text><text x="220" y="528" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#18212b">Bolzano–Weierstrass</text><text x="220" y="556" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#5f6b78">consume existencia</text><rect x="845" y="145" width="270" height="105" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="980" y="173" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0f766e">FUTURO · C16</text><text x="980" y="203" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#18212b">Heine–Borel</text><text x="980" y="231" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#5f6b78">consume infraestructura</text><rect x="845" y="470" width="270" height="105" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/><text x="980" y="498" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0f766e">FUTURO · C23</text><text x="980" y="528" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#18212b">Darboux</text><text x="980" y="556" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#5f6b78">supremos/ínfimos</text><rect x="455" y="115" width="270" height="105" rx="18" fill="#f4efff" stroke="#6d28d9" stroke-width="2"/><text x="590" y="143" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#6d28d9">FUTURO · C10</text><text x="590" y="173" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#18212b">Cauchy en R</text><text x="59