  <title id="C01-F09-title">Qué preservan traslación, escala, reflexión y colapso</title><desc id="C01-F09-desc">Cuatro paneles muestran una traslación, una escala positiva, una reflexión y el caso lambda cero, indicando en cada caso qué ocurre con el orden y con las distancias.</desc><defs />
