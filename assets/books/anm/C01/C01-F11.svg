<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200" id="C01-F11" role="img" aria-labelledby="C01-F11-title C01-F11-desc">
  <title id="C01-F11-title">El costo del retroceso</title><desc id="C01-F11-desc">Gráfico por tramos de E(y): una meseta igual a cero entre x y z y dos ramas lineales crecientes hacia afuera.</desc><defs />
  <rect fill="#ffffff" height="650" width="1200" x="0" y="0" />
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="45">El costo del retroceso</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="74">E(y)=d(x,y)+d(y,z)−d(x,z) para x&lt;z</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="150" x2="1080" y1="505" y2="505" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="150" x2="150" y1="505" y2="135" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="end" x="1080" y="540">y</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="end" x="130" y="145">E(y)</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="2" x1="430" x2="430" y1="497" y2="513" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="2" x1="770" x2="770" y1="497" y2="513" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="430" y="537">x</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="770" y="537">z</text>
  <line stroke="#a24d4d" stroke-linecap="round" stroke-width="5" x1="220" x2="430" y1="200" y2="505" />
  <line stroke="#4f7c5b" stroke-linecap="round" stroke-width="7" x1="430" x2="770" y1="505" y2="505" />
  <line stroke="#a24d4d" stroke-linecap="round" stroke-width="5" x1="770" x2="1010" y1="505" y2="190" />
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="300" y="300">pendiente −2</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="475">E(y)=0</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="915" y="292">pendiente +2</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="550">sin retroceso</text>
  <rect fill="#eef8f6" height="46" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="440" x="380" y="575" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="606">E(y)=0  ⇔  x≤y≤z</text>
</svg>