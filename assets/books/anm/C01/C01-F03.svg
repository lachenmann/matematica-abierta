<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="660" version="1.1" viewBox="0 0 1200 660" width="1200" id="C01-F03" role="img" aria-labelledby="C01-F03-title C01-F03-desc">
  <title id="C01-F03-title">Del origen a la distancia entre dos puntos</title><desc id="C01-F03-desc">Tres paneles muestran la distancia de x al origen, la distancia de x a un centro a y la distancia entre dos puntos x e y; el tercer panel distingue resta orientada de longitud no orientada.</desc><defs />
  <rect fill="#ffffff" height="660" width="1200" x="0" y="0" />
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="45">Del origen a la distancia entre dos puntos</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="74">Una misma medición, con referencias cada vez menos privilegiadas</text>
  <rect fill="#f8fafc" height="420" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="330" x="45" y="115" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="145">1 · origen fijo</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="80" x2="340" y1="300" y2="300" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="330" x2="340" y1="294" y2="300" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="330" x2="340" y1="306" y2="300" />
  <circle cx="180" cy="300" fill="#26364a" r="6" stroke="#26364a" stroke-width="1" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="180" y="284">0</text>
  <circle cx="290" cy="300" fill="#2f6f9f" r="6" stroke="#2f6f9f" stroke-width="1" />
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="290" y="284">x</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="4" x1="180" x2="290" y1="245" y2="245" />
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="3" x1="180" x2="180" y1="237" y2="253" />
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="3" x1="290" x2="290" y1="237" y2="253" />
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="235.0" y="233">|x|</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="210" y="370">referencia = origen</text>
  <rect fill="#eef3f8" height="46" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="260" x="80" y="455" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="210.0" y="486">|x| = d(x,0)</text>
  <rect fill="#f8fafc" height="420" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="330" x="420" y="115" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="438" y="145">2 · centro móvil</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="455" x2="715" y1="300" y2="300" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="705" x2="715" y1="294" y2="300" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="705" x2="715" y1="306" y2="300" />
  <circle cx="520" cy="300" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1" />
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="520" y="284">a</text>
  <circle cx="670" cy="300" fill="#2f6f9f" r="6" stroke="#2f6f9f" stroke-width="1" />
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="670" y="284">x</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="4" x1="520" x2="670" y1="245" y2="245" />
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="520" x2="520" y1="237" y2="253" />
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="670" x2="670" y1="237" y2="253" />
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="595.0" y="233">|x−a|</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="585" y="365">cambia la referencia,</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="585" y="391">no la idea de distancia</text>
  <rect fill="#eef3f8" height="46" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="260" x="455" y="455" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="585.0" y="486">|x−a| = d(x,a)</text>
  <rect fill="#f8fafc" height="420" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="330" x="795" y="115" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="813" y="145">3 · dos puntos</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="830" x2="1090" y1="300" y2="300" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1080" x2="1090" y1="294" y2="300" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1080" x2="1090" y1="306" y2="300" />
  <circle cx="875" cy="300" fill="#2f6f9f" r="6" stroke="#2f6f9f" stroke-width="1" />
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="875" y="284">x</text>
  <circle cx="1050" cy="300" fill="#6d5aa8" r="6" stroke="#6d5aa8" stroke-width="1" />
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="1050" y="284">y</text>
  <line stroke="#6d5aa8" stroke-linecap="round" stroke-width="4" x1="875" x2="1050" y1="245" y2="245" />
  <line stroke="#6d5aa8" stroke-linecap="round" stroke-width="3" x1="875" x2="875" y1="237" y2="253" />
  <line stroke="#6d5aa8" stroke-linecap="round" stroke-width="3" x1="1050" x2="1050" y1="237" y2="253" />
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="962.5" y="233">d(x,y)</text>
  <line stroke="#a24d4d" stroke-dasharray="7 5" stroke-linecap="round" stroke-width="2" x1="875" x2="1050" y1="338" y2="338" />
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="960" y="370">x−y y y−x tienen signos opuestos</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="960" y="400">|x−y| conserva sólo la longitud</text>
  <rect fill="#eef3f8" height="46" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="260" x="830" y="455" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="960.0" y="486">d(x,y)=|x−y|</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600" y="605">El valor absoluto elimina orientación; la distancia retiene separación.</text>
</svg>