  <title id="C01-F05-title">Ruta directa, punto intermedio y retroceso</title><desc id="C01-F05-desc">Tres paneles comparan el caso y entre x y z con y situado a la izquierda o a la derecha. La ruta pasando por y tiene la misma longitud sólo en el primer caso y es mayor en los otros dos.</desc><defs />
