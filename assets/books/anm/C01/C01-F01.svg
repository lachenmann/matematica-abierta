  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="500.0" y="378">d(−z,−y)=d(z,y)</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="4" x1="680" x2="950" y1="390" y2="390" />
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="3" x1="680" x2="680" y1="382" y2="398" />
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="3" x1="950" x2="950" y1="382" y2="398" />
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="815.0" y="378">d(−y,−x)=d(y,x)</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="600" y="515">−z &lt; −y &lt; −x</text>
  <rect fill="#eef3f8" height="46" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="540" x="330" y="552" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="583">mismas separaciones · orientación invertida</text>
</svg>