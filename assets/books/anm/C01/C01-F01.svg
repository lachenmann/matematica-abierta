<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="620" version="1.1" viewBox="0 0 1200 620" width="1200" id="C01-F01" role="img" aria-labelledby="C01-F01-title C01-F01-desc">
  <title id="C01-F01-title">Una recta, dos estructuras</title><desc id="C01-F01-desc">Dos rectas numéricas comparan una configuración x&lt;y&lt;z con su reflejo. Las distancias correspondientes se mantienen, mientras el orden de izquierda a derecha se invierte.</desc><defs />
  <rect fill="#ffffff" height="620" width="1200" x="0" y="0" />
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="45">Una recta, dos estructuras</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="74">La reflexión conserva distancias y revierte la orientación</text>
  <rect fill="#f8fafc" height="205" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1110" x="45" y="100" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="130">Configuración original</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="120" x2="1080" y1="215" y2="215" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1070" x2="1080" y1="209" y2="215" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1070" x2="1080" y1="221" y2="215" />
