  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="950" y="429">−x</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="4" x1="320" x2="680" y1="390" y2="390" />
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="320" x2="320" y1="382" y2="398" />
