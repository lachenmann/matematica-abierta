  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="360">Configuración reflejada: t ↦ −t</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="120" x2="1080" y1="445" y2="445" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1070" x2="1080" y1="439" y2="445" />
