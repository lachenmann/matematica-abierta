  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="250" y="199">x</text>
  <circle cx="520" cy="215" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1" />
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="520" y="199">y</text>
  <circle cx="880" cy="215" fill="#6d5aa8" r="6" stroke="#6d5aa8" stroke-width="1" />
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="880" y="199">z</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="4" x1="250" x2="520" y1="160" y2="160" />
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="3" x1="250" x2="250" y1="152" y2="168" />
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="3" x1="520" x2="520" y1="152" y2="168" />
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="385.0" y="148">d(x,y)</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="4" x1="520" x2="880" y1="160" y2="160" />
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="520" x2="520" y1="152" y2="168" />
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="880" x2="880" y1="152" y2="168" />
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="700.0" y="148">d(y,z)</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="600" y="285">x &lt; y &lt; z</text>
