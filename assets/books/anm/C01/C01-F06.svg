<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="610" version="1.1" viewBox="0 0 1200 610" width="1200" id="C01-F06" role="img" aria-labelledby="C01-F06-title C01-F06-desc">
  <title id="C01-F06-title">Una bola en la recta es un intervalo</title><desc id="C01-F06-desc">Recta numérica centrada en a con extremos abiertos a−r y a+r, ambos a distancia r del centro, y cadena de equivalencias entre distancia, valor absoluto y desigualdad doble.</desc><defs />
  <rect fill="#ffffff" height="610" width="1200" x="0" y="0" />
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="45">Una bola en la recta es un intervalo</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="74">d(x,a)&lt;r selecciona exactamente los puntos entre a−r y a+r</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="100" x2="1100" y1="260" y2="260" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1090" x2="1100" y1="254" y2="260" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1090" x2="1100" y1="266" y2="260" />
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="2" x1="280" x2="280" y1="253" y2="267" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="280" y="294">a−r</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="2" x1="600" x2="600" y1="253" y2="267" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="600" y="294">a</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="2" x1="920" x2="920" y1="253" y2="267" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="920" y="294">a+r</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="16" x1="280" x2="920" y1="260" y2="260" />
  <circle cx="280" cy="260" fill="#ffffff" r="7" stroke="#2f6f9f" stroke-width="3" />
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="280" y="292" />
  <circle cx="920" cy="260" fill="#ffffff" r="7" stroke="#2f6f9f" stroke-width="3" />
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="920" y="292" />
  <circle cx="600" cy="260" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1" />
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600" y="244">a</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="4" x1="280" x2="600" y1="190" y2="190" />
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="280" x2="280" y1="182" y2="198" />
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="600" x2="600" y1="182" y2="198" />
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="440.0" y="178">r</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="4" x1="600" x2="920" y1="190" y2="190" />
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="600" x2="600" y1="182" y2="198" />
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="920" x2="920" y1="182" y2="198" />
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="760.0" y="178">r</text>
  <rect fill="#eef3f8" height="46" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="280" x="115" y="365" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="255.0" y="396">d(x,a) &lt; r</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="430" y="397">⇔</text>
  <rect fill="#eef3f8" height="46" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="280" x="460" y="365" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="396">|x−a| &lt; r</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="775" y="397">⇔</text>
  <rect fill="#eef3f8" height="46" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="280" x="805" y="365" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="945.0" y="396">a−r &lt; x &lt; a+r</text>
  <rect fill="#eef8f6" height="46" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="470" x="365" y="480" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="511">B(a,r) = (a−r, a+r)</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="600" y="570">Los extremos quedan fuera porque su distancia al centro es exactamente r.</text>
</svg>