<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="860" version="1.1" viewBox="0 0 1200 860" width="1200" id="C01-F14" role="img" aria-labelledby="C01-F14-title C01-F14-desc">
  <title id="C01-F14-title">Clasificación de las isometrías de la recta</title><desc id="C01-F14-desc">Diagrama de flujo de la prueba: se define G(x)=F(x)−F(0), se obtiene G(0)=0 y |G(x)|=|x|, se fuerza un signo global y aparecen las dos formas F(x)=x+c o F(x)=−x+c.</desc><defs />
  <rect fill="#ffffff" height="860" width="1200" x="0" y="0" />
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="45">Clasificación de las isometrías de la recta</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="74">Esquema de la estrategia después de la demostración completa</text>
  <rect fill="#eef3f8" height="70" rx="12" ry="12" stroke="#2f6f9f" stroke-width="2" width="360" x="420" y="90" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="600.0" y="125.0">F preserva todas las distancias</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="3" x1="600" x2="600" y1="160" y2="205" />
  <polygon fill="#2f6f9f" points="600,205 594.2504404817628,195.62223025734545 605.7495595182372,195.62223025734545" />
  <rect fill="#eef8f6" height="80" rx="12" ry="12" stroke="#2f7d77" stroke-width="2" width="440" x="380" y="205" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600.0" y="234.56">c=F(0)</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600.0" y="257.06">G(x)=F(x)−c</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="3" x1="600" x2="600" y1="285" y2="335" />
  <polygon fill="#2f7d77" points="600,335 594.2504404817628,325.62223025734545 605.7495595182372,325.62223025734545" />
  <rect fill="#f7f4fb" height="80" rx="12" ry="12" stroke="#6d5aa8" stroke-width="2" width="420" x="390" y="335" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600.0" y="364.56">G(0)=0</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600.0" y="387.06">|G(x)|=|x|</text>
  <line stroke="#6d5aa8" stroke-linecap="round" stroke-width="3" x1="600" x2="600" y1="415" y2="465" />
  <polygon fill="#6d5aa8" points="600,465 594.2504404817628,455.62223025734545 605.7495595182372,455.62223025734545" />
  <rect fill="#fff7e8" height="88" rx="12" ry="12" stroke="#a87320" stroke-width="2" width="490" x="355" y="465" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="600.0" y="499.14">Para cada x: G(x)=±x</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="600.0" y="520.39">pero el signo no puede cambiar arbitrariamente</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="600" y="585">La igualdad |G(x)−G(1)|=|x−1| fuerza coherencia global del signo.</text>
  <line stroke="#4f7c5b" stroke-linecap="round" stroke-width="3" x1="470" x2="300" y1="553" y2="650" />
  <polygon fill="#4f7c5b" points="300,650 305.29571482105985,640.3586616834588 310.9945473715526,650.34630635958" />
  <line stroke="#a24d4d" stroke-linecap="round" stroke-width="3" x1="730" x2="900" y1="553" y2="650" />
  <polygon fill="#a24d4d" points="900,650 889.0054526284474,650.34630635958 894.7042851789402,640.3586616834588" />
  <rect fill="#eef8f0" height="90" rx="12" ry="12" stroke="#4f7c5b" stroke-width="2" width="380" x="110" y="650" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="300.0" y="683.98">rama +</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="300.0" y="707.73">G(x)=x</text>
  <rect fill="#fbefef" height="90" rx="12" ry="12" stroke="#a24d4d" stroke-width="2" width="380" x="710" y="650" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="900.0" y="683.98">rama −</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="900.0" y="707.73">G(x)=−x</text>
  <line stroke="#4f7c5b" stroke-linecap="round" stroke-width="3" x1="300" x2="300" y1="740" y2="785" />
  <polygon fill="#4f7c5b" points="300,785 294.2504404817627,775.6222302573454 305.7495595182373,775.6222302573454" />
  <line stroke="#a24d4d" stroke-linecap="round" stroke-width="3" x1="900" x2="900" y1="740" y2="785" />
  <polygon fill="#a24d4d" points="900,785 894.2504404817628,775.6222302573454 905.7495595182372,775.6222302573454" />
  <rect fill="#ffffff" height="60" rx="12" ry="12" stroke="#4f7c5b" stroke-width="2" width="360" x="120" y="785" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="300.0" y="815.0">F(x)=x+c</text>
  <rect fill="#ffffff" height="60" rx="12" ry="12" stroke="#a24d4d" stroke-width="2" width="360" x="720" y="785" />
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="900.0" y="815.0">F(x)=−x+c</text>
</svg>