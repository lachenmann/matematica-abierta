<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C04-F08" role="img" aria-labelledby="C04-F08-title C04-F08-desc">
<title id="C04-F08-title">Mapa de los seis tests locales</title>
<desc id="C04-F08-desc">Mapa lógico con la ventana B de x y r en el centro y seis nodos alrededor: interior, exterior, adherencia, frontera, acumulación y aislamiento. Cada nodo muestra sólo el cuantificador y la condición local que cambia.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Diccionario de tests locales</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">La ventana es el nodo común; cambian el cuantificador y la forma de mirar A.</text><rect x="455" y="285" width="290" height="120" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3" opacity="1"/><text x="600" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" font-style="normal" fill="#2563eb">B(x,r)</text><text x="600" y="370" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#5f6b78">ventana local</text><rect x="100" y="150" width="320" height="90" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2" opacity="1"/><text x="260" y="180" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#2563eb">interior</text><text x="260" y="214" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" font-style="normal" fill="#18212b">∃r  B⊆A</text><rect x="830" y="150" width="320" height="90" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2" opacity="1"/><text x="990" y="180" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0f766e">exterior</text><text x="990" y="214" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" font-style="normal" fill="#18212b">∃r  B⊆Aᶜ</text><rect x="70" y="470" width="320" height="90" rx="18" fill="#f4efff" stroke="#6d28d9" stroke-width="2" opacity="1"/><text x="230" y="500" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#6d28d9">adherencia</text><text x="230" y="534" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" font-style="normal" fill="#18212b">∀r  B∩A≠∅</text><rect x="805" y="470" width="320" height="90" rx="18" fill="#fff0f3" stroke="#be123c" stroke-width="2" opacity="1"/><text x="965" y="500" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#be123c">frontera</text><text x="965" y="534" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" font-style="normal" fill="#18212b">∀r  toca A y Aᶜ</text><rect x="250" y="565" width="320" height="90" rx="18" fill="#fff6e8" stroke="#c76b00" stroke-width="2" opacity="1"/><text x="410" y="595" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#c76b00">acumulación</text><text x="410" y="629" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" font-style="normal" fill="#18212b">∀r  (B\{x})∩A≠∅</text><rect x="680" y="565" width="320" height="90" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2" opacity="1"/><text x="840" y="595" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0f766e">aislamiento</text><text x="840" y="629" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" font-style="normal" fill="#18212b">x∈A, ∃r  B∩A={x}</text><line x1="455" y1="310" x2="420" y2="235" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M 420 235 L 430.4 242.8 L 419.3 248.0 Z" fill="#2563eb"/><line x1="745" y1="310" x2="830" y2="235" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><path d="M 830 235 L 825.5 247.2 L 817.3 238.0 Z" fill="#0f766e"/><line x1="455" y1="380" x2="390" y2="480" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/><path d="M 390 480 L 391.1 467.0 L 401.4 473.7 Z" fill="#6d28d9"/><line x1="745" y1="380" x2="805" y2="480" stroke="#be123c" stroke-width="2" stroke-linecap="round"/><path d="M 805 480 L 793.8 473.3 L 804.4 467.0 Z" fill="#be123c"/><line x1="520" y1="405" x2="430" y2="565" stroke="#c76b00" stroke-width="2" stroke-linecap="round"/><path d="M 430 565 L 430.3 552.0 L 441.0 558.0 Z" fill="#c76b00"/><line x1="680" y1="405" x2="835" y2="565" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><path d="M 835 565 L 822.6 561.0 L 831.4 552.5 Z" fill="#0f766e"/><text x="600" y="688" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#5f6b78">contener · evitar · tocar · tocar ambos lados · perforar · aislar</text>
</svg>