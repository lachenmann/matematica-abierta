<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C04-F03" role="img" aria-labelledby="C04-F03-title C04-F03-desc">
<title id="C04-F03-title">Clausura de un intervalo perforado</title>
<desc id="C04-F03-desc">Dos rectas alineadas muestran A igual al intervalo abierto de cero a uno con una perforación en un medio y su clausura igual al intervalo cerrado de cero a uno. Un panel local muestra una ventana alrededor de un medio que vuelve a encontrar A a ambos lados.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">La clausura también recupera perforaciones interiores</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">A=(0,1) sin el punto 1/2: la regla es local, no “añadir extremos”.</text><rect x="70" y="130" width="1060" height="350" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="120" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#2563eb">A</text><line x1="220" y1="235" x2="1010" y2="235" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1005" y1="235" x2="1010" y2="235" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1010 235 L 998.5 241.1 L 998.5 228.9 Z" fill="#18212b"/><line x1="320" y1="227" x2="320" y2="243" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="320" y="269" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="615" y1="227" x2="615" y2="243" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="615" y="269" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1/2</text><line x1="910" y1="227" x2="910" y2="243" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="910" y="269" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="320" y1="235" x2="603" y2="235" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><line x1="627" y1="235" x2="910" y2="235" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="320" cy="235" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="615" cy="235" r="10" fill="#ffffff" stroke="#be123c" stroke-width="3" opacity="1"/><circle cx="910" cy="235" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><text x="615" y="193" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#be123c">perforación</text><text x="120" y="386" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#0f766e">Ā</text><line x1="220" y1="380" x2="1010" y2="380" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1005" y1="380" x2="1010" y2="380" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1010 380 L 998.5 386.1 L 998.5 373.9 Z" fill="#18212b"/><line x1="320" y1="372" x2="320" y2="388" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="320" y="414" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="615" y1="372" x2="615" y2="388" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="615" y="414" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1/2</text><line x1="910" y1="372" x2="910" y2="388" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="910" y="414" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="320" y1="380" x2="910" y2="380" stroke="#0f766e" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="320" cy="380" r="10" fill="#0f766e" stroke="#0f766e" stroke-width="2" opacity="1"/><circle cx="615" cy="380" r="10" fill="#0f766e" stroke="#0f766e" stroke-width="2" opacity="1"/><circle cx="910" cy="380" r="10" fill="#0f766e" stroke="#0f766e" stroke-width="2" opacity="1"/><rect x="310" y="515" width="580" height="115" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2" opacity="1"/><text x="350" y="545" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2563eb">lupa local en 1/2</text><line x1="360" y1="585" x2="840" y2="585" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="835" y1="585" x2="840" y2="585" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 840 585 L 828.5 591.1 L 828.5 578.9 Z" fill="#18212b"/><circle cx="600" cy="585" r="8" fill="#be123c" stroke="#be123c" stroke-width="2" opacity="1"/><line x1="430" y1="585" x2="585" y2="585" stroke="#2563eb" stroke-width="8" stroke-linecap="round" opacity="1"/><line x1="615" y1="585" x2="770" y2="585" stroke="#2563eb" stroke-width="8" stroke-linecap="round" opacity="1"/><rect x="500" y="564.0" width="200" height="42" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2" opacity="0.35"/><text x="800" y="620" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">B(1/2,r)</text><text x="600" y="665" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" font-style="normal" fill="#18212b">Toda ventana positiva vuelve a encontrar A a ambos lados del punto ausente.</text>
</svg>