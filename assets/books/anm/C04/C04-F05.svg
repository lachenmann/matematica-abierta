<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C04-F05" role="img" aria-labelledby="C04-F05-title C04-F05-desc">
<title id="C04-F05-title">La frontera es independiente de la pertenencia de los extremos</title>
<desc id="C04-F05-desc">Cuatro filas muestran los intervalos abierto, cerrado y dos semiabiertos entre cero y uno. Los extremos cambian entre puntos abiertos y cerrados, pero una marca común indica que la frontera es siempre el conjunto formado por cero y uno.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">La frontera no decide la pertenencia</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Cuatro conjuntos cambian sus extremos incluidos, pero conservan la misma frontera.</text><rect x="70" y="130" width="1060" height="430" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="120" y="212" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#18212b">(0,1)</text><line x1="300" y1="205" x2="940" y2="205" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="935" y1="205" x2="940" y2="205" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 940 205 L 928.5 211.1 L 928.5 198.9 Z" fill="#18212b"/><line x1="420" y1="197" x2="420" y2="213" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="420" y="239" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="820" y1="197" x2="820" y2="213" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="820" y="239" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="420" y1="205" x2="820" y2="205" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="420" cy="205" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="820" cy="205" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><line x1="420" y1="225" x2="420" y2="247" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="820" y1="225" x2="820" y2="247" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="120" y="307" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#18212b">[0,1]</text><line x1="300" y1="300" x2="940" y2="300" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="935" y1="300" x2="940" y2="300" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 940 300 L 928.5 306.1 L 928.5 293.9 Z" fill="#18212b"/><line x1="420" y1="292" x2="420" y2="308" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="420" y="334" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="820" y1="292" x2="820" y2="308" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="820" y="334" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="420" y1="300" x2="820" y2="300" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="420" cy="300" r="10" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><circle cx="820" cy="300" r="10" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><line x1="420" y1="320" x2="420" y2="342" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="820" y1="320" x2="820" y2="342" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="120" y="402" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#18212b">[0,1)</text><line x1="300" y1="395" x2="940" y2="395" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="935" y1="395" x2="940" y2="395" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 940 395 L 928.5 401.1 L 928.5 388.9 Z" fill="#18212b"/><line x1="420" y1="387" x2="420" y2="403" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="420" y="429" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="820" y1="387" x2="820" y2="403" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="820" y="429" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="420" y1="395" x2="820" y2="395" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="420" cy="395" r="10" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><circle cx="820" cy="395" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><line x1="420" y1="415" x2="420" y2="437" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="820" y1="415" x2="820" y2="437" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="120" y="497" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#18212b">(0,1]</text><line x1="300" y1="490" x2="940" y2="490" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="935" y1="490" x2="940" y2="490" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 940 490 L 928.5 496.1 L 928.5 483.9 Z" fill="#18212b"/><line x1="420" y1="482" x2="420" y2="498" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="420" y="524" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="820" y1="482" x2="820" y2="498" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="820" y="524" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="420" y1="490" x2="820" y2="490" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="420" cy="490" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="820" cy="490" r="10" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><line x1="420" y1="510" x2="420" y2="532" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="820" y1="510" x2="820" y2="532" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="1"/><rect x="955" y="180" width="135" height="315" rx="18" fill="#fff0f3" stroke="#be123c" stroke-width="2" opacity="1"/><text x="1022" y="260" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#be123c"><tspan x="1022" dy="0">misma</tspan><tspan x="1022" dy="25">frontera</tspan></text><text x="1022" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" font-style="normal" fill="#be123c">{0,1}</text><text x="600" y="620" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" font-style="normal" fill="#18212b">Cambiar si 0 o 1 pertenecen al conjunto no cambia lo que toda ventana ve alrededor de esos puntos.</text>
</svg>