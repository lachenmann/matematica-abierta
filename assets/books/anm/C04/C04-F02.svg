<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C04-F02" role="img" aria-labelledby="C04-F02-title C04-F02-desc">
<title id="C04-F02-title">Interior, exterior y frontera con una misma gramática</title>
<desc id="C04-F02-desc">Tres paneles alineados muestran un punto interior con una bola contenida en A, un punto exterior con una bola contenida en el complemento y un punto de frontera con varias ventanas de ejemplo que tocan A y su complemento. Se advierte que el caso de frontera cuantifica todos los radios.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Una misma ventana, tres clasificaciones locales</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Interior y exterior buscan un radio favorable; frontera controla todos los radios.</text><rect x="40" y="135" width="340" height="430" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="210" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">interior</text><rect x="430" y="135" width="340" height="430" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="600" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">exterior</text><rect x="820" y="135" width="340" height="430" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="990" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">frontera</text><line x1="85" y1="330" x2="340" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="335" y1="330" x2="340" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 340 330 L 328.5 336.1 L 328.5 323.9 Z" fill="#18212b"/><line x1="145" y1="330" x2="310" y2="330" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="145" cy="330" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="310" cy="330" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><text x="227" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#2563eb">A</text><circle cx="225" cy="330" r="9" fill="#18212b" stroke="#18212b" stroke-width="2" opacity="1"/><text x="225" y="370" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#18212b">xᵢ</text><rect x="170" y="309.0" width="110" height="42" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2" opacity="0.9"/><text x="225.0" y="255" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2563eb">B(xᵢ,r)</text><rect x="144.25" y="467" width="131.5" height="40" rx="20" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="210" y="494" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2563eb">∃r&gt;0  B⊆A</text><line x1="475" y1="330" x2="730" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="725" y1="330" x2="730" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 730 330 L 718.5 336.1 L 718.5 323.9 Z" fill="#18212b"/><line x1="580" y1="330" x2="705" y2="330" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="580" cy="330" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="705" cy="330" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><text x="642" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#2563eb">A</text><circle cx="520" cy="330" r="9" fill="#18212b" stroke="#18212b" stroke-width="2" opacity="1"/><text x="520" y="370" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#18212b">xₑ</text><rect x="475" y="309.0" width="90" height="42" rx="14" fill="#e8f7f4" stroke="#0f766e" stroke-width="2" opacity="0.9"/><text x="520.0" y="255" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">B(xₑ,r)</text><rect x="528.5" y="467" width="143.0" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="600" y="494" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0f766e">∃r&gt;0  B⊆Aᶜ</text><line x1="865" y1="330" x2="1120" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1115" y1="330" x2="1120" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1120 330 L 1108.5 336.1 L 1108.5 323.9 Z" fill="#18212b"/><line x1="990" y1="330" x2="1105" y2="330" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="990" cy="330" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><circle cx="1105" cy="330" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><text x="1050" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#2563eb">A</text><circle cx="990" cy="330" r="9" fill="#6d28d9" stroke="#6d28d9" stroke-width="2" opacity="1"/><text x="990" y="370" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#18212b">x𝒻</text><rect x="930" y="252" width="120" height="36" rx="12" fill="#f4efff" stroke="#6d28d9" stroke-width="2" opacity="0.95"/><rect x="895" y="297" width="190" height="36" rx="12" fill="#f4efff" stroke="#6d28d9" stroke-width="2" opacity="0.55"/><rect x="860" y="342" width="260" height="36" rx="12" fill="#f4efff" stroke="#6d28d9" stroke-width="2" opacity="0.28"/><rect x="878.25" y="467" width="223.5" height="40" rx="20" fill="#f4efff" stroke="#6d28d9" stroke-width="1.5" opacity="1"/><text x="990" y="494" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#6d28d9">∀r&gt;0  toca A y Aᶜ</text><text x="600" y="610" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#be123c">En el tercer panel las ventanas dibujadas son instancias; la definición cuantifica todos los radios positivos.</text>
</svg>