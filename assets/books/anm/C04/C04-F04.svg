<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C04-F04" role="img" aria-labelledby="C04-F04-title C04-F04-desc">
<title id="C04-F04-title">Adherencia, acumulación y aislamiento en una misma configuración</title>
<desc id="C04-F04-desc">Tres paneles usan A igual al intervalo abierto de cero a uno unido con el punto dos. En x igual a cero y x igual a un medio, la bola perforada encuentra otros puntos de A; en x igual a dos existe una ventana que contiene de A sólo al centro, por lo que el punto es aislado.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Adherencia, acumulación y aislamiento</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Misma configuración A=(0,1)∪{2}; cambia el test local.</text><rect x="40" y="130" width="340" height="470" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="210" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">x=0</text><rect x="430" y="130" width="340" height="470" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="600" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">x=1/2</text><rect x="820" y="130" width="340" height="470" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="990" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">x=2</text><line x1="75" y1="320" x2="345" y2="320" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="340" y1="320" x2="345" y2="320" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 345 320 L 333.5 326.1 L 333.5 313.9 Z" fill="#18212b"/><line x1="120" y1="320" x2="250" y2="320" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="120" cy="320" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="250" cy="320" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="325" cy="320" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><text x="190" y="282" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">(0,1)</text><text x="325" y="282" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">2</text><circle cx="120" cy="320" r="11" fill="#ffffff" stroke="#be123c" stroke-width="3" opacity="1"/><rect x="62" y="298" width="116" height="44" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2" opacity="0.55"/><circle cx="150" cy="320" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><text x="210" y="405" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#5f6b78">centro fuera de A</text><rect x="17.75" y="437" width="384.5" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="210" y="464" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#0f766e">bola perforada vuelve a tocar A</text><rect x="84.25" y="520" width="131.5" height="40" rx="20" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="150" y="547" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2563eb">adherente</text><rect x="197.75" y="520" width="154.5" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="275" y="547" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#0f766e">acumulación</text><line x1="465" y1="320" x2="735" y2="320" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="730" y1="320" x2="735" y2="320" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 735 320 L 723.5 326.1 L 723.5 313.9 Z" fill="#18212b"/><line x1="510" y1="320" x2="640" y2="320" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="510" cy="320" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="640" cy="320" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="715" cy="320" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><text x="580" y="282" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">(0,1)</text><text x="715" y="282" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">2</text><circle cx="575.0" cy="320" r="9" fill="#6d28d9" stroke="#6d28d9" stroke-width="2" opacity="1"/><circle cx="575.0" cy="320" r="15" fill="#ffffff" stroke="#6d28d9" stroke-width="3" opacity="1"/><rect x="515.0" y="298" width="120" height="44" rx="14" fill="#f4efff" stroke="#6d28d9" stroke-width="2" opacity="0.5"/><circle cx="610.0" cy="320" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><text x="600" y="405" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#6d28d9">centro perforado</text><rect x="436.5" y="437" width="327.0" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="600" y="464" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#0f766e">aparecen otros puntos de A</text><rect x="474.25" y="520" width="131.5" height="40" rx="20" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="540" y="547" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2563eb">adherente</text><rect x="587.75" y="520" width="154.5" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="665" y="547" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#0f766e">acumulación</text><line x1="855" y1="320" x2="1125" y2="320" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1120" y1="320" x2="1125" y2="320" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1125 320 L 1113.5 326.1 L 1113.5 313.9 Z" fill="#18212b"/><line x1="900" y1="320" x2="1030" y2="320" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="900" cy="320" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="1030" cy="320" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="1105" cy="320" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><text x="970" y="282" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">(0,1)</text><text x="1105" y="282" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">2</text><circle cx="1105" cy="320" r="10" fill="#be123c" stroke="#be123c" stroke-width="2" opacity="1"/><rect x="1060" y="298" width="90" height="44" rx="14" fill="#fff0f3" stroke="#be123c" stroke-width="2" opacity="0.55"/><text x="990" y="405" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#be123c">B(2,r)∩A={2}</text><rect x="809.25" y="437" width="361.5" height="40" rx="20" fill="#fff0f3" stroke="#be123c" stroke-width="1.5" opacity="1"/><text x="990" y="464" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#be123c">la bola perforada queda vacía</text><rect x="864.25" y="520" width="131.5" height="40" rx="20" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="930" y="547" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2563eb">adherente</text><rect x="1000.75" y="520" width="108.5" height="40" rx="20" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5" opacity="1"/><text x="1055" y="547" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#c76b00">aislado</text><text x="600" y="655" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" font-style="normal" fill="#18212b">Perforar el centro separa acumulación de mera adherencia; una ventana aislante detecta el punto aislado.</text>
</svg>