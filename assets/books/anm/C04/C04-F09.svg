<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C04-F09" role="img" aria-labelledby="C04-F09-title C04-F09-desc">
<title id="C04-F09-title">Interior máximo y clausura mínima</title>
<desc id="C04-F09-desc">Diagrama dual con tres regiones anidadas: interior de A, A y clausura de A. A la izquierda todo abierto G contenido en A apunta al interior; a la derecha todo cerrado F que contiene A recibe la clausura. Se leen las propiedades de mayor abierto interior y menor cerrado exterior.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Interior máximo y clausura mínima</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Dos envolventes extremales alrededor del mismo conjunto A.</text><rect x="350" y="180" width="500" height="310" rx="24" fill="#e8f7f4" stroke="#0f766e" stroke-width="3" opacity="1"/><text x="600" y="215" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#0f766e">Ā</text><rect x="420" y="235" width="360" height="205" rx="22" fill="#eaf2ff" stroke="#2563eb" stroke-width="3" opacity="1"/><text x="600" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" font-style="normal" fill="#2563eb">A</text><rect x="490" y="295" width="220" height="90" rx="20" fill="#fff6e8" stroke="#c76b00" stroke-width="3" opacity="1"/><text x="600" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#c76b00">int(A)</text><rect x="55" y="175" width="245" height="205" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="177" y="210" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#c76b00">desde dentro</text><text x="177" y="255" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#18212b"><tspan x="177" dy="0">G abierto</tspan><tspan x="177" dy="25">G⊆A</tspan></text><line x1="300" y1="315" x2="485" y2="335" stroke="#c76b00" stroke-width="3" stroke-linecap="round"/><path d="M 485 335 L 472.9 339.9 L 474.3 327.7 Z" fill="#c76b00"/><rect x="117.0" y="320" width="120.0" height="40" rx="20" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5" opacity="1"/><text x="177" y="347" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#c76b00">G⊆int(A)</text><rect x="900" y="175" width="245" height="205" rx="18" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="1022" y="210" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#0f766e">desde fuera</text><text x="1022" y="255" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#18212b"><tspan x="1022" dy="0">F cerrado</tspan><tspan x="1022" dy="25">A⊆F</tspan></text><line x1="850" y1="315" x2="900" y2="315" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M 900 315 L 888.5 321.1 L 888.5 308.9 Z" fill="#0f766e"/><rect x="983.0" y="320" width="78" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="1022" y="347" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0f766e">Ā⊆F</text><rect x="190.0" y="535" width="350.0" height="40" rx="20" fill="#fff6e8" stroke="#c76b00" stroke-width="1.5" opacity="1"/><text x="365" y="562" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#c76b00">mayor abierto contenido en A</text><rect x="660.0" y="535" width="350.0" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="835" y="562" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0f766e">menor cerrado que contiene A</text><text x="600" y="635" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" font-style="normal" fill="#18212b">int(A) ⊆ A ⊆ Ā</text>
</svg>