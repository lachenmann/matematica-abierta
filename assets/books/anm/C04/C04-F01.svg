<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C04-F01" role="img" aria-labelledby="C04-F01-title C04-F01-desc">
<title id="C04-F01-title">Vecindad básica dentro de una vecindad general</title>
<desc id="C04-F01-desc">Dos paneles comparan un conjunto V que contiene una bola centrada en x y por eso es vecindad, con un conjunto que contiene a x sólo como punto de borde y no contiene ninguna bola centrada en x.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">Vecindad: contener el punto no basta</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">Una vecindad general debe contener alguna bola centrada en x.</text><rect x="55" y="130" width="515" height="475" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="312" y="168" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">Sí es vecindad de x</text><line x1="110" y1="335" x2="520" y2="335" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="515" y1="335" x2="520" y2="335" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 520 335 L 508.5 341.1 L 508.5 328.9 Z" fill="#18212b"/><line x1="315" y1="327" x2="315" y2="343" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="315" y="369" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">x</text><rect x="165" y="235" width="305" height="70" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2" opacity="1"/><text x="182" y="277" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" font-style="normal" fill="#0f766e">V</text><rect x="245" y="314.0" width="140" height="42" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2" opacity="0.9"/><text x="315.0" y="285" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2563eb">B(x,r)</text><circle cx="315" cy="335" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/><rect x="217.5" y="445" width="189.0" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="312" y="472" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#0f766e">∃r&gt;0  B(x,r)⊆V</text><text x="312" y="535" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#5f6b78">La forma global de V es secundaria.</text><rect x="630" y="130" width="515" height="475" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="887" y="168" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">Contiene x, pero no es vecindad</text><line x1="685" y1="335" x2="1095" y2="335" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1090" y1="335" x2="1095" y2="335" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1095 335 L 1083.5 341.1 L 1083.5 328.9 Z" fill="#18212b"/><line x1="815" y1="327" x2="815" y2="343" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="815" y="369" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">x</text><line x1="815" y1="335" x2="1040" y2="335" stroke="#0f766e" stroke-width="11" stroke-linecap="round" opacity="1"/><circle cx="815" cy="335" r="10" fill="#0f766e" stroke="#0f766e" stroke-width="2" opacity="1"/><circle cx="1040" cy="335" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="3" opacity="1"/><text x="932" y="305" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" font-style="normal" fill="#0f766e">V</text><rect x="755" y="384.0" width="120" height="42" rx="14" fill="#fff0f3" stroke="#be123c" stroke-width="2" opacity="0.9"/><text x="815.0" y="452" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#be123c">B(x,r)</text><line x1="755" y1="405" x2="815" y2="405" stroke="#be123c" stroke-width="7" stroke-linecap="round" opacity="1"/><text x="730" y="411" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#be123c">sale de V</text><rect x="671.75" y="495" width="430.5" height="40" rx="20" fill="#fff0f3" stroke="#be123c" stroke-width="1.5" opacity="1"/><text x="887" y="522" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#be123c">x∈V  pero  no existe bola contenida</text><text x="600" y="655" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" font-style="normal" fill="#18212b">La bola es la ventana básica; una vecindad general sólo debe contener una de ellas.</text>
</svg>