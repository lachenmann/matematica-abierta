<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" id="C04-F06" role="img" aria-labelledby="C04-F06-title C04-F06-desc">
<title id="C04-F06-title">De condiciones locales a conjuntos abiertos y cerrados</title>
<desc id="C04-F06-desc">Dos paneles muestran un intervalo abierto con varios puntos y radios locales distintos, y un conjunto cerrado leído por ventanas alrededor de puntos del complemento que evitan al conjunto. Una banda inferior contrasta el orden correcto de los cuantificadores con la falsa lectura de un radio global.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="55" y="55" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#18212b">De márgenes locales a propiedades globales</text><text x="55" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#5f6b78">El radio depende del punto: ∀x existe rₓ, no existe un único radio global.</text><rect x="55" y="135" width="530" height="440" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="320" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">A abierto</text><line x1="105" y1="330" x2="535" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="530" y1="330" x2="535" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 535 330 L 523.5 336.1 L 523.5 323.9 Z" fill="#18212b"/><line x1="165" y1="322" x2="165" y2="338" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="165" y="364" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="480" y1="322" x2="480" y2="338" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="480" y="364" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="165" y1="330" x2="480" y2="330" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="165" cy="330" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="480" cy="330" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3" opacity="1"/><circle cx="230" cy="330" r="7" fill="#18212b" stroke="#18212b" stroke-width="2" opacity="1"/><rect x="188" y="312" width="84" height="36" rx="11" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.8" opacity="0.45"/><text x="230" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">rₓ</text><circle cx="330" cy="330" r="7" fill="#18212b" stroke="#18212b" stroke-width="2" opacity="1"/><rect x="268" y="312" width="124" height="36" rx="11" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.8" opacity="0.45"/><text x="330" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">rᵧ</text><circle cx="430" cy="330" r="7" fill="#18212b" stroke="#18212b" stroke-width="2" opacity="1"/><rect x="402" y="312" width="56" height="36" rx="11" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.8" opacity="0.45"/><text x="430" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563eb">r_z</text><rect x="242.75" y="450" width="154.5" height="40" rx="20" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="320" y="477" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#2563eb">∀x∈A  ∃rₓ&gt;0</text><text x="320" y="525" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5f6b78">radios distintos</text><rect x="615" y="135" width="530" height="440" rx="20" fill="#f4f7fa" stroke="#cbd5e1" stroke-width="2" opacity="1"/><text x="880" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#18212b">F cerrado ⇔ Fᶜ abierto</text><line x1="665" y1="330" x2="1095" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1090" y1="330" x2="1095" y2="330" stroke="#18212b" stroke-width="3" stroke-linecap="round"/><path d="M 1095 330 L 1083.5 336.1 L 1083.5 323.9 Z" fill="#18212b"/><line x1="785" y1="322" x2="785" y2="338" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="785" y="364" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">0</text><line x1="985" y1="322" x2="985" y2="338" stroke="#18212b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="985" y="364" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#18212b">1</text><line x1="785" y1="330" x2="985" y2="330" stroke="#0f766e" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="785" cy="330" r="9" fill="#0f766e" stroke="#0f766e" stroke-width="2" opacity="1"/><circle cx="985" cy="330" r="9" fill="#0f766e" stroke="#0f766e" stroke-width="2" opacity="1"/><circle cx="720" cy="330" r="7" fill="#18212b" stroke="#18212b" stroke-width="2" opacity="1"/><rect x="686" y="312" width="68" height="36" rx="11" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.8" opacity="0.45"/><text x="720" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0f766e">r₁</text><circle cx="1050" cy="330" r="7" fill="#18212b" stroke="#18212b" stroke-width="2" opacity="1"/><rect x="1008" y="312" width="84" height="36" rx="11" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.8" opacity="0.45"/><text x="1050" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0f766e">r₂</text><rect x="710.75" y="450" width="338.5" height="40" rx="20" fill="#e8f7f4" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="880" y="477" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#0f766e">x∉F  ⇒  alguna bola evita F</text><text x="880" y="525" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5f6b78">ventanas en el complemento</text><rect x="250" y="610" width="700" height="55" rx="18" fill="#fff0f3" stroke="#be123c" stroke-width="1.5" opacity="1"/><text x="600" y="646" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#be123c">No:  ∃r&gt;0  ∀x.     Sí:  ∀x  ∃rₓ&gt;0.</text>
</svg>