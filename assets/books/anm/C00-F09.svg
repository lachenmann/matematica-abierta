<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="820" id="C00-F09" role="img" version="1.1" viewBox="0 0 1200 820" width="1200">
  <title>Traza racional y reconstrucción</title>
  <desc>Un elemento x de F queda codificado por la traza racional A_x contenida en Q; la misma traza permite reconstruir x como supremo de su copia racional dentro de F.</desc>
  <defs/>
  <rect fill="#ffffff" height="820" width="1200" x="0" y="0"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="46">Traza racional y reconstrucción</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="76">x vive en F; Aₓ vive en Q; la reconstrucción vuelve a F</text>
  <rect fill="#f8fafc" height="220" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1070" x="65" y="110"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="83" y="141">Universo F</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="135" x2="1060" y1="220" y2="220"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1050" x2="1060" y1="214" y2="220"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1050" x2="1060" y1="226" y2="220"/>
  <circle cx="780" cy="220" fill="#6d5aa8" r="6" stroke="#6d5aa8" stroke-width="1"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="780" y="205">x∈F</text>
  <circle cx="250" cy="220" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="250" y="205">ι(q₁)</text>
  <circle cx="370" cy="220" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="370" y="205">ι(q₂)</text>
  <circle cx="520" cy="220" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="520" y="205">ι(q₃)</text>
  <circle cx="650" cy="220" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="650" y="205">ι(q₄)</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="450" y="280">imágenes racionales por debajo de x</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="4" x1="600" x2="600" y1="330" y2="405"/>
  <polygon fill="#2f6f9f" points="600,405 594.9204290690437,395.2430558494279 605.0795709309563,395.2430558494279"/>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="650" y="371">registrar qué racionales quedan debajo</text>
  <rect fill="#f8fafc" height="220" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1070" x="65" y="405"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="83" y="436">Universo Q: traza racional</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="135" x2="1060" y1="510" y2="510"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1050" x2="1060" y1="504" y2="510"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1050" x2="1060" y1="516" y2="510"/>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="13" x1="135" x2="690" y1="510" y2="510"/>
  <circle cx="690" cy="510" fill="#ffffff" r="6" stroke="#2f7d77" stroke-width="3"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="690" y="495">Aₓ</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="600" x="300" y="545"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600.0" y="576">Aₓ = { q∈Q : ι_F(q) &lt; x }</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="190" y="610">✓</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="218" y="610">no vacío</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="405" y="610">✓</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="433" y="610">propio</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="600" y="610">✓</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="628" y="610">cerrado hacia abajo</text>
  <text fill="#4f7c5b" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="875" y="610">✓</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="903" y="610">sin máximo</text>
  <line stroke="#6d5aa8" stroke-linecap="round" stroke-width="4" x1="600" x2="600" y1="640" y2="700"/>
  <polygon fill="#6d5aa8" points="600,700 594.9204290690437,690.2430558494278 605.0795709309563,690.2430558494278"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="650" y="676">reconstruir por completitud</text>
  <rect fill="#f8fafc" height="85" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="700" x="250" y="700"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="268" y="731">Vuelta a F</text>
  <rect fill="#f5f1fb" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="380" x="410" y="720"/>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="600.0" y="751">x = sup_F ι_F(Aₓ)</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="600" y="805">Dos elementos con la misma traza racional son el mismo elemento de F.</text>
</svg>
