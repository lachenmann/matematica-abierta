<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="700" id="C00-F02" role="img" version="1.1" viewBox="0 0 1200 700" width="1200">
  <title>Extender sin identificar: N → Z → Q</title>
  <desc>Tres universos separados N, Z y Q unidos por incrustaciones tipadas; la identificación con la imagen aparece como un segundo paso y no como inclusión literal previa.</desc>
  <defs/>
  <rect fill="#ffffff" height="700" width="1200" x="0" y="0"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="46">Extender sin identificar: N → Z → Q</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="76">Cada flecha conserva sólo la estructura que realmente existe en su dominio</text>
  <rect fill="#ffffff" height="245" rx="14" ry="14" stroke="#2f6f9f" stroke-width="2" width="270" x="80" y="145"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="98" y="176">Universo N</text>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="bold" text-anchor="middle" x="215" y="235">N</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="215" y="275">naturales</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="215" y="325">suma · producto · orden</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="215" y="355">no cuerpo</text>
  <rect fill="#ffffff" height="245" rx="14" ry="14" stroke="#2f7d77" stroke-width="2" width="270" x="460" y="145"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="478" y="176">Universo Z</text>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="bold" text-anchor="middle" x="595" y="235">Z</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="595" y="275">enteros</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="595" y="325">anillo ordenado</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="595" y="355">opuestos disponibles</text>
  <rect fill="#ffffff" height="245" rx="14" ry="14" stroke="#6d5aa8" stroke-width="2" width="270" x="840" y="145"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="858" y="176">Universo Q</text>
  <text fill="#6d5aa8" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="bold" text-anchor="middle" x="975" y="235">Q</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="975" y="275">racionales</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="975" y="325">cuerpo ordenado</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="975" y="355">cocientes disponibles</text>
  <line stroke="#2f6f9f" stroke-linecap="round" stroke-width="4" x1="350" x2="455" y1="255" y2="255"/>
  <polygon fill="#2f6f9f" points="455,255 445.2430558494279,260.0795709309563 445.2430558494279,249.92042906904368"/>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="402.5" y="239.0">inyectiva</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="402" y="300">estructura disponible preservada</text>
  <line stroke="#2f7d77" stroke-linecap="round" stroke-width="4" x1="730" x2="835" y1="255" y2="255"/>
  <polygon fill="#2f7d77" points="835,255 825.2430558494278,260.0795709309563 825.2430558494278,249.92042906904368"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="782.5" y="239.0">inyectiva</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="782" y="300">anillo + orden preservados</text>
  <rect fill="#f8fafc" height="150" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="840" x="180" y="455"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="198" y="486">Segundo paso: identificación con la imagen</text>
  <text fill="#2f6f9f" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="380" y="525">A ──incrustación──▶ B</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="525">después</text>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="820" y="525">ι(A) ⊂ B</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="570">La notación A⊂B es una economía posterior; no una inclusión literal dada de antemano.</text>
</svg>
