<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="760" id="C00-F03" role="img" version="1.1" viewBox="0 0 1200 760" width="1200">
  <title>Densidad sin completitud</title>
  <desc>Esquema de la incompletitud de Q para S2: si s al cuadrado es menor que 2 se avanza a la derecha dentro del conjunto; si es mayor que 2 se mejora la cota hacia la izquierda; el caso igual a 2 no es racional.</desc>
  <defs/>
  <rect fill="#ffffff" height="760" width="1200" x="0" y="0"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="40" y="46">Densidad sin completitud</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="40" y="76">S₂⊂Q es no vacío y acotado, pero ningún racional puede ser su supremo</text>
  <rect fill="#f8fafc" height="165" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="1100" x="50" y="115"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="68" y="146">El conjunto racional</text>
  <rect fill="#eef8f6" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="710" x="245" y="155"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="600.0" y="186">S₂ = { q∈Q : q≥0 y q²&lt;2 }</text>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="600" y="245">DENSO = sí   ·   COMPLETO = no</text>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="110" x2="1090" y1="330" y2="330"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1080" x2="1090" y1="324" y2="330"/>
  <line stroke="#7f8da1" stroke-linecap="round" stroke-width="3" x1="1080" x2="1090" y1="336" y2="330"/>
  <circle cx="180" cy="330" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="180" y="315">0</text>
  <circle cx="330" cy="330" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="330" y="315">1</text>
  <circle cx="470" cy="330" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="470" y="315">4/3</text>
  <circle cx="700" cy="330" fill="#65758b" r="6" stroke="#65758b" stroke-width="1"/>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="700" y="315">3/2</text>
  <circle cx="960" cy="330" fill="#65758b" r="6" stroke="#65758b" stroke-width="1"/>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="960" y="315">2</text>
  <line stroke="#a87320" stroke-dasharray="7 6" stroke-linecap="round" stroke-width="3" x1="520" x2="520" y1="296" y2="365"/>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="520" y="285">frontera requerida</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="520" y="388">(no se nombra como √2)</text>
  <rect fill="#f8fafc" height="235" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="340" x="55" y="430"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="73" y="461">Caso 1: s² &lt; 2</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="225" y="478">s es demasiado bajo</text>
  <line stroke="#a24d4d" stroke-linecap="round" stroke-width="4" x1="135" x2="305" y1="540" y2="540"/>
  <polygon fill="#a24d4d" points="305,540 295.2430558494279,545.0795709309563 295.2430558494279,534.9204290690437"/>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="220.0" y="526.0">+δ</text>
  <circle cx="125" cy="540" fill="#26364a" r="6" stroke="#26364a" stroke-width="1"/>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="125" y="525">s</text>
  <circle cx="315" cy="540" fill="#2f7d77" r="6" stroke="#2f7d77" stroke-width="1"/>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="315" y="525">s+δ</text>
  <text fill="#2f7d77" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="225" y="590">s+δ ∈ S₂</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="225" y="622">⇒ s no es cota superior</text>
  <rect fill="#f8fafc" height="235" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="340" x="430" y="430"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="448" y="461">Caso 2: s² = 2</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="600" y="500">ningún s∈Q</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="532">puede satisfacer</text>
  <rect fill="#fff2f2" height="48" rx="9" ry="9" stroke="#dce3ec" stroke-width="1.5" width="210" x="495" y="557"/>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="600.0" y="588">s² = 2</text>
  <rect fill="#f8fafc" height="235" rx="14" ry="14" stroke="#dce3ec" stroke-width="2" width="340" x="805" y="430"/>
  <text fill="#182433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="823" y="461">Caso 3: s² &gt; 2</text>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="975" y="478">s es demasiado alto</text>
  <line stroke="#a24d4d" stroke-linecap="round" stroke-width="4" x1="1055" x2="885" y1="540" y2="540"/>
  <polygon fill="#a24d4d" points="885,540 894.7569441505722,534.9204290690437 894.7569441505722,545.0795709309563"/>
  <text fill="#a24d4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="970.0" y="526.0">−δ</text>
  <circle cx="1065" cy="540" fill="#26364a" r="6" stroke="#26364a" stroke-width="1"/>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="1065" y="525">s</text>
  <circle cx="875" cy="540" fill="#a87320" r="6" stroke="#a87320" stroke-width="1"/>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="875" y="525">t=s−δ</text>
  <text fill="#a87320" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="975" y="590">t sigue siendo cota</text>
  <text fill="#26364a" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="975" y="622">⇒ s no es la menor</text>
  <text fill="#65758b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="718">No hay “agujero macroscópico”: falla una propiedad global de supremos dentro de Q.</text>
</svg>
