<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>Suma ordinaria y suma con origen elegido</title><rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
<text x="35" y="42" font-family="Georgia,serif" font-size="27" fill="#182c3b" text-anchor="start">En la recta x + y = 1: escoger p cambia las operaciones</text>
<line x1="150.0" y1="365" x2="610.0" y2="365" stroke="#8b949e" stroke-width="1"/>
<polygon points="610.0,365 598.0,360.0 598.0,370.0" fill="#8b949e"/>
<line x1="330" y1="505.0" x2="330" y2="155.0" stroke="#8b949e" stroke-width="1"/>
<polygon points="330,155.0 325.0,167.0 335.0,167.0" fill="#8b949e"/>
<line x1="230" y1="165" x2="530" y2="465" stroke="#245b89" stroke-width="3"/>
<line x1="430" y1="365" x2="330" y2="265" stroke="#287a57" stroke-width="3"/>
<polygon points="330,265 334.9497474683059,277.0208152801713 342.0208152801713,269.9497474683059" fill="#287a57"/>
<line x1="430" y1="365" x2="380.0" y2="315.0" stroke="#287a57" stroke-width="3"/>
<polygon points="380.0,315.0 384.9497474683059,327.0208152801713 392.0208152801713,319.9497474683059" fill="#287a57"/>
<line x1="330" y1="265" x2="280.0" y2="215.0" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="380.0" y1="315.0" x2="280.0" y2="215.0" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="430" cy="365" r="5" fill="#182c3b"/>
<circle cx="330" cy="265" r="5" fill="#287a57"/>
<circle cx="380.0" cy="315.0" r="5" fill="#287a57"/>
<circle cx="380.0" cy="215.0" r="5" fill="#a7333f"/>
<circle cx="280.0" cy="215.0" r="5" fill="#245b89"/>
<text x="442" y="390" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">p = (1, 0)</text>
<text x="340" y="252" font-family="Georgia,serif" font-size="18" fill="#287a57" text-anchor="start">u = (0, 1)</text>
<text x="390.0" y="340.0" font-family="Georgia,serif" font-size="18" fill="#287a57" text-anchor="start">v = (1/2, 1/2)</text>
<text x="392.0" y="207.0" font-family="Georgia,serif" font-size="20" fill="#a7333f" text-anchor="start">u + v</text>
<text x="265.0" y="201.0" font-family="Georgia,serif" font-size="20" fill="#245b89" text-anchor="end">suma nueva</text>
<text x="660" y="140" font-family="Georgia,serif" font-size="23" fill="#a7333f" text-anchor="start">Suma ordinaria:</text>
<text x="660" y="180" font-family="Georgia,serif" font-size="22" fill="#a7333f" text-anchor="start">u + v = (1/2, 3/2)</text>
<text x="660" y="215" font-family="Georgia,serif" font-size="19" fill="#182c3b" text-anchor="start">x + y = 2: fuera de la recta.</text>
<text x="660" y="290" font-family="Georgia,serif" font-size="23" fill="#245b89" text-anchor="start">Con origen elegido p:</text>
<text x="660" y="330" font-family="Georgia,serif" font-size="22" fill="#245b89" text-anchor="start">suma nueva = u + v − p</text>
<text x="660" y="368" font-family="Georgia,serif" font-size="22" fill="#245b89" text-anchor="start">= (−1/2, 3/2)</text>
<text x="660" y="405" font-family="Georgia,serif" font-size="19" fill="#182c3b" text-anchor="start">x + y = 1: permanece en la recta.</text>
<text x="50" y="553" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">Los segmentos verdes registran u − p y v − p; las líneas discontinuas completan su suma.</text>
<text x="50" y="587" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">La suma nueva usa esos desplazamientos y tiene p como cero.</text>
</svg>
