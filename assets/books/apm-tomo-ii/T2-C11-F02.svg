<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">11.2. Sumar clases con representantes distintos</title><desc id="desc">Dos sumas de representantes de la clase horizontal de altura uno producen (0,2) y (1,2), que pertenecen a una misma clase.</desc>
<rect x="0" y="0" width="1200" height="590" fill="white"/>
<text x="30" y="35" font-family="Georgia,serif" font-size="24" fill="#24354b">11.2. Sumar clases con representantes distintos</text>
<line x1="85" y1="410" x2="579.0" y2="410" stroke="#9aa5b1" stroke-width="1"/>
<line x1="275" y1="438.5" x2="275" y2="106.0" stroke="#9aa5b1" stroke-width="1"/>
<line x1="85" y1="414.75" x2="85" y2="405.25" stroke="#9aa5b1" stroke-width="1"/>
<text x="77.4" y="438.5" font-family="Georgia,serif" font-size="14" fill="#24354b">-2</text>
<line x1="180" y1="414.75" x2="180" y2="405.25" stroke="#9aa5b1" stroke-width="1"/>
<text x="172.39999999999998" y="438.5" font-family="Georgia,serif" font-size="14" fill="#24354b">-1</text>
<line x1="370" y1="414.75" x2="370" y2="405.25" stroke="#9aa5b1" stroke-width="1"/>
<text x="362.4" y="438.5" font-family="Georgia,serif" font-size="14" fill="#24354b">1</text>
<line x1="465" y1="414.75" x2="465" y2="405.25" stroke="#9aa5b1" stroke-width="1"/>
<text x="457.4" y="438.5" font-family="Georgia,serif" font-size="14" fill="#24354b">2</text>
<line x1="560" y1="414.75" x2="560" y2="405.25" stroke="#9aa5b1" stroke-width="1"/>
<text x="552.4" y="438.5" font-family="Georgia,serif" font-size="14" fill="#24354b">3</text>
<line x1="270.25" y1="315" x2="279.75" y2="315" stroke="#9aa5b1" stroke-width="1"/>
<text x="241.75" y="320.7" font-family="Georgia,serif" font-size="14" fill="#24354b">1</text>
<line x1="270.25" y1="220" x2="279.75" y2="220" stroke="#9aa5b1" stroke-width="1"/>
<text x="241.75" y="225.70000000000002" font-family="Georgia,serif" font-size="14" fill="#24354b">2</text>
<line x1="270.25" y1="125" x2="279.75" y2="125" stroke="#9aa5b1" stroke-width="1"/>
<text x="241.75" y="130.7" font-family="Georgia,serif" font-size="14" fill="#24354b">3</text>
<text x="252.2" y="438.5" font-family="Georgia,serif" font-size="14" fill="#24354b">0</text>
<line x1="104.0" y1="410" x2="560" y2="410" stroke="#28705b" stroke-width="2"/>
<text x="99.25" y="392.9" font-family="Georgia,serif" font-size="16" fill="#28705b">U</text>
<line x1="104.0" y1="315" x2="560" y2="315" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 4"/>
<text x="99.25" y="297.9" font-family="Georgia,serif" font-size="16" fill="#24354b">clase 1</text>
<line x1="104.0" y1="220" x2="560" y2="220" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 4"/>
<text x="99.25" y="202.89999999999998" font-family="Georgia,serif" font-size="16" fill="#24354b">clase 2</text>
<line x1="275" y1="410" x2="275" y2="315" stroke="#a63d40" stroke-width="3"/>
<polygon points="275,315 271.0,325.0 279.0,325.0" fill="#a63d40" fill-opacity="1" stroke="#a63d40" stroke-width="1"/>
<line x1="275" y1="315" x2="275" y2="220" stroke="#a63d40" stroke-width="3"/>
<polygon points="275,220 271.0,230.0 279.0,230.0" fill="#a63d40" fill-opacity="1" stroke="#a63d40" stroke-width="1"/>
<line x1="275" y1="410" x2="465" y2="315" stroke="#1f5b9d" stroke-width="3"/>
<polygon points="465,315 454.266873708001,315.8944271909999 457.8445824720007,323.0498447189993" fill="#1f5b9d" fill-opacity="1" stroke="#1f5b9d" stroke-width="1"/>
<line x1="465" y1="315" x2="370" y2="220" stroke="#1f5b9d" stroke-width="3"/>
<polygon points="370,220 374.24264068711926,229.89949493661166 379.8994949366117,224.2426406871193" fill="#1f5b9d" fill-opacity="1" stroke="#1f5b9d" stroke-width="1"/>
<circle cx="275" cy="315" r="5" fill="#a63d40"/>
<text x="286.4" y="348.25" font-family="Georgia,serif" font-size="17" fill="#a63d40">p=q=(0,1)</text>
<circle cx="465" cy="315" r="5" fill="#1f5b9d"/>
<text x="476.4" y="348.25" font-family="Georgia,serif" font-size="17" fill="#1f5b9d">p&#x27;=(2,1)</text>
<circle cx="275" cy="220" r="5" fill="#a63d40"/>
<text x="199.0" y="200.99999999999997" font-family="Georgia,serif" font-size="17" fill="#a63d40">(0,2)</text>
<circle cx="370" cy="220" r="5" fill="#1f5b9d"/>
<text x="384.25" y="196.25" font-family="Georgia,serif" font-size="17" fill="#1f5b9d">(1,2)</text>
<text x="695" y="150" font-family="Georgia,serif" font-size="22" fill="#a63d40">Primeros representantes:</text>
<text x="695" y="200" font-family="Georgia,serif" font-size="22" fill="#a63d40">(0,1) + (0,1) = (0,2)</text>
<text x="695" y="290" font-family="Georgia,serif" font-size="22" fill="#1f5b9d">Otros representantes:</text>
<text x="695" y="340" font-family="Georgia,serif" font-size="22" fill="#1f5b9d">(2,1) + (-1,1) = (1,2)</text>
<text x="695" y="430" font-family="Georgia,serif" font-size="20" fill="#24354b">Las salidas difieren en (1,0),</text>
<text x="695" y="470" font-family="Georgia,serif" font-size="20" fill="#24354b">que pertenece a U.</text>
<text x="55" y="553" font-family="Georgia,serif" font-size="19" fill="#24354b">En el cociente: clase 1 + clase 1 = clase 2. El resultado es una clase, no un punto.</text>
</svg>