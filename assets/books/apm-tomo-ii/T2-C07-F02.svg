<line x1="240.0" y1="360.0" x2="387.9" y2="232.98000000000002" stroke="#28705b" stroke-width="3"/>
<polygon points="387.9,232.98000000000002 377.70763326539407,236.4607557149705 382.91984182319607,242.52976567953442" fill="#28705b" fill-opacity="1" stroke="#28705b" stroke-width="1"/>
<text x="399.9" y="224.98000000000002" font-family="Georgia,serif" font-size="19" fill="#28705b">a₃ = u + v</text>
<line x1="240.0" y1="360.0" x2="444.45000000000005" y2="426.99" stroke="#24354b" stroke-width="3"/>
<polygon points="444.45000000000005,426.99 436.1926003734784,420.0751354743624 433.70163163207917,427.6774426721394" fill="#24354b" fill-opacity="1" stroke="#24354b" stroke-width="1"/>
<text x="424.45000000000005" y="456.99" font-family="Georgia,serif" font-size="19" fill="#24354b">a₄ = 2u − v</text>
<text x="215.0" y="382.0" font-family="Georgia,serif" font-size="16" fill="#24354b">0</text>
<text x="740" y="120" font-family="Georgia,serif" font-size="22" fill="#24354b">Plano: z = x + y</text>
<text x="740" y="180" font-family="Georgia,serif" font-size="19" fill="#24354b">u = (1, 0, 1)</text>
<text x="740" y="225" font-family="Georgia,serif" font-size="19" fill="#24354b">v = (0, 1, 1)</text>
<text x="740" y="270" font-family="Georgia,serif" font-size="19" fill="#24354b">a₃ = (1, 1, 2)</text>
<text x="740" y="315" font-family="Georgia,serif" font-size="19" fill="#24354b">a₄ = (2, −1, 1)</text>
<text x="70" y="570" font-family="Georgia,serif" font-size="18" fill="#24354b">Proyección oblicua: se representan x + 0,35z e y + 0,23z.</text>
<text x="70" y="605" font-family="Georgia,serif" font-size="17" fill="#24354b">Las ecuaciones verifican las relaciones; los ángulos aparentes no son datos métricos.</text>
