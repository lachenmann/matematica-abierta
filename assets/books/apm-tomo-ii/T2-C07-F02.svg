<text x="369.45" y="357.99" font-family="Georgia,serif" font-size="19" fill="#1f5b9d">u</text>
<line x1="240.0" y1="360.0" x2="270.45" y2="252.99" stroke="#a63d40" stroke-width="3"/>
<polygon points="270.45,252.99 263.8658442634707,261.51343201047143 271.5603920600798,263.7029374810512" fill="#a63d40" fill-opacity="1" stroke="#a63d40" stroke-width="1"/>
