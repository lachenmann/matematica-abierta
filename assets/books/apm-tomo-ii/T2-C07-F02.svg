<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc">
<title id="title">7.2. Extraer una base de cuatro columnas</title><desc id="desc">Las columnas u y v son independientes y generan el plano z=x+y; a3=u+v y a4=2u-v.</desc>
<rect x="0" y="0" width="1100" height="630" fill="white"/>
<text x="35" y="36" font-family="Georgia,serif" font-size="24" fill="#24354b">7.2. Extraer una base de cuatro columnas</text>
<polygon points="123.855,532.521 487.95000000000005,470.49 594.5250000000001,95.95499999999998 230.43,157.986" fill="#1f5b9d" fill-opacity="0.08" stroke="#1f5b9d" stroke-width="1"/>
