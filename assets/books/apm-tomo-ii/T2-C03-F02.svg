<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 600" role="img" aria-labelledby="title desc"><title id="title">Inversa y perdida de informacion</title><desc id="desc">La cizalla S y su inversa sobre (1,1); J envia (1,-1) y (1,1) a (1,0). Las formulas del texto prueban invertibilidad o imposibilidad de inversa; los dibujos ilustran casos.</desc><rect width="930" height="600" fill="white"/><g font-family="Georgia,serif"><text x="450" y="30" font-size="23" text-anchor="middle" fill="#172c40">Recuperar la entrada y perder una coordenada</text><text x="145" y="58" font-size="17" text-anchor="middle" fill="#172c40">Entrada</text><line x1="142.0" y1="243.0" x2="142.0" y2="75" stroke="#e6ebf2" stroke-width="1"/><line x1="190.0" y1="243.0" x2="190.0" y2="75" stroke="#e6ebf2" stroke-width="1"/><line x1="70.0" y1="171" x2="214.0" y2="171" stroke="#e6ebf2" stroke-width="1"/><line x1="70.0" y1="123" x2="214.0" y2="123" stroke="#e6ebf2" stroke-width="1"/><line x1="70.0" y1="75" x2="214.0" y2="75" stroke="#e6ebf2" stroke-width="1"/><line x1="70.0" y1="171" x2="214.0" y2="171" stroke="#64748b" stroke-width="1.5"/><line x1="94.0" y1="243.0" x2="94.0" y2="75" stroke="#64748b" stroke-width="1.5"/><text x="221.0" y="176" font-size="14" text-anchor="start" fill="#172c40">x</text><text x="99.0" y="70" font-size="14" text-anchor="start" fill="#172c40">y</text><circle cx="142.0" cy="123" r="4" fill="#1f5a99"/><text x="151.0" y="113" font-size="15" text-anchor="start" fill="#1f5a99">(1, 1)</text><text x="435" y="58" font-size="17" text-anchor="middle" fill="#172c40">Después de S</text><line x1="432.0" y1="243.0" x2="432.0" y2="75" stroke="#e6ebf2" stroke-width="1"/><line x1="480.0" y1="243.0" x2="480.0" y2="75" stroke="#e6ebf2" stroke-width="1"/><line x1="360.0" y1="171" x2="504.0" y2="171" stroke="#e6ebf2" stroke-width="1"/><line x1="360.0" y1="123" x2="504.0" y2="123" stroke="#e6ebf2" stroke-width="1"/><line x1="360.0" y1="75" x2="504.0" y2="75" stroke="#e6ebf2" stroke-width="1"/><line x1="360.0" y1="171" x2="504.0" y2="171" stroke="#64748b" stroke-width="1.5"/><line x1="384.0" y1="243.0" x2="384.0" y2="75" stroke="#64748b" stroke-width="1.5"/><text x="511.0" y="176" font-size="14" text-anchor="start" fill="#172c40">x</text><text x="389.0" y="70" font-size="14" text-anchor="start" fill="#172c40">y</text><circle cx="480.0" cy="123" r="4" fill="#1f5a99"/><text x="489.0" y="113" font-size="15" text-anchor="start" fill="#1f5a99">(2, 1)</text><text x="725" y="58" font-size="17" text-anchor="middle" fill="#172c40">Después de S inversa</text><line x1="722.0" y1="243.0" x2="722.0" y2="75" stroke="#e6ebf2" stroke-width="1"/><line x1="770.0" y1="243.0" x2="770.0" y2="75" stroke="#e6ebf2" stroke-width="1"/><line x1="650.0" y1="171" x2="794.0" y2="171" stroke="#e6ebf2" stroke-width="1"/><line x1="650.0" y1="123" x2="794.0" y2="123" stroke="#e6ebf2" stroke-width="1"/><line x1="650.0" y1="75" x2="794.0" y2="75" stroke="#e6ebf2" stroke-width="1"/><line x1="650.0" y1="171" x2="794.0" y2="171" stroke="#64748b" stroke-width="1.5"/><line x1="674.0" y1="243.0" x2="674.0" y2="75" stroke="#64748b" stroke-width="1.5"/><text x="801.0" y="176" font-size="14" text-anchor="start" fill="#172c40">x</text><text x="679.0" y="70" font-size="14" text-anchor="start" fill="#172c40">y</text><circle cx="722.0" cy="123" r="4" fill="#1f5a99"/><text x="731.0" y="113" font-size="15" text-anchor="start" fill="#1f5a99">(1, 1)</text><text x="145" y="327" font-size="17" text-anchor="middle" fill="#172c40">Dos entradas</text><line x1="142.0" y1="513.0" x2="142.0" y2="345" stroke="#e6ebf2" stroke-width="1"/><line x1="190.0" y1="513.0" x2="190.0" y2="345" stroke="#e6ebf2" stroke-width="1"/><line x1="70.0" y1="441" x2="214.0" y2="441" stroke="#e6ebf2" stroke-width="1"/><line x1="70.0" y1="393" x2="214.0" y2="393" stroke="#e6ebf2" stroke-width="1"/><line x1="70.0" y1="345" x2="214.0" y2="345" stroke="#e6ebf2" stroke-width="1"/><line x1="70.0" y1="441" x2="214.0" y2="441" stroke="#64748b" stroke-width="1.5"/><line x1="94.0" y1="513.0" x2="94.0" y2="345" stroke="#64748b" stroke-width="1.5"/><text x="221.0" y="446" font-size="14" text-anchor="start" fill="#172c40">x</text><text x="99.0" y="340" font-size="14" text-anchor="start" fill="#172c40">y</text><line x1="142.0" y1="489" x2="142.0" y2="393" stroke="#a53535" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="142.0" cy="489" r="4" fill="#a53535"/><text x="151.0" y="479" font-size="15" text-anchor="start" fill="#a53535">(1, -1)</text><circle cx="142.0" cy="393" r="4" fill="#a53535"/><text x="151.0" y="383" font-size="15" text-anchor="start" fill="#a53535">(1, 1)</text><text x="435" y="327" font-size="17" text-anchor="middle" fill="#172c40">Misma salida por J</text><line x1="432.0" y1="513.0" x2="432.0" y2="345" stroke="#e6ebf2" stroke-width="1"/><line x1="480.0" y1="513.0" x2="480.0" y2="345" stroke="#e6ebf2" stroke-width="1"/><line x1="360.0" y1="441" x2="504.0" y2="441" stroke="#e6ebf2" stroke-width="1"/><line x1="360.0" y1="393" x2="504.0" y2="393" stroke="#e6ebf2" stroke-width="1"/><line x1="360.0" y1="345" x2="504.0" y2="345" stroke="#e6ebf2" stroke-width="1"/><line x1="360.0" y1="441" x2="504.0" y2="441" stroke="#64748b" stroke-width="1.5"/><line x1="384.0" y1="513.0" x2="384.0" y2="345" stroke="#64748b" stroke-width="1.5"/><text x="511.0" y="446" font-size="14" text-anchor="start" fill="#172c40">x</text><text x="389.0" y="340" font-size="14" text-anchor="start" fill="#172c40">y</text><circle cx="432.0" cy="441" r="4" fill="#a53535"/><text x="441.0" y="431" font-size="15" text-anchor="start" fill="#a53535">(1, 0)</text><text x="658" y="394" font-size="19" text-anchor="start" fill="#a53535">J(x, y) = (x, 0)</text><text x="658" y="432" font-size="16" text-anchor="start" fill="#172c40">La salida no distingue</text><text x="658" y="457" font-size="16" text-anchor="start" fill="#172c40">las dos entradas.</text><text x="40" y="570" font-size="16" text-anchor="start" fill="#172c40">La fórmula de S inversa recupera todos los datos; J identifica entradas distintas.</text></g></svg>
