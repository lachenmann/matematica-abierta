<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>Intersección, unión y suma de dos ejes</title><rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
<text x="35" y="45" font-family="Georgia,serif" font-size="28" fill="#182c3b" text-anchor="start">Dos ejes U y W: tres operaciones distintas</text>
<text x="180" y="112" font-family="Georgia,serif" font-size="21" fill="#182c3b" text-anchor="middle">Intersección: sólo el cero</text>
<line x1="40" y1="330" x2="320" y2="330" stroke="#929aa3" stroke-width="2"/>
<line x1="180" y1="430" x2="180" y2="185" stroke="#929aa3" stroke-width="2"/>
<circle cx="180" cy="330" r="5" fill="#287a57"/>
<text x="180" y="500" font-family="Georgia,serif" font-size="19" fill="#182c3b" text-anchor="middle">Intersección = {0}</text>
<text x="540" y="112" font-family="Georgia,serif" font-size="21" fill="#182c3b" text-anchor="middle">Unión: los dos ejes</text>
<line x1="400" y1="330" x2="680" y2="330" stroke="#929aa3" stroke-width="2"/>
<line x1="540" y1="430" x2="540" y2="185" stroke="#929aa3" stroke-width="2"/>
<line x1="400" y1="330" x2="680" y2="330" stroke="#245b89" stroke-width="4"/>
<line x1="540" y1="430" x2="540" y2="185" stroke="#a7333f" stroke-width="4"/>
<text x="650" y="357" font-family="Georgia,serif" font-size="20" fill="#245b89" text-anchor="start">U</text>
<text x="552" y="210" font-family="Georgia,serif" font-size="20" fill="#a7333f" text-anchor="start">W</text>
<circle cx="540" cy="330" r="5" fill="#287a57"/>
<circle cx="615" cy="255" r="5" fill="#287a57"/>
<text x="622" y="248" font-family="Georgia,serif" font-size="17" fill="#287a57" text-anchor="start">(1, 1)</text>
<line x1="615" y1="255" x2="615" y2="330" stroke="#929aa3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="615" y1="255" x2="540" y2="255" stroke="#929aa3" stroke-width="1" stroke-dasharray="4 4"/>
<text x="540" y="500" font-family="Georgia,serif" font-size="19" fill="#182c3b" text-anchor="middle">(1, 1) queda fuera</text>
<text x="900" y="112" font-family="Georgia,serif" font-size="21" fill="#182c3b" text-anchor="middle">Suma: todo el plano</text>
<polygon points="765,195 1035,195 1035,430 765,430" fill="#245b89" fill-opacity="0.1" stroke="#245b89" stroke-width="1"/>
<line x1="760" y1="330" x2="1040" y2="330" stroke="#929aa3" stroke-width="2"/>
<line x1="900" y1="430" x2="900" y2="185" stroke="#929aa3" stroke-width="2"/>
<circle cx="900" cy="330" r="5" fill="#287a57"/>
<circle cx="975" cy="255" r="5" fill="#287a57"/>
<text x="982" y="248" font-family="Georgia,serif" font-size="17" fill="#287a57" text-anchor="start">(1, 1)</text>
<line x1="975" y1="255" x2="975" y2="330" stroke="#929aa3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="975" y1="255" x2="900" y2="255" stroke="#929aa3" stroke-width="1" stroke-dasharray="4 4"/>
<text x="900" y="500" font-family="Georgia,serif" font-size="19" fill="#182c3b" text-anchor="middle">(1, 1) = (1, 0) + (0, 1)</text>
<text x="35" y="570" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">U = {(x, 0)}; W = {(0, y)}. El sombreado muestra una porción visible de U + W = R².</text>
</svg>
