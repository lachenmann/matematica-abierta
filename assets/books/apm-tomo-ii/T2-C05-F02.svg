<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>Generadores y ecuaciones del mismo plano</title><rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
<text x="35" y="45" font-family="Georgia,serif" font-size="27" fill="#182c3b" text-anchor="start">El mismo conjunto: producir columnas o comprobar una ecuación</text>
<polygon points="187.3,533.5 482.5,449.5 573.7,161.5 278.5,245.5" fill="#245b89" fill-opacity="0.12" stroke="#245b89" stroke-width="1"/>
<line x1="300" y1="425" x2="529.5" y2="425" stroke="#929aa3" stroke-width="1"/>
<polygon points="529.5,425 518.5,421.0 518.5,429.0" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<text x="537.5" y="429" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">x</text>
<line x1="300" y1="425" x2="433.0" y2="302.5" stroke="#929aa3" stroke-width="1"/>
<polygon points="433.0,302.5 422.19910082424286,307.0100528816333 427.61890686225723,312.89441372290605" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<text x="441.0" y="306.5" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">y</text>
<line x1="300" y1="425" x2="300" y2="170" stroke="#929aa3" stroke-width="1"/>
<polygon points="300,170 296.0,181.0 304.0,181.0" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<text x="308" y="174" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">z</text>
<line x1="300" y1="425" x2="423" y2="390" stroke="#245b89" stroke-width="3"/>
<polygon points="423,390 411.32524404437265,389.1632961237427 413.5147495149524,396.8578439203518" fill="#245b89" fill-opacity="1" stroke="#245b89" stroke-width="1"/>
<line x1="300" y1="425" x2="338" y2="305" stroke="#a7333f" stroke-width="3"/>
<polygon points="338,305 330.8658223469586,314.27919766008057 338.49256014976453,316.69433129763576" fill="#a7333f" fill-opacity="1" stroke="#a7333f" stroke-width="1"/>
<line x1="300" y1="425" x2="461" y2="270" stroke="#287a57" stroke-width="3"/>
<polygon points="461,270 450.3013440967013,274.7475005911334 455.84978965090056,280.51072468291454" fill="#287a57" fill-opacity="1" stroke="#287a57" stroke-width="1"/>
<line x1="423" y1="390" x2="461" y2="270" stroke="#929aa3" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="338" y1="305" x2="461" y2="270" stroke="#929aa3" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="300" cy="425" r="5" fill="#182c3b"/>
<text x="435" y="407" font-family="Georgia,serif" font-size="21" fill="#245b89" text-anchor="start">u</text>
<text x="325" y="300" font-family="Georgia,serif" font-size="21" fill="#a7333f" text-anchor="end">v</text>
<text x="469" y="260" font-family="Georgia,serif" font-size="21" fill="#287a57" text-anchor="start">u + v</text>
<text x="660" y="160" font-family="Georgia,serif" font-size="23" fill="#245b89" text-anchor="start">u = (1, 1, 0)</text>
<text x="660" y="203" font-family="Georgia,serif" font-size="23" fill="#a7333f" text-anchor="start">v = (0, 1, 1)</text>
<text x="660" y="278" font-family="Georgia,serif" font-size="22" fill="#182c3b" text-anchor="start">a u + b v = (a, a + b, b)</text>
<text x="660" y="338" font-family="Georgia,serif" font-size="22" fill="#182c3b" text-anchor="start">Condición equivalente: y = x + z</text>
<text x="660" y="410" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">La porción sombreada está en ese plano.</text>
<text x="35" y="575" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">Proyección oblicua de R³: representa incidencias y sumas; no codifica longitudes ni ángulos.</text>
</svg>
