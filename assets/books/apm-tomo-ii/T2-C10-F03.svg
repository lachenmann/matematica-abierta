<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">10.3. Cómo se mezclan los coeficientes</title><desc id="desc">Las identidades t=(t-1)+1 y t²=(t-1)²+2(t-1)+1 determinan las columnas de transición y convierten (2,3,1) en (6,5,1).</desc>
<rect x="0" y="0" width="1200" height="590" fill="white"/>
<text x="30" y="35" font-family="Georgia,serif" font-size="24" fill="#24354b">10.3. Cómo se mezclan los coeficientes</text>
<text x="60" y="90" font-family="Georgia,serif" font-size="23" fill="#24354b">t = (t-1) + 1</text>
<text x="520" y="90" font-family="Georgia,serif" font-size="23" fill="#24354b">t² = (t-1)² + 2(t-1) + 1</text>
<text x="70" y="155" font-family="Georgia,serif" font-size="21" fill="#1f5b9d">Entrada en (1,t,t²)</text>
<text x="455" y="155" font-family="Georgia,serif" font-size="21" fill="#24354b">Columnas de transición</text>
<text x="860" y="155" font-family="Georgia,serif" font-size="21" fill="#a63d40">Salida en C₁</text>
<text x="130" y="220" font-family="Georgia,serif" font-size="29" fill="#1f5b9d">2</text>
<text x="475" y="220" font-family="Georgia,serif" font-size="27" fill="#24354b">1</text>
<text x="565" y="220" font-family="Georgia,serif" font-size="27" fill="#24354b">1</text>
<text x="655" y="220" font-family="Georgia,serif" font-size="27" fill="#24354b">1</text>
<text x="770" y="220" font-family="Georgia,serif" font-size="18" fill="#24354b">1</text>
<text x="960" y="220" font-family="Georgia,serif" font-size="29" fill="#a63d40">6</text>
<text x="130" y="285" font-family="Georgia,serif" font-size="29" fill="#1f5b9d">3</text>
<text x="475" y="285" font-family="Georgia,serif" font-size="27" fill="#24354b">0</text>
<text x="565" y="285" font-family="Georgia,serif" font-size="27" fill="#24354b">1</text>
<text x="655" y="285" font-family="Georgia,serif" font-size="27" fill="#24354b">2</text>
<text x="770" y="285" font-family="Georgia,serif" font-size="18" fill="#24354b">t-1</text>
<text x="960" y="285" font-family="Georgia,serif" font-size="29" fill="#a63d40">5</text>
<text x="130" y="350" font-family="Georgia,serif" font-size="29" fill="#1f5b9d">1</text>
<text x="475" y="350" font-family="Georgia,serif" font-size="27" fill="#24354b">0</text>
<text x="565" y="350" font-family="Georgia,serif" font-size="27" fill="#24354b">0</text>
<text x="655" y="350" font-family="Georgia,serif" font-size="27" fill="#24354b">1</text>
<text x="770" y="350" font-family="Georgia,serif" font-size="18" fill="#24354b">(t-1)²</text>
<text x="960" y="350" font-family="Georgia,serif" font-size="29" fill="#a63d40">1</text>
<line x1="230" y1="270" x2="405" y2="270" stroke="#1f5b9d" stroke-width="2"/>
<polygon points="405,270 395.0,266.0 395.0,274.0" fill="#1f5b9d" fill-opacity="1" stroke="#1f5b9d" stroke-width="1"/>
<line x1="820" y1="270" x2="920" y2="270" stroke="#a63d40" stroke-width="2"/>
<polygon points="920,270 910.0,266.0 910.0,274.0" fill="#a63d40" fill-opacity="1" stroke="#a63d40" stroke-width="1"/>
<text x="80" y="435" font-family="Georgia,serif" font-size="22" fill="#24354b">6 = 2 + 3 + 1;   5 = 3 + 2;   1 = 1.</text>
<text x="80" y="490" font-family="Georgia,serif" font-size="25" fill="#24354b">2 + 3t + t² = 6 + 5(t-1) + (t-1)²</text>
<text x="80" y="552" font-family="Georgia,serif" font-size="18" fill="#24354b">Las filas reúnen los aportes a cada potencia del nuevo centro; el polinomio permanece igual.</text>
</svg>