<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">11.3. Factorizar por las direcciones que se anulan</title><desc id="desc">Dos triángulos de funciones comparan la propiedad universal y el primer teorema de isomorfismo. El segundo dirige la aplicación inducida hacia la imagen y no hacia todo el codominio.</desc>
<rect x="0" y="0" width="1200" height="590" fill="white"/>
<text x="30" y="35" font-family="Georgia,serif" font-size="24" fill="#24354b">11.3. Factorizar por las direcciones que se anulan</text>
<text x="50" y="90" font-family="Georgia,serif" font-size="23" fill="#24354b">Propiedad universal</text>
<text x="85" y="180" font-family="Georgia,serif" font-size="29" fill="#24354b">V</text>
<text x="385" y="180" font-family="Georgia,serif" font-size="27" fill="#24354b">W</text>
<text x="75" y="405" font-family="Georgia,serif" font-size="27" fill="#24354b">V/U</text>
<line x1="135" y1="167" x2="355" y2="167" stroke="#1f5b9d" stroke-width="2"/>
<polygon points="355,167 345.0,163.0 345.0,171.0" fill="#1f5b9d" fill-opacity="1" stroke="#1f5b9d" stroke-width="1"/>
<text x="225" y="145" font-family="Georgia,serif" font-size="23" fill="#1f5b9d">T</text>
<line x1="95" y1="215" x2="95" y2="355" stroke="#24354b" stroke-width="2"/>
<polygon points="95,355 99.0,345.0 91.0,345.0" fill="#24354b" fill-opacity="1" stroke="#24354b" stroke-width="1"/>
<text x="115" y="285" font-family="Georgia,serif" font-size="25" fill="#24354b">π</text>
<line x1="155" y1="370" x2="370" y2="210" stroke="#28705b" stroke-width="2"/>
<polygon points="370,210 359.5896247099789,212.76117480810595 364.3657108645406,219.17904057829813" fill="#28705b" fill-opacity="1" stroke="#28705b" stroke-width="1"/>
<text x="240" y="335" font-family="Georgia,serif" font-size="21" fill="#28705b">inducida</text>
<text x="55" y="470" font-family="Georgia,serif" font-size="22" fill="#24354b">U contenido en ker T</text>
<text x="55" y="520" font-family="Georgia,serif" font-size="18" fill="#24354b">Factor único; puede perder información.</text>
<text x="655" y="90" font-family="Georgia,serif" font-size="23" fill="#24354b">Primer isomorfismo</text>
<text x="690" y="180" font-family="Georgia,serif" font-size="29" fill="#24354b">V</text>
<text x="990" y="180" font-family="Georgia,serif" font-size="27" fill="#24354b">im T</text>
<text x="680" y="405" font-family="Georgia,serif" font-size="27" fill="#24354b">V/K</text>
<line x1="740" y1="167" x2="960" y2="167" stroke="#1f5b9d" stroke-width="2"/>
<polygon points="960,167 950.0,163.0 950.0,171.0" fill="#1f5b9d" fill-opacity="1" stroke="#1f5b9d" stroke-width="1"/>
<text x="830" y="145" font-family="Georgia,serif" font-size="23" fill="#1f5b9d">T</text>
<line x1="700" y1="215" x2="700" y2="355" stroke="#24354b" stroke-width="2"/>
<polygon points="700,355 704.0,345.0 696.0,345.0" fill="#24354b" fill-opacity="1" stroke="#24354b" stroke-width="1"/>
<text x="720" y="285" font-family="Georgia,serif" font-size="25" fill="#24354b">π</text>
<line x1="760" y1="370" x2="975" y2="210" stroke="#28705b" stroke-width="2"/>
<polygon points="975,210 964.5896247099789,212.76117480810595 969.3657108645406,219.17904057829813" fill="#28705b" fill-opacity="1" stroke="#28705b" stroke-width="1"/>
<text x="845" y="335" font-family="Georgia,serif" font-size="21" fill="#28705b">inducida</text>
<text x="660" y="470" font-family="Georgia,serif" font-size="22" fill="#24354b">K = ker T</text>
<text x="660" y="520" font-family="Georgia,serif" font-size="18" fill="#24354b">La inducida es biyectiva.</text>
<text x="55" y="565" font-family="Georgia,serif" font-size="18" fill="#24354b">En ambos diagramas, los dos recorridos desde V tienen exactamente el mismo valor.</text>
</svg>