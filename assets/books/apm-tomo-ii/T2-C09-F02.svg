<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc">
<title id="title">9.2. Extender una base del núcleo</title><desc id="desc">Una base del dominio adaptada al núcleo separa los vectores que desaparecen de aquellos cuyas imágenes forman una base de la imagen.</desc>
<rect x="0" y="0" width="1160" height="590" fill="white"/>
<text x="30" y="35" font-family="Georgia,serif" font-size="24" fill="#24354b">9.2. Extender una base del núcleo</text>
<text x="70" y="95" font-family="Georgia,serif" font-size="23" fill="#24354b">Base del dominio, dimensión 3</text>
<text x="740" y="95" font-family="Georgia,serif" font-size="23" fill="#24354b">Imágenes bajo T</text>
<text x="90" y="180" font-family="Georgia,serif" font-size="25" fill="#a63d40">u = (1, -1, 0)</text>
<line x1="445" y1="172" x2="700" y2="172" stroke="#a63d40" stroke-width="2"/>
<polygon points="700,172 690.0,168.0 690.0,176.0" fill="#a63d40" fill-opacity="1" stroke="#a63d40" stroke-width="1"/>
<text x="760" y="180" font-family="Georgia,serif" font-size="25" fill="#a63d40">0</text>
<text x="90" y="290" font-family="Georgia,serif" font-size="25" fill="#1f5b9d">v₁ = (1, 0, 0)</text>
<line x1="445" y1="282" x2="700" y2="282" stroke="#1f5b9d" stroke-width="2"/>
<polygon points="700,282 690.0,278.0 690.0,286.0" fill="#1f5b9d" fill-opacity="1" stroke="#1f5b9d" stroke-width="1"/>
<text x="760" y="290" font-family="Georgia,serif" font-size="25" fill="#1f5b9d">(1, 0)</text>
<text x="90" y="400" font-family="Georgia,serif" font-size="25" fill="#1f5b9d">v₂ = (0, 0, 1)</text>
<line x1="445" y1="392" x2="700" y2="392" stroke="#1f5b9d" stroke-width="2"/>
<polygon points="700,392 690.0,388.0 690.0,396.0" fill="#1f5b9d" fill-opacity="1" stroke="#1f5b9d" stroke-width="1"/>
<text x="760" y="400" font-family="Georgia,serif" font-size="25" fill="#1f5b9d">(0, 1)</text>
<line x1="55" y1="225" x2="1070" y2="225" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="80" y="147" font-family="Georgia,serif" font-size="18" fill="#a63d40">Base del núcleo</text>
<text x="80" y="255" font-family="Georgia,serif" font-size="18" fill="#1f5b9d">Vectores añadidos a esa base</text>
<text x="730" y="465" font-family="Georgia,serif" font-size="21" fill="#1f5b9d">Base de la imagen</text>
<text x="80" y="500" font-family="Georgia,serif" font-size="26" fill="#24354b">dim V = dim ker T + dim im T</text>
<text x="80" y="550" font-family="Georgia,serif" font-size="19" fill="#24354b">3 = 1 + 2. Las flechas expresan la acción de T, sin representar vectores a escala.</text>
</svg>