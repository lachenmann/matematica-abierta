<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 545" role="img" aria-labelledby="title desc"><title id="title">Intersección de dos planos</title><desc id="desc">Parches proyectados de x+y+z=3 y x-y=1, con recta común (2-t,1-t,2t). La ventana no representa la extensión infinita.</desc><rect width="680" height="545" fill="white"/><g font-family="Georgia,serif"><text x="30.00" y="35.00" font-size="22" text-anchor="start" fill="#1e293b">Dos ecuaciones, una recta común</text><polygon points="276.00,100.00 204.00,260.00 384.00,360.00 456.00,200.00" fill="#1f5a99" fill-opacity=".16" stroke="#1f5a99" stroke-width="2"/><polygon points="276.00,200.00 204.00,360.00 384.00,260.00 456.00,100.00" fill="#a53535" fill-opacity=".16" stroke="#a53535" stroke-width="2"/><line x1="380.40" y1="118.00" x2="279.60" y2="342.00" stroke="#276b4b" stroke-width="4"/><circle cx="330.0" cy="230.0" r="4.5" fill="#111827"/><text x="342.00" y="222.00" font-size="16" text-anchor="start" fill="#1e293b">(2, 1, 0)</text><text x="35.00" y="420.00" font-size="18" text-anchor="start" fill="#1f5a99">Plano A: x + y + z = 3</text><text x="35.00" y="451.00" font-size="18" text-anchor="start" fill="#a53535">Plano B: x − y = 1</text><text x="35.00" y="482.00" font-size="18" text-anchor="start" fill="#276b4b">Recta: (2 − t, 1 − t, 2t)</text><text x="35.00" y="515.00" font-size="15" text-anchor="start" fill="#1e293b">Proyección paralela: conserva incidencias, no ángulos.</text></g></svg>
