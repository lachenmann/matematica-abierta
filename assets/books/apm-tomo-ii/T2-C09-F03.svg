<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc">
<title id="title">9.3. Pivotes y compatibilidad</title><desc id="desc">La reducción de la matriz ampliada deja una última ecuación 0=c-a-b; la matriz de coeficientes siempre tiene dos pivotes y dos variables libres.</desc>
<rect x="0" y="0" width="1160" height="590" fill="white"/>
<text x="30" y="35" font-family="Georgia,serif" font-size="24" fill="#24354b">9.3. Pivotes y compatibilidad</text>
<text x="60" y="95" font-family="Georgia,serif" font-size="23" fill="#24354b">Sistema con término independiente (a, b, c)</text>
<text x="90" y="150" font-family="Georgia,serif" font-size="22" fill="#24354b">x₁ + x₃ + 2x₄ = a</text>
<text x="90" y="190" font-family="Georgia,serif" font-size="22" fill="#24354b">x₂ + x₃ - x₄ = b</text>
<text x="90" y="230" font-family="Georgia,serif" font-size="22" fill="#24354b">x₁ + x₂ + 2x₃ + x₄ = c</text>
<line x1="445" y1="180" x2="585" y2="180" stroke="#24354b" stroke-width="2"/>
<polygon points="585,180 575.0,176.0 575.0,184.0" fill="#24354b" fill-opacity="1" stroke="#24354b" stroke-width="1"/>
<text x="460" y="150" font-family="Georgia,serif" font-size="18" fill="#24354b">Gauss</text>
<text x="645" y="125" font-family="Georgia,serif" font-size="18" fill="#24354b">x₁</text>
<text x="720" y="125" font-family="Georgia,serif" font-size="18" fill="#24354b">x₂</text>
<text x="795" y="125" font-family="Georgia,serif" font-size="18" fill="#24354b">x₃</text>
<text x="870" y="125" font-family="Georgia,serif" font-size="18" fill="#24354b">x₄</text>
<text x="995" y="125" font-family="Georgia,serif" font-size="18" fill="#24354b">término</text>
<text x="650" y="180" font-family="Georgia,serif" font-size="23" fill="#24354b">1</text>
<text x="725" y="180" font-family="Georgia,serif" font-size="23" fill="#24354b">0</text>
<text x="800" y="180" font-family="Georgia,serif" font-size="23" fill="#24354b">1</text>
<text x="875" y="180" font-family="Georgia,serif" font-size="23" fill="#24354b">2</text>
<text x="1000" y="180" font-family="Georgia,serif" font-size="23" fill="#24354b">a</text>
<text x="650" y="235" font-family="Georgia,serif" font-size="23" fill="#24354b">0</text>
<text x="725" y="235" font-family="Georgia,serif" font-size="23" fill="#24354b">1</text>
<text x="800" y="235" font-family="Georgia,serif" font-size="23" fill="#24354b">1</text>
<text x="875" y="235" font-family="Georgia,serif" font-size="23" fill="#24354b">-1</text>
<text x="1000" y="235" font-family="Georgia,serif" font-size="23" fill="#24354b">b</text>
<text x="650" y="290" font-family="Georgia,serif" font-size="23" fill="#24354b">0</text>
<text x="725" y="290" font-family="Georgia,serif" font-size="23" fill="#24354b">0</text>
<text x="800" y="290" font-family="Georgia,serif" font-size="23" fill="#24354b">0</text>
<text x="875" y="290" font-family="Georgia,serif" font-size="23" fill="#24354b">0</text>
<text x="1000" y="290" font-family="Georgia,serif" font-size="23" fill="#a63d40">c-a-b</text>
<line x1="935" y1="140" x2="935" y2="305" stroke="#24354b" stroke-width="2"/>
<circle cx="640" cy="160" r="3" fill="#1f5b9d"/>
<circle cx="715" cy="215" r="3" fill="#1f5b9d"/>
<text x="60" y="350" font-family="Georgia,serif" font-size="22" fill="#24354b">Pivotes de A: columnas 1 y 2. Variables libres: x₃ y x₄.</text>
<text x="60" y="410" font-family="Georgia,serif" font-size="22" fill="#1f5b9d">c = a+b: compatible; nulidad 2, dos parámetros.</text>
<text x="60" y="465" font-family="Georgia,serif" font-size="22" fill="#a63d40">c ≠ a+b: aparece 0 = c-a-b ≠ 0; no hay solución.</text>
<text x="60" y="535" font-family="Georgia,serif" font-size="18" fill="#24354b">El rango de A es 2 en ambos casos; el rango ampliado aumenta a 3 sólo si hay contradicción.</text>
</svg>