<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>Cada pareja es independiente; la terna no lo es</title><rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
<text x="35" y="45" font-family="Georgia,serif" font-size="26" fill="#182c3b" text-anchor="start">Cada pareja es independiente; la relación necesita los tres vectores</text>
<line x1="167.0" y1="450" x2="545" y2="450" stroke="#929aa3" stroke-width="1"/>
<polygon points="545,450 534.0,446.0 534.0,454.0" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<line x1="230" y1="492.0" x2="230" y2="135" stroke="#929aa3" stroke-width="1"/>
<polygon points="230,135 226.0,146.0 234.0,146.0" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<line x1="230" y1="450" x2="440" y2="450" stroke="#245b89" stroke-width="3"/>
<polygon points="440,450 429.0,446.0 429.0,454.0" fill="#245b89" fill-opacity="1" stroke="#245b89" stroke-width="1"/>
<line x1="230" y1="450" x2="230" y2="240" stroke="#a7333f" stroke-width="3"/>
<polygon points="230,240 226.0,251.0 234.0,251.0" fill="#a7333f" fill-opacity="1" stroke="#a7333f" stroke-width="1"/>
<line x1="230" y1="450" x2="440" y2="240" stroke="#287a57" stroke-width="3"/>
<polygon points="440,240 429.39339828220176,244.94974746830584 435.0502525316942,250.6066017177982" fill="#287a57" fill-opacity="1" stroke="#287a57" stroke-width="1"/>
<line x1="440" y1="450" x2="440" y2="240" stroke="#929aa3" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="230" y1="240" x2="440" y2="240" stroke="#929aa3" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="230" cy="450" r="5" fill="#182c3b"/>
<text x="452" y="475" font-family="Georgia,serif" font-size="20" fill="#245b89" text-anchor="start">u = (2, 0)</text>
<text x="218" y="225" font-family="Georgia,serif" font-size="20" fill="#a7333f" text-anchor="end">v = (0, 2)</text>
<text x="452" y="228" font-family="Georgia,serif" font-size="20" fill="#287a57" text-anchor="start">w = (2, 2)</text>
<text x="680" y="160" font-family="Georgia,serif" font-size="21" fill="#182c3b" text-anchor="start">Ninguna pareja es proporcional.</text>
<text x="680" y="242" font-family="Georgia,serif" font-size="22" fill="#182c3b" text-anchor="start">La terna satisface:</text>
<text x="680" y="294" font-family="Georgia,serif" font-size="28" fill="#287a57" text-anchor="start">u + v − w = 0</text>
<text x="680" y="380" font-family="Georgia,serif" font-size="21" fill="#182c3b" text-anchor="start">Tres posiciones, una relación</text>
<text x="680" y="417" font-family="Georgia,serif" font-size="21" fill="#182c3b" text-anchor="start">de coeficientes (1, 1, −1).</text>
<text x="35" y="580" font-family="Georgia,serif" font-size="19" fill="#182c3b" text-anchor="start">Dibujo en R² con igual escala en ambos ejes. La independencia por parejas no basta para la terna.</text>
</svg>
