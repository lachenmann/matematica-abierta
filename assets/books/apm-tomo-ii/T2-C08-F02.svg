<text x="382.0" y="154.0" font-family="Georgia,serif" font-size="19" fill="#28705b">C = span(1, 1)</text>
<text x="700" y="145" font-family="Georgia,serif" font-size="23" fill="#24354b">P(x, y) = (x − y, 0)</text>
<text x="700" y="210" font-family="Georgia,serif" font-size="20" fill="#24354b">P(3, 2) = (1, 0)</text>
<text x="700" y="260" font-family="Georgia,serif" font-size="20" fill="#24354b">P(2, 1) = (1, 0)</text>
<text x="700" y="310" font-family="Georgia,serif" font-size="20" fill="#24354b">P(2, 0) = (2, 0)</text>
<text x="700" y="360" font-family="Georgia,serif" font-size="20" fill="#24354b">P² = P</text>
<text x="70" y="548" font-family="Georgia,serif" font-size="18" fill="#24354b">Las direcciones descartadas son paralelas a C; no se exige perpendicularidad.</text>
