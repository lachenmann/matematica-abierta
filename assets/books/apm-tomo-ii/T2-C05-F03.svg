<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>Dos planos y su suma</title><rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
<text x="35" y="45" font-family="Georgia,serif" font-size="27" fill="#182c3b" text-anchor="start">U = {(x, y, 0)}, W = {(0, y, z)}; U + W = R³</text>
<polygon points="177,446 462,446 576,338 291,338" fill="#245b89" fill-opacity="0.13" stroke="#245b89" stroke-width="1"/>
<polygon points="272,536 386,428 386,158 272,266" fill="#a7333f" fill-opacity="0.13" stroke="#a7333f" stroke-width="1"/>
<line x1="310" y1="410" x2="538.0" y2="410" stroke="#929aa3" stroke-width="1"/>
<polygon points="538.0,410 527.0,406.0 527.0,414.0" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<text x="545.0" y="418" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">x</text>
<line x1="310" y1="410" x2="416.4" y2="309.2" stroke="#929aa3" stroke-width="1"/>
<polygon points="416.4,309.2 405.6635418853927,313.8613803913953 411.165499068679,319.66900186264195" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<text x="423.4" y="317.2" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">y</text>
<line x1="310" y1="410" x2="310" y2="158.00000000000003" stroke="#929aa3" stroke-width="1"/>
<polygon points="310,158.00000000000003 306.0,169.00000000000003 314.0,169.00000000000003" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<text x="317" y="166.00000000000003" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">z</text>
<line x1="272" y1="446" x2="401.2" y2="323.6" stroke="#287a57" stroke-width="5"/>
<line x1="310" y1="410" x2="443" y2="374" stroke="#245b89" stroke-width="3"/>
<polygon points="443,374 431.33699193275083,373.01296260289615 433.4271887736767,380.7350787096498" fill="#245b89" fill-opacity="1" stroke="#245b89" stroke-width="1"/>
<line x1="443" y1="374" x2="443" y2="284" stroke="#a7333f" stroke-width="3"/>
<polygon points="443,284 439.0,295.0 447.0,295.0" fill="#a7333f" fill-opacity="1" stroke="#a7333f" stroke-width="1"/>
<circle cx="443" cy="284" r="5" fill="#182c3b"/>
<text x="453" y="397" font-family="Georgia,serif" font-size="18" fill="#245b89" text-anchor="start">(1, 1, 0)</text>
<text x="453" y="275" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">(1, 1, 1)</text>
<text x="660" y="162" font-family="Georgia,serif" font-size="23" fill="#287a57" text-anchor="start">Intersección = {(0, y, 0)}</text>
<text x="660" y="245" font-family="Georgia,serif" font-size="21" fill="#182c3b" text-anchor="start">(a, b, c) = (a, b, 0) + (0, 0, c)</text>
<text x="660" y="302" font-family="Georgia,serif" font-size="19" fill="#245b89" text-anchor="start">La primera parte pertenece a U;</text>
<text x="660" y="336" font-family="Georgia,serif" font-size="19" fill="#a7333f" text-anchor="start">la segunda pertenece a W.</text>
<text x="660" y="420" font-family="Georgia,serif" font-size="19" fill="#182c3b" text-anchor="start">Las descomposiciones pueden variar:</text>
<text x="660" y="456" font-family="Georgia,serif" font-size="22" fill="#182c3b" text-anchor="start">(a, t, 0) + (0, b − t, c)</text>
<text x="35" y="580" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">Porciones de planos en proyección oblicua. La recta verde es la intersección en R³.</text>
</svg>
