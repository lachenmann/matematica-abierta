<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">10.2. Seguir la dirección de las coordenadas</title><desc id="desc">Un triángulo de rutas conecta el vector v con sus dos columnas de coordenadas. Reconstruir desde B y leer en C coincide con multiplicar por P de B a C.</desc>
<rect x="0" y="0" width="1200" height="590" fill="white"/>
<text x="30" y="35" font-family="Georgia,serif" font-size="24" fill="#24354b">10.2. Seguir la dirección de las coordenadas</text>
<text x="430" y="110" font-family="Georgia,serif" font-size="25" fill="#24354b">v = (4,2), en V</text>
<text x="90" y="355" font-family="Georgia,serif" font-size="25" fill="#1f5b9d">[v]B = (3,1)</text>
<text x="790" y="355" font-family="Georgia,serif" font-size="25" fill="#a63d40">[v]C = (2,2)</text>
<line x1="270" y1="310" x2="480" y2="140" stroke="#1f5b9d" stroke-width="2"/>
<polygon points="480,140 469.71075837825333,143.18300280384972 474.744344207597,149.4009617695096" fill="#1f5b9d" fill-opacity="1" stroke="#1f5b9d" stroke-width="1"/>
<text x="205" y="195" font-family="Georgia,serif" font-size="19" fill="#1f5b9d">sB: reconstruir</text>
<line x1="690" y1="140" x2="910" y2="310" stroke="#a63d40" stroke-width="2"/>
<polygon points="910,310 904.5329399903814,300.7203849836737 899.6413599817753,307.05066499481103" fill="#a63d40" fill-opacity="1" stroke="#a63d40" stroke-width="1"/>
<text x="800" y="195" font-family="Georgia,serif" font-size="19" fill="#a63d40">cC: leer en C</text>
<line x1="370" y1="350" x2="740" y2="350" stroke="#24354b" stroke-width="3"/>
<polygon points="740,350 730.0,346.0 730.0,354.0" fill="#24354b" fill-opacity="1" stroke="#24354b" stroke-width="1"/>
<text x="445" y="324" font-family="Georgia,serif" font-size="21" fill="#24354b">P de B hacia C</text>
<line x1="740" y1="415" x2="370" y2="415" stroke="#9aa5b1" stroke-width="2"/>
<polygon points="370,415 380.0,419.0 380.0,411.0" fill="#9aa5b1" fill-opacity="1" stroke="#9aa5b1" stroke-width="1"/>
<text x="430" y="450" font-family="Georgia,serif" font-size="20" fill="#24354b">Vuelta: inversa de P</text>
<text x="90" y="515" font-family="Georgia,serif" font-size="22" fill="#24354b">P, filas: (0,2), (1,-1). Columnas: [b₁]C y [b₂]C.</text>
<text x="90" y="560" font-family="Georgia,serif" font-size="19" fill="#24354b">cC(sB(x)) = Px para toda columna x: los dos recorridos coinciden.</text>
</svg>