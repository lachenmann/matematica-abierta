<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc"><title id="title">Intersecciones por parejas sin intersección común</title><desc id="desc">Sección z=0 de x=0, y=0 y x+y=1. Las parejas se cortan en (0,0), (0,1) y (1,0); cada punto prolonga una recta paralela al eje z. Ningún punto pertenece a las tres. Escala igual en x e y.</desc><rect width="760" height="620" fill="white"/><g font-family="Georgia,serif"><text x="380" y="35" font-size="23" text-anchor="middle" fill="#172c40">Tres planos vistos en z = 0</text><line x1="206.00" y1="517.00" x2="206.00" y2="85.00" stroke="#e3e8ef" stroke-width="1"/><line x1="110.00" y1="421.00" x2="542.00" y2="421.00" stroke="#e3e8ef" stroke-width="1"/><line x1="326.00" y1="517.00" x2="326.00" y2="85.00" stroke="#e3e8ef" stroke-width="1"/><line x1="110.00" y1="301.00" x2="542.00" y2="301.00" stroke="#e3e8ef" stroke-width="1"/><line x1="446.00" y1="517.00" x2="446.00" y2="85.00" stroke="#e3e8ef" stroke-width="1"/><line x1="110.00" y1="181.00" x2="542.00" y2="181.00" stroke="#e3e8ef" stroke-width="1"/><line x1="206.00" y1="517.00" x2="206.00" y2="85.00" stroke="#1f5a99" stroke-width="3"/><line x1="110.00" y1="421.00" x2="542.00" y2="421.00" stroke="#a53535" stroke-width="3" stroke-dasharray="8 5"/><line x1="110.00" y1="85.00" x2="542.00" y2="517.00" stroke="#276b4b" stroke-width="3" stroke-dasharray="3 5"/><circle cx="206.00" cy="421.00" r="5" fill="#111827"/><text x="220.0" y="447.0" font-size="17" text-anchor="start" fill="#172c40">(0, 0)</text><circle cx="206.00" cy="181.00" r="5" fill="#111827"/><text x="220.0" y="168.99999999999997" font-size="17" text-anchor="start" fill="#172c40">(0, 1)</text><circle cx="446.00" cy="421.00" r="5" fill="#111827"/><text x="460.0" y="405.0" font-size="17" text-anchor="start" fill="#172c40">(1, 0)</text><text x="554" y="427" font-size="18" text-anchor="start" fill="#172c40">x</text><text x="215" y="70" font-size="18" text-anchor="start" fill="#172c40">y</text><text x="575" y="180" font-size="18" text-anchor="start" fill="#1f5a99">x = 0</text><text x="575" y="218" font-size="18" text-anchor="start" fill="#a53535">y = 0</text><text x="575" y="256" font-size="18" text-anchor="start" fill="#276b4b">x + y = 1</text><text x="35" y="562" font-size="16" text-anchor="start" fill="#172c40">Cada punto marcado representa una recta paralela al eje z.</text><text x="35" y="592" font-size="16" text-anchor="start" fill="#172c40">Las tres rectas de esta sección no comparten ningún punto.</text></g></svg>
