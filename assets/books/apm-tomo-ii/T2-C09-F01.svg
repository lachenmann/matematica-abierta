<text x="710" y="460" font-family="Georgia,serif" font-size="19" fill="#a63d40">T(t, -t, 0) = (0, 0)</text>
<text x="710" y="500" font-family="Georgia,serif" font-size="19" fill="#1f5b9d">T(2+t, -t, 1) = (2, 1)</text>
<text x="50" y="558" font-family="Georgia,serif" font-size="17" fill="#24354b">Cada punto dibujado sobre una misma recta tiene la misma salida; las dos rectas son paralelas.</text>
