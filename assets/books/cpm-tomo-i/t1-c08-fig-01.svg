<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490"><title>Regla de la cadena: multiplicar cambios locales</title><rect width="800" height="490" fill="white"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="25" fill="#243746" text-anchor="start">Regla de la cadena: multiplicar cambios locales</text><rect x="55" y="180" width="150" height="95" fill="#243746" fill-opacity=".2" stroke="#243746"/><text x="130" y="236" font-size="24" fill="#243746" text-anchor="middle">x = 1</text><rect x="320" y="180" width="160" height="95" fill="#176b91" fill-opacity=".2" stroke="#176b91"/><text x="400" y="236" font-size="24" fill="#176b91" text-anchor="middle">u = x²</text><rect x="595" y="180" width="155" height="95" fill="#287c66" fill-opacity=".2" stroke="#287c66"/><text x="672.5" y="236" font-size="24" fill="#287c66" text-anchor="middle">v = u³</text><line x1="205" y1="227" x2="310" y2="227" stroke="#176b91" stroke-width="2" /><text x="257" y="160" font-size="20" fill="#176b91" text-anchor="middle">u′(1) = 2</text><line x1="480" y1="227" x2="585" y2="227" stroke="#287c66" stroke-width="2" /><text x="530" y="160" font-size="20" fill="#287c66" text-anchor="middle">v′(1) = 3</text><text x="400" y="365" font-size="28" fill="#243746" text-anchor="middle">(v ∘ u)′(1) = 3 · 2 = 6</text><text x="32" y="463" font-size="18" fill="#243746" text-anchor="start">La composición v(u(x)) = x⁶ tiene derivada 6 en x = 1.</text></g></svg>