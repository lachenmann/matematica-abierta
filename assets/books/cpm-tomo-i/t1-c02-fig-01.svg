<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490"><title>Valor absoluto: pertenecer a un intervalo</title><rect width="800" height="490" fill="white"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="25" fill="#243746" text-anchor="start">Valor absoluto: pertenecer a un intervalo</text><line x1="85" y1="250" x2="715" y2="250" stroke="#243746" stroke-width="2" /><line x1="400" y1="145" x2="400" y2="265" stroke="#243746" stroke-width="2" stroke-dasharray="5 5"/><line x1="220" y1="250" x2="580" y2="250" stroke="#176b91" stroke-width="2" /><circle cx="220" cy="250" r="5" stroke="#176b91" stroke-width="2" fill="white"/><text x="220" y="290" font-size="22" fill="#243746" text-anchor="middle">a − r</text><circle cx="400" cy="250" r="5" stroke="#176b91" stroke-width="2" fill="#176b91"/><text x="400" y="290" font-size="22" fill="#243746" text-anchor="middle">a</text><circle cx="580" cy="250" r="5" stroke="#176b91" stroke-width="2" fill="white"/><text x="580" y="290" font-size="22" fill="#243746" text-anchor="middle">a + r</text><text x="400" y="115" font-size="29" fill="#176b91" text-anchor="middle">|x − a| &lt; r</text><line x1="220" y1="340" x2="400" y2="340" stroke="#243746" stroke-width="2" /><line x1="400" y1="340" x2="580" y2="340" stroke="#243746" stroke-width="2" /><text x="310" y="370" font-size="20" fill="#243746" text-anchor="middle">distancia r</text><text x="490" y="370" font-size="20" fill="#243746" text-anchor="middle">distancia r</text><text x="32" y="463" font-size="18" fill="#243746" text-anchor="start">La desigualdad estricta excluye los dos extremos.</text></g></svg>