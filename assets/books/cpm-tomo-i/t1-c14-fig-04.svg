<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img"><title>Subdividir una franja conserva su contribución</title><rect width="800" height="490" fill="white"/><g font-family="Arial, sans-serif"><text x="34" y="42" font-size="25" fill="#243746" text-anchor="start">Subdividir una franja conserva su contribución</text><rect x="75" y="135" width="280" height="180" fill="#176b91" fill-opacity=".2" stroke="#176b91" stroke-width="1.5"/><line x1="455" y1="315" x2="735" y2="315" stroke="#243746" stroke-width="2" /><rect x="455" y="135" width="100" height="180" fill="#176b91" fill-opacity=".2" stroke="#176b91" stroke-width="1.5"/><rect x="555" y="135" width="180" height="180" fill="#176b91" fill-opacity=".2" stroke="#176b91" stroke-width="1.5"/><text x="210" y="113" font-size="21" fill="#176b91" text-anchor="middle">Altura c</text><text x="595" y="113" font-size="21" fill="#176b91" text-anchor="middle">La misma altura c</text><text x="210" y="350" font-size="21" fill="#243746" text-anchor="middle">b − a</text><text x="505" y="350" font-size="20" fill="#243746" text-anchor="middle">t − a</text><text x="645" y="350" font-size="20" fill="#243746" text-anchor="middle">b − t</text><text x="75" y="402" font-size="23" fill="#243746" text-anchor="start">c(b − a)</text><text x="455" y="402" font-size="23" fill="#243746" text-anchor="start">c(t − a) + c(b − t)</text><text x="34" y="462" font-size="19" fill="#243746" text-anchor="start">La identidad de anchuras explica la invariancia de la suma.</text></g></svg>