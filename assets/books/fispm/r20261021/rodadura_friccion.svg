</defs><rect width="900" height="100%" fill="white"/>
<text x="40" y="42" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#173b56" text-anchor="start" font-weight="bold">La fricción depende de cómo se impulsa la rueda</text>
<circle cx="235" cy="255" r="90" fill="#eaf4fa" stroke="#173b56" stroke-width="3"/>
<line x1="70" y1="345" x2="400" y2="345" stroke="#173b56" stroke-width="4"/>
<circle cx="665" cy="255" r="90" fill="#eaf4fa" stroke="#173b56" stroke-width="3"/>
<line x1="500" y1="345" x2="830" y2="345" stroke="#173b56" stroke-width="4"/>
<text x="235" y="110" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="middle" font-weight="bold">Fuerza en el centro</text>
<text x="665" y="110" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="middle" font-weight="bold">Torque motor horario</text>
<path d="M235,255 L375,255" stroke="#2379aa" stroke-width="3" fill="none" marker-end="url(#m2379aa)"/>
<text x="340" y="237" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2379aa" text-anchor="start">F</text>
<path d="M235,345 L120,345" stroke="#b74c3c" stroke-width="3" fill="none" marker-end="url(#mb74c3c)"/>
<text x="122" y="383" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#b74c3c" text-anchor="start">f &lt; 0</text>
<path d="M600,235 A70,70 0 1 1 708,310" stroke="#2379aa" stroke-width="3" fill="none" marker-end="url(#m2379aa)"/>
<text x="741" y="242" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2379aa" text-anchor="start">T</text>
<path d="M665,345 L795,345" stroke="#b74c3c" stroke-width="3" fill="none" marker-end="url(#mb74c3c)"/>
<text x="740" y="383" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#b74c3c" text-anchor="start">f &gt; 0</text>
<text x="235" y="442" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#173b56" text-anchor="middle">a = F / [M(1 + β)]</text>
<text x="665" y="442" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#173b56" text-anchor="middle">a = T / [MR(1 + β)]</text>
<text x="40" y="504" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">Se supone rodadura admisible. Se omiten peso y normal compensados.</text>
