<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img"><title>Una aceptación angular selecciona una corona</title><defs>
<marker id="m173b56" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#173b56"/></marker>
<marker id="m2379aa" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2379aa"/></marker>
<marker id="mb74c3c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b74c3c"/></marker>
<marker id="m287c68" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#287c68"/></marker>
</defs><rect width="900" height="100%" fill="white"/>
<text x="40" y="42" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#173b56" text-anchor="start" font-weight="bold">Una aceptación angular selecciona una corona</text>
<circle cx="250" cy="305" r="150" fill="#dceef7" stroke="#173b56" stroke-width="2"/>
<circle cx="250" cy="305" r="86.60254037844388" fill="white" stroke="#173b56" stroke-width="2"/>
<circle cx="250" cy="305" r="4" fill="#173b56" stroke="#173b56" stroke-width="3"/>
<path d="M250,305 L336.6025403784439,305" stroke="#2379aa" stroke-width="2" fill="none" marker-end="url(#m2379aa)"/>
<text x="277" y="289" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2379aa" text-anchor="start">1 m</text>
<line x1="250" y1="305" x2="144" y2="199" stroke="#b74c3c" stroke-width="2"/>
<text x="45" y="143" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#b74c3c" text-anchor="start">b exterior = √3 m</text>
<text x="76" y="508" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">Área = π(3 − 1) = 2π m²</text>
<path d="M420,305 L490,305" stroke="#b74c3c" stroke-width="3" fill="none" marker-end="url(#mb74c3c)"/>
<text x="520" y="192" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">Ventana del detector</text>
<text x="550" y="271" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2379aa" text-anchor="start">60° ≤ χ ≤ 90°</text>
<text x="550" y="324" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#173b56" text-anchor="start">Todo el azimut</text>
<text x="550" y="378" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">a<tspan baseline-shift="sub" font-size="70%">*</tspan> = 1 m</text>
<text x="40" y="567" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#173b56" text-anchor="start">Los radios se invierten: mayor b produce menor χ.</text>
</svg>