<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>Resorte horizontal y tirón constante; la extensión es la coordenada de movimiento.</title><g font-family="DejaVu Sans, sans-serif"><path d="M55,310 L620,310" fill="none" stroke="#637686" stroke-width="4"/><path d="M55,190 L55,310" fill="none" stroke="#637686" stroke-width="5"/><path d="M55,285 L85,285 L85,275 L95,295 L105,275 L115,295 L125,275 L135,295 L145,275 L155,295 L165,275 L175,295 L185,275 L195,295 L205,275 L215,295 L225,275 L235,295 L245,275 L255,285 L275,285" fill="none" stroke="#176c9c" stroke-width="2"/><rect x="275" y="235" width="100" height="70" rx="4" fill="#e4f1f7" stroke="#176c9c" stroke-width="2"/><text x="325" y="275" font-size="18" fill="#176c9c" text-anchor="middle">m = 2 kg</text><path d="M325,250 L510,250" fill="none" stroke="#267b62" stroke-width="2.5"/><polygon points="510,250 501.71045105397405,253.50476508077784 501.71045105397405,246.49523491922216" fill="#267b62"/><text x="455" y="225" font-size="19" fill="#267b62" text-anchor="start">f₀ = 8 N</text><path d="M325,250 L205,250" fill="none" stroke="#b84d3d" stroke-width="2.5"/><polygon points="205,250 213.28954894602597,246.49523491922216 213.28954894602597,253.50476508077784" fill="#b84d3d"/><text x="150" y="220" font-size="19" fill="#b84d3d" text-anchor="start">Fₛ = −kx</text><text x="140" y="345" font-size="19" fill="#176c9c" text-anchor="start">k = 8 N/m</text><path d="M100,400 L580,400" fill="none" stroke="#637686" stroke-width="2.5"/><polygon points="580,400 571.710451053974,403.5047650807779 571.710451053974,396.4952349192221" fill="#637686"/><text x="590" y="406" font-size="18" fill="#637686" text-anchor="start">+x</text><text x="90" y="450" font-size="18" fill="#637686" text-anchor="start">x = 0: longitud natural del resorte</text></g></svg>