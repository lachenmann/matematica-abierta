<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 265" role="img" aria-labelledby="title desc">
<title id="title">El punto que seguimos en el carro</title><desc id="desc">Se marca el frente del carro como origen, la velocidad inicial positiva y la distancia disponible de veinte metros hasta el extremo del riel.</desc>
<rect width="1040" height="265" fill="white"/>
<g font-family="Arial, sans-serif" font-size="17" fill="#192d40">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#225b91"/></marker></defs>
<text x="40" y="30" font-size="22" font-weight="bold">Una posición y una distancia disponibles</text>
<path d="M65,142H950" stroke="#5a6878" stroke-width="5"/>
<rect x="100" y="85" width="100" height="43" rx="5" fill="#d7e7f2" stroke="#225b91" stroke-width="2"/>
<circle cx="120" cy="134" r="9" fill="#5a6878"/><circle cx="180" cy="134" r="9" fill="#5a6878"/>
<path d="M200,66V158" stroke="#225b91" stroke-width="2"/>
<text x="200" y="59" text-anchor="middle">frente del carro</text>
<path d="M235,94H360" stroke="#225b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="290" y="80" text-anchor="middle">v₀ = 8 m/s</text>
<path d="M880,80V158" stroke="#9c4930" stroke-width="3"/>
<text x="880" y="62" text-anchor="middle">extremo</text>
<path d="M200,147v12" stroke="#192d40"/><text x="200" y="183" text-anchor="middle">0</text>
<path d="M370,147v12" stroke="#192d40"/><text x="370" y="183" text-anchor="middle">5</text>
<path d="M540,147v12" stroke="#192d40"/><text x="540" y="183" text-anchor="middle">10</text>
<path d="M710,147v12" stroke="#192d40"/><text x="710" y="183" text-anchor="middle">15</text>
<path d="M880,147v12" stroke="#192d40"/><text x="880" y="183" text-anchor="middle">20</text>
<text x="955" y="183" text-anchor="end">x (m)</text>
<path d="M200,210v10M200,215H880M880,210v10" stroke="#225b91" stroke-width="2" fill="none"/>
<text x="540" y="246" text-anchor="middle">L = 20 m, medidos desde el frente</text>
</g></svg>