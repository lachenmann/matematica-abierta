<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img"><title>Dos etapas de un péndulo balístico</title><rect width="900" height="480" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="45" y="40" font-size="28" fill="#23678e" text-anchor="start">Impacto y subida utilizan balances distintos</text><text x="45" y="105" font-size="25" fill="#23678e" text-anchor="start">Antes</text><text x="340" y="105" font-size="25" fill="#23678e" text-anchor="start">Justo después</text><text x="665" y="105" font-size="25" fill="#23678e" text-anchor="start">Arriba</text><rect x="140" y="255" width="90" height="70" rx="5" fill="#dfedf4" stroke="#23678e" stroke-width="2"/><text x="185" y="298" font-size="21" fill="#23678e" text-anchor="middle">Bloque</text><rect x="425" y="255" width="90" height="70" rx="5" fill="#dfedf4" stroke="#23678e" stroke-width="2"/><text x="470" y="298" font-size="21" fill="#23678e" text-anchor="middle">Bloque</text><rect x="705" y="155" width="90" height="70" rx="5" fill="#dfedf4" stroke="#23678e" stroke-width="2"/><text x="750" y="198" font-size="21" fill="#23678e" text-anchor="middle">Bloque</text><circle cx="65" cy="290" r="10" fill="#b9543a"/><path d="M80 290 L130 290" fill="none" stroke="#b9543a" stroke-width="3"/><path d="M130 290 l-11 -6 l0 12 Z" fill="#b9543a" transform="rotate(0.0 130 290)"/><text x="45" y="255" font-size="25" fill="#687b88" text-anchor="start">u</text><path d="M515 290 L590 290" fill="none" stroke="#23678e" stroke-width="3"/><path d="M590 290 l-11 -6 l0 12 Z" fill="#23678e" transform="rotate(0.0 590 290)"/><text x="535" y="265" font-size="25" fill="#687b88" text-anchor="start">V</text><text x="740" y="145" font-size="22" fill="#22836d" text-anchor="middle">v = 0</text><path d="M805 290 L805 190" fill="none" stroke="#22836d" stroke-width="3"/><text x="825" y="245" font-size="25" fill="#22836d" text-anchor="start">h</text><text x="45" y="385" font-size="23" fill="#23678e" text-anchor="start">Impacto: mu = (m + M)V</text><text x="420" y="430" font-size="23" fill="#22836d" text-anchor="start">Subida: ½(m + M)V² = (m + M)gh</text></g></svg>