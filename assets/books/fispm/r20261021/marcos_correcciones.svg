</defs><rect width="900" height="100%" fill="white"/>
<text x="40" y="42" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#173b56" text-anchor="start" font-weight="bold">Cuatro correcciones y sus preparaciones</text>
<rect x="40" y="95" width="390" height="215" fill="#f6f9fb" stroke="#173b56" stroke-width="2"/>
<rect x="470" y="95" width="390" height="215" fill="#f6f9fb" stroke="#173b56" stroke-width="2"/>
<rect x="40" y="335" width="390" height="215" fill="#f6f9fb" stroke="#173b56" stroke-width="2"/>
<rect x="470" y="335" width="390" height="215" fill="#f6f9fb" stroke="#173b56" stroke-width="2"/>
<text x="60" y="132" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#173b56" text-anchor="start">Traslación</text>
<circle cx="250" cy="218" r="6" fill="#173b56" stroke="#173b56" stroke-width="3"/>
<path d="M250,218 L345,218" stroke="#287c68" stroke-width="3" fill="none" marker-end="url(#m287c68)"/>
<path d="M250,218 L135,218" stroke="#b74c3c" stroke-width="3" fill="none" marker-end="url(#mb74c3c)"/>
<text x="291" y="190" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#287c68" text-anchor="start">A′</text>
<text x="128" y="194" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#b74c3c" text-anchor="start">−A′</text>
<text x="60" y="283" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#173b56" text-anchor="start">El origen acelera hacia +x.</text>
<text x="490" y="132" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#173b56" text-anchor="start">Centrífuga</text>
<circle cx="560" cy="218" r="4" fill="#173b56" stroke="#173b56" stroke-width="3"/>
<line x1="560" y1="218" x2="655" y2="218" stroke="#173b56" stroke-width="2"/>
<circle cx="655" cy="218" r="6" fill="#173b56" stroke="#173b56" stroke-width="3"/>
<path d="M655,218 L780,218" stroke="#b74c3c" stroke-width="3" fill="none" marker-end="url(#mb74c3c)"/>
<text x="560" y="254" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">ρ</text>
<text x="490" y="283" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#b74c3c" text-anchor="start">−ω × (ω × ρ), hacia afuera.</text>
<text x="60" y="373" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#173b56" text-anchor="start">Coriolis</text>
<circle cx="205" cy="435" r="6" fill="#173b56" stroke="#173b56" stroke-width="3"/>
<path d="M205,435 L335,435" stroke="#2379aa" stroke-width="3" fill="none" marker-end="url(#m2379aa)"/>
<path d="M205,435 L205,520" stroke="#b74c3c" stroke-width="3" fill="none" marker-end="url(#mb74c3c)"/>
<text x="267" y="418" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2379aa" text-anchor="start">v relativa</text>
<text x="224" y="503" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#b74c3c" text-anchor="start">−2ω × v</text>
<text x="60" y="541" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#173b56" text-anchor="start">ω hacia +z; v hacia +x.</text>
<text x="490" y="373" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#173b56" text-anchor="start">Euler</text>
<circle cx="560" cy="435" r="4" fill="#173b56" stroke="#173b56" stroke-width="3"/>
<line x1="560" y1="435" x2="655" y2="435" stroke="#173b56" stroke-width="2"/>
<circle cx="655" cy="435" r="6" fill="#173b56" stroke="#173b56" stroke-width="3"/>
<path d="M655,435 L655,520" stroke="#b74c3c" stroke-width="3" fill="none" marker-end="url(#mb74c3c)"/>
<text x="686" y="488" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#b74c3c" text-anchor="start">−ω̇ × ρ</text>
<text x="490" y="541" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#173b56" text-anchor="start">ρ hacia +x; ω̇ hacia +z.</text>
<text x="40" y="602" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">+z sale de la hoja. Se dibujan correcciones por unidad de masa.</text>
</svg>