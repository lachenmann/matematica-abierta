<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">Posición y velocidad durante un frenado</title>
<desc id="desc">El carro comienza a ocho metros por segundo y frena con aceleración de menos dos metros por segundo cuadrado hasta detenerse en cuatro segundos, tras recorrer dieciséis metros. Después se supone reposo. Los trazos discontinuos prolongan la fórmula del primer régimen y producirían un retroceso.</desc>
<rect width="1040" height="450" fill="white"/>
<g font-family="Arial, sans-serif" font-size="17" fill="#182433">
<text x="40" y="32" font-size="22" font-weight="bold">Un frenado termina cuando se alcanza el reposo</text>
