<script>
// Move keyboard focus into the image dialog before hiding the reading page.
(() => {
  let opener = null;
  document.addEventListener('click', (event) => {
    const link = event.target.closest?.('a.lightbox');
    if (!link) return;
    opener = link;
    if (link.contains(document.activeElement)) document.activeElement.blur();
  }, true);
  window.addEventListener('load', () => {
    const gallery = window.lightboxQuarto;
    if (!gallery) return;
    gallery.on('open', () => document.querySelector('.glightbox-container .gclose')?.focus());
    gallery.on('close', () => {
      if (opener?.isConnected) opener.focus({preventScroll: true});
    });
  });
})();
</script>
<script>
// The v04 semantic figures also work without Quarto's implicit-image gallery.
// Keep ordinary SVG links as the fallback when scripting is unavailable.
document.addEventListener('DOMContentLoaded', () => {
  const dialog = document.createElement('dialog');
  if (typeof dialog.showModal !== 'function') return;
  dialog.className = 'fpm-figure-dialog';
  dialog.setAttribute('aria-label', 'Ilustración ampliada');
  const controls = document.createElement('div');
  controls.className = 'fpm-figure-controls';
  const title = document.createElement('strong');
  const original = document.createElement('a');
  original.textContent = 'Abrir imagen';
  original.target = '_blank';
  original.rel = 'noopener';
  const close = document.createElement('button');
  close.type = 'button';
  close.textContent = 'Cerrar ×';
  close.setAttribute('aria-label', 'Cerrar ilustración ampliada');
  close.addEventListener('click', () => dialog.close());
  controls.append(title, original, close);
  const image = document.createElement('img');
  dialog.append(controls, image);
  document.body.append(dialog);
  let opener = null;
  document.addEventListener('click', (event) => {
    const link = event.target.closest?.('figure.fpm-v04-panel a.lightbox');
    if (!link) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const source = link.querySelector('img');
    if (!source) return;
    opener = link;
    image.src = link.href;
    image.alt = source.alt;
    title.textContent = link.closest('figure').querySelector('figcaption strong')?.textContent || 'Ilustración ampliada';
    original.href = link.href;
    dialog.showModal();
    close.focus();
  }, true);
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) dialog.close();
  });
  dialog.addEventListener('close', () => opener?.focus({preventScroll: true}));
});
</script>
