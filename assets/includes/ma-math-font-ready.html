<script id="ma-math-font-ready">
// MathJax must measure the final text font, not a transient system fallback.
// Keep this hook in the canonical document so online and offline use one rule.
window.MathJax = window.MathJax || {};
window.MathJax.startup = window.MathJax.startup || {};
window.MathJax.startup.pageReady = async function () {
  document.body.getBoundingClientRect();
  await document.fonts.ready;
  return MathJax.startup.defaultPageReady();
};
</script>
