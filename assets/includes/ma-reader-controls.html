<script>
(() => {
  'use strict';

  const attach = () => {
    const main = document.querySelector('main.content');
    if (!main || main.querySelector(':scope > .ma-reader-tools')) return;

    const rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    const step = 0.08 * rootPx;
    const min = 0.90 * rootPx;
    const max = 1.50 * rootPx;
    let size = parseFloat(getComputedStyle(main).fontSize) || (1.06 * rootPx);

    const bar = document.createElement('div');
    bar.className = 'ma-reader-tools';
    bar.setAttribute('role', 'group');
    bar.setAttribute('aria-label', 'Tamaño del texto');

    const label = document.createElement('span');
    label.textContent = 'Lectura';
    bar.append(label);

    const apply = next => {
      size = Math.max(min, Math.min(max, next));
      main.style.setProperty('--ma-reader-size', size + 'px');
    };

    const button = (text, name, handler) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = text;
      el.setAttribute('aria-label', name);
      el.addEventListener('click', handler);
      bar.append(el);
    };

    button('A−', 'Reducir tamaño de letra', () => apply(size - step));
    button('A+', 'Aumentar tamaño de letra', () => apply(size + step));
    button('Restablecer', 'Restablecer tamaño de letra', () => {
      main.style.removeProperty('--ma-reader-size');
      size = parseFloat(getComputedStyle(main).fontSize) || (1.06 * rootPx);
    });

    const title = main.querySelector('#title-block-header');
    if (title) title.after(bar);
    else main.prepend(bar);
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach, { once: true });
  } else {
    attach();
  }
})();
</script>

<script>
/* ANM C00: progressive-enhancement link to the original full-size SVG.
   Only published C00 figures are targeted; no SVG or chapter sources change. */
(() => {
  'use strict';

  const attachC00Links = () => {
    const main = document.querySelector('main.content');
    if (!main) return;

    main.querySelectorAll('div[id^="fig-anm-c00-f"]').forEach(container => {
      const match = /^fig-anm-c00-(f\d{2})$/.exec(container.id);
      if (!match || container.querySelector('.ma-anm-c00-fullsize')) return;

      const image = container.querySelector('figure img[src]');
      if (!image) return;
      const src = image.getAttribute('src');
      const expected = '../../assets/books/anm/C00-' + match[1].toUpperCase() + '.svg';
      if (src !== expected) return;

      const access = document.createElement('p');
      access.className = 'ma-anm-c00-fullsize';
      const link = document.createElement('a');
      link.href = src;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'Abrir figura a tamaño natural ↗';
      link.setAttribute('aria-label', 'Abrir figura C00-' + match[1].toUpperCase() +
        ' a tamaño natural en otra pestaña para ampliar');
      link.title = 'Puedes ampliarla con el zoom del navegador';
      access.append(link);
      container.append(access);
    });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachC00Links, { once: true });
  } else {
    attachC00Links();
  }
})();
</script>
