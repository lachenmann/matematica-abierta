<script>
(() => {
  'use strict';

  const CATALOGS = [
    new URL('/teoria/resultados/index.html', window.location.origin),
    new URL('/teoria/metodos/index.html', window.location.origin)
  ];
  const PREVIEW_HASH = /^#(?:res|met|def)-/i;
  const cache = new Map();
  let catalog = new Map();
  let activeLink = null;
  let requestToken = 0;

  const panel = document.createElement('aside');
  panel.className = 'ma-result-preview';
  panel.id = 'ma-result-preview';
  panel.setAttribute('role', 'tooltip');
  panel.hidden = true;
  panel.innerHTML = [
    '<div class="ma-result-preview-kicker"></div>',
    '<div class="ma-result-preview-title"></div>',
    '<div class="ma-result-preview-summary"></div>'
  ].join('');
  document.body.append(panel);

  const kickerEl = panel.querySelector('.ma-result-preview-kicker');
  const titleEl = panel.querySelector('.ma-result-preview-title');
  const summaryEl = panel.querySelector('.ma-result-preview-summary');

  const normalizePath = pathname => pathname
    .replace(/\.(?:md|qmd)$/i, '.html')
    .replace(/\/index\.html$/i, '/');

  const keyFor = (href, base = document.baseURI) => {
    try {
      const url = new URL(href, base);
      if (url.origin !== window.location.origin) return null;
      return normalizePath(url.pathname) + url.hash;
    } catch (_) {
      return null;
    }
  };

  const kindForHash = hash => {
    if (/^#met-/i.test(hash)) return 'method';
    if (/^#def-/i.test(hash)) return 'definition';
    return 'result';
  };

  const labelForKind = kind => ({
    result: 'Resultado',
    method: 'Método',
    definition: 'Definición'
  }[kind] || 'Referencia');

  const cleanText = text => (text || '')
    .replace(/\(\s*MA-[^)]+\)/g, '')
    .replace(/^\s*[—–-]\s*/, '')
    .replace(/\s+/g, ' ')
    .trim();

  const truncate = (text, max = 430) => {
    const clean = cleanText(text);
    if (clean.length <= max) return clean;
    const cut = clean.slice(0, max);
    const lastSpace = cut.lastIndexOf(' ');
    return cut.slice(0, lastSpace > 300 ? lastSpace : max).trimEnd() + '…';
  };

  const readCatalog = async catalogUrl => {
    try {
      const response = await fetch(catalogUrl, { credentials: 'same-origin' });
      if (!response.ok) return [];
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const entries = [];

      doc.querySelectorAll('main.content li').forEach(li => {
        const link = li.querySelector('a[href]');
        if (!link) return;
        const key = keyFor(link.getAttribute('href'), catalogUrl);
        if (!key) return;

        const url = new URL(link.getAttribute('href'), catalogUrl);
        const clone = li.cloneNode(true);
        clone.querySelectorAll('a, code').forEach(el => el.remove());
        const summary = cleanText(clone.textContent);

        entries.push([key, {
          title: cleanText(link.textContent),
          summary,
          kind: kindForHash(url.hash)
        }]);
      });

      return entries;
    } catch (_) {
      return [];
    }
  };

  const loadCatalog = async () => {
    const groups = await Promise.all(CATALOGS.map(readCatalog));
    const next = new Map();

    groups.flat().forEach(([key, value]) => {
      const existing = next.get(key);
      if (!existing || (!existing.summary && value.summary)) next.set(key, value);
    });

    return next;
  };

  const fallbackFromTarget = async url => {
    const cacheKey = normalizePath(url.pathname) + url.hash;
    if (cache.has(cacheKey)) return cache.get(cacheKey);

    const promise = (async () => {
      try {
        let doc;
        if (normalizePath(url.pathname) === normalizePath(window.location.pathname)) {
          doc = document;
        } else {
          const response = await fetch(url.pathname, { credentials: 'same-origin' });
          if (!response.ok) return null;
          doc = new DOMParser().parseFromString(await response.text(), 'text/html');
        }

        const id = decodeURIComponent(url.hash.slice(1));
        const target = doc.getElementById(id);
        if (!target) return null;

        let title = '';
        let text = '';

        if (/^H[1-6]$/.test(target.tagName)) {
          title = cleanText(target.textContent);
          const level = Number(target.tagName.slice(1));
          const parts = [];
          let node = target.nextElementSibling;
          while (node && parts.length < 5) {
            if (/^H[1-6]$/.test(node.tagName) && Number(node.tagName.slice(1)) <= level) break;
            const value = cleanText(node.textContent);
            if (value) parts.push(value);
            node = node.nextElementSibling;
          }
          text = parts.join(' ');
        } else {
          const heading = target.querySelector('h1,h2,h3,h4,h5,h6');
          title = heading ? cleanText(heading.textContent) : '';
          const clone = target.cloneNode(true);
          clone.querySelectorAll('script, style, button, nav').forEach(el => el.remove());
          if (heading) {
            const clonedHeading = clone.querySelector('h1,h2,h3,h4,h5,h6');
            if (clonedHeading) clonedHeading.remove();
          }
          text = cleanText(clone.textContent);
        }

        return {
          title: title || labelForKind(kindForHash(url.hash)),
          summary: truncate(text),
          kind: kindForHash(url.hash)
        };
      } catch (_) {
        return null;
      }
    })();

    cache.set(cacheKey, promise);
    return promise;
  };

  const position = link => {
    if (panel.hidden || !link) return;
    const margin = 12;
    const gap = 10;
    const rect = link.getBoundingClientRect();
    const box = panel.getBoundingClientRect();

    let left = rect.left + (rect.width / 2) - (box.width / 2);
    left = Math.max(margin, Math.min(left, window.innerWidth - box.width - margin));

    let top = rect.bottom + gap;
    if (top + box.height > window.innerHeight - margin) {
      const above = rect.top - box.height - gap;
      if (above >= margin) top = above;
    }

    panel.style.left = Math.round(left) + 'px';
    panel.style.top = Math.round(top) + 'px';
  };

  const hide = () => {
    requestToken += 1;
    if (activeLink) activeLink.removeAttribute('aria-describedby');
    activeLink = null;
    panel.hidden = true;
  };

  const show = async link => {
    const url = new URL(link.href, document.baseURI);
    const token = ++requestToken;
    const key = keyFor(url.href);
    let item = key ? catalog.get(key) : null;

    if ((!item || !item.summary) && PREVIEW_HASH.test(url.hash)) {
      item = await fallbackFromTarget(url);
    }

    if (token !== requestToken || !item || !item.summary) return;

    const kind = item.kind || kindForHash(url.hash);
    activeLink = link;
    panel.dataset.kind = kind;
    kickerEl.textContent = labelForKind(kind);
    titleEl.textContent = item.title || cleanText(link.textContent) || labelForKind(kind);
    summaryEl.textContent = truncate(item.summary);
    link.dataset.maPreviewKind = kind;
    link.setAttribute('aria-describedby', panel.id);
    panel.hidden = false;
    requestAnimationFrame(() => position(link));
  };

  const attachLink = link => {
    if (link.dataset.maResultPreview === '1') return;
    const url = new URL(link.href, document.baseURI);
    const key = keyFor(url.href);
    if (!key) return;

    const isCandidate = catalog.has(key) || PREVIEW_HASH.test(url.hash);
    if (!isCandidate) return;

    const kind = catalog.get(key)?.kind || kindForHash(url.hash);
    link.dataset.maResultPreview = '1';
    link.dataset.maPreviewKind = kind;
    link.classList.add('ma-result-link');

    link.addEventListener('mouseenter', () => show(link));
    link.addEventListener('mouseleave', () => {
      if (document.activeElement !== link) hide();
    });
    link.addEventListener('focus', () => show(link));
    link.addEventListener('blur', hide);
  };

  const attach = async () => {
    catalog = await loadCatalog();
    document.querySelectorAll('main.content a[href]').forEach(attachLink);

    window.addEventListener('scroll', () => position(activeLink), { passive: true });
    window.addEventListener('resize', () => position(activeLink), { passive: true });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') hide();
    });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach, { once: true });
  } else {
    attach();
  }
})();
</script>
