<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
<title id="t">Sistema arquimediano frente a un sistema con infinitesimales</title>
<desc id="d">Esquema conceptual, no a escala. A la izquierda, múltiplos de una cantidad positiva terminan superando el umbral b. A la derecha, un infinitesimal epsilon tiene todos sus múltiplos naturales todavía por debajo de 1.</desc>
<rect width="1200" height="540" rx="24" fill="#f7f7f5"/>
<text x="600" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202124">¿Qué cambia cuando falla la propiedad?</text>
<rect x="445" y="70" width="310" height="32" rx="16" fill="#eef0f2" stroke="#c5c9cf"/>
<text x="600" y="92" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#5f6368">ESQUEMA CONCEPTUAL · NO A ESCALA</text>
<line x1="600" y1="120" x2="600" y2="488" stroke="#d1d5db" stroke-width="2"/>

<text x="300" y="143" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#1f5f3f">Sistema arquimediano</text>
<text x="300" y="173" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#4b5563">Para a &gt; 0 y b &gt; 0, algún na supera b.</text>
<text x="900" y="143" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#7a3d3d">Sistema no arquimediano</text>
<text x="900" y="173" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#4b5563">Puede existir ε &gt; 0 con nε &lt; 1 para todo n ≥ 1.</text>

<!-- Panel izquierdo: escala ordinaria -->
<line x1="90" y1="335" x2="530" y2="335" stroke="#374151" stroke-width="4"/>
<polygon points="530,335 508,324 508,346" fill="#374151"/>
<line x1="430" y1="225" x2="430" y2="392" stroke="#b3261e" stroke-width="4" stroke-dasharray="9 7"/>
<text x="430" y="209" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#b3261e">b</text>
<g fill="#0f9d58"><circle cx="155" cy="335" r="8"/><circle cx="220" cy="335" r="8"/><circle cx="285" cy="335" r="8"/><circle cx="350" cy="335" r="8"/><circle cx="415" cy="335" r="8"/><circle cx="480" cy="335" r="10"/></g>
<text x="155" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f5f3f">a</text>
<text x="220" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f5f3f">2a</text>
<text x="285" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f5f3f">3a</text>
<text x="480" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1f5f3f">na &gt; b</text>
<path d="M125 415 Q300 475 485 415" fill="none" stroke="#0f9d58" stroke-width="3"/>
<text x="305" y="466" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1f5f3f">algún múltiplo cruza el umbral</text>

<!-- Panel derecho: sólo se codifica el orden relativo -->
<line x1="675" y1="335" x2="1115" y2="335" stroke="#374151" stroke-width="4"/>
<polygon points="1115,335 1093,324 1093,346" fill="#374151"/>
<line x1="1030" y1="225" x2="1030" y2="392" stroke="#b3261e" stroke-width="4" stroke-dasharray="9 7"/>
<text x="1030" y="209" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#b3261e">1</text>
<g fill="#8456a8"><circle cx="725" cy="335" r="7"/><circle cx="775" cy="335" r="7"/><circle cx="825" cy="335" r="7"/><circle cx="955" cy="335" r="9"/></g>
<text x="725" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6a4388">ε</text>
<text x="775" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6a4388">2ε</text>
<text x="825" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6a4388">3ε</text>
<text x="888" y="342" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#6a4388">…</text>
<text x="955" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#6a4388">nε</text>
<text x="880" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#6a4388">ε, 2ε, 3ε, …, nε &lt; 1</text>
<path d="M705 425 Q860 480 1000 425" fill="none" stroke="#8456a8" stroke-width="3"/>
<text x="855" y="477" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#6a4388">ningún múltiplo natural alcanza 1</text>
<text x="900" y="510" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6b7280">La posición horizontal codifica orden, no distancia numérica.</text>
</svg>