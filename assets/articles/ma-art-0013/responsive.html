<style>
main.content:has(#seccion-01) { min-width: 0; overflow-x: clip; }
main.content:has(#seccion-01) .ma-jones-scroll {
  max-width: 100%; overflow-x: auto; margin-block: 1rem;
  -webkit-overflow-scrolling: touch;
}
main.content:has(#seccion-01) .ma-jones-scroll table { margin-bottom: .5rem; }
main.content:has(#seccion-01) .math.display { padding: .5em .25em; }
main.content:has(#seccion-01) .math.display mjx-container[display="true"] { margin: .5em 0 !important; }
main.content:has(#seccion-01) pre { max-width: 100%; overflow-x: auto; }
.ma-jones-scroll-hint { font-size: .85rem; opacity: .8; margin: .25rem 0; }
@media (max-width: 767.98px) {
  main.content:has(#seccion-01) .ma-jones-scroll table { font-size: .85rem; }
}
</style>
<script>
(function () {
  async function prepareJones() {
    if (!document.getElementById('seccion-01')) return;
    for (const table of document.querySelectorAll('main table')) {
      const wrap = document.createElement('div');
      wrap.className = 'table-responsive ma-jones-scroll';
      wrap.tabIndex = 0; wrap.setAttribute('role', 'region');
      wrap.setAttribute('aria-label', 'Tabla desplazable horizontalmente');
      table.before(wrap); wrap.append(table);
    }
    function hints() {
      for (const block of document.querySelectorAll('main .ma-jones-scroll, main .math.display, main pre')) {
        let hint = block.previousElementSibling;
        const overflow = block.scrollWidth > block.clientWidth + 2;
        if (overflow && !hint?.classList.contains('ma-jones-scroll-hint')) {
          hint = document.createElement('p'); hint.className = 'ma-jones-scroll-hint';
          hint.textContent = 'Desplaza horizontalmente para ver el contenido completo.';
          block.before(hint); block.tabIndex = 0;
        }
        if (hint?.classList.contains('ma-jones-scroll-hint')) hint.hidden = !overflow;
      }
    }
    hints(); window.addEventListener('resize', hints);
    document.fonts.ready.then(hints);
    window.MathJax?.startup?.promise?.then(hints);
    let frame;
    const observer = new ResizeObserver(() => {
      cancelAnimationFrame(frame); frame = requestAnimationFrame(hints);
    });
    observer.observe(document.querySelector('main'));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', prepareJones);
  else prepareJones();
})();
</script>
