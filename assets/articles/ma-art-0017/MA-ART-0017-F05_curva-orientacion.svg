<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="864pt" height="396pt" viewBox="0 0 864 396" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-labelledby="title-ma-5 desc-ma-5"><title id="title-ma-5">Trabajo de campo tangencial cambia con sentido de recorrido</title>
<desc id="desc-ma-5">En la circunferencia unitaria y para el campo F(x,y)=(-y,x), una vuelta antihoraria produce integral de trabajo +2 pi y una vuelta horaria -2 pi. La integral escalar de 1 respecto de longitud vale 2 pi en ambos recorridos.</desc>

