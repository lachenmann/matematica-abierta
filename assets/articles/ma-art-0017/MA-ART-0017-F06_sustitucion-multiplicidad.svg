<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="864pt" height="396pt" viewBox="0 0 864 396" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-labelledby="title-ma-6 desc-ma-6"><title id="title-ma-6">Mapa x al cuadrado con signos y multiplicidad</title>
<desc id="desc-ma-6">Para u=x al cuadrado en [-1,1], el recorrido desde u=1 baja a cero y vuelve a u=1. La integral orientada de la derivada 2x vale cero. La integral de |2x| vale 2, porque cuenta dos recorridos de longitud 1; el conjunto imagen [0,1] tiene longitud 1.</desc>

