<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
<title id="t">Un múltiplo acaba superando una magnitud dada, disposición móvil</title>
<desc id="d">Ejemplo con a igual a 7 y b igual a 100. Catorce veces a vale 98 y queda debajo de b; quince veces a vale 105 y lo supera.</desc>
<rect width="640" height="700" rx="28" fill="#f7f7f5"/>
<text x="320" y="62" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202124">Repetir hasta superar</text>
<text x="320" y="103" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5f6368">Ejemplo: a = 7, b = 100</text>
<text x="320" y="158" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#374151">Buscamos un natural n con na &gt; b</text>
<line x1="75" y1="330" x2="565" y2="330" stroke="#374151" stroke-width="5"/>
<polygon points="565,330 539,316 539,344" fill="#374151"/>
<line x1="263" y1="242" x2="263" y2="390" stroke="#4c78a8" stroke-width="5"/>
<circle cx="263" cy="330" r="12" fill="#4c78a8"/>
<text x="263" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#335f8a">14a = 98</text>
<text x="263" y="425" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#335f8a">todavía no</text>
<line x1="320" y1="218" x2="320" y2="408" stroke="#b3261e" stroke-width="5" stroke-dasharray="12 9"/>
<text x="320" y="198" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#b3261e">b = 100</text>
<line x1="405" y1="242" x2="405" y2="390" stroke="#0f9d58" stroke-width="5"/>
<circle cx="405" cy="330" r="13" fill="#0f9d58"/>
<text x="405" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#08783f">15a = 105</text>
<text x="405" y="425" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#08783f">¡supera b!</text>
<rect x="92" y="500" width="456" height="120" rx="22" fill="#e6f4ea" stroke="#3f8f62" stroke-width="2"/>
<text x="320" y="548" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#214d34">Existe n = 15</text>
<text x="320" y="583" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#214d34">No hace falta que todos los múltiplos</text>
<text x="320" y="613" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#214d34">superen a b.</text>
<text x="320" y="662" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5f6368">El cuantificador «existe» pide al menos un testigo.</text>
</svg>