<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Genealogía de la propiedad arquimediana</title>
<desc id="d">Secuencia conceptual desde Eudoxo y la teoría de proporciones, pasando por Euclides Libro V y Arquímedes, hasta la formulación moderna en cuerpos ordenados.</desc>
<rect width="1200" height="420" rx="24" fill="#f7f7f5"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202124">Genealogía de la idea arquimediana</text>
<text x="600" y="91" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5f6368">La prioridad de la idea y el nombre tradicional no son la misma cuestión histórica.</text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6b7280"/></marker></defs>
<line x1="260" y1="225" x2="365" y2="225" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="560" y1="225" x2="665" y2="225" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="860" y1="225" x2="965" y2="225" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="145" width="220" height="160" rx="18" fill="#e8f0fe" stroke="#4c78a8" stroke-width="2"/>
<text x="150" y="188" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#20324d">Eudoxo</text>
<text x="150" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#20324d">siglo IV a. C.</text>
<text x="150" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#20324d">teoría de proporciones</text>
<text x="150" y="278" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#20324d">y exhaución</text>
<rect x="365" y="145" width="195" height="160" rx="18" fill="#e6f4ea" stroke="#3f8f62" stroke-width="2"/>
<text x="462" y="188" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#214d34">Euclides</text>
<text x="462" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#214d34">Libro V, Def. 4</text>
<text x="462" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#214d34">múltiplos que pueden</text>
<text x="462" y="278" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#214d34">excederse mutuamente</text>
<rect x="665" y="145" width="195" height="160" rx="18" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
<text x="762" y="188" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#6b4b10">Arquímedes</text>
<text x="762" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#6b4b10">siglo III a. C.</text>
<text x="762" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6b4b10">supuesto explícito en</text>
<text x="762" y="278" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6b4b10">Esfera y cilindro I</text>
<rect x="965" y="145" width="195" height="160" rx="18" fill="#f3e8ff" stroke="#8456a8" stroke-width="2"/>
<text x="1062" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#4e3464">Matemática</text>
<text x="1062" y="204" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#4e3464">moderna</text>
<text x="1062" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4e3464">cuerpos ordenados</text>
<text x="1062" y="263" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4e3464">arquimedianos /</text>
<text x="1062" y="285" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4e3464">no arquimedianos</text>
<text x="600" y="365" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#374151">Idea eudoxiana · formulación célebre arquimediana · abstracción moderna</text>
</svg>
