<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Un múltiplo acaba superando una magnitud dada</title>
<desc id="d">Ejemplo con a igual a 7 y b igual a 100. El múltiplo 14a vale 98 y queda por debajo de b, mientras que 15a vale 105 y lo supera.</desc>
<rect width="1200" height="420" rx="24" fill="#f7f7f5"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202124">La idea básica: repetir hasta superar</text>
<text x="600" y="92" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f6368">Ejemplo: a = 7, b = 100</text>
<line x1="80" y1="245" x2="1120" y2="245" stroke="#374151" stroke-width="4"/>
<polygon points="1120,245 1096,233 1096,257" fill="#374151"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">
<line x1="80" y1="235" x2="80" y2="255" stroke="#6b7280"/><text x="80" y="281">0</text>
<line x1="145" y1="235" x2="145" y2="255" stroke="#6b7280"/><text x="145" y="281">7</text>
<line x1="210" y1="235" x2="210" y2="255" stroke="#6b7280"/><text x="210" y="281">14</text>
<line x1="275" y1="235" x2="275" y2="255" stroke="#6b7280"/><text x="275" y="281">21</text>
<line x1="340" y1="235" x2="340" y2="255" stroke="#6b7280"/><text x="340" y="281">28</text>
</g>
<g fill="#4c78a8">
<circle cx="145" cy="245" r="7"/><circle cx="210" cy="245" r="7"/><circle cx="275" cy="245" r="7"/><circle cx="340" cy="245" r="7"/>
<circle cx="405" cy="245" r="7"/><circle cx="470" cy="245" r="7"/><circle cx="535" cy="245" r="7"/><circle cx="600" cy="245" r="7"/><circle cx="665" cy="245" r="7"/><circle cx="730" cy="245" r="7"/><circle cx="795" cy="245" r="7"/><circle cx="860" cy="245" r="7"/><circle cx="925" cy="245" r="7"/><circle cx="990" cy="245" r="8"/>
</g>
<line x1="1009" y1="125" x2="1009" y2="315" stroke="#b3261e" stroke-width="4" stroke-dasharray="10 8"/>
<text x="1009" y="112" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#b3261e">b = 100</text>
<line x1="990" y1="197" x2="990" y2="235" stroke="#4c78a8" stroke-width="3"/>
<text x="930" y="178" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#335f8a">14a = 98</text>
<circle cx="1055" cy="245" r="10" fill="#0f9d58"/>
<line x1="1055" y1="197" x2="1055" y2="235" stroke="#0f9d58" stroke-width="3"/>
<text x="1082" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#08783f">15a = 105</text>
<path d="M990 332 C1005 355, 1040 355, 1055 332" fill="none" stroke="#6b7280" stroke-width="2"/>
<text x="1023" y="384" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">El siguiente múltiplo cruza el umbral.</text>
</svg>
