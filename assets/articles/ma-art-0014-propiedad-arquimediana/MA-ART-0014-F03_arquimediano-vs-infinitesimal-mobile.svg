<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="t d">
<title id="t">Sistema arquimediano frente a un sistema con infinitesimales, disposición móvil</title>
<desc id="d">Dos paneles verticales. En el primero algún múltiplo de a supera b. En el segundo un infinitesimal epsilon satisface n epsilon menor que 1 para todo natural n. Es un esquema conceptual no a escala.</desc>
<rect width="640" height="1120" rx="28" fill="#f7f7f5"/>
<text x="320" y="58" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202124">¿Qué falla sin arquimedianidad?</text>
<rect x="145" y="82" width="350" height="42" rx="18" fill="#eceff1" stroke="#9aa0a6"/>
<text x="320" y="110" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#5f6368">ESQUEMA CONCEPTUAL · NO A ESCALA</text>
<rect x="55" y="158" width="530" height="385" rx="24" fill="#edf7f1" stroke="#3f8f62" stroke-width="3"/>
<text x="320" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1f5f3f">Sistema arquimediano</text>
<text x="320" y="244" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#374151">Para a &gt; 0 y b &gt; 0, algún na supera b.</text>
<line x1="105" y1="365" x2="535" y2="365" stroke="#374151" stroke-width="5"/>
<polygon points="535,365 509,351 509,379" fill="#374151"/>
<line x1="425" y1="288" x2="425" y2="432" stroke="#b3261e" stroke-width="5" stroke-dasharray="11 8"/>
<text x="425" y="277" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#b3261e">b</text>
<g fill="#0f9d58"><circle cx="145" cy="365" r="10"/><circle cx="215" cy="365" r="10"/><circle cx="285" cy="365" r="10"/><circle cx="355" cy="365" r="10"/><circle cx="485" cy="365" r="13"/></g>
<g font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1f5f3f" text-anchor="middle"><text x="145" y="405">a</text><text x="215" y="405">2a</text><text x="285" y="405">3a</text><text x="355" y="405">…</text><text x="485" y="405" font-weight="700">na &gt; b</text></g>
<text x="320" y="488" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1f5f3f">algún múltiplo cruza el umbral</text>
<rect x="55" y="580" width="530" height="435" rx="24" fill="#f5effa" stroke="#8456a8" stroke-width="3"/>
<text x="320" y="627" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#6a4388">Sistema no arquimediano</text>
<text x="320" y="666" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#374151">Puede existir ε &gt; 0 con nε &lt; 1 para todo n.</text>
<line x1="105" y1="805" x2="535" y2="805" stroke="#374151" stroke-width="5"/>
<polygon points="535,805 509,791 509,819" fill="#374151"/>
<line x1="475" y1="728" x2="475" y2="872" stroke="#b3261e" stroke-width="5" stroke-dasharray="11 8"/>
<text x="475" y="717" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#b3261e">1</text>
<g fill="#8456a8"><circle cx="145" cy="805" r="10"/><circle cx="215" cy="805" r="10"/><circle cx="285" cy="805" r="10"/><circle cx="355" cy="805" r="10"/><circle cx="415" cy="805" r="10"/></g>
<g font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6a4388" text-anchor="middle"><text x="145" y="846">ε</text><text x="215" y="846">2ε</text><text x="285" y="846">3ε</text><text x="355" y="846">…</text><text x="415" y="846">nε</text></g>
<text x="320" y="914" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#6a4388">nε &lt; 1 para todo n natural</text>
<text x="320" y="959" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#6a4388">ningún múltiplo natural alcanza 1</text>
<text x="320" y="1068" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#5f6368">La posición horizontal codifica sólo el orden relativo.</text>
</svg>