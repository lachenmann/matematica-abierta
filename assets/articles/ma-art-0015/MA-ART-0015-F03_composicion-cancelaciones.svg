<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="t d"><title id="t">Reversión por composición</title><desc id="d">La serie candidata s(z)=z+Az³+Bz⁵ se sustituye en f(x)=x+x³/6+3x⁵/40. Los términos cúbicos y quínticos se cancelan al elegir A=-1/6 y B=1/120; queda z más términos de orden siete.</desc>
<rect width="1100" height="800" rx="20" fill="#f7f7f5"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5f6368"/></marker></defs>
<text x="32" y="46" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="700">F03 · Componer para invertir</text>
<text x="32" y="83" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="400">Cada coeficiente nuevo cancela un grado.</text>
<rect x="32" y="130" width="296" height="140" rx="14" fill="#ffffff" stroke="#d4d6d8" stroke-width="2"/>
<text x="52" y="171" fill="#4c78a8" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="700">Candidato</text>
<text x="52" y="225" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="400">z + Az³ + Bz⁵</text>
<rect x="402" y="130" width="296" height="140" rx="14" fill="#ffffff" stroke="#d4d6d8" stroke-width="2"/>
<text x="422" y="171" fill="#4c78a8" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="700">Serie del arco</text>
<text x="422" y="225" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="400">x + x³/6 + 3x⁵/40</text>
<rect x="772" y="130" width="296" height="140" rx="14" fill="#ffffff" stroke="#d4d6d8" stroke-width="2"/>
<text x="792" y="171" fill="#4c78a8" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="700">Composición</text>
<text x="792" y="225" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="400">z + O(z⁷)</text>
<line x1="333" y1="200" x2="394" y2="200" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)" />
<line x1="703" y1="200" x2="764" y2="200" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)" />
<rect x="32" y="320" width="1036" height="160" rx="14" fill="#ffffff" stroke="#3f8f62" stroke-width="2"/>
<text x="54" y="358" fill="#3f8f62" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="700">Grado 3 · cancelar A + 1/6</text>
<text x="54" y="404" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="400">A = −1/6</text>
<text x="54" y="450" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="start" font-weight="400">−1/6 + 1/6 = 0</text>
<rect x="32" y="520" width="1036" height="160" rx="14" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="54" y="558" fill="#b7791f" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="700">Grado 5 · cancelar B + A/2 + 3/40</text>
<text x="54" y="604" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="400">B = 1/120</text>
<text x="54" y="650" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="start" font-weight="400">1/120 − 1/12 + 3/40 = 0</text>
<text x="32" y="755" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" font-weight="400">La cancelación hasta grado 5 no da una inversa exacta.</text>
<text x="32" y="785" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" font-weight="400">Se conservan términos desde grado 7.</text>
</svg>