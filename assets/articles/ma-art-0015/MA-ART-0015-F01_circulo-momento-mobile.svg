<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1120" viewBox="0 0 600 1120" role="img" aria-labelledby="t d"><title id="t">Del círculo al momento del arco</title><desc id="d">Círculo unidad con arco z desde (0,1), punto P=(sin z,cos z) y ampliación del triángulo tangente. La razón dx/ds=cos z expresa dz/dx=1/cos z. Los diferenciales son longitudes sobre la tangente, no incrementos finitos sobre la curva.</desc>
