<text x="32" y="1006" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="700">dz / dx = 1 / √(1 − x²)</text>
<text x="32" y="1050" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="start" font-weight="400">Radio 1 · 0 &lt; z &lt; π/2 · ds = dz en radianes</text>
<text x="32" y="1088" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" font-weight="400">Reconstrucción moderna; no es un facsímil de Newton.</text>
