<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="t d"><title id="t">Del binomio al seno</title><desc id="d">Cuatro etapas: desarrollar el momento del arco con el binomio; integrar para obtener el arco; revertir la serie del arco; reconocer los coeficientes del seno. La fórmula general requiere además la justificación moderna del artículo.</desc>
<rect width="1100" height="660" rx="20" fill="#f7f7f5"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5f6368"/></marker></defs>
<text x="32" y="46" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="700">F02 · Del binomio al seno</text>
<text x="32" y="82" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="start" font-weight="400">Primero obtenemos el arco; después, el seno.</text>
<rect x="32" y="130" width="468" height="170" rx="14" fill="#ffffff" stroke="#4c78a8" stroke-width="2"/>
<text x="54" y="172" fill="#4c78a8" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="700">1 · Desarrollar el momento</text>
<text x="54" y="220" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="400">1 / √(1 − x²)</text>
<text x="54" y="263" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="400">1 + x²/2 + 3x⁴/8 + ⋯</text>
<rect x="600" y="130" width="468" height="170" rx="14" fill="#ffffff" stroke="#3f8f62" stroke-width="2"/>
<text x="622" y="172" fill="#3f8f62" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="700">2 · Recuperar el arco</text>
<text x="622" y="220" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="400">z = arcsin x</text>
<text x="622" y="263" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="400">x + x³/6 + 3x⁵/40 + ⋯</text>
<rect x="600" y="380" width="468" height="170" rx="14" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="622" y="422" fill="#b7791f" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="700">3 · Invertir la relación</text>
<text x="622" y="470" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="400">x = z + Az³ + Bz⁵ + ⋯</text>
<text x="622" y="513" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="400">Sustituir y cancelar potencias.</text>
<rect x="32" y="380" width="468" height="170" rx="14" fill="#ffffff" stroke="#4c78a8" stroke-width="2"/>
<text x="54" y="422" fill="#4c78a8" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="700">4 · Obtener el seno</text>
<text x="54" y="470" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="400">x = sin z</text>
<text x="54" y="513" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="400">z − z³/6 + z⁵/120 + ⋯</text>
<line x1="505" y1="215" x2="592" y2="215" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)" />
<text x="550" y="185" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400">Integrar</text>
<line x1="830" y1="307" x2="830" y2="373" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)" />
<text x="850" y="344" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" font-weight="400">Revertir</text>
<line x1="595" y1="465" x2="507" y2="465" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)" />
<text x="550" y="437" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400">Comparar</text>
<text x="32" y="598" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" font-weight="400">Los puntos suspensivos no prueban la fórmula general.</text>
<text x="32" y="633" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" font-weight="400">La §11.3 justifica todos los coeficientes y el alcance global.</text>
</svg>