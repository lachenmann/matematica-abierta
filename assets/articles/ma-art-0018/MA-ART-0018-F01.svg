<svg xmlns="http://www.w3.org/2000/svg" width="650" height="953" viewBox="0 0 650 953" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">F01: fichas y sumas cruzadas</title><desc id="svgdesc">La cuenta A=(5,2) tiene cinco fichas a favor y dos en contra; B=(4,1) tiene cuatro a favor y una en contra. Los totales cruzados son 5+1=6 y 2+4=6. Los dos pares distintos son equivalentes.</desc><rect x="1" y="1" width="648" height="951" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="31" y="49" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#17263B">Fichas y sumas cruzadas</text><text x="31" y="79" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#46536A">Dos cuentas distintas pueden ser equivalentes.</text><rect x="32" y="112" width="586" height="181" rx="15" fill="#FBFCFD" stroke="#BACDDD" stroke-width="2"/><text x="52" y="149" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#17263B">A = (5,2)</text><text x="56" y="194" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#16649E">a favor</text><text x="342" y="194" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#A54A12">en contra</text><text x="54" y="270" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17263B">5 fichas</text><text x="340" y="270" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17263B">2 fichas</text><circle cx="63" cy="222" r="10" fill="#16649E" stroke="#17263B" stroke-width="1"/><circle cx="94" cy="222" r="10" fill="#16649E" stroke="#17263B" stroke-width="1"/><circle cx="125" cy="222" r="10" fill="#16649E" stroke="#17263B" stroke-width="1"/><circle cx="156" cy="222" r="10" fill="#16649E" stroke="#17263B" stroke-width="1"/><circle cx="187" cy="222" r="10" fill="#16649E" stroke="#17263B" stroke-width="1"/><circle cx="349" cy="222" r="10" fill="#A54A12" stroke="#17263B" stroke-width="1"/><circle cx="380" cy="222" r="10" fill="#A54A12" stroke="#17263B" stroke-width="1"/><rect x="32" y="323" width="586" height="181" rx="15" fill="#FBFCFD" stroke="#BACDDD" stroke-width="2"/><text x="52" y="360" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#17263B">B = (4,1)</text><text x="56" y="405" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#16649E">a favor</text><text x="342" y="405" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#A54A12">en contra</text><text x="54" y="481" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17263B">4 fichas</text><text x="340" y="481" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17263B">1 ficha</text><circle cx="63" cy="433" r="10" fill="#16649E" stroke="#17263B" stroke-width="1"/><circle cx="94" cy="433" r="10" fill="#16649E" stroke="#17263B" stroke-width="1"/><circle cx="125" cy="433" r="10" fill="#16649E" stroke="#17263B" stroke-width="1"/><circle cx="156" cy="433" r="10" fill="#16649E" stroke="#17263B" stroke-width="1"/><circle cx="349" cy="433" r="10" fill="#A54A12" stroke="#17263B" stroke-width="1"/><text x="32" y="548" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#17263B">Compara columnas opuestas:</text><rect x="31" y="571" width="587" height="102" rx="15" fill="#EAF4FC" stroke="#B7D7EC" stroke-width="2"/><text x="54" y="606" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#16649E">1.ª de A  +  2.ª de B</text><text x="54" y="645" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#17263B">5 + 1 = 6</text><rect x="31" y="685" width="587" height="102" rx="15" fill="#FFF2E8" stroke="#E6C1A7" stroke-width="2"/><text x="54" y="721" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#A54A12">2.ª de A  +  1.ª de B</text><text x="54" y="761" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#17263B">2 + 4 = 6</text><rect x="31" y="805" width="587" height="121" rx="15" fill="#EAF8F1" stroke="#97C7AF" stroke-width="2"/><text x="53" y="846" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#176C51">Se cumple la igualdad cruzada:</text><text x="53" y="884" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#17263B">5 + 1 = 2 + 4</text><text x="53" y="914" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17263B">(5,2) ~ (4,1), pero no son el mismo par.</text></svg>
