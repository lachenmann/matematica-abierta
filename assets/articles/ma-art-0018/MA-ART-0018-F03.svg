<svg xmlns="http://www.w3.org/2000/svg" width="780" height="900" viewBox="0 0 780 900" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">F03: sumar y normalizar</title><desc id="svgdesc">Secuencia de tres pasos: elegir pares normalizados (3,0) y (0,2); sumar coordenadas para obtener (3,2); sustituir ese representante por (1,0) de su misma clase, pues (3,2), (2,1) y (1,0) son pares naturales equivalentes. Resultado: 3 más menos dos es uno.</desc><rect x="1" y="1" width="778" height="898" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="40" y="53" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700" fill="#17263B">Operar no es normalizar</text><text x="40" y="84" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#46536A">El entero es una clase; el par es uno de sus representantes.</text><rect x="38" y="108" width="704" height="174" rx="12" fill="#EAF4FC" stroke="#BCCCD8" stroke-width="2"/><text x="64" y="149" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#16649E">1  Elegir representantes</text><text x="66" y="204" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#17263B">[(3,0)] y [(0,2)]</text><rect x="38" y="305" width="704" height="174" rx="12" fill="#FFF2E8" stroke="#BCCCD8" stroke-width="2"/><text x="64" y="346" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#A54A12">2  Sumar por coordenadas</text><text x="66" y="401" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#17263B">[(3,0)] + [(0,2)] = [(3,2)]</text><rect x="38" y="502" width="704" height="174" rx="12" fill="#EAF8F1" stroke="#BCCCD8" stroke-width="2"/><text x="64" y="543" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#176C51">3  Normalizar el par</text><text x="66" y="598" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#17263B">(3,2) ~ (2,1) ~ (1,0)</text><text x="65" y="255" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#46536A">Ambos pares elegidos tienen una coordenada igual a cero.</text><text x="65" y="450" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#46536A">El par (3,2) obtenido no es normalizado.</text><text x="65" y="648" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#46536A">Cada par está en la retícula: a y b son naturales.</text><text x="40" y="716" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#17263B">(3,2) y (1,0) son pares diferentes,</text><text x="40" y="748" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#17263B">pero sus clases son iguales:</text><rect x="36" y="775" width="708" height="94" rx="15" fill="#F4F7FA" stroke="#ABC3D3" stroke-width="2"/><text x="65" y="816" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#176C51">[(3,2)] = [(1,0)] = 1</text><text x="65" y="850" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#17263B">Por tanto, 3 + (−2) = 1.</text></svg>
