ht="400" fill="#17263B" text-anchor="middle">5</text><text x="514" y="664" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17263B" text-anchor="middle">6</text><text x="61" y="217" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17263B" text-anchor="middle">6</text><text x="547" y="643" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#17263B">a</text><text x="83" y="175" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#17263B">b</text><line x1="301" y1="637" x2="514" y2="424" stroke="#16649E" stroke-width="3" stroke-dasharray="8 7"/><rect x="293" y="629" width="16" height="16" rx="2" fill="#16649E"/><circle cx="301" cy="637" r="17" fill="none" stroke="#17263B" stroke-width="2.6"/><rect x="364" y="558" width="16" height="16" rx="2" fill="#16649E"/><rect x="435" y="487" width="16" height="16" rx="2" fill="#16649E"/><rect x="506" y="416" width="16" height="16" rx="2" fill="#16649E"/><line x1="88" y1="637" x2="514" y2="211" stroke="#56647A" stroke-width="3" stroke-dasharray="8 7"/><circle cx="88" cy="637" r="8" fill="#56647A" stroke="#FFFFFF" stroke-width="1"/><circle cx="88" cy="637" r="17" fill="none" stroke="#17263B" stroke-width="2.6"/><circle cx="159" cy="566" r="8" fill="#56647A" stroke="#FFFFFF" stroke-width="1"/><circle cx="230" cy="495" r="8" fill="#56647A" stroke="#FFFFFF" stroke-width="1"/><circle cx="301" cy="424" r="8" fill="#56647A" stroke="#FFFFFF" stroke-width="1"/><circle cx="372" cy="353" r="8" fill="#56647A" stroke="#FFFFFF" stroke-width="1"/><circle cx="443" cy="282" r="8" fill="#56647A" stroke="#FFFFFF" stroke-width="1"/><circle cx="514" cy="211" r="8" fill="#56647A" stroke="#FFFFFF" stroke-width="1"/><line x1="88" y1="424" x2="301" y2="211" stroke="#A54A12" stroke-width="3" stroke-dasharray="8 7"/><polygon points="88,414 98,424 88,434 78,424" fill="#A54A12"/><circle cx="88" cy="424" r="17" fill="none" stroke="#17263B" stroke-width="2.6"/><polygon points="159,343 169,353 159,363 149,353" fill="#A54A12"/><polygon points="230,272 240,282 230,292 220,282" fill="#A54A12"/><polygon points="301,201 311,211 301,221 291,211" fill="#A54A12"/><text x="31" y="707" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#16649E">P  ■   [(3,0)]   :   a = b + 3</text><text x="31" y="758" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#56647A">C  ●   [(0,0)]   :   a = b</text><text x="31" y="809" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#A54A12">N  ◆   [(0,3)]   :   b = a + 3</text><rect x="30" y="848" width="586" height="157" rx="15" fill="#EAF4FC" stroke="#B6CFDF" stroke-width="2"/><text x="51" y="891" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17263B">Los aros indican representantes</text><text x="51" y="924" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17263B">canónicos sobre los ejes.</text><text x="51" y="959" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#46536A">Las líneas solo guían la vista.</text><text x="51" y="987" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#46536A">Las clases continúan fuera del recorte.</text></svg>
