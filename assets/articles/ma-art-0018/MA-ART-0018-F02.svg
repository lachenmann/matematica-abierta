<svg xmlns="http://www.w3.org/2000/svg" width="650" height="1031" viewBox="0 0 650 1031" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">F02: retícula de clases</title><desc id="svgdesc">Retícula de los 49 pares de naturales entre cero y seis. Cuatro cuadrados P representan (3,0),(4,1),(5,2),(6,3). Siete círculos C representan todos los (n,n) de 0 a 6, incluido (6,6). Cuatro rombos N representan (0,3),(1,4),(2,5),(3,6). Aros señalan (3,0),(0,0),(0,3); las clases tienen infinitos elementos y los trazos son solo guías.</desc><rect x="1" y="1" width="648" height="1029" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="30" y="48" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#17263B">Clases de equivalencia</text><text x="30" y="78" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#46536A">Cada punto es un par (a,b) de naturales.</text><text x="30" y="105" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#46536A">Se muestra solo la ventana de 0 a 6.</text><line x1="88" y1="637" x2="514" y2="637" stroke="#DCE3EB" stroke-width="1"/><line x1="88" y1="566" x2="514" y2="566" stroke="#DCE3EB" stroke-width="1"/><line x1="88" y1="495" x2="514" y2="495" stroke="#DCE3EB" stroke-width="1"/><line x1="88" y1="424" x2="514" y2="424" stroke="#DCE3EB" stroke-width="1"/><line x1="88" y1="353" x2="514" y2="353" stroke="#DCE3EB" stroke-width="1"/><line x1="88" y1="282" x2="514" y2="282" stroke="#DCE3EB" stroke-width="1"/><line x1="88" y1="211" x2="514" y2="211" stroke="#DCE3EB" stroke-width="1"/><line x1="88" y1="637" x2="88" y2="211" stroke="#DCE3EB" stroke-width="1"/><line x1="159" y1="637" x2="159" y2="211" stroke="#DCE3EB" stroke-width="1"/><line x1="230" y1="637" x2="230" y2="211" stroke="#DCE3EB" stroke-width="1"/><line x1="301" y1="637" x2="301" y2="211" stroke="#DCE3EB" stroke-width="1"/><line x1="372" y1="637" x2="372" y2="211" stroke="#DCE3EB" stroke-width="1"