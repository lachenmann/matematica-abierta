<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">F03B · Lectura métrica de la construcción de Euclides II.11</title>
<desc id="desc">La misma construcción con las longitudes AB igual L, AE igual L sobre 2, EB y EF iguales a L raíz de 5 sobre 2, y AH igual AF igual a L por raíz de 5 menos 1 sobre 2.</desc>
<rect width="1400" height="850" fill="#fff"/>
<style>
  .t{font-family:Inter,Arial,sans-serif;fill:#111827}.b{font-weight:700}.g{stroke:#1f77b4}.o{stroke:#d97706}.gr{stroke:#15803d}.pu{stroke:#7c3aed}.gy{stroke:#64748b}
  .line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:2}.dash{stroke-dasharray:9 8}
  .small{font-size:21px}.mid{font-size:25px}.lab{font-size:27px;font-weight:700}.eq{font-size:28px}
</style>
<text x="70" y="62" class="t b" font-size="36">F03B · La misma construcción leída con longitudes modernas</text>

<!-- geometry -->
<path d="M180 480 L620 480 L620 120 L180 120 Z" class="line g"/>
<path d="M180 120 L180 700" class="line gy thin dash"/>
<path d="M180 300 L620 480" class="line o"/>
<path d="M180 300 L180 700" class="line o"/>
<path d="M180 480 L180 700 L452 700 L452 480 Z" class="line gr"/>
<polygon points="180,300 180,480 620,480" fill="#d97706" opacity=".055"/>

<!-- points -->
<g class="t lab">
<circle cx="180" cy="480" r="5" fill="#111827"/><text x="150" y="470">A</text>
<circle cx="620" cy="480" r="5" fill="#111827"/><text x="632" y="470">B</text>
<circle cx="180" cy="120" r="5" fill="#111827"/><text x="150" y="110">C</text>
<circle cx="620" cy="120" r="5" fill="#111827"/><text x="632" y="110">D</text>
<circle cx="180" cy="300" r="5" fill="#7c3aed"/><text x="150" y="300" fill="#7c3aed">E</text>
<circle cx="180" cy="700" r="5" fill="#d97706"/><text x="150" y="728" fill="#d97706">F</text>
<circle cx="452" cy="700" r="5" fill="#15803d"/><text x="464" y="728" fill="#15803d">G</text>
<circle cx="452" cy="480" r="5" fill="#15803d"/><text x="464" y="470" fill="#15803d">H</text>
</g>

<!-- metric labels -->
<g class="t">
<rect x="315" y="438" width="106" height="38" rx="6" fill="#fff" opacity=".92"/><text x="324" y="466" class="mid" fill="#1f77b4">AB = L</text>
<rect x="82" y="376" width="112" height="38" rx="6" fill="#fff" opacity=".92"/><text x="90" y="404" class="mid" fill="#7c3aed">AE = L/2</text>
<rect x="330" y="330" width="206" height="38" rx="6" fill="#fff" opacity=".92"/><text x="340" y="358" class="mid" fill="#d97706">EB = L√5/2</text>
<text x="78" y="555" class="small" fill="#d97706">EF = EB = L√5/2</text>
<text x="286" y="523" class="small" fill="#15803d">AH = AF</text>
<text x="270" y="607" class="small" fill="#15803d">AF = EF − EA</text>
<text x="470" y="455" class="small" fill="#64748b">BH = L − AH</text>
<text x="350" y="382" class="small" fill="#d97706">triángulo rectángulo AEB</text>
</g>

<!-- equations -->
<g class="t">
<text x="735" y="150" class="b mid" fill="#d97706">1. Pitágoras en AEB</text>
<text x="735" y="205" class="eq">EB = √(AB² + AE²) = √(L² + (L/2)²) = L√5/2</text>

<text x="735" y="305" class="b mid" fill="#d97706">2. El compás transporta la hipotenusa</text>
<text x="735" y="360" class="eq">EF = EB = L√5/2</text>

<text x="735" y="455" class="b mid" fill="#15803d">3. Restar el tramo EA</text>
<text x="735" y="510" class="eq">AF = EF − EA = L√5/2 − L/2 = L(√5 − 1)/2</text>

<text x="735" y="605" class="b mid" fill="#15803d">4. El cuadrado transporta AF hasta AH</text>
<rect x="720" y="635" width="480" height="78" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="748" y="685" class="b" font-size="34" fill="#15803d">AH = AF = L(√5 − 1)/2</text>
</g>

<text x="70" y="820" class="t small" fill="#64748b">La raíz √5 aparece en la hipotenusa EB y entra en la sección áurea por una cadena de construcciones exactas, no por una medición decimal.</text>
</svg>