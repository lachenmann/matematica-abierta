<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">F03A · Construcción con regla y compás</title>
<desc id="desc">Construcción de Euclides II.11. Se construye el cuadrado ABDC sobre AB, se biseca AC en E, se une E con B, se prolonga CA hasta F usando un arco con centro E y radio EB, y se construye el cuadrado AFGH, cuyo lado AH determina H sobre AB.</desc>
<rect width="1400" height="850" fill="#fff"/>
<style>
  .t{font-family:Inter,Arial,sans-serif;fill:#111827}.b{font-weight:700}.g{stroke:#1f77b4}.o{stroke:#d97706}.gr{stroke:#15803d}.pu{stroke:#7c3aed}.gy{stroke:#64748b}
  .line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:2}.dash{stroke-dasharray:9 8}
  .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.small{font-size:22px}.mid{font-size:25px}.lab{font-size:27px;font-weight:700}
</style>
<text x="70" y="62" class="t b" font-size="38">F03A · Construcción con regla y compás</text>

<!-- geometry -->
<path d="M180 480 L620 480 L620 120 L180 120 Z" class="line g"/>
<path d="M180 120 L180 700" class="line gy thin dash"/>
<path d="M180 300 L620 480" class="line g"/>
<path d="M180 300 L620 480" class="line o thin dash"/>
<path d="M180 480 L180 700 L452 700 L452 480 Z" class="line gr"/>
<path d="M620 480 A475.4 475.4 0 0 1 180 700" class="line o"/>
<!-- right angle -->
<path d="M180 480 h30 v-30 h-30" class="line gy thin"/>
<!-- midpoint ticks -->
<path d="M166 286 h28 M166 314 h28" class="line pu thin"/>

<!-- points -->
<g class="t lab">
<circle cx="180" cy="480" r="5" fill="#111827"/><text x="150" y="470">A</text>
<circle cx="620" cy="480" r="5" fill="#111827"/><text x="632" y="470">B</text>
<circle cx="180" cy="120" r="5" fill="#111827"/><text x="150" y="110">C</text>
<circle cx="620" cy="120" r="5" fill="#111827"/><text x="632" y="110">D</text>
<circle cx="180" cy="300" r="5" fill="#7c3aed"/><text x="150" y="300" fill="#7c3aed">E</text>
<circle cx="180" cy="700" r="5" fill="#d97706"/><text x="150" y="728" fill="#d97706">F</text>
<circle cx="452" cy="700" r="5" fill="#15803d"/><text x="464" y="728" fill="#15803d">G</text>
<circle cx="452" cy="480" r="5" fill="#15803d"/><text x="464" y="470" fill="#15803d">H</text>
</g>

<text x="360" y="330" class="t small" fill="#1f77b4" transform="rotate(22 360 330)">regla: unir E con B</text>
<text x="240" y="610" class="t small" fill="#d97706">compás: centro E, radio EB</text>
<text x="250" y="742" class="t small" fill="#15803d">cuadrado sobre AF</text>

<!-- step rail -->
<g class="t">
  <circle cx="770" cy="165" r="26" fill="#1f77b4"/><text x="770" y="174" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">1</text>
  <rect x="815" y="128" rx="10" ry="10" width="515" height="74" class="box"/>
  <text x="840" y="174" class="mid">Construir el cuadrado <tspan font-style="italic">ABDC</tspan> sobre <tspan font-style="italic">AB</tspan>.</text>

  <circle cx="770" cy="285" r="26" fill="#1f77b4"/><text x="770" y="294" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">2</text>
  <rect x="815" y="248" rx="10" ry="10" width="515" height="74" class="box"/>
  <text x="840" y="294" class="mid">Bisecar <tspan font-style="italic">AC</tspan> en <tspan font-style="italic">E</tspan> y trazar <tspan font-style="italic">EB</tspan>.</text>

  <circle cx="770" cy="430" r="26" fill="#d97706"/><text x="770" y="439" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">3</text>
  <rect x="815" y="375" rx="10" ry="10" width="515" height="112" class="box"/>
  <text x="840" y="414" class="small">Prolongar <tspan font-style="italic">CA</tspan> más allá de <tspan font-style="italic">A</tspan>.</text>
  <text x="840" y="447" class="small">Con centro <tspan font-style="italic">E</tspan> y radio <tspan font-style="italic">EB</tspan>, trazar el arco hasta <tspan font-style="italic">F</tspan>.</text>

  <circle cx="770" cy="600" r="26" fill="#15803d"/><text x="770" y="609" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">4</text>
  <rect x="815" y="540" rx="10" ry="10" width="515" height="122" class="box"/>
  <text x="840" y="580" class="small">Construir el cuadrado <tspan font-style="italic">AFGH</tspan> sobre <tspan font-style="italic">AF</tspan>.</text>
  <text x="840" y="613" class="small">Su lado <tspan font-style="italic">AH</tspan> cae sobre <tspan font-style="italic">AB</tspan> y determina <tspan font-style="italic">H</tspan>.</text>
</g>

<text x="815" y="716" class="t b small" fill="#64748b">Resultado geométrico</text>
<text x="815" y="760" class="t b" font-size="32" fill="#15803d">AH = AF   y   H ∈ AB</text>
<text x="70" y="820" class="t small" fill="#64748b">Las rectas representan operaciones de regla; el arco naranja transporta exactamente la longitud EB con compás.</text>
</svg>