<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">F03-02. Cuadrado ABDC sobre AB.</title>
<desc id="desc">Sobre AB se construye el cuadrado ABDC; los cuatro lados tienen exactamente la misma longitud.</desc>
<rect width="1200" height="900" fill="#ffffff"/>
<style>
  .old { stroke:#4b5563; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .new { stroke:#2563eb; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .aux { stroke:#2563eb; stroke-width:2.8; fill:none; stroke-dasharray:10 9; opacity:.86; }
  .aux-old { stroke:#94a3b8; stroke-width:2.4; fill:none; stroke-dasharray:9 9; opacity:.58; }
  .point { fill:#111827; }
  .point-new { fill:#2563eb; }
  .label { font-family:"STIX Two Math","Times New Roman",serif; font-style:italic; font-size:34px; fill:#111827; }
  .label-new { font-family:"STIX Two Math","Times New Roman",serif; font-style:italic; font-size:34px; fill:#2563eb; }
  .tick { stroke:#2563eb; stroke-width:3; stroke-linecap:round; }
  .tick-old { stroke:#64748b; stroke-width:2.7; stroke-linecap:round; }
</style>
<line x1="360.00" y1="520.00" x2="780.00" y2="520.00" class="old"/>
<line x1="360.00" y1="520.00" x2="360.00" y2="100.00" class="new"/>
<line x1="360.00" y1="100.00" x2="780.00" y2="100.00" class="new"/>
<line x1="780.00" y1="100.00" x2="780.00" y2="520.00" class="new"/>
<circle cx="360.00" cy="520.00" r="5.5" class="point"/><text x="322.00" y="562.00" class="label">A</text>
<circle cx="780.00" cy="520.00" r="5.5" class="point"/><text x="798.00" y="562.00" class="label">B</text>
<circle cx="360.00" cy="100.00" r="5.5" class="point-new"/><text x="322.00" y="88.00" class="label-new">C</text>
<circle cx="780.00" cy="100.00" r="5.5" class="point-new"/><text x="798.00" y="88.00" class="label-new">D</text>
</svg>