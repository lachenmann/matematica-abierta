<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"
 role="img" aria-labelledby="title desc">
<title id="title">F03-02. Cuadrado ABDC construido sobre AB.</title>
<desc id="desc">F03-02. Cuadrado ABDC construido sobre AB.</desc>
<rect width="1200" height="700" fill="#ffffff"/>
<style>
  .old { stroke:#4b5563; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .new { stroke:#2563eb; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .aux { stroke:#2563eb; stroke-width:2.8; fill:none; stroke-dasharray:10 9; opacity:.82; }
  .aux-old { stroke:#94a3b8; stroke-width:2.4; fill:none; stroke-dasharray:9 9; opacity:.64; }
  .point { fill:#111827; }
  .point-new { fill:#2563eb; }
  .label { font-family:"STIX Two Math","Times New Roman",serif; font-style:italic; font-size:34px; fill:#111827; }
  .label-new { font-family:"STIX Two Math","Times New Roman",serif; font-style:italic; font-size:34px; fill:#2563eb; }
  .tick { stroke:#2563eb; stroke-width:3; stroke-linecap:round; }
</style>

<line x1="350" y1="550" x2="950" y2="550" class="old"/>
<path d="M 350 550 L 350 150 L 950 150 L 950 550" class="new"/>
<circle cx="350" cy="550" r="5.5" class="point"/><text x="315" y="562" class="label">A</text>
<circle cx="950" cy="550" r="5.5" class="point"/><text x="968" y="562" class="label">B</text>
<circle cx="350" cy="150" r="5.5" class="point"/><text x="315" y="138" class="label">C</text>
<circle cx="950" cy="150" r="5.5" class="point"/><text x="968" y="138" class="label">D</text>

