<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">F08 — Dos curvas parecidas, pero matemáticamente distintas</title>
<desc id="desc">A la izquierda aparece una curva formada por cuartos de circunferencia en cuadrados sucesivos. A la derecha aparece una espiral logarítmica con un único centro y una ley radial continua.</desc>
<style>
 .bg{fill:#fff}.panel{fill:#fff;stroke:#cfd7df;stroke-width:1.5}.title{font:700 30px Georgia,serif;fill:#111}.subtitle{font:italic 17px Georgia,serif;fill:#4d5965}.head{font:700 20px Georgia,serif;fill:#111}.label{font:16px Georgia,serif;fill:#111}.small{font:14px Georgia,serif;fill:#4e5c68}.math{font:19px Georgia,serif;fill:#111}
 .sq{fill:none;stroke:#17212b;stroke-width:1.5}.s0{fill:#fff9e8}.s1{fill:#eef7fd}.s2{fill:#f5f1fb}.arc{fill:none;stroke:#111;stroke-width:3}.center{fill:#1769aa}.ray{stroke:#7a8793;stroke-width:1.2;stroke-dasharray:6 5}.spiral{fill:none;stroke:#1769aa;stroke-width:3.2}.divider{stroke:#d6dde4;stroke-width:1.2}.note{fill:#f7f9fc;stroke:#d6dde4;stroke-width:1}
</style>
<rect class="bg" width="1200" height="610"/>
<text class="title" x="600" y="42" text-anchor="middle">F08 — Dos curvas parecidas, pero matemáticamente distintas</text>
<text class="subtitle" x="600" y="70" text-anchor="middle">Cuartos de circunferencia frente a una espiral logarítmica áurea exacta</text>

<rect class="panel" x="35" y="105" width="535" height="455" rx="10"/>
