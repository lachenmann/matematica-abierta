<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">F06 — Rectángulo áureo y autosemejanza</title>
<desc id="desc">Un rectángulo áureo se divide en un cuadrado y un rectángulo menor semejante al original. A la derecha se muestran las proporciones que justifican la semejanza.</desc>
<style>
  .bg{fill:#fff}.panel{fill:#fff;stroke:#cfd7df;stroke-width:1.5}.line{fill:none;stroke:#17212b;stroke-width:3}.thin{fill:none;stroke:#52616f;stroke-width:1.6}.dash{fill:none;stroke:#7a8793;stroke-width:1.4;stroke-dasharray:7 6}
  .accent{fill:#eaf4fd;stroke:#1769aa;stroke-width:2}.gold{fill:#fff7df;stroke:#b88716;stroke-width:2}.muted{fill:#5b6875}.title{font:700 31px Georgia,serif;fill:#111}.subtitle{font:italic 17px Georgia,serif;fill:#4d5965}
  .head{font:700 20px Georgia,serif;fill:#111}.label{font:17px Georgia,serif;fill:#111}.small{font:15px Georgia,serif;fill:#43515e}.math{font:22px Georgia,serif;fill:#111}.mathbig{font:700 28px Georgia,serif;fill:#111}
</style>
<rect class="bg" width="1200" height="610"/>
<text class="title" x="600" y="42" text-anchor="middle">F06 — Rectángulo áureo y autosemejanza</text>
<text class="subtitle" x="600" y="70" text-anchor="middle">Al retirar un cuadrado, el rectángulo restante conserva exactamente la misma razón</text>

<rect class="panel" x="38" y="105" width="700" height="455" rx="10"/>
<text class="head" x="388" y="139" text-anchor="middle">A. La construcción geométrica</text>

<!-- Golden rectangle, ratio 1.618... -->
<rect class="line" x="95" y="182" width="540" height="334"/>
<rect class="gold" x="95" y="182" width="334" height="334"/>
<rect class="accent" x="429" y="182" width="206" height="334"/>
<line class="line" x1="429" y1="182" x2="429" y2="516"/>

<text class="label" x="262" y="343" text-anchor="middle">cuadrado</text>
<text class="math" x="262" y="370" text-anchor="middle">1 × 1</text>
<text class="label" x="532" y="320" text-anchor="middle">rectángulo restante</text>
<text class="math" x="532" y="349" text-anchor="middle">1 × (φ − 1)</text>
<text class="small" x="532" y="378" text-anchor="middle">girado 90°</text>

<!-- dimension lines -->
<line class="thin" x1="95" y1="165" x2="635" y2="165"/>
<line class="thin" x1="95" y1="159" x2="95" y2="171"/>
<line class="thin" x1="635" y1="159" x2="635" y2="171"/>
<text class="math" x="365" y="154" text-anchor="middle">φ</text>

<line class="thin" x1="74" y1="182" x2="74" y2="516"/>
<line class="thin" x1="68" y1="182" x2="80" y2="182"/>
<line class="thin" x1="68" y1="516" x2="80" y2="516"/>
<text class="math" x="55" y="356" text-anchor="middle">1</text>

<line class="thin" x1="429" y1="535" x2="635" y2="535"/>
<line class="thin" x1="429" y1="529" x2="429" y2="541"/>
<line class="thin" x1="635" y1="529" x2="635" y2="541"/>
<text class="math" x="532" y="555" text-anchor="middle">φ − 1</text>

<rect class="panel" x="770" y="105" width="392" height="455" rx="10"/>
<text class="head" x="966" y="139" text-anchor="middle">B. La semejanza exacta</text>

<text class="small" x="966" y="196" text-anchor="middle">Razón del rectángulo original</text>
<text class="mathbig" x="966" y="235" text-anchor="middle">φ / 1 = φ</text>

<line class="dash" x1="825" y1="259" x2="1107" y2="259"/>

<text class="small" x="966" y="302" text-anchor="middle">Razón del rectángulo restante, girado</text>
<text class="mathbig" x="966" y="343" text-anchor="middle">1 / (φ − 1)</text>

<text class="math" x="966" y="397" text-anchor="middle">φ = 1 / (φ − 1)</text>
<text class="math" x="966" y="435" text-anchor="middle">φ(φ − 1) = 1</text>

<rect class="accent" x="837" y="466" width="258" height="58" rx="8"/>
<text class="mathbig" x="966" y="503" text-anchor="middle">φ² = φ + 1</text>
</svg>