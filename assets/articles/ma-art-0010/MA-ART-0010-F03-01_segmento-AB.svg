<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
<title id="title">F03-01. Segmento dado AB.</title>
<desc id="desc">El segmento AB es el único dato inicial de la construcción de Euclides II.11.</desc>
<rect width="720" height="700" fill="#ffffff"/>
<style>
  .old { stroke:#4b5563; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .new { stroke:#2563eb; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .aux { stroke:#2563eb; stroke-width:2.8; fill:none; stroke-dasharray:10 9; opacity:.86; }
  .aux-old { stroke:#94a3b8; stroke-width:2.4; fill:none; stroke-dasharray:9 9; opacity:.58; }
  .point { fill:#111827; }
  .point-new { fill:#2563eb; }
  .label { font-family:"STIX Two Math","Times New Roman",serif; font-style:italic; font-size:34px; fill:#111827; }
  .label-new { font-family:"STIX Two Math","Times New Roman",serif; font-style:italic; font-size:34px; fill:#2563eb; }
  .tick { stroke:#2563eb; stroke-width:3; stroke-linecap:round; }
  .tick-old { stroke:#64748b; stroke-width:2.7; stroke-linecap:round; }
</style>
<line x1="180.00" y1="420.00" x2="540.00" y2="420.00" class="new"/>
<circle cx="180.00" cy="420.00" r="5.5" class="point-new"/><text x="144.00" y="460.00" class="label-new">A</text>
<circle cx="540.00" cy="420.00" r="5.5" class="point-new"/><text x="554.00" y="460.00" class="label-new">B</text>
</svg>