<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="t d">
<title id="t">Genealogía de la propiedad arquimediana, disposición móvil</title>
<desc id="d">Secuencia vertical desde Eudoxo y la teoría de proporciones, pasando por Euclides Libro V y Arquímedes, hasta la formulación moderna.</desc>
<rect width="640" height="1080" rx="28" fill="#f7f7f5"/>
<text x="320" y="58" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202124">Genealogía de la idea arquimediana</text>
<text x="320" y="94" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5f6368">Prioridad de la idea y nombre tradicional</text>
<defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#6b7280"/></marker></defs>
<rect x="70" y="140" width="500" height="165" rx="22" fill="#e8f0fe" stroke="#4c78a8" stroke-width="3"/>
<text x="320" y="187" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#20324d">Eudoxo</text>
<text x="320" y="224" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#20324d">siglo IV a. C.</text>
<text x="320" y="263" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#20324d">teoría de proporciones y exhaución</text>
<line x1="320" y1="307" x2="320" y2="355" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="70" y="365" width="500" height="165" rx="22" fill="#e6f4ea" stroke="#3f8f62" stroke-width="3"/>
<text x="320" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#214d34">Euclides</text>
<text x="320" y="451" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#214d34">Libro V, Def. 4</text>
<text x="320" y="490" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#214d34">múltiplos que pueden excederse</text>
<line x1="320" y1="532" x2="320" y2="580" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="70" y="590" width="500" height="165" rx="22" fill="#fef3c7" stroke="#b7791f" stroke-width="3"/>
<text x="320" y="637" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#6b4b10">Arquímedes</text>
<text x="320" y="676" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#6b4b10">siglo III a. C.</text>
<text x="320" y="715" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#6b4b10">supuesto explícito en Esfera y cilindro I</text>
<line x1="320" y1="757" x2="320" y2="805" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="70" y="815" width="500" height="175" rx="22" fill="#f3e8ff" stroke="#8456a8" stroke-width="3"/>
<text x="320" y="862" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#4e3464">Matemática moderna</text>
<text x="320" y="904" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#4e3464">cuerpos ordenados</text>
<text x="320" y="944" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#4e3464">arquimedianos / no arquimedianos</text>
<text x="320" y="1024" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#374151">Idea eudoxiana → formulación arquimediana</text>
<text x="320" y="1054" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#374151">→ abstracción moderna</text>
</svg>