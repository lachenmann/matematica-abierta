project:
  type: website
  pre-render:
    - python3 tools/materialize_fispm_downloads.py
    - python3 tools/materialize_pm_covers.py
    - python3 tools/sanmartin_archive.py
    - python3 tools/materialize_sanmartin_figures.py
    - python3 tools/generate_sanmartin_web.py --check
  resources:
    - "assets/books/san-martin/IC2021_master_y_figuras.zip"
    - "assets/books/san-martin/IC2021_fuentes_web_completas.zip"
    - "assets/books/para-matematicos/downloads/cubiertas-v01/**"
    - "assets/books/fisica-preuniversitaria/**"
    - assets/books/mp/**
    - "manifest.webmanifest"
    - "assets/books/fispm/downloads/**"
    - "assets/books/fispm/C10/**"
    - "assets/books/fispm/C30/**"
    - "assets/books/cpm-tomo-i/downloads/**"
    - "COPYING.FDL"
    - "assets/books/cdr/**"
    - "teoria/resultados/interactive/**"
    - "assets/labs/**"
    - "app/catalog-v1.json"
    - "libros/otros/tratado-de-analisis-volumen-i.pdf"
    - "libros/otros/tratado-de-analisis-volumen-i-ficticio.png"

lang: es
bibliography: references.bib

website:
  title: "Matemática Abierta"
  description: "Cursos, teoría, problemas y libros abiertos de matemáticas."
  site-url: "https://matematicaabierta.cl/"
  favicon: assets/brand/ma-mark-light.svg
  search: true
  page-navigation: true
  draft-mode: gone

  sidebar:
    - id: ic2021-san-martin
      title: "Introducción al cálculo · IC2021"
      style: docked
      collapse-level: 1
      contents:
        - text: "Portada del libro"
          href: libros/otros/introduccion-al-calculo/index.qmd
        - section: "Parte I. Fundamentos: de los reales a la geometría"
          contents:
            - text: "1. La estructura algebraica de los números reales"
              href: libros/otros/introduccion-al-calculo/capitulo-01.qmd
            - text: "2. Orden, desigualdades e inecuaciones"
              href: libros/otros/introduccion-al-calculo/capitulo-02.qmd
            - text: "3. Coordenadas, distancias y rectas"
              href: libros/otros/introduccion-al-calculo/capitulo-03.qmd
            - text: "4. Cónicas y curvas cuadráticas"
              href: libros/otros/introduccion-al-calculo/capitulo-04.qmd
        - section: "Parte II. Funciones y trigonometría"
          contents:
            - text: "5. El lenguaje de las funciones"
              href: libros/otros/introduccion-al-calculo/capitulo-05.qmd
            - text: "6. El círculo trigonométrico y sus identidades"
              href: libros/otros/introduccion-al-calculo/capitulo-06.qmd
            - text: "7. Identidades trigonométricas y resolución de triángulos"
              href: libros/otros/introduccion-al-calculo/capitulo-07.qmd
            - text: "8. Funciones trigonométricas inversas y ecuaciones"
              href: libros/otros/introduccion-al-calculo/capitulo-08.qmd
        - section: "Parte III. La completitud de los reales y las sucesiones"
          contents:
            - text: "9. Supremos, naturales y propiedad arquimediana"
              href: libros/otros/introduccion-al-calculo/capitulo-09.qmd
            - text: "10. Sucesiones y convergencia"
              href: libros/otros/introduccion-al-calculo/capitulo-10.qmd
            - text: "11. Comparaciones, velocidad y monotonía de sucesiones"
              href: libros/otros/introduccion-al-calculo/capitulo-11.qmd
        - section: "Parte IV. Exponenciales y logaritmos"
          contents:
            - text: "12. La función exponencial y su inversa logarítmica"
              href: libros/otros/introduccion-al-calculo/capitulo-12.qmd
        - section: "Parte V. Límites de funciones y cálculo diferencial"
          contents:
            - text: "13. Puntos de acumulación y límite de una función"
              href: libros/otros/introduccion-al-calculo/capitulo-13.qmd
            - text: "14. Álgebra, comparación y límites fundamentales"
              href: libros/otros/introduccion-al-calculo/capitulo-14.qmd
            - text: "15. Límites de composiciones y caracterización épsilon-delta"
              href: libros/otros/introduccion-al-calculo/capitulo-15.qmd
            - text: "16. Límites laterales, infinito y asíntotas"
              href: libros/otros/introduccion-al-calculo/capitulo-16.qmd
            - text: "17. La derivada como límite de pendientes"
              href: libros/otros/introduccion-al-calculo/capitulo-17.qmd
            - text: "18. Reglas y técnicas de derivación"
              href: libros/otros/introduccion-al-calculo/capitulo-18.qmd
        - text: "Apéndices y fuentes"
          href: libros/otros/introduccion-al-calculo/apendices.qmd

