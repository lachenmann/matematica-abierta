format:
  html:
    theme:
      dark: [darkly, styles.scss, brand.scss]
      light: [cosmo, styles.scss, paper.scss, brand.scss]
    respect-user-color-scheme: false
    toc: true
    html-math-method: mathjax
    include-in-header:
      - assets/includes/ma-system-ui.html
    include-after-body:
      - assets/includes/ma-art-0007-responsive.html
      - assets/includes/ma-reader-controls.html
      - assets/includes/ma-result-preview.html
