<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 415" role="img" aria-labelledby="title description">
<title id="title">De las observaciones a la prueba o al contraejemplo</title>
<desc id="description">Una observación sugiere una conjetura. Una demostración general prueba la afirmación bajo hipótesis; un contraejemplo la refuta. Los ejemplos por sí solos no la prueban.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525B"/>
 </marker>
</defs>
<rect width="930" height="415" rx="24" fill="#fbfbfa"/>
<text x="465" y="35" font-size="22" font-weight="700" text-anchor="middle" fill="#142431" font-family="DejaVu Sans, sans-serif">¿Cómo se justifica una afirmación matemática?</text>
<rect x="26" y="91" width="240" height="110" rx="15" fill="#E9F4F7" stroke="#318CA1" stroke-width="2"/>
<text x="146" y="125" text-anchor="middle" font-size="18" font-weight="700" fill="#163744" font-family="DejaVu Sans, sans-serif">Ejemplos</text>
<text x="146" y="155" text-anchor="middle" font-size="14" fill="#28414C" font-family="DejaVu Sans, sans-serif">Permiten explorar</text>
<text x="146" y="178" text-anchor="middle" font-size="14" fill="#28414C" font-family="DejaVu Sans, sans-serif">y descubrir patrones</text>
<line x1="272" y1="145" x2="343" y2="145" stroke="#52525B" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="352" y="91" width="228" height="110" rx="15" fill="#F8EEDB" stroke="#B78A2B" stroke-width="2"/>
<text x="466" y="125" text-anchor="middle" font-size="18" font-weight="700" fill="#563E12" font-family="DejaVu Sans, sans-serif">Conjetura</text>
<text x="466" y="155" text-anchor="middle" font-size="14" fill="#66522D" font-family="DejaVu Sans, sans-serif">Afirmación propuesta,</text>
<text x="466" y="178" text-anchor="middle" font-size="14" fill="#66522D" font-family="DejaVu Sans, sans-serif">todavía no probada</text>
<line x1="586" y1="145" x2="647" y2="145" stroke="#52525B" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="655" y="84" width="252" height="124" rx="15" fill="#E5F3E7" stroke="#407C4B" stroke-width="2"/>
<text x="781" y="114" text-anchor="middle" font-size="18" font-weight="700" fill="#25472B" font-family="DejaVu Sans, sans-serif">Demostración</text>
<text x="781" y="145" text-anchor="middle" font-size="14" fill="#315639" font-family="DejaVu Sans, sans-serif">La conclusión se sigue</text>
<text x="781" y="166" text-anchor="middle" font-size="14" fill="#315639" font-family="DejaVu Sans, sans-serif">de las hipótesis</text>
<text x="781" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#315639" font-family="DejaVu Sans, sans-serif">VALIDEZ GENERAL</text>
<path d="M466 209 V269 H650" fill="none" stroke="#52525B" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="655" y="234" width="252" height="110" rx="15" fill="#FCEAEA" stroke="#B45454" stroke-width="2"/>
<text x="781" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#6F3030" font-family="DejaVu Sans, sans-serif">Contraejemplo</text>
<text x="781" y="296" text-anchor="middle" font-size="14" fill="#793D3D" font-family="DejaVu Sans, sans-serif">Un caso cumple hipótesis</text>
<text x="781" y="316" text-anchor="middle" font-size="14" fill="#793D3D" font-family="DejaVu Sans, sans-serif">pero no la conclusión</text>
<text x="466" y="385" text-anchor="middle" font-size="14" fill="#475569" font-family="DejaVu Sans, sans-serif">Muchos ejemplos no prueban universalidad; un contraejemplo basta para refutarla.</text>
</svg>
