<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img"><title>Polinomios y funciones sobre F2</title><rect x="0" y="0" width="1100" height="540" fill="#ffffff"/>
<text x="40" y="45" font-family="Georgia,serif" font-size="28" fill="#182c3b" text-anchor="start">Dos polinomios distintos; una misma función en F₂</text>
<text x="60" y="105" font-family="Georgia,serif" font-size="23" fill="#182c3b" text-anchor="start">Coeficientes de (1, t, t²)</text>
<text x="70" y="163" font-family="Georgia,serif" font-size="24" fill="#245b89" text-anchor="start">p = 0</text>
<text x="350" y="163" font-family="Georgia,serif" font-size="24" fill="#245b89" text-anchor="start">(0, 0, 0)</text>
<text x="70" y="220" font-family="Georgia,serif" font-size="24" fill="#a7333f" text-anchor="start">q = t² − t = t² + t</text>
<text x="350" y="262" font-family="Georgia,serif" font-size="24" fill="#a7333f" text-anchor="start">(0, 1, 1)</text>
<text x="60" y="333" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">En F₂: 1 + 1 = 0 y −1 = 1.</text>
<line x1="570" y1="95" x2="570" y2="420" stroke="#8b949e" stroke-width="2"/>
<text x="650" y="105" font-family="Georgia,serif" font-size="22" fill="#182c3b" text-anchor="start">Evaluación en todos los argumentos</text>
<text x="670" y="166" font-family="Georgia,serif" font-size="24" fill="#182c3b" text-anchor="start">x</text>
<text x="810" y="166" font-family="Georgia,serif" font-size="24" fill="#182c3b" text-anchor="start">p(x)</text>
<text x="950" y="166" font-family="Georgia,serif" font-size="24" fill="#182c3b" text-anchor="start">q(x)</text>
<line x1="640" y1="184" x2="1040" y2="184" stroke="#8b949e" stroke-width="2"/>
<text x="670" y="240" font-family="Georgia,serif" font-size="25" fill="#182c3b" text-anchor="start">0</text>
<text x="810" y="240" font-family="Georgia,serif" font-size="25" fill="#182c3b" text-anchor="start">0</text>
<text x="950" y="240" font-family="Georgia,serif" font-size="25" fill="#182c3b" text-anchor="start">0</text>
<text x="670" y="310" font-family="Georgia,serif" font-size="25" fill="#182c3b" text-anchor="start">1</text>
<text x="810" y="310" font-family="Georgia,serif" font-size="25" fill="#182c3b" text-anchor="start">0</text>
<text x="950" y="310" font-family="Georgia,serif" font-size="25" fill="#182c3b" text-anchor="start">0</text>
<text x="650" y="395" font-family="Georgia,serif" font-size="22" fill="#182c3b" text-anchor="start">Funciones iguales en todo F₂</text>
<text x="60" y="490" font-family="Georgia,serif" font-size="22" fill="#182c3b" text-anchor="start">Comparar coeficientes y comparar valores son dos pruebas de igualdad diferentes.</text>
</svg>
