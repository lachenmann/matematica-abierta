<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img"><title>Suma vectorial y cambio de sentido</title><rect x="0" y="0" width="1100" height="600" fill="#ffffff"/>
<text x="40" y="42" font-family="Georgia,serif" font-size="27" fill="#182c3b" text-anchor="start">Suma por componentes; producto por un escalar negativo</text>
<line x1="65.0" y1="440" x2="604.0" y2="440" stroke="#8b949e" stroke-width="1"/>
<polygon points="604.0,440 592.0,435.0 592.0,445.0" fill="#8b949e"/>
<line x1="240" y1="524.0" x2="240" y2="118.0" stroke="#8b949e" stroke-width="1"/>
<polygon points="240,118.0 235.0,130.0 245.0,130.0" fill="#8b949e"/>
<text x="611.0" y="447.0" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">x</text>
<text x="248.4" y="121.5" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">y</text>
<line x1="450" y1="370" x2="520" y2="230" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="310" y1="300" x2="520" y2="230" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="240" y1="440" x2="450" y2="370" stroke="#245b89" stroke-width="3"/>
<polygon points="450,370 437.03466159330964,369.0513167019495 440.196939253478,378.5381496824546" fill="#245b89"/>
<line x1="240" y1="440" x2="310" y2="300" stroke="#287a57" stroke-width="3"/>
<polygon points="310,300 300.1613008990009,308.4970583144992 309.1055728090001,312.96919426949876" fill="#287a57"/>
<line x1="240" y1="440" x2="520" y2="230" stroke="#a7333f" stroke-width="3"/>
<polygon points="520,230 507.4,233.2 513.4,241.2" fill="#a7333f"/>
<text x="460" y="390" font-family="Georgia,serif" font-size="19" fill="#245b89" text-anchor="start">u = (3, 1)</text>
<text x="290" y="285" font-family="Georgia,serif" font-size="19" fill="#287a57" text-anchor="start">v = (1, 2)</text>
<text x="532" y="225" font-family="Georgia,serif" font-size="20" fill="#a7333f" text-anchor="start">u + v = (4, 3)</text>
<line x1="240" y1="440" x2="135.0" y2="475.0" stroke="#245b89" stroke-width="3"/>
<polygon points="135.0,475.0 147.96533840669036,475.9486832980505 144.80306074652196,466.4618503175454" fill="#245b89"/>
<text x="45" y="508" font-family="Georgia,serif" font-size="19" fill="#245b89" text-anchor="start">−u/2 = (−1,5; −0,5)</text>
<circle cx="240" cy="440" r="5" fill="#182c3b"/>
<text x="250" y="465" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">0</text>
<text x="765" y="190" font-family="Georgia,serif" font-size="23" fill="#182c3b" text-anchor="start">La suma:</text>
<text x="765" y="229" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">(3 + 1, 1 + 2) = (4, 3)</text>
<text x="765" y="310" font-family="Georgia,serif" font-size="23" fill="#182c3b" text-anchor="start">El múltiplo −u/2:</text>
<text x="765" y="349" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">sentido opuesto</text>
<text x="765" y="382" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">mitad de la longitud</text>
<text x="40" y="570" font-family="Georgia,serif" font-size="19" fill="#182c3b" text-anchor="start">Geometría en R² con escala igual en ambos ejes; la definición general no exige longitud.</text>
</svg>
