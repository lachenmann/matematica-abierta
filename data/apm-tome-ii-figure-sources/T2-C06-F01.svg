<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>Una recta de coeficientes produce la misma salida</title><rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
<text x="35" y="45" font-family="Georgia,serif" font-size="25" fill="#182c3b" text-anchor="start">La ambigüedad está en los coeficientes: una relación no cambia la salida</text>
<line x1="210" y1="435" x2="474.0" y2="435" stroke="#929aa3" stroke-width="1"/>
<polygon points="474.0,435 463.0,431.0 463.0,439.0" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<text x="482.0" y="440" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">a</text>
<line x1="210" y1="435" x2="355.0" y2="307.4" stroke="#929aa3" stroke-width="1"/>
<polygon points="355.0,307.4 344.0996397342816,311.6640527761212 349.38466289341784,317.66976091150326" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<text x="363.0" y="312.4" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">b</text>
<line x1="210" y1="435" x2="210" y2="162.0" stroke="#929aa3" stroke-width="1"/>
<polygon points="210,162.0 206.0,173.0 214.0,173.0" fill="#929aa3" fill-opacity="1" stroke="#929aa3" stroke-width="1"/>
<text x="218" y="167.0" font-family="Georgia,serif" font-size="18" fill="#182c3b" text-anchor="start">c</text>
<line x1="454" y1="412" x2="235" y2="283" stroke="#245b89" stroke-width="4"/>
<circle cx="381" cy="369" r="5" fill="#a7333f"/>
<circle cx="308" cy="326" r="5" fill="#287a57"/>
<text x="399" y="349" font-family="Georgia,serif" font-size="20" fill="#a7333f" text-anchor="start">(2, 3, 0)</text>
<text x="293" y="361" font-family="Georgia,serif" font-size="20" fill="#287a57" text-anchor="end">(1, 2, 1)</text>
<text x="70" y="525" font-family="Georgia,serif" font-size="23" fill="#245b89" text-anchor="start">Coeficientes: (2 − s, 3 − s, s)</text>
<line x1="600" y1="115" x2="600" y2="535" stroke="#929aa3" stroke-width="1"/>
<text x="650" y="148" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">u = (1, 0, 1), v = (0, 1, 1)</text>
<text x="650" y="188" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">w = u + v = (1, 1, 2)</text>
<text x="650" y="266" font-family="Georgia,serif" font-size="23" fill="#a7333f" text-anchor="start">2u + 3v = (2, 3, 5)</text>
<text x="650" y="310" font-family="Georgia,serif" font-size="23" fill="#287a57" text-anchor="start">u + 2v + w = (2, 3, 5)</text>
<text x="650" y="397" font-family="Georgia,serif" font-size="20" fill="#182c3b" text-anchor="start">Cambio de coeficientes: (−1, −1, 1)</text>
<text x="650" y="440" font-family="Georgia,serif" font-size="24" fill="#245b89" text-anchor="start">−u − v + w = 0</text>
<text x="35" y="585" font-family="Georgia,serif" font-size="19" fill="#182c3b" text-anchor="start">La recta del espacio de coeficientes se muestra en proyección oblicua; no representa tres salidas.</text>
</svg>
