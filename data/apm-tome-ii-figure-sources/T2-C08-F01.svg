<text x="935.36" y="315.9" font-family="Georgia,serif" font-size="18" fill="#1f5b9d">u = (2, 1)</text>
<text x="633.5" y="206.7" font-family="Georgia,serif" font-size="18" fill="#a63d40">v = (−1, 2)</text>
<text x="859.7" y="148.2" font-family="Georgia,serif" font-size="18" fill="#24354b">u + v = (1, 3)</text>
<text x="70" y="515" font-family="Georgia,serif" font-size="21" fill="#24354b">T(e₁ + e₂) = T(e₁) + T(e₂)</text>
<text x="70" y="558" font-family="Georgia,serif" font-size="18" fill="#24354b">El cálculo universal prueba linealidad; este paralelogramo representa un caso concreto.</text>
</svg>