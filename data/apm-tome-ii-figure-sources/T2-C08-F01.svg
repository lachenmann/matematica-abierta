<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc">
<title id="title">8.1. La suma se reconstruye con dos salidas</title><desc id="desc">Dos entradas usuales y su suma se transforman mediante T(x,y)=(2x-y,x+2y), conservando las combinaciones lineales.</desc>
