"/><text x="720" y="350.0" font-size="23" fill="#637785" text-anchor="start">r</text><path d="M670 275 L670 375" stroke="#23806b" stroke-width="2" fill="none"/><text x="650" y="332.0" font-size="24" fill="#23806b" text-anchor="end">d</text><path d="M670 363 L682 363" stroke="#23806b" stroke-width="2" fill="none"/><path d="M682 363 L682 375" stroke="#23806b" stroke-width="2" fill="none"/><text x="670" y="455" font-size="25" fill="#23806b" text-anchor="middle">τz + : antihorario</text><text x="45" y="515" font-size="23" fill="#637785" text-anchor="start">F horizontal positiva · arriba de O: τz &lt; 0 · abajo: τz &gt; 0</text></g></svg>