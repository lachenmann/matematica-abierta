<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img"><title>Desplazamiento respecto del equilibrio vertical</title><rect width="900" height="550" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="45" y="40" font-size="28" fill="#23678e" text-anchor="start">Dos orígenes para el resorte vertical</text><path d="M100 85 L760 85" fill="none" stroke="#687b88" stroke-width="2.5"/><path d="M280 85 L280 120" fill="none" stroke="#687b88" stroke-width="2.5"/><polyline points="260.00,120.00 300.00,132.00 260.00,144.00 300.00,156.00 260.00,168.00 300.00,180.00 260.00,192.00 300.00,204.00 260.00,216.00 300.00,228.00 260.00,240.00 300.00,252.00 260.00,264.00" fill="none" stroke="#687b88" stroke-width="3"/><path d="M280 264 L280 310" fill="none" stroke="#687b88" stroke-width="2.5"/><rect x="225" y="310" width="110" height="75" rx="5" fill="#dfedf4" stroke="#23678e" stroke-width="2"/><text x="280" y="357" font-size="27" fill="#23678e" text-anchor="middle">m</text><path d="M370 220 L780 220" fill="none" stroke="#687b88" stroke-width="2.5" stroke-dasharray="7 6"/><text x="400" y="205" font-size="24" fill="#687b88" text-anchor="start">y = 0: longitud natural</text><path d="M370 345 L780 345" fill="none" stroke="#22836d" stroke-width="2.5" stroke-dasharray="7 6"/><text x="400" y="330" font-size="24" fill="#22836d" text-anchor="start">yₑ = mg/k: equilibrio</text><path d="M720 370 L720 465" fill="none" stroke="#22836d" stroke-width="2.5"/><path d="M720 465 l-12 -5 l0 10 Z" fill="#22836d" transform="rotate(90.0 720 465)"/><text x="745" y="440" font-size="24" fill="#22836d" text-anchor="start">+q</text><path d="M820 225 L820 465" fill="none" stroke="#687b88" stroke-width="2.5"/><path d="M820 465 l-12 -5 l0 10 Z" fill="#687b88" transform="rotate(90.0 820 465)"/><text x="835" y="405" font-size="24" fill="#687b88" text-anchor="start">+y</text><text x="45" y="515" font-size="25" fill="#23678e" text-anchor="start">q = y − yₑ · en equilibrio: kyₑ = mg</text></g></svg>