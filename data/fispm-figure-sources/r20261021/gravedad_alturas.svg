<text x="40" y="104" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#173b56" text-anchor="start">g₀ = 10,00 m/s²</text>
<text x="490" y="104" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#173b56" text-anchor="start">g₂ = (8,27 ± 0,03) m/s²</text>
<text x="490" y="158" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">r₂ = R + h = 1,10R</text>
<text x="490" y="197" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">R = 6,00 × 10⁶ m</text>
<text x="40" y="491" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#173b56" text-anchor="start">Altura y radio central son magnitudes distintas.</text>
<text x="40" y="529" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">Las distancias y las flechas son esquemáticas.</text>
