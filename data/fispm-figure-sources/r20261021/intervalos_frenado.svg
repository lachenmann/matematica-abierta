<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-labelledby="title desc">
<title id="title">Comparación de las cotas de distancia y longitud</title><desc id="desc">La distancia de frenado se acota entre catorce coma ochenta y cinco y diecisiete coma veintisiete metros. La longitud disponible está entre diecinueve coma nueve y veinte coma uno. El margen garantizado en este modelo es de dos coma sesenta y tres metros.</desc>
<rect width="1040" height="330" fill="white"/>
<g font-family="Arial, sans-serif" font-size="17" fill="#192d40">
<text x="40" y="32" font-size="22" font-weight="bold">Comparar los extremos que deciden la conclusión</text>
<path d="M100,252H950" stroke="#192d40" stroke-width="1.5"/>
<path d="M100.000,252v6" stroke="#192d40"/><text x="100.000" y="282" text-anchor="middle">14</text>
<path d="M221.429,252v6" stroke="#192d40"/><text x="221.429" y="282" text-anchor="middle">15</text>
<path d="M342.857,252v6" stroke="#192d40"/><text x="342.857" y="282" text-anchor="middle">16</text>
<path d="M464.286,252v6" stroke="#192d40"/><text x="464.286" y="282" text-anchor="middle">17</text>
<path d="M585.714,252v6" stroke="#192d40"/><text x="585.714" y="282" text-anchor="middle">18</text>
<path d="M707.143,252v6" stroke="#192d40"/><text x="707.143" y="282" text-anchor="middle">19</text>
<path d="M828.571,252v6" stroke="#192d40"/><text x="828.571" y="282" text-anchor="middle">20</text>
<path d="M950.000,252v6" stroke="#192d40"/><text x="950.000" y="282" text-anchor="middle">21</text>
<text x="950" y="314" text-anchor="end">longitud (m)</text>
<text x="350.143" y="95" text-anchor="middle">distancia de frenado</text><rect x="203.214" y="112" width="293.857" height="16" fill="#225b91"/>
<text x="203.214" y="152" text-anchor="middle" font-size="15">14,85</text>
<text x="497.071" y="152" text-anchor="middle" font-size="15">17,27</text>
<text x="828.571" y="165" text-anchor="middle">longitud disponible</text><rect x="816.429" y="182" width="24.286" height="16" fill="#27795d"/>
<text x="816.429" y="224" text-anchor="end" font-size="15">19,9</text>
