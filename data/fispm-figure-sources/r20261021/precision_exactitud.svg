<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Precisión y cercanía a una referencia</title><desc id="desc">A se concentra alrededor de 12,40 centímetros con rango 0,04. B tiene rango 0,08 alrededor de la referencia idealizada de 12,60 centímetros. Los puntos muestran las cinco lecturas en cada serie.</desc>
<rect width="800" height="400" fill="white"/>
<g font-family="Arial, sans-serif" font-size="17" fill="#192d40">
<text x="32" y="32" font-size="21" font-weight="bold">Repetir de forma parecida no asegura acertar</text>
<path d="M577.4999999999983,86V274" stroke="#263e50" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="577.4999999999983" y="72" text-anchor="middle" font-size="17">referencia: 12,60 cm</text>
<text x="32" y="150" font-size="19" font-weight="bold">A</text><path d="M220.0000000000001,145H284.99999999999875" stroke="#225b91" stroke-width="3"/>
<circle cx="252.49999999999943" cy="145" r="4.5" fill="#225b91"/>
<circle cx="284.99999999999875" cy="145" r="4.5" fill="#225b91"/>
<circle cx="236.24999999999977" cy="145" r="4.5" fill="#225b91"/>
<circle cx="268.7499999999991" cy="145" r="4.5" fill="#225b91"/>
<circle cx="220.0000000000001" cy="145" r="4.5" fill="#225b91"/>
<text x="252.49999999999943" y="181" text-anchor="middle" font-size="17">media 12,40; rango 0,04 cm</text>
<text x="32" y="245" font-size="19" font-weight="bold">B</text><path d="M512.4999999999997,240H642.4999999999998" stroke="#27795d" stroke-width="3"/>
<circle cx="512.4999999999997" cy="240" r="4.5" fill="#27795d"/>
<circle cx="609.9999999999976" cy="240" r="4.5" fill="#27795d"/>
<circle cx="577.4999999999983" cy="240" r="4.5" fill="#27795d"/>
<circle cx="642.4999999999998" cy="240" r="4.5" fill="#27795d"/>
<circle cx="544.999999999999" cy="240" r="4.5" fill="#27795d"/>
<text x="577.4999999999983" y="276" text-anchor="middle" font-size="17">media 12,60; rango 0,08 cm</text>
<path d="M90,302H740" stroke="#192d40"/>
<path d="M90.0,302v7" stroke="#192d40"/><text x="90.0" y="333" text-anchor="middle" font-size="17">12,3</text>
<path d="M252.49999999999943,302v7" stroke="#192d40"/><text x="252.49999999999943" y="333" text-anchor="middle" font-size="17">12,4</text>
<path d="M414.99999999999886,302v7" stroke="#192d40"/><text x="414.99999999999886" y="333" text-anchor="middle" font-size="17">12,5</text>
<path d="M577.4999999999983,302v7" stroke="#192d40"/><text x="577.4999999999983" y="333" text-anchor="middle" font-size="17">12,6</text>
<path d="M739.9999999999977,302v7" stroke="#192d40"/><text x="739.9999999999977" y="333" text-anchor="middle" font-size="17">12,7</text>
<text x="740" y="364" text-anchor="end" font-size="17">longitud (cm)</text>
<text x="400" y="391" text-anchor="middle" font-size="16">Datos simulados; referencia tratada como exacta solo en el ejemplo.</text>
</g></svg>