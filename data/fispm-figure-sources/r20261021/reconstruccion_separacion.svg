<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">Una raíz puede pertenecer a otra historia</title><desc id="d">La separación efectiva sigue una parábola hasta cinco segundos y una recta después. La parábola prolongada se anula fuera de su dominio, antes del encuentro efectivo.</desc><rect width="800" height="470" fill="white"/><g font-family="Arial,sans-serif" font-size="17" fill="#192d40">
