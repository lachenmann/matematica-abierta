<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img"><title>Triángulo de velocidades de un choque elástico</title><rect width="900" height="610" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="45" y="40" font-size="28" fill="#23678e" text-anchor="start">Velocidades de salida de masas iguales</text><path d="M170 310 L650 310" fill="none" stroke="#687b88" stroke-width="3"/><path d="M650 310 l-11 -6 l0 12 Z" fill="#687b88" transform="rotate(0.0 650 310)"/><text x="670" y="318" font-size="24" fill="#687b88" text-anchor="start">u = (4, 0)</text><path d="M170 310 L530 102.15390309173475" fill="none" stroke="#23678e" stroke-width="3"/><path d="M530 102.15390309173475 l-11 -6 l0 12 Z" fill="#23678e" transform="rotate(-29.999999999999996 530 102.15390309173475)"/><text x="450" y="80" font-size="23" fill="#23678e" text-anchor="start">v₁ = (3, √3) m/s</text><path d="M170 310 L290 517.8460969082653" fill="none" stroke="#22836d" stroke-width="3"/><path d="M290 517.8460969082653 l-11 -6 l0 12 Z" fill="#22836d" transform="rotate(60.00000000000001 290 517.8460969082653)"/><text x="325" y="510" font-size="23" fill="#22836d" text-anchor="start">v₂ = (1, −√3) m/s</text><path d="M530 102.15390309173475 L650 310" fill="none" stroke="#22836d" stroke-width="3" stroke-dasharray="7 6"/><path d="M290 517.8460969082653 L650 310" fill="none" stroke="#23678e" stroke-width="3" stroke-dasharray="7 6"/><text x="45" y="565" font-size="23" fill="#687b88" text-anchor="start">Suma vectorial: v₁ + v₂ = u; producto escalar: v₁ · v₂ = 0</text></g></svg>