id: MA-CLS-C13-P01
status: assembly-implemented
language: es
title: "Del área a las sumas"
subtitle: "Tres ideas para entrar en la teoría integral"
source:
  visible_chapter: 13
  internal_file: T1-C14.md
  title: "Del área y las sumas a la integral"

target_duration_seconds: 185
duration_tolerance_seconds: 20
silent_preview:
  class: MAClsC13P01
  purpose: "QA de continuidad visual antes de incorporar voz."
  timing_note: "La duración del preview silencioso no es todavía la duración editorial definitiva."

structure:
  - id: opening
    type: bridge
    target_seconds: 12
    visual: "Título sobre fondo oscuro; sin fórmula nueva."
    purpose: "Plantear el recorrido sin añadir contenido matemático."

  - id: block-1
    type: visualization
    source_id: MA-VIZ-C13-002
    source_class: MAVizC13RiemannRefinement
    target_seconds: 45
    purpose: "Del área geométrica al encierro por sumas y al refinamiento."

  - id: bridge-1
    type: bridge
    target_seconds: 8
    visual: "Fondo oscuro; una sola frase."
    on_screen: "Refinar controla la incertidumbre. Ahora falta entender qué se suma."
    purpose: "Pasar del encierro a la estructura de una suma."

  - id: block-2
    type: visualization
    source_id: MA-VIZ-C13-003
    source_class: MAVizC13RiemannTermToSum
    target_seconds: 45
    purpose: "Hacer emerger f(xi_i) Delta x_i y la suma de Riemann."

  - id: bridge-2
    type: bridge
    target_seconds: 8
    visual: "Fondo oscuro; una sola frase."
    on_screen: "Una suma puede acumular cantidades positivas y negativas."
    purpose: "Preparar la distinción entre integral con signo y área geométrica."

  - id: block-3
    type: visualization
    source_id: MA-VIZ-C13-004
    source_class: MAVizC13SignedIntegralVsArea
    target_seconds: 50
    purpose: "Separar integral con signo de área geométrica total."

  - id: closing
    type: bridge
    target_seconds: 17
    visual: "Mapa conceptual mínimo de tres pasos."
    on_screen:
      - "encerrar"
      - "sumar"
      - "distinguir signo y área"
    purpose: "Cerrar el recorrido sin definir todavía la integral general."

transitions:
  visual:
    method: "fade-through-background"
    duration_seconds: 0.6
    preserve_background: true
    preserve_palette: true
  audio:
    overlap_seconds: 0
    rule: "La nueva frase comienza sólo después de cerrar la anterior."

constraints:
  - "No introducir la definición general de integral de Riemann."
  - "No repetir dentro de las transiciones fórmulas ya mostradas."
  - "No añadir ejemplos nuevos."
  - "Una relación matemática dominante por momento."
  - "Los puentes no deben superar dos líneas en pantalla."
  - "Las tres MA-VIZ siguen siendo reutilizables de forma independiente."
