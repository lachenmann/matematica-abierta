name: Spivak C01 transfer and real Quarto QA (temporary)

on:
  push:
    branches:
      - publicacion/spivak-c01-20260922
    paths:
      - .github/workflows/spivak-transfer.yml

permissions:
  contents: write

jobs:
  transfer-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Transfer only the derived chapter, not the Drive master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p problemas/colecciones/spivak-calculus
          curl --fail --location --silent --show-error --retry 2 --max-time 120 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f788-820e-a536-7cebe867c13c/raw?se=2026-09-23T00%3A49%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=8378c251-0591-5aed-89d8-9ccdefae0566&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A01%3A57Z&ske=2026-09-23T23%3A01%3A57Z&sks=b&skv=2026-02-06&sig=xUOCNiY9IjcSET1uq/ga656wTWwmV6Dkb7SDbI66c6U%3D' -o problemas/colecciones/spivak-calculus/capitulo-01.qmd
          echo 'e6032555ef420580be6e8efa63d6831442592a519526d7125764d3db65580e1e  problemas/colecciones/spivak-calculus/capitulo-01.qmd' | sha256sum --check --status
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('problemas/colecciones/spivak-calculus/capitulo-01.qmd')
          data=p.read_text(encoding='utf-8')
          ids=re.findall(r'^## (SPV4-C01-E\d{3})\b',data,re.M)
          assert ids==[f'SPV4-C01-E{i:03d}' for i in range(1,26)],ids
          assert len(re.findall(r'^### ',data,re.M))==202
          assert '$el de $k=0$$' not in data
          print('PASS: exact derivative SHA-256, 25 exercise IDs, 202 subsections')
          PY
      - name: Install website Quarto version
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render the actual full chapter with website configuration
        run: quarto render problemas/colecciones/spivak-calculus/capitulo-01.qmd --to html
      - name: Inspect real HTML output and report limitations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          matches=list(Path('_site').rglob('capitulo-01.html'))
          assert len(matches)==1, f'Expected one rendered chapter; got {matches}'
          html=matches[0].read_text(encoding='utf-8')
          missing=[f'SPV4-C01-E{i:03d}' for i in range(1,26) if f'SPV4-C01-E{i:03d}' not in html]
          assert not missing,missing
          assert 'mathjax' in html.lower(), 'MathJax loader not found'
          assert 'spivak-c01.css' in html, 'Chapter-specific responsive CSS not linked'
          assert 'independiente y no oficial' in html, 'Provenance statement absent'
          math_hits=len(re.findall(r'class="math (?:inline|display)"',html))
          assert math_hits>500,f'Unexpectedly few math elements: {math_hits}'
          print(f'PASS: {matches[0]}, 25 exercise identifiers, {math_hits} math elements, MathJax, provenance, CSS')
          print('LIMITS: browser typography, mobile overflow, independent math and copyright review not certified by this workflow.')
          PY
      - name: Commit only the verified derived QMD to publication branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- problemas/colecciones/spivak-calculus/capitulo-01.qmd
          git diff --cached --exit-code --quiet && exit 0
          git commit -m 'feat(spivak): incorporar capítulo 1 derivado con QA Quarto real'
          git push origin HEAD:publicacion/spivak-c01-20260922
