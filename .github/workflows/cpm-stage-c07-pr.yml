name: CPM C07 prepare public PR candidate

on:
  push:
    branches:
      - cpm/publicacion-capitulo-7
    paths:
      - .github/workflows/cpm-stage-c07-pr.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'lachenmann/matematica-abierta'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CPM_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.CPM_DRIVE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out only the approved publication branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: cpm/publicacion-capitulo-7
      - name: Install read-only Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Accept valid LaTeX row spacing in source checking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/cpm_stage_c07_public.py')
          source = path.read_text(encoding='utf-8')
          needle = " or '\\[' in body"
          if source.count(needle) != 1:
              raise SystemExit('Unexpected staging script version')
          path.write_text(source.replace(needle, '', 1), encoding='utf-8')
          PY
      - name: Prepare derivative and validate exact private source
        run: python scripts/cpm_stage_c07_public.py
      - name: Ensure only expected website files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- libros/capitulos/algebra-de-derivadas-y-regla-de-la-cadena.md libros/capitulos/index.qmd libros/para-matematicos/calculo-para-matematicos.md
          git diff --cached --check
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' libros/capitulos/algebra-de-derivadas-y-regla-de-la-cadena.md libros/capitulos/index.qmd libros/para-matematicos/calculo-para-matematicos.md | sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo 'Unexpected changed-file set; not committing.' >&2
            exit 1
          fi
      - name: Commit candidate to PR branch only; no merge or deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'CPM: proponer capítulo 7 y actualizar índices web (revisión pendiente)'
          git push origin HEAD:cpm/publicacion-capitulo-7
