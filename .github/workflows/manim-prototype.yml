name: Manim prototype preview

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/ma-cls-c13
    paths:
      - "audiovisual/manim/**"
      - ".github/workflows/manim-prototype.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:v0.21.0
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render refinement scene
        run: >
          manim -ql
          audiovisual/manim/ma_cls_c13_p01/scene.py
          MAVizC13RiemannRefinement
          --media_dir media

      - name: Render term-to-sum scene
        run: >
          manim -ql
          audiovisual/manim/ma_cls_c13_p01/scene.py
          MAVizC13RiemannTermToSum
          --media_dir media

      - name: Render signed-integral scene
        run: >
          manim -ql
          audiovisual/manim/ma_cls_c13_p01/scene.py
          MAVizC13SignedIntegralVsArea
          --media_dir media

      - name: Render assembled microclass
        run: >
          manim -ql
          audiovisual/manim/ma_cls_c13_p01/scene.py
          MAClsC13P01
          --media_dir media

      - name: Render timed microclass
        run: >
          manim -ql
          audiovisual/manim/ma_cls_c13_p01/scene.py
          MAClsC13P01Timed
          --media_dir media

      - name: Verify timed duration
        run: |
          python - <<'PY'
          import glob
          import av

          matches = glob.glob("media/**/MAClsC13P01Timed.mp4", recursive=True)
          if not matches:
              raise SystemExit("No se encontró MAClsC13P01Timed.mp4")
          path = matches[0]
          with av.open(path) as container:
              if container.duration is None:
                  raise SystemExit("El contenedor MP4 no informa duración")
              duration = float(container.duration * av.time_base)
          print(f"Timed preview: {duration:.3f} s")
          if not 183.0 <= duration <= 187.0:
              raise SystemExit(f"Duración fuera de tolerancia: {duration:.3f} s")
          PY

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: MA-C13-prototype-timed
          path: media/videos/**/*.mp4
          if-no-files-found: error
