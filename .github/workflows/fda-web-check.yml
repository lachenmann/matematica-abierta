name: FDA web publication QA

on:
  pull_request:
    paths:
      - 'libros/otros/la-demostracion-admirable/**'
      - 'libros/otros/index.qmd'
      - '_project/ID_REGISTRY.md'
      - 'tools/generate_app_catalog.py'
      - 'tests/fda_web_browser.cjs'
      - '.github/workflows/fda-web-check.yml'

permissions:
  contents: read

jobs:
  fda-render-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate and generate catalog
        run: |
          python3 tools/generate_app_catalog.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('app/catalog-v1.json').read_text(encoding='utf-8'))
          ids={item['id']:item for item in data['items']}
          expected=['MA-BOK-0012']+[f'MA-BCH-{i:04d}' for i in range(149,165)]
          assert all(x in ids for x in expected)
          assert ids['MA-BOK-0012']['path']=='/libros/otros/la-demostracion-admirable/index.html'
          for x in expected[1:]:
              assert ids[x].get('parentId')=='MA-BOK-0012'
          print('FDA catalog QA: 17/17 IDs')
          PY
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render FDA candidate
        run: |
          quarto render libros/otros/la-demostracion-admirable --to html
          quarto render libros/index.qmd --to html
          quarto render libros/otros/index.qmd --to html
          quarto render libros/tratados/index.qmd --to html
          quarto render teoria/resultados/index.qmd --to html
          quarto render teoria/metodos/index.qmd --to html
          test "$(find _site/libros/otros/la-demostracion-admirable -maxdepth 1 -name '*.html' | wc -l)" -eq 17
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/fda-browser" playwright@1.62.1
          "$RUNNER_TEMP/fda-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check FDA desktop/mobile light/dark rendering
        env:
          NODE_PATH: ${{ runner.temp }}/fda-browser/node_modules
        run: |
          python -m http.server 8765 --directory _site > "$RUNNER_TEMP/fda-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/fda_web_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fda-browser-evidence
          path: browser-evidence-fda
          retention-days: 7
