name: ANM complete edition QA
on:
  pull_request:
    paths:
      - 'libros/capitulos/analisis-para-matematicos*'
      - 'libros/para-matematicos/analisis-para-matematicos.md'
      - 'assets/books/anm/**'
      - 'data/anm-*'
      - '_quarto-anm-qa.yml'
      - 'tests/anm_edition_browser.cjs'
      - '.github/workflows/anm-edition-qa.yml'
permissions:
  contents: read
jobs:
  render-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render all ANM pages
        run: |
          quarto render --profile anm-qa --to html
          python3 tools/check_anm_c00_semantic_html.py --site-dir _site-anm-qa
          python3 tools/check_anm_c01_pilot_html.py --site-dir _site-anm-qa
          python3 tools/check_anm_c01_semantic_html.py --site-dir _site-anm-qa
          python3 tools/check_book_layout.py --site-dir _site-anm-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/anm-browser" playwright@1.56.0
          "$RUNNER_TEMP/anm-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check formulas, images and mobile themes
        env:
          NODE_PATH: ${{ runner.temp }}/anm-browser/node_modules
        run: |
          python3 -m http.server 8766 --directory _site-anm-qa > "$RUNNER_TEMP/anm-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/anm_edition_browser.cjs
      - name: Preserve ANM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anm-complete-edition-qa
          path: .ma-build/anm-browser
          retention-days: 14
          if-no-files-found: warn
