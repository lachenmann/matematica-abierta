name: One-time MA-CON-0020 certification sync
on:
  push:
    branches: [editorial/ma-con-0020-certificacion-quince]
permissions:
  contents: write
jobs:
  apply-and-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified canonical certification and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('conceptos/axiomas-de-cuerpo-y-consecuencias-algebraicas-basicas.md')
          b = p.read_bytes()
          def blob(b):
              return hashlib.sha1(b"blob " + str(len(b)).encode() + b"\0" + b).hexdigest()
          assert blob(b) == 'a55bbca062c1a8ba91da502261f794a009378cff', "Source changed: abort rather than overwrite"
          s = b.decode("utf-8")
          start = s.index('::: {.ma-block .ma-comprobacion}\n')
          end = s.index("\n:::\n", start) + len("\n:::")
          assert s.count('::: {.ma-block .ma-comprobacion}\n') >= 1
          s = s[:start] + '::: {.ma-block .ma-comprobacion}\n**Verificación formal en Lean 4 — quince consecuencias algebraicas**\n\nEn el módulo `MatematicaAbierta.ConsecuenciasCuerpo` se han verificado **quince resultados**. Catorce se formulan para un cuerpo arbitrario `F`: unicidad del neutro aditivo (§4.1: `neutro_aditivo_unico`), unicidad del neutro multiplicativo (§4.2: `neutro_multiplicativo_unico`), unicidad del inverso aditivo (§5.1: `inverso_aditivo_unico`), unicidad del inverso multiplicativo (§5.2: `inverso_multiplicativo_unico`), absorción del cero (§6: `cero_absorbe_producto`), imposibilidad de invertir el cero (§7: `cero_no_tiene_inverso_multiplicativo`), multiplicación por $-1$ (§8.1: `menos_uno_por`), desplazamiento del signo menos entre factores (§8.2: `menos_primer_factor`, `menos_segundo_factor`), producto de dos negativos (§8.3: `producto_dos_negativos`), doble negación e inverso aditivo del cero (§8.4: `doble_negacion`, `inverso_aditivo_cero`), cancelación multiplicativa con factor no nulo (§10: `cancelacion_multiplicativa`) y equivalencia del producto nulo (§11: `producto_nulo_iff`). El resultado restante, la cancelación aditiva (§9: `cancelacion_aditiva`), se demuestra bajo la hipótesis más débil de un grupo aditivo `[AddGroup G]`, sin exigir conmutatividad ni multiplicación.\n\nLa unicidad del inverso multiplicativo compara dos candidatos sin usar cancelación multiplicativa. La imposibilidad de invertir el cero se obtiene de `cero_absorbe_producto` y `zero_ne_one`, sin división. Las seis pruebas de §8 utilizan distributividad, unicidad del inverso aditivo, conmutatividad y resultados anteriores; la doble negación se demuestra antes de emplearse en el producto de dos negativos, sin dependencia circular. La cancelación aditiva suma un inverso a ambos lados. Las pruebas explicitan sus pasos y usan leyes estructurales de Mathlib; no invocan directamente los teoremas finales como demostración.\n\n[Consultar el módulo Lean en la revisión fija verificada](https://github.com/lachenmann/matematica-abierta/blob/f311903c53d1bc866c893af7b63af3493f0b4b52/lean/MatematicaAbierta/ConsecuenciasCuerpo.lean) · [PR #99: seis resultados iniciales](https://github.com/lachenmann/matematica-abierta/pull/99) · [PR #113: dos resultados](https://github.com/lachenmann/matematica-abierta/pull/113) · [PR #124: inversión del cero](https://github.com/lachenmann/matematica-abierta/pull/124) · [PR #132: seis reglas de signos](https://github.com/lachenmann/matematica-abierta/pull/132) ([Lean aprobado](https://github.com/lachenmann/matematica-abierta/actions/runs/35563377740); [Quarto aprobado](https://github.com/lachenmann/matematica-abierta/actions/runs/35563377745)).\n\n**Alcance preciso.** La verificación parte de `Field F` y `AddGroup G` suministradas por Mathlib; no construye un cuerpo desde primeros principios ni comprueba paso a paso todas las pruebas manuscritas. `cancelacion_aditiva` verifica la implicación $a+c=b+c\\Rightarrow a=b$, pero no declara separadamente la equivalencia completa de §9. El teorema de §7 prueba que `0 * c ≠ 1` para todo `c : F`, no que el inverso totalizado `0⁻¹` sea un inverso multiplicativo. Siguen sin certificación específica la división (§12), las ecuaciones lineales (§13) y otras afirmaciones no enumeradas.\n:::' + s[end:]
          b_new = s.encode("utf-8")
          assert blob(b_new) == '2653cc1e332a73e7fcd5e8f1fa7eb8bffbfb16f9', "Derived content is not byte-for-byte canonical"
          p.write_bytes(b_new)
          print("Verified canonical web blob:", blob(b_new))
          PY
          git rm -- .github/workflows/ma-con-0020-certificacion-quince-once.yml
          git add -- conceptos/axiomas-de-cuerpo-y-consecuencias-algebraicas-basicas.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: publicar certificación Lean de quince resultados en MA-CON-0020"
          git push origin HEAD:editorial/ma-con-0020-certificacion-quince
