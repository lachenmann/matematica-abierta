name: AUD-022 targeted proof repair (one shot)

on:
  push:
    branches: [audit/fdc-aud-022-programa-transparente]
    paths:
      - '.github/workflows/audit022-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace recursive simp by one-step definitional proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean')
          s = p.read_text(encoding='utf-8')
          old = '  change buscarHasta χA χB p (n + 1) = some b\n  simp [buscarHasta, h]\n'
          new = ('  change (match buscarHasta χA χB p n with\n'
                 '    | some c => some c\n'
                 '    | none => etapaConcreta χA χB p (n + 1)) = some b\n'
                 '  rw [h]\n')
          assert s.count(old) == 1, 'Refusing an ambiguous or missing proof site'
          p.write_text(s.replace(old, new), encoding='utf-8')
          assert 'theorem programaVisible_estable_succ' in p.read_text()
          PY
          rm .github/workflows/audit022-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean .github/workflows/audit022-repair.yml
          git diff --cached --check
          git commit -m 'AUD-022: unfold only one fuel step in stability proof'
          git push origin HEAD:audit/fdc-aud-022-programa-transparente
