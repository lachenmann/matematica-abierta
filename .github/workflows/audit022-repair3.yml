name: AUD-022 induction proof repair (one shot)

on:
  push:
    branches: [audit/fdc-aud-022-programa-transparente]
    paths:
      - '.github/workflows/audit022-repair3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use definitional equality in induction instead of global simplification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean')
          s = p.read_text(encoding='utf-8')
          old = ('  induction k with\n'
                 '  | zero => simpa using h\n'
                 '  | succ k ih =>\n'
                 '      have hs := programaVisible_estable_succ χA χB p (n + k) b ih\n'
                 '      simpa [Nat.add_succ] using hs\n')
          new = ('  induction k with\n'
                 '  | zero => exact h\n'
                 '  | succ k ih =>\n'
                 '      have hs := programaVisible_estable_succ χA χB p (n + k) b ih\n'
                 '      exact hs\n')
          assert s.count(old) == 1, 'Ambiguous or absent induction proof'
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/audit022-repair3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean .github/workflows/audit022-repair3.yml
          git diff --cached --check
          git commit -m 'AUD-022: use definitional equality in fuel induction'
          git push origin HEAD:audit/fdc-aud-022-programa-transparente
