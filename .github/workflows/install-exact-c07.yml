name: Install exact C7

on:
  push:
    branches:
      - publish/algebra-v2-c07
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: publish/algebra-v2-c07
          fetch-depth: 0

      - name: Decode exact public derivative
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/c07/exact.md.gz.b64 | gzip -dc > libros/capitulos/conjuntos-y-algebra-de-conjuntos.md
          rm -rf .tmp/c07
          rm -f .github/workflows/install-exact-c07.yml
          test "$(git hash-object libros/capitulos/conjuntos-y-algebra-de-conjuntos.md)" = "bca97399688e39d6c90dc3d418c0c738f2bf4cdc"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install exact canonical C7 public derivative"
          git push origin HEAD:publish/algebra-v2-c07
