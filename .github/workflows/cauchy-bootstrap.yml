name: Cauchy-Schwarz Integrate

on:
  push:
    branches:
      - publish/cauchy-schwarz

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: publish/cauchy-schwarz

      - name: Integrate existing derived sources
        run: |
          python3 tools/integrate_cauchy_repo.py
          python3 tests/cauchy_static.py
          node --check teoria/resultados/interactive/cauchy-schwarz.js
          node --check teoria/resultados/interactive/cauchy-schwarz-embed.js

      - name: Commit index and reciprocal link only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teoria/resultados/index.qmd teoria/resultados/desigualdad-triangular.qmd
          if ! git diff --cached --quiet; then
            git commit -m "Integrate Cauchy-Schwarz index and reciprocal link"
            git push origin HEAD:publish/cauchy-schwarz
          else
            echo "Content integration is already up to date."
          fi
