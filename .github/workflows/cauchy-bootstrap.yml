name: Cauchy-Schwarz Bootstrap

on:
  push:
    branches:
      - publish/cauchy-schwarz

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: publish/cauchy-schwarz

      - name: Install Drive downloader
        run: python -m pip install --disable-pip-version-check gdown

      - name: Download canonical sources
        run: |
          gdown 1AoE-duo6Hq-vKJX7RC-BoMyTkHqkRVPd -O /tmp/MA-ART-0004.md
          gdown 199NIdie6ynAEXBw46ZZdODRZGzpcM5Wp -O /tmp/MA-APP-0002.html
          test -s /tmp/MA-ART-0004.md
          test -s /tmp/MA-APP-0002.html

      - name: Generate web derivatives and integrate repository
        env:
          MA_CS_ARTICLE: /tmp/MA-ART-0004.md
          MA_CS_HTML: /tmp/MA-APP-0002.html
        run: |
          python tools/build_cauchy_sources.py
          python tools/integrate_cauchy_repo.py
          python tests/cauchy_static.py
          node --check teoria/resultados/interactive/cauchy-schwarz-embed.js

      - name: Commit generated publication sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teoria/resultados/desigualdad-cauchy-schwarz.qmd \
                  teoria/resultados/laboratorio-cauchy-schwarz.qmd \
                  teoria/resultados/interactive/cauchy-schwarz.html \
                  teoria/resultados/interactive/cauchy-schwarz-embed.js \
                  teoria/resultados/index.qmd \
                  teoria/resultados/desigualdad-triangular.qmd \
                  .github/workflows/quarto-check.yml
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Publish Cauchy-Schwarz article and laboratory"
            git push origin HEAD:publish/cauchy-schwarz
          fi
