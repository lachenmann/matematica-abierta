name: Axler C3 staging temporal
on:
  push:
    branches: [axler/publicar-3d-3e-20260922]
    paths: ['.axler_payload/READY']
permissions:
  contents: write
jobs:
  install:
    if: github.ref == 'refs/heads/axler/publicar-3d-3e-20260922'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruir tres derivados aprobados y retirar ficheros temporales
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import base64, hashlib, io
          d=Path('.axler_payload')
          assert (d/'READY').read_text().strip() == '341d8cd9d1f279f7deb59dc2924d20cca78c87d5116810d9ca0b731f3054f11e'
          chunks=[d/f'{i:03d}.b64' for i in range(7)]
          assert all(p.exists() for p in chunks)
          payload=base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True)
          assert hashlib.sha256(payload).hexdigest() == '341d8cd9d1f279f7deb59dc2924d20cca78c87d5116810d9ca0b731f3054f11e'
          expected={
            'libros/axler-ladr-es/index.qmd':'54e1076b6e9952d7dcef6f74b16111a2b574e4a829bdf4217f9c0c15ff4f5900',
            'libros/axler-ladr-es/traduccion/03-capitulo-3/3d-invertibilidad-isomorfismos.qmd':'315b21b73f45835f55fca52dea0ac1dc4e5c89d36645048a83d1eaf066185be3',
            'libros/axler-ladr-es/traduccion/03-capitulo-3/3e-productos-cocientes.qmd':'55a6e3ab588958cbdd7a204c9296166ea83b0f431bd06dd611f75cc2676fe9d7',
          }
          with ZipFile(io.BytesIO(payload)) as z:
              assert set(z.namelist()) == set(expected)
              data={p:z.read(p) for p in expected}
          for p, sha in expected.items():
              assert hashlib.sha256(data[p]).hexdigest() == sha, p
          import subprocess
          index='libros/axler-ladr-es/index.qmd'
          assert subprocess.check_output(['git','hash-object',index],text=True).strip() == '9fa2de60792f3073351613957271b8d4e1cf1778', 'El índice base cambió'
          for p in expected:
              if p != index: assert not Path(p).exists(), f'Ya existe {p}'
          for p in expected:
              dest=Path(p); dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(data[p])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .axler_payload .github/workflows/axler-c3-stage.yml
          git add libros/axler-ladr-es/index.qmd libros/axler-ladr-es/traduccion/03-capitulo-3/3d-invertibilidad-isomorfismos.qmd libros/axler-ladr-es/traduccion/03-capitulo-3/3e-productos-cocientes.qmd
          git diff --cached --check
          git commit -m 'Axler: integrar secciones 3D y 3E con 43 soluciones'
          git push origin HEAD:refs/heads/axler/publicar-3d-3e-20260922
