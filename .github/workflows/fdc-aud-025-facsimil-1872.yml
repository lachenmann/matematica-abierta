name: FDC AUD025 | Facsimil Dedekind 1872
on:
  push:
    branches:
      - audit/fdc-aud-025-dedekind-1872
    paths:
      - .github/workflows/fdc-aud-025-facsimil-1872.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  facsimil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check --quiet pymupdf pillow requests
      - name: Download institutional original and render every page
        run: |
          python - <<'PY'
          import json, hashlib, pathlib, traceback, time
          import requests
          from PIL import Image, ImageDraw
          import fitz
          out=pathlib.Path("audit25-evidence")
          out.mkdir(exist_ok=True)
          urls=[
            "https://www.e-rara.ch/zut/download/pdf/19451236",
            "https://www.e-rara.ch/download/pdf/19451236.pdf",
            "https://www.e-rara.ch/download/pdf/19451236",
          ]
          log={"title":"Stetigkeit und irrationale Zahlen","author":"Richard Dedekind","edition":"Braunschweig: Friedrich Vieweg und Sohn, 1872","institution":"ETH-Bibliothek Zürich","shelfmark":"Rar 22802","persistent_id":"https://doi.org/10.3931/e-rara-71757","record":"https://www.e-rara.ch/zut/content/titleinfo/19451236","attempts":[]}
          filename=out/"Dedekind_1872_ETH_Rar22802_original.pdf"
          for url in urls:
            for n in range(2):
              try:
                r=requests.get(url,headers={"User-Agent":"Mozilla/5.0 (Scholarly source verification)","Accept":"application/pdf,*/*"},timeout=90)
                trace={"url":url,"attempt":n+1,"status":r.status_code,"final_url":r.url,"bytes":len(r.content),"content_type":r.headers.get("content-type",""),"sha256":hashlib.sha256(r.content).hexdigest()}
                log["attempts"].append(trace)
                if r.ok and r.content[:4]==b"%PDF" and len(r.content)>100000:
                  filename.write_bytes(r.content)
                  log["source_pdf"]=trace
                  break
              except Exception as e:
                log["attempts"].append({"url":url,"attempt":n+1,"error":str(e)[:500]})
              time.sleep(2)
            if filename.exists():break
          if filename.exists():
            d=fitz.open(filename)
            log["page_count"]=len(d)
            previews=[]
            for i,p in enumerate(d):
              pix=p.get_pixmap(matrix=fitz.Matrix(1.3,1.3),alpha=False)
              image=Image.frombytes("RGB",[pix.width,pix.height],pix.samples)
              target=out/f"page_{i+1:03d}.jpg"
              image.save(target,quality=85,optimize=True)
              thumb=image.copy()
              thumb.thumbnail((360,500))
              previews.append((i+1,thumb))
            w=4*380
            for start in range(0,len(previews),16):
              items=previews[start:start+16]
              sheet=Image.new("RGB",(w,4*530),"white")
              draw=ImageDraw.Draw(sheet)
              for j,(pn,im) in enumerate(items):
                x=(j%4)*380;y=(j//4)*530
                sheet.paste(im,(x+4,y+24))
                draw.text((x+6,y+5),f"PDF page {pn}",fill="black")
              sheet.save(out/f"contact_{1+start//16:02d}.jpg",quality=86,optimize=True)
            log["status"]="SUCCESS"
            log["pdf_sha256"]=hashlib.sha256(filename.read_bytes()).hexdigest()
            log["rendered_images"]=len(previews)
          else:
            log["status"]="DOWNLOAD_FAILED"
          (out/"SOURCE_MANIFEST.json").write_text(json.dumps(log,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in log.items() if k not in ("attempts",)},indent=2))
          print("Attempt diagnostics:",json.dumps(log["attempts"],indent=2))
          PY
      - name: Preserve download and imaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdc-aud025-dedekind-1872-eth
          path: audit25-evidence/
          retention-days: 7
      - name: Enforce positive download result
        run: python -c "import json; assert json.load(open('audit25-evidence/SOURCE_MANIFEST.json'))['status']=='SUCCESS'"
