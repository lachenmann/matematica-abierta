name: Update C7 support files

on:
  push:
    branches:
      - publish/algebra-v2-c07
  workflow_dispatch:

jobs:
  update-support:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: publish/algebra-v2-c07
          fetch-depth: 0

      - name: Update publication navigation and ID registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object libros/capitulos/conjuntos-y-algebra-de-conjuntos.md)" = "bca97399688e39d6c90dc3d418c0c738f2bf4cdc"
          python - <<'PY'
          from pathlib import Path

          chapter_id = 'MA-BCH-0018'
          chapter_title = 'Conjuntos y álgebra de conjuntos'
          chapter_path = 'libros/capitulos/conjuntos-y-algebra-de-conjuntos.md'

          reg = Path('_project/ID_REGISTRY.md')
          s = reg.read_text(encoding='utf-8')
          if f'| {chapter_id} | book-chapter |' not in s:
              s = s.replace('| Capítulo | MA-BCH-0018 |', '| Capítulo | MA-BCH-0019 |', 1)
              anchor = '| MA-BCH-0017 | book-chapter | Cuantificadores, predicados y lenguaje matemático | `libros/capitulos/cuantificadores-predicados-y-lenguaje-matematico.md` | published |'
              row = f'| {chapter_id} | book-chapter | {chapter_title} | `{chapter_path}` | published |'
              assert anchor in s
              s = s.replace(anchor, anchor + '\n' + row, 1)
              reg.write_text(s, encoding='utf-8')

          book = Path('libros/para-matematicos/algebra-para-matematicos.md')
          s = book.read_text(encoding='utf-8')
          if '  - MA-BCH-0018' not in s:
              s = s.replace('  - MA-BCH-0017\nprovenance:', '  - MA-BCH-0017\n  - MA-BCH-0018\nprovenance:', 1)
          item = '7. [**Conjuntos y álgebra de conjuntos**](../capitulos/conjuntos-y-algebra-de-conjuntos.md) (`MA-BCH-0018`).'
          if item not in s:
              anchor = '6. [**Cuantificadores, predicados y lenguaje matemático**](../capitulos/cuantificadores-predicados-y-lenguaje-matematico.md) (`MA-BCH-0017`).'
              assert anchor in s
              s = s.replace(anchor, anchor + '\n' + item, 1)
          s = s.replace('cerrados y aprobados sus primeros once capítulos', 'cerrados y aprobados sus primeros doce capítulos', 1)
          s = s.replace('los capítulos 1, 2, 3, 4, 5 y 6 mediante el flujo canónico', 'los capítulos 1, 2, 3, 4, 5, 6 y 7 mediante el flujo canónico', 1)
          book.write_text(s, encoding='utf-8')

          idx = Path('libros/capitulos/index.qmd')
          s = idx.read_text(encoding='utf-8')
          item = '- [**Conjuntos y álgebra de conjuntos**](conjuntos-y-algebra-de-conjuntos.md) (`MA-BCH-0018`) — Séptimo capítulo del Tomo I: pertenencia, extensionalidad, inclusión, conjunto potencia, unión, intersección, diferencia, complemento, diferencia simétrica, álgebra de conjuntos, doble inclusión y producto cartesiano; incluye 80 ejercicios con soluciones desarrolladas.'
          if item not in s:
              anchor = '- [**Cuantificadores, predicados y lenguaje matemático**](cuantificadores-predicados-y-lenguaje-matematico.md) (`MA-BCH-0017`) — Sexto capítulo del Tomo I: predicados, dominios, variables libres y ligadas, cuantificadores universal y existencial, negación, alcance, dependencia, orden de cuantificadores y existencia única; incluye 80 ejercicios con soluciones desarrolladas.'
              assert anchor in s
              s = s.replace(anchor, anchor + '\n' + item, 1)
              idx.write_text(s, encoding='utf-8')

          area = Path('explorar/areas/algebra.qmd')
          s = area.read_text(encoding='utf-8')
          item = '- [**Conjuntos y álgebra de conjuntos**](../../libros/capitulos/conjuntos-y-algebra-de-conjuntos.md) (`MA-BCH-0018`) — Séptimo capítulo publicado del Tomo I: pertenencia, extensionalidad, inclusión, conjunto potencia, operaciones y leyes del álgebra de conjuntos, doble inclusión y producto cartesiano.'
          if item not in s:
              anchor = '- [**Cuantificadores, predicados y lenguaje matemático**](../../libros/capitulos/cuantificadores-predicados-y-lenguaje-matematico.md) (`MA-BCH-0017`) — Sexto capítulo publicado del Tomo I: predicados, dominios, variables libres y ligadas, cuantificadores, negación, alcance, dependencia y existencia única.'
              assert anchor in s
              s = s.replace(anchor, anchor + '\n' + item, 1)
              area.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/update-c07-support.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Algebra chapter 7 publication navigation"
          git push origin HEAD:publish/algebra-v2-c07
