name: APM repair C1-C3

on:
  push:
    branches:
      - repair/apm-c1-c3-identifiers
    paths:
      - '.github/workflows/apm-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/apm-c1-c3-identifiers
          fetch-depth: 0

      - name: Reconstruct repaired APM chapters
        shell: bash
        run: |
          set -euo pipefail
          cat _project/.apm-repair-payload.part* > /tmp/apm_payload.b64
          base64 -d /tmp/apm_payload.b64 > /tmp/apm_payload.tgz
          tar -xzf /tmp/apm_payload.tgz -C .
          rm -f _project/.apm-repair-payload.part*
          rm -f .github/workflows/apm-repair.yml

      - name: Commit repaired tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair APM chapters 1-3 and qualify source identifiers'
          git push origin HEAD:repair/apm-c1-c3-identifiers
