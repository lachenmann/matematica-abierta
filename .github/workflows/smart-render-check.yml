name: Smart render safeguards
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/smart_render.py'
      - 'tests/test_smart_render.py'
      - 'tests/smart_render_integration.py'
      - '.github/workflows/publish.yml'
      - '.github/workflows/quarto-check.yml'
      - '.github/workflows/smart-render-check.yml'
permissions:
  contents: read
jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test dependency selection and fallbacks
        run: python3 -m unittest tests/test_smart_render.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Validate fresh checkout, transferred state and exact output
        run: python3 tests/smart_render_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: smart-render-integration
          path: .ma-build/integration-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

