name: Temporary MA-CON-0020 section 7 sync
on:
  push:
    branches:
      - editorial/ma-con-0020-nota-auditoria-seccion7
    paths:
      - .github/workflows/ma-con-0020-section7-sync-temporal.yml
permissions:
  contents: write
jobs:
  sync-source-to-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply source-derived note with exact blob and scope guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('conceptos/axiomas-de-cuerpo-y-consecuencias-algebraicas-basicas.md')
          old = p.read_text(encoding='utf-8')
          old_sha = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          assert old_sha == 'facef52a8915fc742fece8f35594b4327dabaaed', f'Unexpected source version: {old_sha}'
          assert 'Auditoría de dependencias y alcance' not in old
          anchor = 'Ésta es la razón estructural por la que no existe división por cero en un cuerpo.\n\n## 8. Reglas de signos como consecuencias'
          assert old.count(anchor) == 1
          replacement = r'''Ésta es la razón estructural por la que no existe división por cero en un cuerpo.

          ::: {.ma-block .ma-observacion}
          **Auditoría de dependencias y alcance**

          Esta contradicción utiliza dos hechos: $0c=0$, demostrado en §6, y el axioma $0\neq1$. No necesita cancelación multiplicativa ni presupone una operación de división.

          La afirmación «$0$ no tiene inverso multiplicativo» significa precisamente que **no existe** $c\in F$ tal que $0c=1$. Aunque una formalización asigne convencionalmente un valor a la expresión $0^{-1}$ para definir la operación de inverso en todo el cuerpo, ese valor no satisface $0\cdot0^{-1}=1$ y, por tanto, no es un inverso multiplicativo de cero.
          :::

          ## 8. Reglas de signos como consecuencias'''
          # GitHub Actions' shell block indentation is removed by YAML, but the
          # embedded triple-quoted paragraph needs its indentation stripped.
          import textwrap
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.split('\n'))
          new = old.replace(anchor, replacement)
          p.write_text(new, encoding='utf-8')
          new_sha = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          assert new_sha == 'a55bbca062c1a8ba91da502261f794a009378cff', f'Unexpected output: {new_sha}'
          print('Source-derived note only; source blob verified:', old_sha, '->', new_sha)
          PY
          git diff --check
          git add -- conceptos/axiomas-de-cuerpo-y-consecuencias-algebraicas-basicas.md
          git -c user.name='Matematica Abierta editorial' -c user.email='80990661+lachenmann@users.noreply.github.com' commit -m 'docs(MA-CON-0020): sync §7 audit note from Obsidian'
          git push origin HEAD:editorial/ma-con-0020-nota-auditoria-seccion7