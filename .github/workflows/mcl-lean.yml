name: MCL Lean CI

on:
  push:
    branches: ["main"]
    paths:
      - "lean/aprender-matematicas-con-lean/**"
      - ".github/workflows/mcl-lean.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lean/aprender-matematicas-con-lean/**"
      - ".github/workflows/mcl-lean.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/aprender-matematicas-con-lean
          build: true
          test: false
