name: MCL Lean CI

on:
  push:
    branches: ["main"]
    paths:
      - "lean/aprender-matematicas-con-lean/**"
      - ".github/workflows/mcl-lean.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lean/aprender-matematicas-con-lean/**"
      - ".github/workflows/mcl-lean.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean/aprender-matematicas-con-lean
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        working-directory: .
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build MCL
        run: lake build
