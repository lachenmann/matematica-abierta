name: MCL Lean CI

on:
  push:
    branches: ["main"]
    paths:
      - "lean/aprender-matematicas-con-lean/**"
      - ".github/workflows/mcl-lean.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lean/aprender-matematicas-con-lean/**"
      - ".github/workflows/mcl-lean.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean/aprender-matematicas-con-lean
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/aprender-matematicas-con-lean
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Resolve dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build MCL
        run: lake build
