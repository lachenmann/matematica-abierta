name: Temporary MA-CON-0020 editorial sync
on:
  push:
    branches:
      - editorial/ma-con-0020-certificacion-nueve
    paths:
      - .github/workflows/ma-con-0020-sync9-temporal.yml
permissions:
  contents: write
jobs:
  apply-editorial-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update web derivative from approved Obsidian changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('conceptos/axiomas-de-cuerpo-y-consecuencias-algebraicas-basicas.md')
          actual = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          assert actual == 'c7e5b12bd536ae9594ebf16909a3a7eda2fe5354', f'unexpected source blob: {actual}'
          s = p.read_text(encoding='utf-8')
          changes = [
              ('date-modified: 2026-09-20', 'date-modified: 2026-09-21'),
              ('Verificación formal en Lean 4 — ocho consecuencias algebraicas', 'Verificación formal en Lean 4 — nueve consecuencias algebraicas'),
              ('se han verificado **ocho resultados**. Siete se formulan', 'se han verificado **nueve resultados**. Ocho se formulan'),
              ('absorción del cero (§6: `cero_absorbe_producto`), cancelación multiplicativa', 'absorción del cero (§6: `cero_absorbe_producto`), imposibilidad de invertir el cero (§7: `cero_no_tiene_inverso_multiplicativo`), cancelación multiplicativa'),
              ('El octavo, la cancelación aditiva', 'El noveno, la cancelación aditiva'),
              ('La cancelación aditiva desarrolla la suma de un inverso a ambos lados. Las demostraciones', 'La imposibilidad de invertir el cero se obtiene de `cero_absorbe_producto` y `zero_ne_one`, sin usar división ni cancelación multiplicativa. La cancelación aditiva desarrolla la suma de un inverso a ambos lados. Las demostraciones'),
              ('blob/0a52b49e8770a8f3a8fae36daf4d73f5dc4c29ed/lean/MatematicaAbierta/ConsecuenciasCuerpo.lean', 'blob/d773e244057eea39ee5b5308c71cb47f69cacfe0/lean/MatematicaAbierta/ConsecuenciasCuerpo.lean'),
              ('[Ver la PR #113 (dos resultados nuevos y CI)](https://github.com/lachenmann/matematica-abierta/pull/113).', '[Ver la PR #113 (dos resultados nuevos y CI)](https://github.com/lachenmann/matematica-abierta/pull/113) · [Ver la PR #124 (imposibilidad de invertir cero y CI)](https://github.com/lachenmann/matematica-abierta/pull/124).'),
              ('Permanecen fuera de esta certificación la imposibilidad de invertir el cero (§7), las reglas de signos (§8),', 'El teorema de §7 establece, para cada `c : F`, que `0 * c ≠ 1`; no afirma que la expresión totalizada `0⁻¹` sea un inverso multiplicativo. Permanecen fuera de esta certificación las reglas de signos (§8),'),
          ]
          for old, new in changes:
              assert s.count(old) == 1, (old, s.count(old))
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          actual = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          assert actual == 'facef52a8915fc742fece8f35594b4327dabaaed', f'unexpected result blob: {actual}'
          print('PASS: exact approved Obsidian note -> web note; blob', actual)
          PY
      - name: Commit only the derived article
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- conceptos/axiomas-de-cuerpo-y-consecuencias-algebraicas-basicas.md
          git commit -m 'docs: certificar nueve consecuencias de cuerpo en la web'
          git push origin HEAD:editorial/ma-con-0020-certificacion-nueve
