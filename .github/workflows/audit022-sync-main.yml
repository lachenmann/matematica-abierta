name: AUD-022 guarded main synchronization (one shot)

on:
  push:
    branches: [audit/fdc-aud-022-programa-transparente]
    paths:
      - '.github/workflows/audit022-sync-main.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/fdc-aud-022-programa-transparente
          fetch-depth: 0
      - name: Merge latest main, preserve newly added imports, and delete helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ "$unresolved" != 'lean/MatematicaAbierta.lean' ]; then
              echo "Unexpected merge conflicts: $unresolved" >&2
              exit 1
            fi
            python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('lean/MatematicaAbierta.lean')
          main_source = subprocess.check_output(['git', 'show', 'origin/main:lean/MatematicaAbierta.lean'], text=True)
          new_import = 'import MatematicaAbierta.Continuo.ProgramaTransparente\n'
          assert main_source.count('import MatematicaAbierta.TeoriaDeFunciones.Reindexacion\n') == 1
          assert new_import not in main_source
          assert main_source.count('\n\n/-!') == 1
          merged = main_source.replace('\n\n/-!', '\n' + new_import + '\n/-!', 1)
          assert merged.count(new_import) == 1
          for line in main_source.splitlines():
              if line.startswith('import '):
                  assert line in merged.splitlines(), line
          p.write_text(merged, encoding='utf-8')
          PY
            git add lean/MatematicaAbierta.lean
          fi
          test -f lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean
          grep -q '^import MatematicaAbierta.Continuo.ProgramaTransparente$' lean/MatematicaAbierta.lean
          grep -q '^import MatematicaAbierta.TeoriaDeFunciones.Reindexacion$' lean/MatematicaAbierta.lean
          rm .github/workflows/audit022-sync-main.yml
          git add .github/workflows/audit022-sync-main.yml
          git diff --cached --check
          git commit -m 'AUD-022: merge updated main preserving Lean imports'
          git push origin HEAD:audit/fdc-aud-022-programa-transparente
