name: CPM Tomo I · navegador
on:
  pull_request:
    branches: [main]
    paths:
      - 'libros/capitulos/**'
      - 'libros/para-matematicos/calculo-para-matematicos.md'
      - 'assets/books/cpm-tomo-i/**'
      - 'data/cpm-tome-i-*'
      - 'tests/cpm_tome*'
      - '_quarto-cpm-qa.yml'
      - '.github/workflows/cpm-tome-qa.yml'
permissions:
  contents: read
concurrency:
  group: cpm-tome-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify source integrity and links
        run: python3 tests/cpm_tome_static.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render integrated chapters
        run: |
          quarto render --profile cpm-qa --to html
          python3 tests/cpm_tome_html.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Check MathJax and responsive layout
        run: |
          python3 -m http.server 8788 --directory _site-cpm-qa >/tmp/cpm-http.log 2>&1 &
          node tests/cpm_tome_browser.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpm-tome-i-browser-qa
          path: |
            cpm-browser-qa/
            _site-cpm-qa/
          retention-days: 7
          if-no-files-found: error
