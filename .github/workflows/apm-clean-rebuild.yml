name: APM clean rebuild validation

on:
  push:
    branches:
      - rebuild/apm-clean-2026-09-11
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v7
        with:
          ref: rebuild/apm-clean-2026-09-11

      - name: Structural QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('libros/capitulos')
          specs = [
              ('algebra-para-matematicos-capitulo-1-del-calculo-aritmetico-al-lenguaje-algebraico.md', 'apm-t1-c01-e', 56),
              ('algebra-para-matematicos-capitulo-2-logica-proposicional-y-algebra-de-proposiciones.md', 'apm-t1-c02-e', 78),
              ('algebra-para-matematicos-capitulo-3-predicados-cuantificadores-y-lenguaje-matematico.md', 'apm-t1-c03-e', 72),
          ]

          total_e = total_s = 0
          for fn, prefix, expected in specs:
              p = root / fn
              t = p.read_text(encoding='utf-8')
              e = len(re.findall(rf'(?mi)^###\s+.*\{{#{re.escape(prefix)}\d{{4}}\}}\s*$', t))
              s = len(re.findall(r'(?m)^####\s+Solución\s*$', t))
              assert e == s == expected, (fn, e, s, expected)
              assert '{{< include ' not in t, fn
              assert 'APM-I-' not in t, fn
              total_e += e
              total_s += s

          assert total_e == total_s == 206

          obsolete = [p for p in root.glob('_algebra-c0*.md') if p.is_file()]
          assert not obsolete, f'Obsolete APM fragments remain: {obsolete}'
          print(f'PASS: {total_e} exercises / {total_s} solutions; standalone pages only')
          PY

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render full site and persist diagnostics on failure
        shell: bash
        run: |
          set +e
          quarto render > _project/APM_QUARTO_RENDER.log 2>&1
          status=$?
          cat _project/APM_QUARTO_RENDER.log
          echo "$status" > _project/APM_QUARTO_RENDER.status
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _project/APM_QUARTO_RENDER.log _project/APM_QUARTO_RENDER.status
            git commit -m "Capture APM Quarto render failure [skip ci]" || true
            git push origin HEAD:rebuild/apm-clean-2026-09-11
            exit "$status"
          fi
          rm -f _project/APM_QUARTO_RENDER.log _project/APM_QUARTO_RENDER.status

      - name: Final QA
        shell: bash
        run: |
          echo 'PASS: clean APM rebuild and full Quarto render succeeded'
