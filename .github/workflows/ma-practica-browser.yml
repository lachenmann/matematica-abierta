name: MA-Práctica — QA real de navegador

on:
  pull_request:
    branches: [main]
    paths:
      - 'practica/**'
      - '.github/workflows/ma-practica-browser.yml'

permissions:
  contents: read

concurrency:
  group: ma-practica-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Browser QA for all algebra pilot exercises
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/ma-practica-http.log 2>&1 &
          python -u practica/tests/browser-qa.py
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-practica-browser-evidence
          path: practica/browser-qa-artifacts/
          if-no-files-found: warn
          retention-days: 2
