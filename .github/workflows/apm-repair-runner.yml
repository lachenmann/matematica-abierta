name: APM one-shot repair runner

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apm-repair-runner.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair source branch
        uses: actions/checkout@v4
        with:
          ref: repair/apm-c1-c3-identifiers
          fetch-depth: 0

      - name: Reconstruct final repaired tree and make patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          cat _project/.apm-repair-payload.part* > /tmp/apm_payload.b64
          base64 -d /tmp/apm_payload.b64 > /tmp/apm_payload.tgz
          tar -xzf /tmp/apm_payload.tgz -C .
          rm -f _project/.apm-repair-payload.part*
          rm -f .github/workflows/apm-repair.yml
          git diff --binary origin/main -- . ':(exclude).github/workflows/apm-repair-runner.yml' > /tmp/apm-repair.patch
          test -s /tmp/apm-repair.patch

      - name: Apply repair atomically to main and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          git apply --index /tmp/apm-repair.patch
          git rm .github/workflows/apm-repair-runner.yml
          git diff --cached --check
          test -f _project/IDENTIFIER_POLICY.md
          grep -q 'source-id: APM-T1-C01' libros/capitulos/algebra-para-matematicos-capitulo-1-del-calculo-aritmetico-al-lenguaje-algebraico.md
          grep -q 'source-id: APM-T1-C02' libros/capitulos/algebra-para-matematicos-capitulo-2-logica-proposicional-y-algebra-de-proposiciones.md
          grep -q 'source-id: APM-T1-C03' libros/capitulos/algebra-para-matematicos-capitulo-3-predicados-cuantificadores-y-lenguaje-matematico.md
          grep -q 'APM-T1-C01-D0001' libros/capitulos/_algebra-c01-01.md
          grep -q 'trasfondo preteórico' libros/capitulos/_algebra-c01-01.md
          ! find _project -maxdepth 1 -name '.apm-repair-payload.part*' | grep -q .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair APM chapters 1-3 and qualify source identifiers'
          git push origin main
