name: APM one-shot repair runner

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apm-repair-runner.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair source branch
        uses: actions/checkout@v4
        with:
          ref: repair/apm-c1-c3-identifiers
          fetch-depth: 0

      - name: Reconstruct and validate repaired tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, tarfile
          parts = sorted(Path('_project').glob('.apm-repair-payload.part*'))
          assert parts, 'No repair payload parts found'
          raw = b''.join(p.read_bytes() for p in parts)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          clean += b'=' * ((-len(clean)) % 4)
          print(f'payload parts={len(parts)} raw={len(raw)} clean={len(clean)}')
          decoded = base64.b64decode(clean, validate=False)
          Path('/tmp/apm_payload.tgz').write_bytes(decoded)
          with tarfile.open('/tmp/apm_payload.tgz', 'r:gz') as tf:
              tf.extractall('.')
          PY

          rm -f _project/.apm-repair-payload.part*
          rm -f .github/workflows/apm-repair.yml

          # Remove obsolete split fragments from the previous web edition.
          rm -f libros/capitulos/_algebra-c02-11a.md libros/capitulos/_algebra-c02-11b.md
          rm -f libros/capitulos/_algebra-c02-12a.md libros/capitulos/_algebra-c02-12b.md
          rm -f libros/capitulos/_algebra-c03-12a.md libros/capitulos/_algebra-c03-12b.md libros/capitulos/_algebra-c03-12c.md

          # Structural QA before producing any patch.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('libros/capitulos')
          frags = sorted(root.glob('_algebra-c0[123]-*.md'))
          expected = {1:10, 2:12, 3:12}
          for c,n in expected.items():
              fs = sorted(root.glob(f'_algebra-c0{c}-*.md'))
              assert len(fs) == n, (c, len(fs), [p.name for p in fs])
          assert len(frags) == 34, len(frags)
          total_ex = 0
          for p in frags:
              s = p.read_text(encoding='utf-8')
              assert '#apm-i-' not in s.lower(), p
              assert '![[ ' not in s and '![[ ' not in s, p
              assert s.count('$$') % 2 == 0, ('unbalanced $$', p)
              assert s.count(':::') % 2 == 0, ('unbalanced div', p)
              total_ex += len(re.findall(r'^### .*\{#apm-t1-c0[123]-e\d{4}\}\s*$', s, re.M | re.I))
          assert total_ex == 206, total_ex
          wrappers = {
              'algebra-para-matematicos-capitulo-1-del-calculo-aritmetico-al-lenguaje-algebraico.md':'APM-T1-C01',
              'algebra-para-matematicos-capitulo-2-logica-proposicional-y-algebra-de-proposiciones.md':'APM-T1-C02',
              'algebra-para-matematicos-capitulo-3-predicados-cuantificadores-y-lenguaje-matematico.md':'APM-T1-C03',
          }
          for fn,sid in wrappers.items():
              s=(root/fn).read_text(encoding='utf-8')
              assert f'source-id: {sid}' in s, fn
          assert Path('_project/IDENTIFIER_POLICY.md').is_file()
          print(f'QA OK: fragments={len(frags)} exercises={total_ex}')
          PY

          git diff --binary origin/main -- . ':(exclude).github/workflows/apm-repair-runner.yml' > /tmp/apm-repair.patch
          test -s /tmp/apm-repair.patch

      - name: Apply repair atomically to main and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          git apply --index /tmp/apm-repair.patch
          git rm .github/workflows/apm-repair-runner.yml
          git diff --cached --check
          test -f _project/IDENTIFIER_POLICY.md
          grep -q 'source-id: APM-T1-C01' libros/capitulos/algebra-para-matematicos-capitulo-1-del-calculo-aritmetico-al-lenguaje-algebraico.md
          grep -q 'source-id: APM-T1-C02' libros/capitulos/algebra-para-matematicos-capitulo-2-logica-proposicional-y-algebra-de-proposiciones.md
          grep -q 'source-id: APM-T1-C03' libros/capitulos/algebra-para-matematicos-capitulo-3-predicados-cuantificadores-y-lenguaje-matematico.md
          grep -q 'APM-T1-C01-D0001' libros/capitulos/_algebra-c01-01.md
          grep -q 'trasfondo preteórico' libros/capitulos/_algebra-c01-01.md
          ! grep -Rqi '#apm-i-' libros/capitulos/_algebra-c0[123]-*.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair APM chapters 1-3 and qualify source identifiers'
          git push origin main
