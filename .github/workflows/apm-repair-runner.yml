name: APM one-shot repair runner

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apm-repair-runner.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair APM chapters 1-3 in place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('libros/capitulos')

          # 1. Qualify every historical chapter-local APM-I-* identifier.
          for chapter in (1, 2, 3):
              prefix = f'APM-T1-C0{chapter}'
              for path in sorted(root.glob(f'_algebra-c0{chapter}-*.md')):
                  text = path.read_text(encoding='utf-8')
                  text = text.replace('APM-I-', prefix + '-')
                  text = text.replace('#apm-i-', '#' + prefix.lower() + '-')
                  path.write_text(text, encoding='utf-8')

          # 2. Normalize fragments that had been split only for transport/render convenience.
          groups = {
              root / '_algebra-c02-11.md': [root / '_algebra-c02-11a.md', root / '_algebra-c02-11b.md'],
              root / '_algebra-c02-12.md': [root / '_algebra-c02-12a.md', root / '_algebra-c02-12b.md'],
              root / '_algebra-c03-12.md': [root / '_algebra-c03-12a.md', root / '_algebra-c03-12b.md', root / '_algebra-c03-12c.md'],
          }
          for target, parts in groups.items():
              missing = [p.name for p in parts if not p.exists()]
              if missing:
                  raise SystemExit(f'Missing split fragments for {target.name}: {missing}')
              chunks = [p.read_text(encoding='utf-8').strip() for p in parts]
              target.write_text('\n\n'.join(chunks) + '\n', encoding='utf-8')
              for p in parts:
                  p.unlink()

          # 3. Add source-id metadata and point wrappers at normalized fragments.
          wrappers = {
              root / 'algebra-para-matematicos-capitulo-1-del-calculo-aritmetico-al-lenguaje-algebraico.md': 'APM-T1-C01',
              root / 'algebra-para-matematicos-capitulo-2-logica-proposicional-y-algebra-de-proposiciones.md': 'APM-T1-C02',
              root / 'algebra-para-matematicos-capitulo-3-predicados-cuantificadores-y-lenguaje-matematico.md': 'APM-T1-C03',
          }
          for path, source_id in wrappers.items():
              text = path.read_text(encoding='utf-8')
              if 'source-id:' not in text:
                  text, n = re.subn(r'^(content-id:\s*MA-BCH-\d+)\s*$', r'\1\nsource-id: ' + source_id, text, count=1, flags=re.M)
                  if n != 1:
                      raise SystemExit(f'Could not insert source-id into {path.name}')
              else:
                  text = re.sub(r'^source-id:.*$', 'source-id: ' + source_id, text, count=1, flags=re.M)
              path.write_text(text, encoding='utf-8')

          replacements = {
              wrappers.keys().__iter__().__next__(): [],
              root / 'algebra-para-matematicos-capitulo-2-logica-proposicional-y-algebra-de-proposiciones.md': [
                  ('{{< include _algebra-c02-11a.md >}}\n\n{{< include _algebra-c02-11b.md >}}', '{{< include _algebra-c02-11.md >}}'),
                  ('{{< include _algebra-c02-12a.md >}}\n\n{{< include _algebra-c02-12b.md >}}', '{{< include _algebra-c02-12.md >}}'),
              ],
              root / 'algebra-para-matematicos-capitulo-3-predicados-cuantificadores-y-lenguaje-matematico.md': [
                  ('{{< include _algebra-c03-12a.md >}}\n\n{{< include _algebra-c03-12b.md >}}\n\n{{< include _algebra-c03-12c.md >}}', '{{< include _algebra-c03-12.md >}}'),
              ],
          }
          for path, reps in replacements.items():
              if not reps:
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f'Expected include sequence not found in {path.name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # 4. Install the repository-wide identifier policy.
          policy = Path('_project/IDENTIFIER_POLICY.md')
          policy.parent.mkdir(parents=True, exist_ok=True)
          policy.write_text('''# Política de identificadores

Matemática Abierta utiliza dos capas de identificadores que cumplen funciones distintas y no deben confundirse.

## 1. Identificador global público

Formato: `MA-TIPO-NNNN`, por ejemplo `MA-BCH-0007`.

- Es global para todo el sitio.
- Es inmutable.
- No se reutiliza aunque una pieza se retire.
- Identifica la pieza editorial publicada, no su posición interna en un manuscrito.

## 2. Identificador editorial de fuente

Formato base: `PROYECTO-TOMO-CAPITULO`, por ejemplo `APM-T1-C01`.

Debe ser autosuficiente: `T1-C01` por sí solo está prohibido como identificador canónico porque puede colisionar entre libros.

Códigos iniciales:

- `APM` — Álgebra para matemáticos
- `CPM` — Cálculo para matemáticos
- `FPM` — Fundamentos para matemáticos
- `FISPM` — Física para matemáticos

## 3. Objetos internos de un capítulo

Formato: `PROYECTO-TOMO-CAPITULO-TIPO-NNNN`.

Ejemplos:

- `APM-T1-C01-D0001` — definición
- `APM-T1-C01-E0001` — ejercicio
- `APM-T1-C01-X0001` — ejemplo
- `APM-T1-C02-P0001` — proposición
- `APM-T1-C02-T0001` — teorema

La numeración histórica puede conservarse; la cualificación con proyecto, tomo y capítulo es obligatoria en la edición web y en nuevos documentos canónicos.

## 4. Compatibilidad con identificadores históricos

Los identificadores históricos del tipo `APM-I-D0001` no se renumeran destructivamente en manuscritos cerrados. Durante la migración se consideran aliases históricos. La edición web usa el identificador cualificado `APM-T1-Cxx-*`.

## 5. Regla de publicación

Cada capítulo publicado debe declarar simultáneamente:

```yaml
content-id: MA-BCH-NNNN
source-id: APM-T1-CNN
```

`content-id` enlaza con el registro global del sitio; `source-id` enlaza con el canon editorial del libro.
''', encoding='utf-8')
          PY

      - name: Structural QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('libros/capitulos')
          expected = {1: 10, 2: 12, 3: 12}
          total_exercises = 0

          for chapter, count in expected.items():
              files = sorted(root.glob(f'_algebra-c0{chapter}-*.md'))
              assert len(files) == count, (chapter, len(files), [p.name for p in files])
              qualified = f'apm-t1-c0{chapter}-'
              for path in files:
                  text = path.read_text(encoding='utf-8')
                  assert '#apm-i-' not in text.lower(), path
                  assert 'APM-I-' not in text, path
                  assert text.count('$$') % 2 == 0, ('unbalanced $$', path)
                  assert text.count(':::') % 2 == 0, ('unbalanced div', path)
                  total_exercises += len(re.findall(r'^### .*\{#' + qualified + r'e\d{4}\}\s*$', text, re.M | re.I))

          assert total_exercises == 206, total_exercises

          wrappers = {
              'algebra-para-matematicos-capitulo-1-del-calculo-aritmetico-al-lenguaje-algebraico.md': ('MA-BCH-0007', 'APM-T1-C01'),
              'algebra-para-matematicos-capitulo-2-logica-proposicional-y-algebra-de-proposiciones.md': ('MA-BCH-0008', 'APM-T1-C02'),
              'algebra-para-matematicos-capitulo-3-predicados-cuantificadores-y-lenguaje-matematico.md': ('MA-BCH-0011', 'APM-T1-C03'),
          }
          for filename, (content_id, source_id) in wrappers.items():
              text = (root / filename).read_text(encoding='utf-8')
              assert f'content-id: {content_id}' in text, filename
              assert f'source-id: {source_id}' in text, filename

          obsolete = [
              '_algebra-c02-11a.md', '_algebra-c02-11b.md',
              '_algebra-c02-12a.md', '_algebra-c02-12b.md',
              '_algebra-c03-12a.md', '_algebra-c03-12b.md', '_algebra-c03-12c.md',
          ]
          assert not any((root / name).exists() for name in obsolete), obsolete
          assert Path('_project/IDENTIFIER_POLICY.md').is_file()
          print(f'QA OK: fragments=34 exercises={total_exercises}')
          PY
          git diff --check

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Full Quarto render
        shell: bash
        run: |
          set -euo pipefail
          quarto render

      - name: Commit validated repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apm-repair-runner.yml
          git add libros/capitulos _project/IDENTIFIER_POLICY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair APM chapters 1-3 identifiers and reading fragments'
          git push origin main
