name: APM one-shot repair runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apm-repair-runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize APM identifiers and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('libros/capitulos')
          chapters = {
              'c01': (
                  'APM-T1-C01', 'MA-BCH-0007',
                  root / 'algebra-para-matematicos-capitulo-1-del-calculo-aritmetico-al-lenguaje-algebraico.md'
              ),
              'c02': (
                  'APM-T1-C02', 'MA-BCH-0008',
                  root / 'algebra-para-matematicos-capitulo-2-logica-proposicional-y-algebra-de-proposiciones.md'
              ),
              'c03': (
                  'APM-T1-C03', 'MA-BCH-0011',
                  root / 'algebra-para-matematicos-capitulo-3-predicados-cuantificadores-y-lenguaje-matematico.md'
              ),
          }

          all_fragments = []
          for chapter, (source_id, content_id, wrapper) in chapters.items():
              fragments = sorted(root.glob(f'_algebra-{chapter}-*.md'))
              if not fragments:
                  raise SystemExit(f'No fragments found for {chapter}')

              for path in fragments:
                  text = path.read_text(encoding='utf-8')
                  text = text.replace('APM-I-', source_id + '-')
                  text = text.replace('apm-i-', source_id.lower() + '-')
                  path.write_text(text, encoding='utf-8')
              all_fragments.extend(fragments)

              text = wrapper.read_text(encoding='utf-8')
              if f'content-id: {content_id}' not in text:
                  raise SystemExit(f'{wrapper.name}: expected content-id {content_id}')

              lines = text.splitlines()
              source_index = next((i for i, line in enumerate(lines) if line.startswith('source-id:')), None)
              if source_index is not None:
                  lines[source_index] = f'source-id: {source_id}'
              else:
                  content_index = next(
                      (i for i, line in enumerate(lines) if line.strip() == f'content-id: {content_id}'),
                      None
                  )
                  if content_index is None:
                      raise SystemExit(f'{wrapper.name}: cannot locate content-id line')
                  lines.insert(content_index + 1, f'source-id: {source_id}')
              wrapper.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          policy = Path('_project/IDENTIFIER_POLICY.md')
          policy.parent.mkdir(parents=True, exist_ok=True)
          policy.write_text('''# Política de identificadores

Matemática Abierta utiliza dos capas de identificadores con funciones distintas.

## 1. Identificador global público

Formato: `MA-TIPO-NNNN`, por ejemplo `MA-BCH-0007`.

- Es global para todo el sitio.
- Es inmutable.
- No se reutiliza aunque una pieza se retire.
- Identifica la pieza editorial publicada, no su posición interna en un manuscrito.

## 2. Identificador editorial de fuente

Formato base: `PROYECTO-TOMO-CAPITULO`, por ejemplo `APM-T1-C01`.

Debe ser autosuficiente: `T1-C01` por sí solo no es un identificador canónico porque puede colisionar entre libros.

Códigos iniciales:

- `APM` — Álgebra para matemáticos.
- `CPM` — Cálculo para matemáticos.
- `FPM` — Fundamentos para matemáticos.
- `FISPM` — Física para matemáticos.

## 3. Objetos internos de un capítulo

Formato: `PROYECTO-TOMO-CAPITULO-TIPO-NNNN`.

Ejemplos:

- `APM-T1-C01-D0001` — definición.
- `APM-T1-C01-E0001` — ejercicio.
- `APM-T1-C01-X0001` — observación u objeto auxiliar.

La numeración histórica puede conservarse; la cualificación con proyecto, tomo y capítulo es obligatoria en la edición web y en nuevos documentos canónicos.

## 4. Compatibilidad histórica

Los identificadores heredados del tipo `APM-I-D0001` no se renumeran destructivamente dentro de manuscritos cerrados o congelados. Durante la migración se consideran alias históricos. La capa web usa el identificador cualificado `APM-T1-Cxx-*` para evitar colisiones.

## 5. Regla de publicación

Cada capítulo publicado declara simultáneamente:

```yaml
content-id: MA-BCH-NNNN
source-id: APM-T1-CNN
```

`content-id` enlaza con el registro global del sitio; `source-id` enlaza con el canon editorial del libro.
''', encoding='utf-8')

          # Structural QA without changing the current fragment architecture.
          first = root / '_algebra-c01-01.md'
          if 'trasfondo preteórico' not in first.read_text(encoding='utf-8'):
              raise SystemExit('C1 provenance check failed: expected phrase missing')

          joined = '\n'.join(p.read_text(encoding='utf-8') for p in all_fragments)
          if '#apm-i-' in joined.lower() or 'APM-I-' in joined:
              raise SystemExit('Legacy APM-I identifiers remain in web fragments')

          exercise_total = 0
          solution_total = 0
          by_chapter = {}
          for chapter, (source_id, content_id, wrapper) in chapters.items():
              fragments = sorted(root.glob(f'_algebra-{chapter}-*.md'))
              chapter_text = '\n'.join(p.read_text(encoding='utf-8') for p in fragments)
              anchor_prefix = source_id.lower()
              if f'#{anchor_prefix}-' not in chapter_text.lower():
                  raise SystemExit(f'{chapter}: qualified anchors missing')

              exercises = len(re.findall(
                  rf'^#{{1,6}}\s+.*\{{#{re.escape(anchor_prefix)}-e\d{{4}}\}}\s*$',
                  chapter_text,
                  flags=re.M | re.I,
              ))
              solutions = len(re.findall(r'^####\s+Solución\s*$', chapter_text, flags=re.M | re.I))
              by_chapter[chapter] = (exercises, solutions, len(fragments))
              exercise_total += exercises
              solution_total += solutions

              wrapper_text = wrapper.read_text(encoding='utf-8')
              if f'content-id: {content_id}' not in wrapper_text:
                  raise SystemExit(f'{wrapper.name}: content-id changed unexpectedly')
              if f'source-id: {source_id}' not in wrapper_text:
                  raise SystemExit(f'{wrapper.name}: source-id missing')

              for path in fragments:
                  standalone_math = sum(
                      1 for line in path.read_text(encoding='utf-8').splitlines()
                      if line.strip() == '$$'
                  )
                  if standalone_math % 2:
                      raise SystemExit(f'{path.name}: unbalanced standalone $$ ({standalone_math})')

          expected_exercises = {'c01': 56, 'c02': 78, 'c03': 72}
          for chapter, expected in expected_exercises.items():
              actual = by_chapter[chapter][0]
              if actual != expected:
                  raise SystemExit(f'{chapter}: expected {expected} exercises, found {actual}')

          if exercise_total != 206:
              raise SystemExit(f'Expected 206 exercises, found {exercise_total}')
          if solution_total != 206:
              raise SystemExit(f'Expected 206 solutions, found {solution_total}')

          print('QA OK')
          for chapter, (exercises, solutions, fragments) in by_chapter.items():
              print(f'{chapter}: fragments={fragments} exercises={exercises} solutions={solutions}')
          print(f'total: exercises={exercise_total} solutions={solution_total}')
          PY

      - name: Commit validated repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apm-repair-runner.yml
          git add libros/capitulos _project/IDENTIFIER_POLICY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Qualify APM chapter identifiers'
          git push origin main
