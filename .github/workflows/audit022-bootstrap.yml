name: AUD-022 source transfer (one shot)

on:
  push:
    branches: [audit/fdc-aud-022-programa-transparente]
    paths:
      - 'lean/.audit022-source.gz.b64'
      - '.github/workflows/audit022-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify the exact archived UTF-8 Lean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean/MatematicaAbierta/Continuo
          base64 --decode lean/.audit022-source.gz.b64 | gzip --decompress > lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean
          echo 'b5893820588c0f0d51887a7eb596436cd9ea0041a0c6d68920216cae19ded786  lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean' | sha256sum --check
          sed -i '/^import MatematicaAbierta.TeoriaDeFunciones.Diagonalizacion$/a import MatematicaAbierta.Continuo.ProgramaTransparente' lean/MatematicaAbierta.lean
          rm lean/.audit022-source.gz.b64 .github/workflows/audit022-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean/MatematicaAbierta.lean lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean lean/.audit022-source.gz.b64 .github/workflows/audit022-bootstrap.yml
          git diff --cached --check
          git commit -m 'AUD-022: add byte-identical Lean source and register module'
          git push origin HEAD:audit/fdc-aud-022-programa-transparente
