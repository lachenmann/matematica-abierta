name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: quarto-publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate public mobile catalog
        run: python3 tools/generate_app_catalog.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render site
        run: quarto render

      - name: Generate B2 offline pilot package
        run: |
          python3 tools/generate_offline_manifests.py \
            --site-dir _site \
            --book-id MA-BOK-0005

      - name: Publish rendered site to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
