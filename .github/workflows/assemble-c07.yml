name: Assemble C7

on:
  push:
    branches:
      - publish/algebra-v2-c07
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: publish/algebra-v2-c07
          fetch-depth: 0

      - name: Assemble exact C7 public derivative
        shell: bash
        run: |
          set -euo pipefail
          target="libros/capitulos/conjuntos-y-algebra-de-conjuntos.md"
          cat .tmp/c07/part-*.md > "$target"
          rm -rf .tmp/c07
          rm -f .github/workflows/assemble-c07.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace C7 with exact canonical public derivative"
          git push origin HEAD:publish/algebra-v2-c07
