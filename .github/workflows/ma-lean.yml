name: MA-Lean · tests del motor

on:
  pull_request:
    branches: [main]
    paths:
      - 'MA-Lean/**'
      - 'lean/MatematicaAbierta/MCL/**'
      - 'lean/MatematicaAbierta.lean'
      - '.github/workflows/ma-lean.yml'
  push:
    branches: [main]
    paths:
      - 'MA-Lean/**'
      - 'lean/MatematicaAbierta/MCL/**'
      - 'lean/MatematicaAbierta.lean'
      - '.github/workflows/ma-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python unit tests
        env:
          PYTHONPATH: MA-Lean
        run: python -m unittest discover -s MA-Lean/tests -v

  mcl-u00-l01-formal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install canonical Lean environment
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: MA-Lean formal audit for MCL-U00-L01
        env:
          PYTHONPATH: MA-Lean
        run: |
          python -m adapters.mcl_formal             --mapping MA-Lean/mapeos/MCL/MCL-U00-L01.json             --profile MA-Lean/profiles/mcl.json             --repo-root .             --output /tmp/MCL-U00-L01-formal-audit.json
