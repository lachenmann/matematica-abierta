name: MA-Lean · tests del motor

on:
  pull_request:
    branches: [main]
    paths:
      - 'MA-Lean/**'
      - '.github/workflows/ma-lean.yml'
  push:
    branches: [main]
    paths:
      - 'MA-Lean/**'
      - '.github/workflows/ma-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python unit tests
        env:
          PYTHONPATH: MA-Lean
        run: python -m unittest discover -s MA-Lean/tests -v
