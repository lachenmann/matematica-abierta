name: AUD-022 eventual-response proof repair (one shot)

on:
  push:
    branches: [audit/fdc-aud-022-programa-transparente]
    paths:
      - '.github/workflows/audit022-repair4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use direct witness at zero additional fuel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean')
          s = p.read_text(encoding='utf-8')
          old = '    exact ⟨n, by simpa using hn 0⟩\n'
          new = '    exact ⟨n, hn 0⟩\n'
          assert s.count(old) == 1, 'Unexpected eventual-response proof'
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/audit022-repair4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean .github/workflows/audit022-repair4.yml
          git diff --cached --check
          git commit -m 'AUD-022: eliminate last recursive simplifier in new proofs'
          git push origin HEAD:audit/fdc-aud-022-programa-transparente
