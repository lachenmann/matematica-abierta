name: AUD-022 congruence proof repair (one shot)

on:
  push:
    branches: [audit/fdc-aud-022-programa-transparente]
    paths:
      - '.github/workflows/audit022-repair2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply direct congruence to the one-step recurrence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean')
          s = p.read_text(encoding='utf-8')
          old = ('  change (match buscarHasta χA χB p n with\n'
                 '    | some c => some c\n'
                 '    | none => etapaConcreta χA χB p (n + 1)) = some b\n'
                 '  rw [h]\n')
          new = ('  change (match buscarHasta χA χB p n with\n'
                 '    | some c => some c\n'
                 '    | none => etapaConcreta χA χB p (n + 1)) = some b\n'
                 '  exact congrArg (fun r : Option Bool =>\n'
                 '    match r with\n'
                 '    | some c => some c\n'
                 '    | none => etapaConcreta χA χB p (n + 1)) h\n')
          assert s.count(old) == 1, 'Ambiguous or absent proof site'
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/audit022-repair2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean/MatematicaAbierta/Continuo/ProgramaTransparente.lean .github/workflows/audit022-repair2.yml
          git diff --cached --check
          git commit -m 'AUD-022: prove one-step stability by direct congruence'
          git push origin HEAD:audit/fdc-aud-022-programa-transparente
