name: APM delivery package
on:
  push:
    branches: [build/apm-pdf-20261015]
    paths: [apm-pdf-build/package.py, .github/workflows/apm-delivery.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pymupdf pillow
      - run: python3 apm-pdf-build/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: APM-Tomo-I-entrega
          path: apm-pdf-build/delivery/
      - run: |
          git config user.name 'APM PDF build'
          git config user.email 'actions@users.noreply.github.com'
          git add apm-pdf-build/delivery
          git commit -m 'Preserve complete PDF editions, LaTeX package and visual QA evidence [skip ci]'
          git push origin HEAD:build/apm-pdf-20261015
