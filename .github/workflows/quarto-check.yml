name: Quarto Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: quarto-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check laboratory JavaScript and interactions
        run: |
          node --check teoria/resultados/interactive/desigualdad-triangular.js
          node --test tests/triangle-lab.test.mjs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render site
        run: quarto render