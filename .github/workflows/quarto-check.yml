name: Quarto Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: quarto-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test and generate public mobile catalog
        run: |
          python3 -m unittest tests/test_app_catalog_generator.py tests/test_offline_manifest_generator.py tests/test_smart_render.py
          python3 tools/generate_app_catalog.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("app/catalog-v1.json")
          assert p.is_file() and p.stat().st_size > 0
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["schemaVersion"] == 1
          assert data["siteBaseUrl"] == "https://matematicaabierta.cl"
          assert data["items"], "catalog must contain published items"
          ids = [item["id"] for item in data["items"]]
          assert len(ids) == len(set(ids)), "catalog ids must be unique"
          print(f"catalog-v1 QA: {len(ids)} items")
          PY

      - name: Check laboratory JavaScript and interactions
        run: |
          node --check teoria/resultados/interactive/desigualdad-triangular.js
          node --test tests/triangle-lab.test.mjs

      - name: Verify canonical article ID and embedded laboratory
        run: |
          article=teoria/resultados/desigualdad-triangular.qmd
          grep -qx 'content-id: MA-ART-0003' "$article"
          ! grep -q 'MA-ART-0002' "$article"
          grep -q 'tri-historia' "$article"
          grep -q '<iframe src="interactive/desigualdad-triangular.html"' "$article"

      - name: Validate Euler article web source and assets
        run: |
          python3 tests/euler_article_static.py

      - name: Validate Cauchy-Schwarz source and laboratory
        run: |
          python3 tests/cauchy_static.py
          node --check teoria/resultados/interactive/cauchy-schwarz.js
          node --check teoria/resultados/interactive/cauchy-schwarz-embed.js

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Restore published complete state for proportional QA
        uses: actions/cache/restore@v4
        with:
          path: |
            _site
            .quarto
            .ma-build/base.json
          key: ${{ runner.os }}-ma-site-v1-quarto-1.10.18-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ma-site-v1-quarto-1.10.18-

      - name: Render affected pages or complete site and offline pilot
        run: python3 tools/smart_render.py build --offline-book MA-BOK-0005

      - name: Verify laboratory assets and rendered page
        run: |
          test -s _site/teoria/resultados/desigualdad-triangular.html
          test -s _site/teoria/resultados/laboratorio-desigualdad-triangular.html
          test -s _site/teoria/resultados/interactive/desigualdad-triangular.html
          test -s _site/teoria/resultados/interactive/desigualdad-triangular.css
          test -s _site/teoria/resultados/interactive/desigualdad-triangular.js
          grep -q 'interactive/desigualdad-triangular.html' _site/teoria/resultados/desigualdad-triangular.html
          grep -q 'interactive/desigualdad-triangular.html' _site/teoria/resultados/laboratorio-desigualdad-triangular.html
          grep -q 'MA-ART-0003' _site/teoria/resultados/laboratorio-desigualdad-triangular.html

      - name: Verify Cauchy-Schwarz rendered pages and assets
        run: |
          article=teoria/resultados/desigualdad-cauchy-schwarz.qmd
          lab=teoria/resultados/laboratorio-cauchy-schwarz.qmd
          test -s _site/teoria/resultados/interactive/cauchy-schwarz.html
          test -s _site/teoria/resultados/interactive/cauchy-schwarz.css
          test -s _site/teoria/resultados/interactive/cauchy-schwarz.js
          test -s _site/teoria/resultados/interactive/cauchy-schwarz-embed.js
          if grep -qx 'draft: true' "$article" && grep -qx 'draft: true' "$lab"; then
            test -s _site/teoria/resultados/desigualdad-cauchy-schwarz.html
            test -s _site/teoria/resultados/laboratorio-cauchy-schwarz.html
            ! grep -q 'interactive/cauchy-schwarz.html' _site/teoria/resultados/desigualdad-cauchy-schwarz.html
            ! grep -q 'interactive/cauchy-schwarz.html' _site/teoria/resultados/laboratorio-cauchy-schwarz.html
            ! grep -q 'desigualdad-cauchy-schwarz.html' _site/teoria/resultados/index.html
            echo "Cauchy-Schwarz draft protection QA PASS"
          else
            test -s _site/teoria/resultados/desigualdad-cauchy-schwarz.html
            test -s _site/teoria/resultados/laboratorio-cauchy-schwarz.html
            grep -q 'interactive/cauchy-schwarz.html' _site/teoria/resultados/desigualdad-cauchy-schwarz.html
            grep -q 'interactive/cauchy-schwarz.html' _site/teoria/resultados/laboratorio-cauchy-schwarz.html
            grep -q 'MA-APP-0002' _site/teoria/resultados/laboratorio-cauchy-schwarz.html
            grep -q 'desigualdad-cauchy-schwarz.html' _site/teoria/resultados/index.html
            echo "Cauchy-Schwarz published integration QA PASS"
          fi

      - name: Verify rendered mobile catalog
        run: |
          test -s _site/app/catalog-v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("_site/app/catalog-v1.json").read_text(encoding="utf-8"))
          assert data["schemaVersion"] == 1
          assert data["items"]
          PY

      - name: Verify B2 offline pilot package
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          package = Path("_site/app/offline/MA-BOK-0005")
          manifest_path = package / "manifest-v1.json"
          assert manifest_path.is_file() and manifest_path.stat().st_size > 0
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert manifest["schemaVersion"] == 1
          assert manifest["siteBaseUrl"] == "https://matematicaabierta.cl"
          assert manifest["hashAlgorithm"] == "sha256"
          assert manifest["bookId"] == "MA-BOK-0005"
          assert manifest["entryContentId"] == "MA-BCH-0009"
          assert [item["contentId"] for item in manifest["contents"]] == [
              "MA-BCH-0009",
              "MA-BCH-0031",
          ]
          assert manifest["assets"] == []

          total = 0
          for item in manifest["contents"]:
              path = package / item["localPath"]
              data = path.read_bytes()
              assert len(data) == item["size"]
              assert hashlib.sha256(data).hexdigest() == item["sha256"]
              assert b"<html" in data.lower() and b"<body" in data.lower()
              total += len(data)

          assert total == manifest["totalSize"]
          assert manifest["version"].startswith("sha256-")
          print(
              f"B2 offline QA: {len(manifest['contents'])} capítulos, "
              f"{manifest['totalSize']} bytes, {manifest['version']}"
          )
          PY


      - name: Package reduced FND official HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import re, shutil, json, hashlib
          root = Path("_site").resolve()
          out = Path("qa-reduced")
          out.mkdir(exist_ok=True)
          names = [Path(x).stem for x in ("libros/capitulos/fnd-c10-quarto-qa.qmd", "libros/capitulos/fnd-c11-quarto-qa.qmd", "libros/capitulos/fnd-global-quarto-qa.qmd")]
          targets = []
          for name in names:
              found = list(root.rglob(name + ".html"))
              assert len(found) == 1, (name, found)
              targets.extend(found)
          print("Actual Quarto outputs:", [str(p.relative_to(root)) for p in targets])
          selected = set(targets)
          shared = list(root.rglob("site_libs"))
          for directory in shared:
              selected.update(p for p in directory.rglob("*") if p.is_file() and p.suffix != ".map")
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  for key in ("src", "poster", "data-src"):
                      if a.get(key): self.refs.append(a[key])
                  if tag == "link" and a.get("href"): self.refs.append(a["href"])
                  if a.get("srcset"):
                      self.refs.extend(v.strip().split()[0] for v in a["srcset"].split(","))
          def resolve(p, value):
              u = urlsplit(value)
              if u.scheme or u.netloc or not u.path: return None
              q = (root / unquote(u.path).lstrip("/") if u.path.startswith("/") else p.parent / unquote(u.path)).resolve()
              if not q.is_relative_to(root): return None
              return q
          seen = set()
          while selected - seen:
              p = next(iter(selected - seen))
              seen.add(p)
              refs = []
              if p.suffix in (".html", ".css", ".js", ".svg"):
                  text = p.read_text(errors="replace")
                  refs += re.findall(r"url\(\s*['\"]?([^)'\"\s]+)", text)
                  if p.suffix == ".html":
                      parser = Links()
                      parser.feed(text)
                      refs += parser.refs
                  if p.suffix == ".js":
                      refs += re.findall(r"""['"]([^'"]+\.(?:css|js|woff2?|ttf|svg|png|jpe?g|webp|gif)(?:\?[^'"]*)?)['"]""", text)
              for value in refs:
                  q = resolve(p, value)
                  if q and q.is_file() and q.suffix not in (".map", ".qmd", ".md"):
                      selected.add(q)
          for p in sorted(selected):
              dest = out / p.relative_to(root)
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, dest)
          size = sum(p.stat().st_size for p in out.rglob("*") if p.is_file())
          manifest = {"targets": [str(p.relative_to(root)) for p in targets], "bytes": size, "files": [{"path": str(p.relative_to(root)), "bytes":p.stat().st_size, "sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(selected)], "excluded": "All other site HTML, unreferenced chapter assets, source files, caches, offline packages and source maps. Full site_libs retained except source maps."}
          (out / "qa-manifest.json").write_text(json.dumps(manifest, indent=2))
          size = sum(p.stat().st_size for p in out.rglob("*") if p.is_file())
          print("REDUCED_BYTES", size, "FILES", len(selected))
          assert size < 32 * 1024 * 1024, "Conservative reduction still exceeds 32 MiB"
          
          PY

      - name: Preserve reduced FND QA
        uses: actions/upload-artifact@v4
        with:
          name: fnd-qa-reduced
          path: qa-reduced/
          compression-level: 9
          retention-days: 2
          if-no-files-found: error

      - name: Preserve rendered site for visual and link QA
        uses: actions/upload-artifact@v4
        with:
          name: triangular-site-qa
          path: _site/
          retention-days: 2
          if-no-files-found: error

      - name: Preserve build decision and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-pr-build-report
          path: .ma-build/report.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

