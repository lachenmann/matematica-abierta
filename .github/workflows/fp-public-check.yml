name: Física preuniversitaria · producción
on:
  push:
    branches: [qa/fp-public-verificacion-v032]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install public browser QA
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Verify public site, mathematics, images and downloads
        run: python3 tests/fp_public_check.py
      - name: Preserve public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp-public-verification
          path: .ma-build/fp-visual/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
