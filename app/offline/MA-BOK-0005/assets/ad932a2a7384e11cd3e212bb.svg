<text x="40" y="570" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">D(χ) = dσ/dΩ; si hay varias coronas, sus áreas se suman.</text>
<text x="40" y="614" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">La esfera se representa esquemáticamente.</text>
