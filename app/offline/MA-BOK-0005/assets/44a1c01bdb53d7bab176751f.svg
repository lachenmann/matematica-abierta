<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>Tres carros unidos por cuerdas diferentes: restricciones comunes, tensiones distintas.</title><g font-family="DejaVu Sans, sans-serif"><path d="M35,280 L640,280" fill="none" stroke="#637686" stroke-width="4"/><rect x="65" y="200" width="110" height="76" rx="4" fill="#e4f1f7" stroke="#176c9c" stroke-width="2"/><text x="120" y="245" font-size="19" fill="#176c9c" text-anchor="middle">1 kg</text><rect x="255" y="200" width="110" height="76" rx="4" fill="#e4f1f7" stroke="#176c9c" stroke-width="2"/><text x="310" y="245" font-size="19" fill="#176c9c" text-anchor="middle">2 kg</text><rect x="445" y="200" width="110" height="76" rx="4" fill="#e4f1f7" stroke="#176c9c" stroke-width="2"/><text x="500" y="245" font-size="19" fill="#176c9c" text-anchor="middle">3 kg</text><path d="M175,235 L255,235" fill="none" stroke="#176c9c" stroke-width="3"/><path d="M365,235 L445,235" fill="none" stroke="#176c9c" stroke-width="3"/><text x="215" y="220" font-size="18" fill="#176c9c" text-anchor="middle">T₁</text><text x="405" y="220" font-size="18" fill="#176c9c" text-anchor="middle">T₂</text><path d="M555,235 L635,235" fill="none" stroke="#b84d3d" stroke-width="2.5"/><polygon points="635,235 626.710451053974,238.50476508077784 626.710451053974,231.49523491922216" fill="#b84d3d"/><text x="610" y="190" font-size="17" fill="#b84d3d" text-anchor="middle">F = 12 N</text><path d="M65,110 L145,110" fill="none" stroke="#267b62" stroke-width="2.5"/><polygon points="145,110 136.71045105397403,113.50476508077786 136.71045105397403,106.49523491922214" fill="#267b62"/><text x="155" y="116" font-size="20" fill="#267b62" text-anchor="start">a = 2 m/s²</text><text x="70" y="360" font-size="22" fill="#176c9c" text-anchor="start">T₁ = 2 N</text><text x="390" y="360" font-size="22" fill="#176c9c" text-anchor="start">T₂ = 6 N</text><text x="70" y="440" font-size="17" fill="#637686" text-anchor="start">Dos distancias constantes; una aceleración común.</text></g></svg>