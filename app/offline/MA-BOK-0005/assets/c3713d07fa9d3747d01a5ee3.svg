<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>Proyecciones y signos del trabajo en un desplazamiento horizontal.</title><g font-family="DejaVu Sans, sans-serif"><path d="M110,300 L565,300" fill="none" stroke="#637686" stroke-width="2.5"/><polygon points="565,300 556.710451053974,303.5047650807779 556.710451053974,296.4952349192221" fill="#637686"/><text x="530" y="335" font-size="19" fill="#637686" text-anchor="start">Δr →</text><path d="M150,270 L350,150" fill="none" stroke="#176c9c" stroke-width="2.5"/><polygon points="350,150 344.69495717926566,157.27024901019044 341.088583663604,151.25962648408773" fill="#176c9c"/><path d="M150,270 L350,270" fill="none" stroke="#176c9c" stroke-width="2" stroke-dasharray="5 4"/><path d="M350,270 L350,150" fill="none" stroke="#176c9c" stroke-width="2" stroke-dasharray="5 4"/><text x="340" y="125" font-size="20" fill="#176c9c" text-anchor="start">F oblicua</text><text x="235" y="260" font-size="17" fill="#176c9c" text-anchor="start">F cos α</text><text x="190" y="231" font-size="18" fill="#176c9c" text-anchor="start">α</text><path d="M150,270 L55,270" fill="none" stroke="#b84d3d" stroke-width="2.5"/><polygon points="55,270 63.28954894602597,266.4952349192221 63.28954894602597,273.5047650807779" fill="#b84d3d"/><text x="40" y="230" font-size="19" fill="#b84d3d" text-anchor="start">W &lt; 0</text><path d="M490,270 L490,110" fill="none" stroke="#267b62" stroke-width="2.5"/><polygon points="490,110 493.5047650807779,118.28954894602597 486.4952349192221,118.28954894602597" fill="#267b62"/><text x="510" y="190" font-size="19" fill="#267b62" text-anchor="start">W = 0</text><text x="260" y="385" font-size="23" fill="#176c9c" text-anchor="start">W = F Δx cos α</text><text x="70" y="450" font-size="17" fill="#637686" text-anchor="start">Sólo contribuye la componente paralela al movimiento.</text></g></svg>