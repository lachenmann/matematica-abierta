<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img"><title>Dos carros que se enganchan</title><rect width="900" height="480" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="45" y="40" font-size="28" fill="#23678e" text-anchor="start">Antes del enganche</text><text x="45" y="245" font-size="28" fill="#23678e" text-anchor="start">Después del enganche</text><path d="M45 175 L850 175" fill="none" stroke="#687b88" stroke-width="3"/><path d="M45 365 L850 365" fill="none" stroke="#687b88" stroke-width="3"/><rect x="110" y="115" width="145" height="60" rx="5" fill="#dfedf4" stroke="#23678e" stroke-width="2"/><text x="182" y="154" font-size="25" fill="#23678e" text-anchor="middle">2 kg</text><rect x="550" y="115" width="100" height="60" rx="5" fill="#dfedf4" stroke="#23678e" stroke-width="2"/><text x="600" y="154" font-size="25" fill="#23678e" text-anchor="middle">1 kg</text><path d="M265 100 L420 100" fill="none" stroke="#23678e" stroke-width="3"/><path d="M420 100 l-11 -6 l0 12 Z" fill="#23678e" transform="rotate(0.0 420 100)"/><text x="280" y="76" font-size="25" fill="#687b88" text-anchor="start">3 m/s</text><text x="550" y="76" font-size="25" fill="#687b88" text-anchor="start">En reposo</text><rect x="340" y="305" width="180" height="60" rx="5" fill="#dfedf4" stroke="#23678e" stroke-width="2"/><text x="430" y="345" font-size="25" fill="#23678e" text-anchor="middle">3 kg</text><path d="M530 290 L680 290" fill="none" stroke="#23678e" stroke-width="3"/><path d="M680 290 l-11 -6 l0 12 Z" fill="#23678e" transform="rotate(0.0 680 290)"/><text x="555" y="265" font-size="25" fill="#687b88" text-anchor="start">2 m/s</text><text x="45" y="425" font-size="24" fill="#22836d" text-anchor="start">Pₓ = 6 kg·m/s en ambos estados</text><text x="520" y="425" font-size="24" fill="#b9543a" text-anchor="start">K: 9 J → 6 J</text></g></svg>