<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>Receptores que recorren distancias diferentes bajo una pareja de fricción.</title><g font-family="DejaVu Sans, sans-serif"><text x="40" y="45" font-size="21" fill="#176c9c" text-anchor="start">Mismo intervalo de un segundo</text><rect x="110" y="95" width="120" height="65" rx="4" fill="#e4f1f7" stroke="#176c9c" stroke-width="2"/><text x="170" y="135" font-size="20" fill="#176c9c" text-anchor="middle">Caja</text><path d="M60,165 L610,165" fill="none" stroke="#637686" stroke-width="5"/><path d="M120,200 L370,200" fill="none" stroke="#267b62" stroke-width="2.5"/><polygon points="370,200 361.71045105397405,203.50476508077784 361.71045105397405,196.49523491922216" fill="#267b62"/><text x="190" y="230" font-size="19" fill="#267b62" text-anchor="start">Δx caja = 2 m</text><path d="M120,270 L495,270" fill="none" stroke="#267b62" stroke-width="2.5"/><polygon points="495,270 486.71045105397405,273.5047650807779 486.71045105397405,266.4952349192221" fill="#267b62"/><text x="260" y="302" font-size="19" fill="#267b62" text-anchor="start">Δx cinta = 3 m</text><path d="M170,110 L280,110" fill="none" stroke="#176c9c" stroke-width="2.5"/><polygon points="280,110 271.71045105397405,113.50476508077786 271.71045105397405,106.49523491922214" fill="#176c9c"/><text x="298" y="116" font-size="18" fill="#176c9c" text-anchor="start">f sobre caja →</text><path d="M440,150 L330,150" fill="none" stroke="#b84d3d" stroke-width="2.5"/><polygon points="330,150 338.28954894602595,146.49523491922216 338.28954894602595,153.50476508077784" fill="#b84d3d"/><text x="395" y="91" font-size="18" fill="#b84d3d" text-anchor="start">← f sobre cinta</text><text x="70" y="375" font-size="22" fill="#176c9c" text-anchor="start">W caja = +8 J</text><text x="365" y="375" font-size="22" fill="#b84d3d" text-anchor="start">W cinta = −12 J</text><text x="70" y="445" font-size="18" fill="#637686" text-anchor="start">Fuerzas opuestas; trabajos que suman −4 J.</text></g></svg>