<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img"><title>Centro de masa de dos partículas</title><rect width="900" height="480" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="45" y="40" font-size="28" fill="#23678e" text-anchor="start">Las masas ponderan las posiciones</text><path d="M85 290 L825 290" fill="none" stroke="#23678e" stroke-width="3"/><path d="M825 290 l-11 -6 l0 12 Z" fill="#23678e" transform="rotate(0.0 825 290)"/><path d="M110 280 L110 300" fill="none" stroke="#687b88" stroke-width="3"/><text x="110" y="330" font-size="24" fill="#687b88" text-anchor="middle">0</text><path d="M290 280 L290 300" fill="none" stroke="#687b88" stroke-width="3"/><text x="290" y="330" font-size="24" fill="#687b88" text-anchor="middle">1</text><path d="M470 280 L470 300" fill="none" stroke="#687b88" stroke-width="3"/><text x="470" y="330" font-size="24" fill="#687b88" text-anchor="middle">2</text><path d="M650 280 L650 300" fill="none" stroke="#687b88" stroke-width="3"/><text x="650" y="330" font-size="24" fill="#687b88" text-anchor="middle">3</text><path d="M830 280 L830 300" fill="none" stroke="#687b88" stroke-width="3"/><text x="830" y="330" font-size="24" fill="#687b88" text-anchor="middle">4</text><circle cx="110" cy="220" r="27" fill="#23678e"/><circle cx="830" cy="220" r="47" fill="#23678e"/><text x="110" y="165" font-size="25" fill="#23678e" text-anchor="middle">1 kg</text><text x="815" y="140" font-size="25" fill="#23678e" text-anchor="middle">3 kg</text><path d="M110 250 L110 280" fill="none" stroke="#687b88" stroke-width="3"/><path d="M830 265 L830 280" fill="none" stroke="#687b88" stroke-width="3"/><path d="M650 120 L650 280" fill="none" stroke="#22836d" stroke-width="3" stroke-dasharray="7 6"/><text x="650" y="100" font-size="25" fill="#22836d" text-anchor="middle">Centro de masa</text><text x="805" y="365" font-size="25" fill="#687b88" text-anchor="start">x (m)</text><text x="45" y="425" font-size