<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img"><title>Recuperar posiciones desde R y r</title><defs>
<marker id="m173b56" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#173b56"/></marker>
<marker id="m2379aa" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2379aa"/></marker>
<marker id="mb74c3c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b74c3c"/></marker>
<marker id="m287c68" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#287c68"/></marker>
</defs><rect width="900" height="100%" fill="white"/>
<text x="40" y="42" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#173b56" text-anchor="start" font-weight="bold">Recuperar posiciones desde R y r</text>
<path d="M100,415 L310,270" stroke="#2379aa" stroke-width="2" fill="none" marker-end="url(#m2379aa)"/>
<path d="M100,415 L610,270" stroke="#287c68" stroke-width="2" fill="none" marker-end="url(#m287c68)"/>
<path d="M100,415 L410,270" stroke="#173b56" stroke-width="3" fill="none" marker-end="url(#m173b56)"/>
<circle cx="310" cy="270" r="5" fill="#2379aa" stroke="#173b56" stroke-width="3"/>
<circle cx="610" cy="270" r="5" fill="#287c68" stroke="#173b56" stroke-width="3"/>
<circle cx="410" cy="270" r="5" fill="#173b56" stroke="#173b56" stroke-width="3"/>
<text x="75" y="449" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">O</text>
<text x="396" y="242" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#173b56" text-anchor="start">R</text>
<text x="279" y="308" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2379aa" text-anchor="start">x₁</text>
<text x="621" y="307" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#287c68" text-anchor="start">x₂</text>
<path d="M310,180 L610,180" stroke="#b74c3c" stroke-width="3" fill="none" marker-end="url(#mb74c3c)"/>
<text x="460" y="164" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#b74c3c" text-anchor="middle">r = x₂ − x₁</text>
<path d="M410,340 L310,340" stroke="#2379aa" stroke-width="3" fill="none" marker-end="url(#m2379aa)"/>
<path d="M410,340 L610,340" stroke="#287c68" stroke-width="3" fill="none" marker-end="url(#m287c68)"/>
<text x="340" y="378" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#2379aa" text-anchor="middle">−r/3</text>
<text x="530" y="378" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#287c68" text-anchor="middle">2r/3</text>
<text x="40" y="106" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">Configuración ilustrada: m₁ = 2m₂.</text>
<text x="40" y="495" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">x₁ = R − (m₂/M)r</text>
<text x="440" y="495" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#173b56" text-anchor="start">x₂ = R + (m₁/M)r</text>
<text x="40" y="538" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">El centro de masa puede trasladarse respecto del laboratorio.</text>
</svg>