<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>Orientación y fuerza del resorte lineal durante la compresión.</title><g font-family="DejaVu Sans, sans-serif"><path d="M95,230 L600,230" fill="none" stroke="#637686" stroke-width="2.5"/><polygon points="600,230 591.710451053974,233.50476508077784 591.710451053974,226.49523491922216" fill="#637686"/><path d="M350,410 L350,65" fill="none" stroke="#637686" stroke-width="2.5"/><polygon points="350,65 353.5047650807779,73.28954894602597 346.4952349192221,73.28954894602597" fill="#637686"/><text x="605" y="255" font-size="18" fill="#637686" text-anchor="start">x (m)</text><text x="358" y="65" font-size="18" fill="#637686" text-anchor="start">Fₓ (N)</text><path d="M130,90 L570,370" fill="none" stroke="#176c9c" stroke-width="3"/><polygon points="350,230 130,90 130,230" fill="#e4f1f7" opacity="0.85"/><path d="M280,270 L175,270" fill="none" stroke="#267b62" stroke-width="2.5"/><polygon points="175,270 183.28954894602597,266.4952349192221 183.28954894602597,273.5047650807779" fill="#267b62"/><text x="80" y="315" font-size="18" fill="#267b62" text-anchor="start">Compresión desde x = 0</text><text x="100" y="355" font-size="18" fill="#176c9c" text-anchor="start">Fₓ &gt; 0,  dx &lt; 0  ⇒  W &lt; 0</text><text x="130" y="255" font-size="18" fill="#637686" text-anchor="middle">−d</text><text x="360" y="255" font-size="16" fill="#637686" text-anchor="start">0</text><text x="455" y="135" font-size="23" fill="#176c9c" text-anchor="start">Fₓ = −kx</text><text x="80" y="465" font-size="22" fill="#176c9c" text-anchor="start">Wₛ = ½k(xᵢ² − x_f²)</text></g></svg>