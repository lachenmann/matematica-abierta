<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img"><title>Clasificar exige conservar las hipótesis</title><defs>
<marker id="m173b56" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#173b56"/></marker>
<marker id="m2379aa" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2379aa"/></marker>
<marker id="mb74c3c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b74c3c"/></marker>
<marker id="m287c68" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#287c68"/></marker>
</defs><rect width="900" height="100%" fill="white"/>
<text x="40" y="42" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#173b56" text-anchor="start" font-weight="bold">Clasificar exige conservar las hipótesis</text>
<rect x="40" y="100" width="820" height="82" fill="#f2f7fa" stroke="#173b56" stroke-width="2"/>
<text x="58" y="130" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2379aa" text-anchor="start">h &gt; 0,  E específica &lt; 0</text>
<text x="58" y="163" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">0 ≤ e &lt; 1</text>
<text x="450" y="149" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2379aa" text-anchor="start">Elipse; círculo si e = 0</text>
<rect x="40" y="205" width="820" height="82" fill="#f2f7fa" stroke="#173b56" stroke-width="2"/>
<text x="58" y="235" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#287c68" text-anchor="start">h &gt; 0,  E específica = 0</text>
<text x="58" y="268" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">e = 1</text>
<text x="450" y="254" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#287c68" text-anchor="start">Parábola</text>
<rect x="40" y="310" width="820" height="82" fill="#f2f7fa" stroke="#173b56" stroke-width="2"/>
<text x="58" y="340" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#b74c3c" text-anchor="start">h &gt; 0,  E específica &gt; 0</text>
<text x="58" y="373" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">e &gt; 1</text>
<text x="450" y="359" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#b74c3c" text-anchor="start">Una rama hiperbólica</text>
<rect x="40" y="428" width="820" height="108" fill="#fff4e7" stroke="#173b56" stroke-width="2"/>
<text x="58" y="465" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">h = 0: movimiento radial; e = 1 para toda energía.</text>
<text x="58" y="506" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#173b56" text-anchor="start">El ángulo deja de servir como variable de evolución.</text>
</svg>